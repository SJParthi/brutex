[package]
name         = "spikefade"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
description  = "SNIPER s25b spike-fade option selling from the Top Volume screener: per-day minute cube (O(1) window queries), per-segment per-expiry Top Volume lists, spike events, REQ 70 worst-case fills (crate v2.1), Dhan charges (sell-diag estimator), account sweep over the dial grid, random-time twin. Read only on every input."
build = false
autobenches = false
autoexamples = false
autotests = false

[[bin]]
name = "spikefade"
path = "src/main.rs"

[dependencies]
brutex_core = { path = "../core", package = "core", version = "0.1.0" }
costs       = { path = "../costs", version = "0.1.0" }
# v2.1 (checker F-A): the FA1 copy of crate v2.1 (opt-in sparse-tape capacity reading; Row = crate v2.1 byte for byte)
# v3 (EXITS-DYNAMIC): the crate v2.2 copy (the FA1 crate + the additive xrule module); pinned/common-fill-v21-fa1 stays as copied
# v3.1 (MAIN-RULINGS-ENGINE-v22): the crate v2.3 copy (crate v2.2 + the ONE margin module M1 + the opt-in carried entitlement K1)
# v3.2 (MAIN-RULINGS-ENGINE-v22 addenda 10-11): the crate v2.4 copy (crate v2.3 + margin rule v3 M3 + the executed-order count O1)
# v3.4 (round D build:D-high): the crate v2.5 copy (crate v2.4 + CHANGE B1: the price band on a tape view, re-sent exit limits clipped inside it)
# v3.4 (round D integrate:D): the crate v2.6 copy (crate v2.5 + CHANGE S1: the strict order readings of data:F7: re-send laws, NSE limit
# price protection, the band lock at the known level, the clip to an exact band; with no strict view = crate v2.5 byte for byte)
common_fill = { path = "../../pinned/common-fill-v26" }
# v3.2 (addenda 8 / 8b): the app's OWN Greeks code, the same crate behind /greeks.json and the screener: the app on :8080 is built from the
# wt/APP tree (its crates/greeks = the tree the v3.1 runner's proven greeks-tsv linked; project/crates/greeks is an OLDER copy whose solver
# reports other iteration counts), linked unmodified (no copy, no new formula); it declares no dependency (its CI gate 9b). sha256 of its
# sources at the v3.2 build: BUILD.md.
greeks = { path = "../greeks" }

