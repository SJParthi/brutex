[package]
name         = "pull"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
description  = "Vendor ingest: the credential path configuration, the read-only secret source, and the per-vendor manifest."

# docs/01-architecture.md gives `pull` exactly `core` and `store`. Both are
# taken, and nothing else is.
#
# THERE IS NO AWS SDK DEPENDENCY IN THIS CHANGE, and that is a decision rather
# than an omission. `aws-config` and `aws-sdk-ssm` sit in the workspace
# dependency table unused. Taking them here would add roughly a hundred
# transitive crates to `Cargo.lock` for a change that makes no live call, and CI
# gate 3 (`cargo deny check`) would then be verifying a licence and advisory
# surface that nothing in this repository exercises. `src/secret.rs` defines the
# port the SDK plugs into — one method, `get_parameter` — so the adapter that
# takes the dependency is a single `impl` block in the change that first makes a
# live call. See docs/05-decisions.md D-0035.
[dependencies]
# THE EXPIRY CALENDAR, AND NOTHING ELSE FROM IT. D-0206.
#
# Dhan's rolling-option answer names a strike and a timestamp and NO EXPIRY
# DATE -- the request asked by cadence and ordinal (`expiryFlag` WEEK|MONTH,
# `expiryCode` 1|2|3), never by date. But `store::path` files a contract under
# `Kind::Option { expiry, strike, side }`, so the date has to be computed:
# "the near weekly as of this bar's day".
#
# That calendar already exists, once, in `costs::expiry`, with its regimes and
# its verified-from citations. A second copy here would be a second answer to
# "when did that contract expire", and the one that drifts is always the copy
# nobody remembers exists.
#
# The graph stays acyclic: `costs` declares `brutex_core` alone, so this is
# pull -> costs -> core beside the pull -> core that already exists.
costs = { path = "../costs", version = "0.1.0" }
# THE FIRST ARROW ANY CRATE HAS EVER POINTED AT `greeks`. D-0217.
#
# Measured with `cargo metadata --no-deps` before this line existed: thirteen
# crates, and not one named `greeks`. It was complete -- Black-Scholes-Merton, a
# bounded implied-volatility solver, moneyness, 100% covered -- and every greek
# in this repository was computed by nobody.
#
# The graph stays acyclic and gate 9b stays true: `greeks` declares NO
# dependencies at all, so this is a leaf being pointed at, not a cycle being
# closed. `pull` is the caller because it already holds the other four BSM
# inputs -- the strike from `fno`, the spot from Dhan's overlay, the tenor from
# `tenor`, and a carry of zero for an index -- and because it is where the
# overlay is written.
greeks = { path = "../greeks", version = "0.1.0" }
# The lib target is `brutex_core` and it MUST be referred to by that name: a
# dependency key of `core` shadows the sysroot crate inside rustdoc's generated
# doc-test harness. Proven three times now -- in core itself, in store, and the
# reason this line is spelled the way it is.
brutex_core = { path = "../core", package = "core", version = "0.1.0" }

# A version is required alongside the path: deny.toml sets wildcards = "deny",
# and a path dependency with no version IS a wildcard.
#
# Taken for `store::crc` and for `store::path::{Timeframe, YearMonth}`. The
# manifest reuses the bar file's checksum, its two-slot header geometry and its
# commit-counter argument rather than paraphrasing them -- see
# `src/manifest.rs`, which also names the one thing it deliberately does not
# reuse.
store = { path = "../store", version = "0.1.0" }

# THE EVENT SINK, AND WHY THIS EDGE IS NEW.
#
# Every `telemetry::emit` in this workspace used to sit in `crates/api`, and
# all of them on a REFUSAL path. So the crate that does the actual work — the
# fetch, the decode, the fold, the census, the write — could not say anything
# at all. A live run refused 10 of 16 members in 18 seconds and wrote ZERO log
# lines; the cause was recovered by decoding bar files by hand. That is not a
# diagnostic procedure, and no amount of care in `api` fixes it, because the
# facts worth logging only exist inside these loops.
#
# NO CYCLE. `crates/telemetry` names no workspace member — it is a leaf, like
# `core` — so `pull -> telemetry` keeps CLAUDE.md section 5's graph acyclic.
# Recorded in D-0075 and the section 5 table.
#
# AND IT IS CHEAP WHEN IT IS OFF. `Sink::emit` filters on one relaxed atomic
# load and a comparison; a filtered event touches no clock, no lock and no
# buffer. So a Trace event on a per-row path costs a load when the operator is
# not asking for it, which is what makes instrumenting every corner affordable.
telemetry = { path = "../telemetry", version = "0.1.0" }

# THE SOCKET. Taken now and not before, because until this change nothing in
# this crate could reach a vendor: `pull::fetch::BarSource` had exactly one
# implementor and it answered from memory. The workspace `reqwest` line sets
# `default-features = false` with `rustls-tls-webpki-roots-no-provider`, which
# keeps **OpenSSL** out AND keeps rustls's default C provider out.
#
# THIS COMMENT USED TO SAY THE OPPOSITE, AND FOR A WHILE IT WAS RIGHT. Under the
# old `rustls-tls` feature rustls reached `ring` 0.17.14, whose `build.rs`
# compiled 135 vendored C and assembly files into the shipped binary (D-0071).
# D-0211 moved the feature to `-no-provider` and installed `rustls-graviola`
# (the line below) through `pull::ensure_tls_provider`; D-0212 made `deny.toml`
# ban `ring`, `aws-lc-rs`, `aws-lc-sys` and `cc` by name, so neither can return
# without a red `cargo deny`. `ring` still has a `Cargo.lock` entry -- the lock
# records every optional edge -- and is in no resolved build graph:
# `cargo tree --workspace --locked -i ring --target all` prints nothing.
# D-3501: `core/tests/graph.rs` refuses a manifest comment that names a banned
# crate without saying it is banned, which is how this paragraph went stale.
reqwest = { workspace = true }
rustls-graviola = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

# THE CREDENTIAL READ, IN RUST AND NOTHING ELSE.
#
# `aws-sdk-ssm` was tried first and refused, on measurement rather than taste.
# It reaches rustls through `aws-smithy-http-client`, which hard-enables the
# `aws-lc-rs` backend, which vendors `aws-lc-sys` — a C library. Cargo features
# are additive, so no `default-features = false` downstream can switch it off.
# The tree went **145 crates to 232**, and `aws-lc-sys` appeared in the lock:
# 87 extra crates AND the exact shape `CLAUDE.md` §2 bans, which CI gate 13
# walks `Cargo.lock` to catch.
#
# The AWS *API* needs none of it. `GetParameter` is one HTTPS POST carrying a
# SigV4 signature, and SigV4 is HMAC-SHA256 over a canonical string. `reqwest`
# is already here for the broker; these two are pure-Rust RustCrypto crates
# with no `asm` feature. Two crates instead of eighty-seven, and **these two
# add no C** — which is a claim about `hmac` and `sha2` only; the TLS provider
# above is `rustls-graviola` since D-0211, and `deny.toml` bans `aws-lc-rs` and
# `aws-lc-sys` by name since D-0212. See `src/ssm.rs`, D-0051 and D-0071.
hmac = { workspace = true }
sha2 = { workspace = true }
# Dated NSE MII security masters are gzip CSVs; pure-Rust default backend.
flate2 = { workspace = true }
# TOTP is HMAC-SHA1 (RFC 6238 default). Declared in the workspace manifest
# since before this crate needed it; `crates/pull/src/totp.rs` is the first
# and only user.
sha1 = { workspace = true }

[lints]
workspace = true

# ---------------------------------------------------------------------------
# GATE 8 — the O(1) ratio harness. `harness = false` so it is a plain binary
# with no benchmarking framework and therefore no dependency; `test = false`
# because `cargo test` must not run a timing loop, and the coverage gate must
# not measure one. See D-0034 and crates/core/Cargo.toml.
# ---------------------------------------------------------------------------
[[bench]]
name    = "ratio"
harness = false
test    = false
