# CHARGES ORACLE RATE TABLE — machine-readable twin of docs/charges-oracle/RATES.md
#
# Every charge on an NSE intraday trade, for three segments, 2018-09-01 to
# 2026-10-31, from official sources only. Read by
# crates/costs/tests/charges_oracle.rs, which refuses any key, value or shape
# it does not understand.
#
# HOW THE SOURCES WERE READ (it bounds every row): the session that wrote this
# table could not fetch any page — its network policy refused every official
# host. Every quote below is text a web-search tool returned from the official
# URL named on the row, queried 10 Nov 2026 with the search restricted to that
# official domain. `verification` says whether the tool returned the string as
# the source's own text ("verbatim via search") or paraphrased it.
#
# Fields:
#   id        unique row id, cited by RATES.md and the report
#   charge    brokerage_rate | brokerage_cap | brokerage_per_order | exchange_txn
#             | ipft | clearing | sebi_fee | stt | stt_exercise | stamp | gst
#             | gst_on_sebi_fee
#   segments  comma list of equity_intraday, stock_option, index_option
#   applies   buy | sell | both | exercise
#   base      what the rate multiplies
#   num/den   the rate as an exact fraction (paisa for brokerage_cap and
#             brokerage_per_order; 1 or 0 for gst_on_sebi_fee)
#   from/to   inclusive calendar dates
#   status    verified | assumption | unverified | unknown | counterfactual
#             (unknown: no official figure was reached; num is 0 and the oracle
#             prices nothing for it and says so)
#   value     the figure as the source states it
#   source    official URL(s)
#   quote     the exact quote, as the search tool returned it
#   note      verification level and any choice the row makes

schema = "brutex-charges-oracle/1"
window_from = "2018-09-01"
window_to = "2026-10-31"

