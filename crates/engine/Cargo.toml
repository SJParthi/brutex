[package]
name         = "engine"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
publish      = false

[dependencies]
# `version` is not decoration. `deny.toml` sets `wildcards = "deny"`, and a path
# dependency with no version IS a wildcard -- `cargo deny check bans` failed on
# this one line, and it was the workspace's only wildcard. `crates/indicators`
# had always written it the other way, so the two spellings of the same
# dependency disagreed and only one of them was legal.
vocab = { path = "../vocab", version = "0.1.0" }

[lints]
workspace = true

# ---------------------------------------------------------------------------
# The o1p99 attack (cloud lane, 10 Nov 2026): every claim `ratio` times by its
# minimum, re-timed per call at 1, 10^2, 10^4 and 10^6 with p50 and p99
# printed, failing when the p99 grows past the factor each row states. Same
# shape as `ratio`: no framework, no dependency, not run by `cargo test`.
# DECLARED BEFORE `ratio` ON PURPOSE: gate 14's manifest reader keeps the last
# of two adjacent [[bench]] blocks, and the one it must keep is `ratio`.
# ---------------------------------------------------------------------------
[[bench]]
name    = "o1p99"
harness = false
test    = false

# ---------------------------------------------------------------------------
# THE BOUND IS RE-MEASURED, NOT ASSERTED. Gate 14 refuses a crate that claims a
# constant cost and never measures it. This crate made four cost claims and
# measured none until `benches/ratio.rs`. The per-bar factor is what the bench
# pins: support counting is O(bars) by definition and the Apriori join is
# O(|frontier|^2), and neither is a defect -- a per-bar constant that DRIFTS is.
# See D-0103.
#
# THIS IS NOT A DEPENDENCY. A [[bench]] target links this crate's own lib, its
# one dependency and std. The [dependencies] table still names `vocab` alone.
# ---------------------------------------------------------------------------
[[bench]]
name    = "ratio"
harness = false
test    = false
