# Explanatory YAML comments: docs/34-ci-workflow-notes.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# D-1610 (hunt-ci-12): no job here writes through GITHUB_TOKEN; checkout reads.
permissions:
  contents: read

jobs:
  language-purity:
    name: Gate 1+2 — one language
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - name: Gate 0 — the source scanner proves itself, then reads this workflow
        run: |
          set -euo pipefail
          # D-1100. The gates below used to read Rust and TOML with line
          # regexes, and valid source walked past them: `r#Command`, `#[path]`,
          # `pub(crate) mod`, `include!`, `*slot = "..."` read as a comment, a
          # brace on a `#[cfg(test)] use` line, `[dependencies . x]`. The
          # scanner reads TOKENS. It is one dependency-free Rust file, built by
          # rustc like gate 10's and gate 18's tools, and its own adversarial
          # tests run before any gate is allowed to trust an answer from it.
          # Every later step in this job reads its path from SOURCE_SCAN.
          tool="${RUNNER_TEMP:-/tmp}/source-scan"
          rustc --edition=2024 --test -D warnings .github/source_scan.rs -o "${tool}-tests"
          "${tool}-tests"
          rustc --edition=2024 -D warnings .github/source_scan.rs -o "$tool"
          # D-2343: the auto-merge and main re-check JSON rules, tested here.
          rustc --edition=2024 --test -D warnings .github/gh_json.rs -o "${tool}-gh-json-tests"
          "${tool}-gh-json-tests"
          # D-2311: the listings and verdicts of this step and of gates 1 to 7
          # below are .github/gates_tree.rs, proved by its own tests here and
          # run from this one path by each later step. It may start only git
          # (D-2344), so a step runs the scanner itself and hands the tool the
          # output file and the exit status; any non-zero status is refused.
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          rustc --edition=2024 --test -D warnings .github/gates_tree.rs -o "${gt}-tests"
          "${gt}-tests"
          rustc --edition=2024 -D warnings .github/gates_tree.rs -o "$gt"
          if [ -n "${GITHUB_ENV:-}" ]; then
            printf 'SOURCE_SCAN=%s\n' "$tool" >> "$GITHUB_ENV"
          fi
          # Workflow hygiene, read from every tracked workflow:
          #   * `continue-on-error` anywhere turns a red step into a green job,
          #     and ci-ok accepts only `success` from a job.
          #   * a pipe into `grep -q` under `pipefail`: grep exits at its first
          #     match, the producer takes SIGPIPE once its output outruns one
          #     pipe buffer, and `if` reads the match as a MISS (AC-gates-law-5).
          #     Test with `grep -q ... <<< "$x"` instead.
          #   * an interpreter handed a program inline (`node -e`, `perl -e`)
          #     is a second language in a tracked file outside web/ (CLAUDE.md
          #     section 2); such a program lives under web/ and is run by path.
          #     D-2342 widens the forms; awk is a pinned ratchet (06-limits).
          # Every tracked .yml under .github/, not only workflows/ (D-2341).
          # An empty listing is refused.
          work=$(mktemp -d)
          "$gt" gate-0 prepare "$work"
          st_w=0; xargs -0 -r "$tool" workflow < "$work/workflows.z" > "$work/workflow" || st_w=$?
          # D-1601: ci-ok needs every job, runs `if: always()`, accepts only
          # success. D-1603: no crate code spawns a shell or an interpreter by
          # a literal name or path, which gate 1e's PATH stubs cannot see.
          st_a=0; "$tool" aggregator .github/workflows/ci.yml > "$work/aggregator" || st_a=$?
          # D-2344: every spawn names current_exe, a CARGO_BIN_EXE_ path or a
          # listed program; .github/*.rs tools are read too.
          st_s=0; xargs -0 -r "$tool" spawns < "$work/spawns.z" > "$work/spawns" || st_s=$?
          # P1-09-01, D-2660 (D-1935): on `workflow_run` and
          # `pull_request_target` the auto-merge token can WRITE whoever wrote
          # the pull request, so its `isCrossRepository` refusal is the only
          # thing between a fork and an armed merge. Deleting it as "redundant
          # with a read-only token" is a red build.
          st_f=0; "$tool" fork-refusal .github/workflows/auto-merge.yml > "$work/fork" || st_f=$?
          "$gt" gate-0 verdict "$work" "$st_w" "$st_a" "$st_s" "$st_f"

      - name: Gate 1 — extension allowlist
        run: |
          set -euo pipefail
          # D-2311: the lists and the walk below are `ALLOWED`, `extension_ok`
          # and `gate_1_record` in .github/gates_tree.rs; these comments are
          # their justification.
          #
          # THE ONLY EXTENSIONS THIS REPOSITORY MAY CONTAIN OUTSIDE web/, and this
          # line is now CLAUDE.md section 2 quoted rather than section 2 widened:
          # "Allowed tracked extensions: `.rs` `.toml` `.md` `.lock` `.html`
          # `.css` `.yml` (the last only under `.github/`)."
          #
          # IT USED TO READ `rs|toml|md|lock|html|css|yml|json` FOR EVERY PATH,
          # which is wider than the law in two separate ways, and the tree was
          # only clean because a SECOND gate cleaned up after this one: gate 1b
          # confines `.json` and `.yml` to `.github/`, `.claude/` and `web/`. Two
          # gates disagreeing about the same rule is not defence in depth -- gate
          # 1's list is the sentence a reader takes as the statement of section 2,
          # and a wider sentence is a wrong one. So the split is by PATH here too,
          # exactly as the `web/` exception already is.
          #
          # `.yml` ONLY UNDER `.github/`. The parenthesis in section 2 is part of
          # the rule, and nothing enforced it here. Both tracked `.yml` files --
          # this workflow and `auto-merge.yml` -- already live there, so this
          # narrowing costs nothing today and is the point at which a `.yml`
          # dropped at the root becomes a red build rather than a gate-1b one.
          #
          # `.json` is in section 2's list ONLY under `.claude/`, and exactly one
          # tracked file carries it: `.claude/launch.json`, which holds the two
          # run configurations docs/07-plan.md section 0 names. It is read by the
          # PREVIEW TOOLS. It is NOT read by IntelliJ -- an earlier version of
          # this comment said "IntelliJ and the preview tools", and IntelliJ takes
          # its run entries from .idea/ or .run/*.xml, neither of which is
          # tracked. An operator opening the clone in IntelliJ still gets that
          # IDE's own Cargo auto-detection of the `api` binary, which is the
          # thing section 0 says is the IDE inferring rather than the repository
          # promising. Gate 1b already sanctions `.claude/` by path and states the
          # reason -- operator tooling, not source, not shipped -- so this line
          # makes gate 1 agree with gate 1b instead of being wider than gate 1b
          # AND wider than the law.
          #
          # THE DIVERGENCE THIS COMMENT USED TO NAME IS NOW CLOSED, and closed the
          # way this comment demanded rather than the way a gate could have taken
          # on its own. It read: "Resolving that is a CLAUDE.md edit and a
          # `docs/05-decisions.md` entry, which a CI gate must not make on its own
          # -- a gate that widens the law to match the tree is the shape this whole
          # file exists to refuse." Section 2 now carries the `.claude/` clause and
          # D-0210 is the entry. The gate did not move; the law did.
          #
          # Under web/ ONLY, the browser languages are allowed -- D-0052. This
          # is narrowed by PATH, not relaxed by extension: putting `ts` on the
          # line above would permit a build script anywhere in the tree, which
          # is the thing CLAUDE.md section 2 exists to forbid.
          #
          # Files with no extension that are still legitimate -- AND WHERE.
          # The names used to pass at any depth, so `crates/x/LICENSE` could
          # hold anything (UC-8). A licence and a code-owners file mean
          # something at the root (and CODEOWNERS under .github/ or docs/,
          # where GitHub reads it). D-1104. The two git files now pass only at
          # the root and under web/ (rustonly2-5, D-2348): a nested one could
          # hold anything, and none is tracked anywhere else.
          #
          # A MODE IS CONTENT TOO (D-1104). Outside web/, every tracked file
          # is an ordinary non-executable file: a symlink can point the
          # allowlist's `.rs` at anything, an executable bit turns a `.rs`
          # holding a shell script into a program cargo can be told to run,
          # and a gitlink is a whole foreign tree. None is tracked today.
          #
          # WHICH LIST APPLIES IS DECIDED BY THE PATH, not by the file.
          # Under web/ the browser languages are legal; everywhere else the
          # hard rule is untouched, so a .ts under crates/ fails here exactly
          # as it always did.
          #
          # THE LISTING IS A FILE, NOT A PROCESS SUBSTITUTION (AC-gates-law-10).
          # `done < <(git ls-files)` swallowed a git that failed -- a moved
          # worktree, a refused directory owner -- the loop read nothing and
          # this gate printed OK. A git that fails now stops the step, and an
          # empty listing is refused. NUL-separated with `-s`, so a name git
          # would quote (a non-ASCII `.rs`, whose extension read as `rs"`:
          # ET-rust-only-purity-10) is read as itself, and so the MODE is read
          # alongside it.
          #
          # AN EXTENSION IS A NAME, AND THE NAME IS NOT THE CONTENT (D-1104).
          # Everything above decides from the path. ET-rust-only-purity-3 and
          # UC-8 put non-Rust content under `.rs`, an executable script named
          # `.rs` behind a tracked `.cargo/config.toml`, and a NUL byte that
          # makes every grep-based gate skip a file, and gate 1 passed them all.
          # Two content checks close what the name cannot:
          #
          #   1. `source_scan content`: outside web/, no NUL byte, nothing that
          #      is not UTF-8, no `.rs` opening with a shebang, and no browser
          #      code in a `.html` or `.css`. Also no NAME holding a control
          #      character, a non-ASCII byte, `"` or `\` (git quotes those in
          #      every listing read without `-z`), and no `mutants::skip`
          #      token in crate code: `#[cfg_attr(miri, mutants::skip)]`
          #      compiles to nothing and still hides a function from gate 18
          #      (P1-07-03, P1-07-04, P1-08-01, D-2660).
          #   2. `source_scan orphans`: every tracked `.rs` outside web/ is
          #      COMPILED -- reached from a crate root (lib, main, bin, test,
          #      bench, example, build script, or a manifest `path`) or a
          #      `.github/*.rs` tool through `mod`, `#[path]` or `include!`. A
          #      `.rs` nothing compiles is not Rust to anything that reads this
          #      repository, whatever is in it, and a `.rs` that IS compiled has
          #      to be Rust or the build fails.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-1 prepare "$work"
          st_c=0; "$scan" content "$work/tracked" > "$work/content" || st_c=$?
          st_o=0; "$scan" orphans "$work/tracked" > "$work/orphans" || st_o=$?
          "$gt" gate-1 verdict "$work" "$st_c" "$st_o"

      - name: Gate 1e — the engine builds with no front-end toolchain
        run: |
          set -euo pipefail
          # WHAT §2 ACTUALLY REQUIRES, quoted, because the previous version of this
          # gate tested something else and that is why it enforced nothing:
          #
          #   "no crate may depend on the front end's toolchain to build, test or
          #    run. `cargo build`, `cargo test` and `cargo clippy` must pass on a
          #    machine with no Node, no package manager and no `web/` build ever
          #    run."
          #
          # RO-6, D-2345: this gate used to claim the build ran "with the front
          # end moved aside" while it only shadowed PATH in the checkout, web/
          # present. It now builds and tests a WORKTREE OF THIS COMMIT WITH web/
          # DELETED, so the claim CLAUDE.md section 2 makes for gate 1e is what
          # runs: no crate can need web/, its toolchain, or a web/ build. `api`
          # reads web/ at run time (crates/api/src/assets.rs), never at build.
          #
          # The old gate moved the whole `web/` tree aside, which breaks `api`'s
          # embed by construction. Its own comment called that failure "expected",
          # and so it captured the output with `set +e` and NEVER READ THE EXIT
          # STATUS -- it only grepped for seven toolchain words. An audit proved the
          # consequence with a stub cargo exiting 101: the gate exited 0. So §2's
          # central build promise was enforced by nothing at all.
          #
          # This version shadows the toolchain instead. Every binary a crate could
          # reach for is replaced by a stub that logs and fails, then the workspace
          # is built with that stub directory first on PATH. Two things must hold,
          # and both are now checked:
          #
          #   1. the build SUCCEEDS -- the exit status is read
          #   2. no stub was ever invoked
          #
          # A crate that shells out to a bundler trips clause 2 AND, because the
          # stub exits 127, clause 1 as well.
          #
          # D-2311: the worktree, the stubs and every verdict below are
          # `gate-1e` in .github/gates_tree.rs. Each stub is a copy of that
          # binary, which logs its own name and exits 127 when it runs under a
          # stub's name, so no shell program is written to make one. The two
          # cargo captures stay here, exactly as D-0911 pins them.
          #
          # Each stub APPENDS TO A FILE as well as writing to stderr, and the file is
          # what the check reads. Cargo suppresses a build script's stderr unless the
          # script itself fails, so a `build.rs` doing
          # `let _ = Command::new("vite").status();` invoked the stub and left no
          # trace in the captured output at all -- the first version of this clause
          # missed exactly that, verified by injecting it. A file on disk is outside
          # cargo's output capture.
          #
          # D-1101: the interpreters other than Node are shadowed too. An audit
          # ran a non-JS interpreter from `crates/cli/build.rs` with every gate
          # green, and the stub list named only Node's toolchain. Gate 2 now
          # refuses the spawn in the source; this is the second, runtime signal.
          # A program reached by ABSOLUTE path is still not shadowed here, which
          # is why gate 2's token check is the one that carries the rule. The
          # py-family names are assembled because gate 15 bans the word itself.
          # sh and bash too (D-2344): no crate code starts a shell.
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          tree="${RUNNER_TEMP:-/tmp}/gate-1e-no-web"
          stub="$(mktemp -d)"
          "$gt" gate-1e prepare "$tree" "$stub"
          cd "$tree"

          set +e
          out="$(PATH="$stub:$PATH" cargo build --workspace --locked --all-targets 2>&1)"
          status=$?
          set -e
          # The check the old gate discarded: a failing build with no toolchain
          # on PATH is exactly what §2 forbids, whatever the reason. And the
          # package-metadata words, kept as a second signal: a crate could reach
          # a toolchain by an absolute path the stub directory does not shadow.
          "$gt" gate-1e verdict build "$stub" "$status" <<< "$out"

          # §2'S SENTENCE NAMES THREE COMMANDS AND THIS STEP SHADOWED ONE. The
          # quote at the top of this gate is "`cargo build`, `cargo test` and
          # `cargo clippy` must pass on a machine with no Node" -- and everything
          # above it tested `cargo build`. That is not a pedantic gap. `cargo
          # build --all-targets` COMPILES the test binaries and never runs them,
          # so a `#[test]` that does `Command::new("npm")` at RUNTIME was
          # invisible to every clause above: the stub is on PATH, but nothing
          # ever reached the line that would have invoked it.
          #
          # THE COST IS THE TEST RUN, NOT A REBUILD, and that is worth saying
          # because this job is the cheap one everything else waits on. The build
          # above already compiled every test target into the same target
          # directory, so this invocation links nothing new and spends its time
          # executing. It does duplicate the `Tests` step in the `build` job --
          # deliberately, because that run has no stub on PATH and therefore
          # proves nothing about §2.
          #
          # `cargo clippy` IS STILL NOT SHADOWED, and the reason is that it would
          # buy nothing rather than that it was forgotten: clippy compiles and
          # does not execute, so every point at which it could reach a toolchain
          # is a point `cargo build --all-targets` has already walked with the
          # same stub directory in front of PATH.
          set +e
          tout="$(PATH="$stub:$PATH" cargo test --workspace --locked 2>&1)"
          tstatus=$?
          set -e
          # The stub log accumulates across both runs and the build verdict
          # already refused a non-empty one, so anything in it now was written
          # while the tests ran.
          "$gt" gate-1e verdict test "$stub" "$tstatus" <<< "$tout"
      - name: Gate 1b — .json and .yml are confined
        run: |
          set -euo pipefail
          # JSON and YAML are config, not source, and only belong in two places.
          #
          # THE SECOND PLACE IS `web/`, NOT `crates/web/`.
          #
          # D-0052 moved the front end out of the crate graph to `web/`, and
          # D-0053 made that directory unrestricted -- any language, any
          # toolchain, any extension. Gate 1a was updated for the move; this
          # gate was not, and it kept naming a path that no longer exists.
          #
          # The result was a gate that failed on `web/package.json` -- a file a
          # SvelteKit app cannot exist without, and one D-0053 explicitly
          # permits. A stale allowlist refusing a legal file is the same class
          # of failure as a permissive one accepting an illegal file: the gate
          # stopped describing the rule it was written to enforce.
          #
          # `.claude/` is the run configuration IntelliJ and the preview tools
          # read. It is operator tooling, not source, and it is not shipped.
          # The listing first: `git ls-files ... | grep || true` swallowed a git
          # that failed and printed OK over nothing (AC-gates-law-10, D-1104).
          # A git that fails stops the step, and an empty listing is refused.
          # D-2311: the rule is `gate_1b` in .github/gates_tree.rs.
          "${RUNNER_TEMP:-/tmp}/gates-tree" gate-1b

      - name: Gate 1g — no tracked configuration runs a program
        run: |
          set -euo pipefail
          # D-1105. `.toml` is allowed everywhere, and three tools this
          # repository runs will EXECUTE what a tracked `.toml` tells them to:
          #
          #   * cargo reads `.cargo/config.toml` from the working directory and
          #     every ancestor. Its `build.rustc-wrapper` names a program cargo
          #     runs for every rustc invocation, on CI and on every developer
          #     machine; `target.<t>.runner` and `.linker` are the same door.
          #     (ET-rust-only-purity-1: a tracked config pointing the wrapper at
          #     an executable shell script named `.rs`.)
          #   * cargo-nextest, which the mutation job runs, reads
          #     `.config/nextest.toml`, and a `[scripts.setup.*]` or
          #     `[script.*]` table there runs arbitrary commands before the
          #     tests (ET-rust-only-purity-2).
          #   * rustup reads `rust-toolchain.toml`, whose `toolchain.path` names
          #     a custom toolchain directory to run.
          #
          # So: no tracked file under any `.cargo/` directory, and the other two
          # files may carry only the keys listed here, read by the scanner's
          # TOML walker (D-1100) so quoting, spacing and dotted-key spellings
          # are all one key. A new key is a reviewed edit to this list. The
          # workflows themselves may not set the environment-variable or
          # `--config` forms of the same settings.
          #
          # Only one file may live under .config/, and only one of each tool
          # file may exist, at the root, because each tool also reads a copy
          # in any ancestor of the directory it runs in.
          #
          # D-1612 (rustonly2-7): the same doors by other names -- a linker in
          # RUSTFLAGS, a CARGO_HOME whose config.toml is any tracked file, and
          # a nextest configuration under another name. Comment lines skipped.
          # D-2346 (RO-7): RUSTDOCFLAGS and the encoded and per-target flag
          # forms, a doc runtool, and an environment NAME built from a shell
          # variable or written to GITHUB_ENV/GITHUB_PATH beyond the two
          # literal names this workflow sets. See docs/06-limits.md.
          #
          # D-2311: the listing rules, the two key allowlists and the three
          # workflow patterns are `gate_1g_verdict` in .github/gates_tree.rs,
          # each matcher beside the expression it replaced. The scanner reads
          # each tool file that exists; `prepare` lists which ones do.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-1g prepare "$work"
          st_t=0; xargs -0 -r "$scan" toml < "$work/toolchain.z" > "$work/toolchain" || st_t=$?
          st_n=0; xargs -0 -r "$scan" toml < "$work/nextest.z" > "$work/nextest" || st_n=$?
          "$gt" gate-1g verdict "$work" "$st_t" "$st_n"

      - name: Gate 1f — no browser code inside a Rust string literal
        run: |
          set -euo pipefail
          # GATES 1, 13 AND 15 ARE ALL STRUCTURALLY BLIND TO THIS, and a real
          # violation lived under `crates/` because of it: 127 lines of
          # JavaScript inside `const SCRIPT: &str = r#"..."#` in
          # `crates/api/src/mastersrun.rs`, emitted as `<script>{SCRIPT}</script>`
          # on the live `/masters` route. An extension walk sees a `.rs` file, a
          # manifest walk sees no dependency, and a one-word walk sees no
          # forbidden word. Only a gate that reads the CONTENT catches it.
          #
          # CLAUDE.md section 2 forbids "any generated source in another
          # language, checked in", and the `web/` exception is a PATH, not a
          # licence to write browser code wherever it is convenient.
          #
          # `crate::calendar` had already NAMED this attack -- "a `<script>`
          # block living inside a Rust string literal is another language
          # smuggled past the gate" -- and pointed at
          # `render::every_page_carries_the_one_script_this_repository_chose_and_no_other`
          # as the guard. That test iterates `render::every_page()`, and the
          # offending page is routed from its own module, so it was never in the
          # sample. D-0060's lesson, recurring one route later: an invariant is
          # only as true as its sample. A GATE has no sample to go stale.
          #
          # THE GATE NOW READS STRING LITERALS, NOT LINES (D-1106). The version
          # this replaced grepped each line case-sensitively for five words,
          # dropped every line holding `src=` anywhere, and stopped reading a
          # file at its first `#[cfg(test)]`. An audit got `<SCRIPT>`,
          # `onclick=`, `<img src=x onerror=..>`, `<script data-src=x>..`,
          # `concat!("<scr", "ipt>..")` and production code after a test
          # module (385 public items in 48 files) past it, and its success line
          # claimed "no inline handler" while nothing looked for one.
          #
          # `source_scan browser` lexes each file, drops exactly the
          # `#[cfg(test)]` items (their extent is read from tokens, so braces in
          # strings do not matter and production code after a test module is
          # scanned), decodes every string literal's escapes (so `\x3c` is
          # `<`), joins the pieces of each `concat!`, and refuses, case-blind:
          # a `<script>` without its own `src` attribute or with a body; any
          # `on*=` attribute inside a tag; `javascript:`; and the browser APIs
          # (`document.getElementById`/`querySelector`/`createElement`/
          # `cookie`/`write`/`body`, `window.location`, `window.open(`,
          # `addEventListener`, `innerHTML`, `outerHTML`, `XMLHttpRequest`,
          # `await fetch(`, `eval(`).
          #
          # WHAT IT CANNOT SEE: markup assembled at run time from pieces that
          # are not one literal or one `concat!` -- `format!("<scr{}", "ipt>")`.
          #
          # D-2311: the listing (NUL-separated, so a name with a space stays one
          # name; an empty one is refused) and the verdict are `gate-1f` in
          # .github/gates_tree.rs.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-1f prepare "$work"
          st=0; xargs -0 -r "$scan" browser < "$work/rs.z" > "$work/browser" || st=$?
          "$gt" gate-1f verdict "$work" "$st"
      - name: Gate 1c — no literal credential path
        run: |
          set -euo pipefail
          # This repository is public. A Parameter Store path names an account,
          # an environment and a vendor relationship; once pushed it lives in
          # every fork's history forever. Documents carry only the generic
          # shape /<org>/<env>/<vendor>/<field> — which does not match this
          # pattern, because <env> is not a real environment name.
          # See docs/05-decisions.md D-0013 and docs/04-invariants.md X-08.
          #
          # WHAT THIS GATE DOES NOT SEE, stated because X-08 used to claim more
          # than it proves and crates/pull's whole safety argument leans on it.
          # It matches a SLASH-JOINED path whose environment segment is one of
          # the ten words below. It cannot see a bare `const ORG: &str = "..."`,
          # and it cannot see a joined path whose env segment is outside that
          # alphabet. Gate 1d below is the check for the crate where that gap
          # matters; docs/06-limits.md §18 records what neither of them can do.
          #
          # No untrusted input reaches this step: the inputs are `git ls-files`
          # and a static pattern. Nothing from the event payload is expanded.
          #
          # The ten words are `ENV_WORDS` in .github/gates_tree.rs (D-2311).
          # The listing first: piped straight into `xargs ... || true`, a git
          # that failed left nothing to scan and the step printed OK
          # (AC-gates-law-10, D-1104). A git that fails stops the step, an
          # empty listing is refused, and a tracked file that cannot be read is
          # refused rather than skipped.
          #
          # The org segment may begin with `_` or `-`, because
          # `pull::config::check_segment` accepts either there, and the
          # environment word is matched case-blind, because a segment may hold
          # upper case. The pattern required `[A-Za-z0-9]` first and a
          # lower-case environment, so an org written `_acmeorg` before a real
          # environment word, or an environment word in capitals, passed
          # (AC-gates-law-8, D-1109). The runtime configuration itself,
          # `credentials.toml`, is never tracked.
          #
          # AND OVER THE DECODED LITERALS (P1-07-02, D-2660, D-1935). The
          # pattern reads source BYTES, so one Rust escape -- `\x70rod`,
          # `pr\u{6f}d` -- hid a standard environment word from it. `source_scan
          # strings` prints every string literal of every tracked `.rs` outside
          # web/ with its escapes resolved, and the same pattern runs over that.
          # A scanner that fails, or decodes no literal, is refused.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-1c prepare "$work"
          st=0; xargs -0 -r "$scan" strings < "$work/rs.z" > "$work/decoded" || st=$?
          "$gt" gate-1c verdict "$work" "$st"

      - name: Gate 1d — every segment-shaped literal in crates/pull is declared
        run: |
          set -euo pipefail
          # Every double-quoted literal under crates/pull that could BE a
          # parameter-path segment must be declared, so "every segment here is
          # invented" is a check and adding one is a deliberate act.
          # docs/06-limits.md §18 records what it cannot do.
          #
          # THE DECLARED WORDS AND THE REASON FOR EACH GROUP ARE IN
          # .github/gates_tree.rs (D-2311). They were shell variables here,
          # each beside the comment that argued it; they moved with those
          # comments, unchanged, and a new word is declared there.
          #
          # THE EXTRACTION READS TOKENS, NOT LINES (D-1109). It used to drop
          # every line whose first non-blank character was `//` or `*`, on the
          # claim that "a Rust STRING LITERAL cannot sit on a line that begins
          # with `//`, so this cannot hide one". The `*` half was never argued:
          # `*slot = "acmeorg";` is an ordinary statement and was never read.
          # It matched `"word"` in raw text, so a segment inside a fixture
          # literal as `\"orgtwo\"` was invisible, and it required the first
          # character to be `[a-z0-9]` while `pull::config::check_segment`
          # accepts `-` and `_` there, so `"_acmeorg"` was invisible too.
          #
          # Now `source_scan strings` lexes each tracked `.rs` under crates/pull
          # and prints every string literal's DECODED value -- comments are not
          # literals and are not read, a `*`-led statement is code, escapes and
          # raw strings are resolved, and each `concat!` is also reported as the
          # one literal the compiler sees. A value that is segment-shaped in
          # whole is extracted, and so is every `"word"` quoted inside a value.
          # The one non-Rust file, the manifest, is read as text as before.
          #
          # THE LISTING IS A FILE, SO A FAILING GIT FAILS THE STEP. It was read
          # through process substitution, which swallowed git's status, and a
          # loop that read nothing printed the success line (AC-gates-law-10).
          #
          # WHAT IT STILL CANNOT SEE: a segment containing an upper-case
          # letter. `check_segment` accepts one, and 356 distinct upper-case
          # segment-shaped values are in this crate today; declaring them is a
          # separate piece of work. Gate 1c's path-shape scan, which is
          # case-blind on the segments, is what covers a mixed-case path.
          #
          # The listing, the extraction, the date exclusion and the verdict are
          # `gate-1d` in .github/gates_tree.rs. A scanner that fails is refused
          # by name; under the pipe this replaced, it stopped the step with no
          # message of the gate's own.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-1d prepare "$work"
          st=0; xargs -0 -r "$scan" strings < "$work/rs.z" > "$work/strings" || st=$?
          "$gt" gate-1d verdict "$work" "$st"
      - name: Gate 2 — no build script shells out
        run: |
          set -euo pipefail
          # THE FILE SET IS THE COMPILER'S, READ BY THE SCANNER (D-1101). It was
          # a shell walk of `mod NAME;` lines, which `#[path = "x.rs"] mod m;`,
          # `pub(crate) mod m;` and `include!("x.rs")` all walked past -- so a
          # fourth file could join the build script unseen, and gate 13 layer 3
          # copied the same walk. `source_scan closure` follows every module
          # declaration with any visibility, `#[path]` (at file level and inside
          # inline modules) and `include!`, and REFUSES what it cannot resolve:
          # a computed include path, `cfg_attr(.., path = ..)`, a module a macro
          # declares, a module file that is not tracked. Only tracked files
          # count: an untracked file is not what CI compiles.
          #
          # A `build = "gen.rs"` key would rename the ROOT out of the seed list;
          # the manifest scan below refuses the key outright.
          #
          # THE SPAWN CHECK READS TOKENS (D-1101). Whitespace, comments,
          # strings and raw identifiers no longer decide it: `p::r#Command::
          # r#new(..).r#status()` after `use std::process as p;` was invisible
          # to all five regexes this replaced. Refused in any build-script
          # file: the identifiers `Command` and `CommandExt`; `process` unless
          # it is `process::{id, exit, abort, ExitCode, ExitStatus,
          # Termination}` -- the members that start nothing, which is what
          # `build_provenance.rs`'s test pid needs; `.spawn(`, `.output(`,
          # `.status(`, `.exec(`; and `macro_rules`, `unsafe`, `extern`,
          # `asm!` and `libc`, because each is a way to call something whose
          # tokens this scan cannot read.
          #
          # THE GLOB ABOVE KEYS ON A FILENAME, AND THE FILENAME IS ONLY A
          # DEFAULT. `build.rs` is what cargo looks for when a manifest says
          # nothing; a manifest that says `build = "gen.rs"` gets a build script
          # called `gen.rs`, and every check in this repository that spells the
          # name out walks straight past it. Two of them do: this glob, and gate
          # 13 layer 3's `$NF == "build.rs"`. One `build =` line defeats both,
          # and the file it names is a `.rs` that gate 1's extension allowlist
          # welcomes.
          #
          # So the KEY is refused, not just the name. `build =` is refused
          # because CLAUDE.md §2 bans "any `build.rs` that invokes an external
          # process" and gate 13 layer 3 goes further and bans the script
          # existing at all -- neither ban means anything if the script can be
          # renamed out of sight. `links =` is refused with it because a `links`
          # key declares that the package links a native library and cargo
          # REQUIRES a build script to accompany it: it is a build script and a
          # foreign-language dependency announced in one line.
          #
          # Comments stripped first, the same way gate 13 layer 1 strips them and
          # for the same reason -- these manifests discuss the rules they obey,
          # at length, and a rule that refuses its own justification is a rule
          # somebody deletes. The cost, stated: a `#` inside a quoted value
          # truncates its line, which can only cause a MISS and never a false
          # refusal.
          #
          # WHAT THIS DOES NOT COVER. A build script cargo picks up from the
          # DEFAULT path with no manifest key is caught by the glob above and by
          # gate 13 layer 3, not by this clause; the two halves are complementary
          # and neither is sufficient alone. The glob `*Cargo.toml` also matches
          # `NotCargo.toml`; the basename is pinned exactly.
          #
          # D-2311: the listings (`*build.rs` roots, every tracked file, every
          # `Cargo.toml`), the closure's file list, the manifest-key scan and
          # the verdict are `gate-2` in .github/gates_tree.rs. The scanner runs
          # here, three times, its output and status handed back each time.
          #
          # THE KEY IS READ AS TOML, NOT ONLY AS A LINE (P1-07-01, D-2660,
          # D-1935). The line reading `:[[:space:]]*(build|links)[[:space:]]*=`
          # saw one spelling of four: `"build" = ..`, `package.build = ..` and
          # `package = { build = .. }` all renamed the script past it.
          # `source_scan build-keys` prints `package.build` / `package.links`
          # whatever the spelling, and either reading is a refusal.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-2 prepare "$work"
          st_c=0; xargs -0 -r "$scan" closure "$work/tracked" < "$work/roots.z" > "$work/closure" || st_c=$?
          "$gt" gate-2 files "$work"
          st_b=0; xargs -0 -r "$scan" build < "$work/files.z" > "$work/found" || st_b=$?
          st_k=0; xargs -0 -r "$scan" build-keys < "$work/manifests.z" > "$work/keys" || st_k=$?
          "$gt" gate-2 verdict "$work" "$st_c" "$st_b" "$st_k"

      - name: Gate 9 — core depends on nothing
        run: |
          set -euo pipefail
          # docs/01-architecture.md gives core "May depend on: nothing". Gate 7
          # guards crates/web, but web's single allowed dependency IS core --
          # so a dependency added to core is silently forced into a wasm32
          # build where the filesystem does not exist. Without this gate the
          # architecture's most load-bearing arrow is a convention.
          #
          # AND FOR THE WHOLE LIFE OF THIS GATE IT READ ONE SPELLING OF FOUR.
          # The parse was `name =` at line start inside a flat `[dependencies]`
          # table. Cargo accepts four ways to say the same thing:
          #
          #   store = { path = "../store" }    the only form the awk could see
          #   store.path = "../store"          a dotted key, same meaning
          #   [dependencies.store]             a table header, same meaning
          #   [dev-dependencies] / [build-dependencies] /
          #   [target.'cfg(unix)'.dependencies]      all three LINK
          #
          # THIS IS MEASURED, NOT FEARED. `crates/core/tests/graph.rs` records
          # that one `[dependencies.store]` stanza "defeated NINE guarantees at
          # once", and names gate 9 as one of the nine: the awk printed nothing
          # for that stanza, and printing nothing is exactly how this step used
          # to say "core depends on nothing". A pass and a bypass spelled
          # identically is the worst shape a gate can have.
          #
          # THE MANIFEST IS NOW PARSED, NOT REFUSED-AROUND (D-1107). The
          # repair above was a refusal list read with `^\[dependencies\.`, so
          # `[ dependencies . store ]`, `["dependencies"]` and a root-level
          # `dependencies.store = { path = "../store" }` -- all valid TOML, all
          # declaring a dependency -- matched no refusal and no extraction, and
          # the step printed its success line over them. `source_scan deps`
          # reads the manifest as TOML (quoted and spaced keys, dotted keys at
          # any level, inline tables, every linking table, `target.*`,
          # `[patch]`, `[replace]`) and prints one line per declaration. Core
          # may have none, so ANY line is the violation -- and a manifest the
          # scanner cannot read is a refusal, never a pass.
          #
          # ABSENT IS A REFUSAL. This step said "skip — crate not created yet"
          # and passed when the manifest was missing, so deleting the manifest
          # turned the architecture's most load-bearing arrow off in silence.
          # D-2311: the verdict is `gate-9` in .github/gates_tree.rs, which
          # checks the manifest is tracked and refuses a scanner that failed.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          f=crates/core/Cargo.toml
          work=$(mktemp -d)
          st=0; "$scan" deps "$f" > "$work/deps" || st=$?
          "${RUNNER_TEMP:-/tmp}/gates-tree" gate-9 "$f" "$work/deps" "$st"
          # WHAT THIS STILL CANNOT SEE, because a gate that oversells itself is
          # worse than no gate: a `[patch]` or `[replace]` in the WORKSPACE root
          # that redirects a crate core does not name is not core's declaration
          # and is not read here. Gate 13 layers 1 and 2 walk the root manifest
          # and the lock; this step reads one file, completely.
      - name: Gate 9b — greeks depends on nothing
        run: |
          set -euo pipefail
          # Same shape as gate 9, for the same reason and a different consumer.
          # crates/greeks is taken by the `tickvault` repository by git URL, so
          # a dependency added here is a dependency forced on a repository that
          # is not this one -- and a type from this workspace in its public
          # surface makes it unusable there outright.
          #
          # Until this gate existed the property was advertised in six places
          # and enforced in none. `crates/greeks/tests/standalone.rs` was named
          # as the proof and cannot be: an integration test fails only on items
          # it NAMES, so a leaked type it does not name is invisible to it, and
          # a `pub use` adds zero code regions so the coverage gate cannot see
          # one either. Both were verified by breaking the property in a copy
          # of this workspace outside the repository -- clippy, the full test
          # suite and 100% coverage all stayed green. See D-0046.
          #
          # No untrusted input reaches this step: the inputs are a tracked
          # manifest path, `git ls-files` and static patterns. Nothing from the
          # event payload is expanded.
          #
          # AND IT INHERITED GATE 9'S PARSE, SO IT INHERITED GATE 9'S HOLE. The
          # extraction read `name =` at line start inside a flat `[dependencies]`
          # table, which is one of the four spellings Cargo accepts; a
          # `[dependencies.serde]` stanza printed NOTHING and this step said
          # "greeks depends on nothing" over a greeks that did.
          # `crates/core/tests/graph.rs` names gate 9b among the nine guarantees
          # a single such stanza defeated. The dev-dependency clause below had
          # the same shape and therefore the same hole.
          #
          # The repair is gate 22 clause A1's, carried across unchanged in
          # spirit: REFUSE the spellings a shell cannot parse instead of
          # pretending to parse them. For this crate the refusal is not a
          # compromise at all -- greeks may declare NO dependency in ANY table,
          # so a `[dev-dependencies]` or `[target.'cfg(unix)'.dependencies]`
          # header is itself the violation and there is nothing left to read
          # inside it. That is why the separate dev-dependency parse below is
          # gone rather than fixed: it is now one line in the refusal list, and
          # `[build-dependencies]` and `[target.*]` came free with it.
          #
          # A DEV-DEPENDENCY IS NOT A LESSER VIOLATION HERE, which is the reason
          # the old clause existed and the reason its replacement must be at
          # least as strong: it is not forced on a consumer, but it IS forced on
          # anyone who runs this crate's tests, and this crate's tests are part
          # of what `tickvault` takes by git URL.
          # THE MANIFEST IS NOW PARSED, NOT REFUSED-AROUND (D-1107). The
          # refusal list this replaced read headers with `^\[dependencies\.`,
          # so `[ dependencies . serde ]`, `["dependencies"]` and a root-level
          # `dependencies.serde = "1"` -- all valid TOML, all declaring a
          # dependency -- matched no refusal and no extraction, and the step
          # printed the success line over them. `source_scan deps` reads the
          # manifest as TOML (quoted and spaced keys, dotted keys at any level,
          # inline tables, every linking table, `target.*`, `[patch]`,
          # `[replace]`) and prints one line per declaration; greeks may have
          # none, so ANY line is the violation. A manifest it cannot read is a
          # refusal, never a pass.
          # ABSENT IS A REFUSAL. This step said "skip — crate not created yet"
          # and passed when the manifest was missing, so deleting the crate's
          # manifest turned the guarantee off in silence.
          #
          # The public surface names no type from this workspace. Every other
          # crate here is reachable only by its package name, so naming one at
          # all is the leak -- including through a re-export, which is the case
          # standalone.rs cannot see.
          #
          # D-2311: the tracked check, the verdict and the source scan for a
          # workspace type are `gate-9b` in .github/gates_tree.rs.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          f=crates/greeks/Cargo.toml
          work=$(mktemp -d)
          st=0; "$scan" deps "$f" > "$work/deps" || st=$?
          "${RUNNER_TEMP:-/tmp}/gates-tree" gate-9b "$f" "$work/deps" "$st"

      - name: Gate 10b — no invariant identifier means two things
        run: |
          set -euo pipefail
          # docs/04-invariants.md carried I-16 through I-22 TWICE, in two
          # tables, with different claims and different tests. An identifier
          # that resolves to two invariants cannot be cited unambiguously in a
          # decision entry, and CLAUDE.md section 3.8 requires history to be
          # append-only -- identifiers are never renumbered or reused.
          #
          # Gate 10 could not see it: it walks rows -> tests and never asks
          # whether a row is uniquely named. See D-0329.
          #
          # D-2311: `gate_10b` in .github/gates_tree.rs reads the table rows of
          # docs/04-invariants.md, and refuses a file it cannot read or one in
          # which it finds no identifier at all. The id shape is gate 27's,
          # `[A-Z][A-Z0-9]*(-[A-Za-z0-9]+)+` (D-2667, P6-04, D-1936): the old
          # `[A-Z]+-[0-9]+[a-z]?` could not see `FV4-01` or `S-30-session`, so a
          # duplicate among them passed.
          "${RUNNER_TEMP:-/tmp}/gates-tree" gate-10b

      - name: Gate 7 — the browser crate depends on core alone
        run: |
          set -euo pipefail
          # `crates/web` no longer exists: D-0052 moved the browser code to
          # `web/`, where it is no longer a crate at all and so has no
          # Cargo.toml and no dependency line to police. The check is kept
          # rather than deleted because the INVARIANT it guards -- the browser
          # code reaches only for `core` -- outlives the layout, and a crate of
          # this name reappearing must be held to it again. The skip below is
          # therefore the correct outcome today, not a gap.
          #
          # D-2311: `gate_7` in .github/gates_tree.rs skips when
          # crates/web/Cargo.toml is not a file.
          #
          # READ AS TOML, BY PACKAGE (P1-08-05, D-2660, D-1936). This was the
          # flat `[dependencies]` reading D-1107 removed from gates 9 and 9b:
          # `[dependencies.store]`, a dotted key, a target table or a
          # dev-dependency printed nothing and the step said OK. `source_scan
          # deps` prints `file:line:kind:name:package` for every spelling, and
          # any declaration whose package is not `core` is refused.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gt="${RUNNER_TEMP:-/tmp}/gates-tree"
          work=$(mktemp -d)
          "$gt" gate-7 prepare "$work"
          st=0; xargs -0 -r "$scan" deps < "$work/web.z" > "$work/deps" || st=$?
          "$gt" gate-7 verdict "$work" "$st"

      - name: Gate 13 — no foreign runtime, not even through a dependency
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 forbids "any interpreted
          # runtime, as a dependency, a dev-dependency, or a tool" and "any
          # vendored binding to another language", WITHOUT EXCEPTION. Gate 1
          # enforces section 2 by walking tracked file EXTENSIONS — and a
          # binding does not arrive as an extension. It arrives as one line in
          # a Cargo.toml, which is a `.toml` and passes gate 1 without a
          # murmur; or, worse, as a TRANSITIVE package in Cargo.lock that
          # nobody typed at all and nobody reads. The route is concrete rather
          # than hypothetical: the cost calculator landing in crates/costs is
          # lifted from a predecessor repository whose manifest declared
          # exactly such a binding library. Until this step, the ban was
          # unenforced against the one path a violation was most likely to
          # take.
          #
          # WHY `cargo deny` IS NOT ENOUGH ON ITS OWN. Gate 3 runs
          # `cargo deny check` and deny.toml carries a [bans] list, and that
          # list IS enforced — proven differentially, not assumed: a workspace
          # holding a package by a banned name exits 2 with the entry present
          # and 0 with the entry removed. Three gaps remain anyway.
          #   1. Gate 3 lives in the `build` job, which NEEDS this one. A
          #      violation would otherwise burn a toolchain install, a fetch
          #      and a full compile before anybody hears about it.
          #   2. cargo-deny resolves only the three targets in deny.toml's
          #      [graph]. A dependency conditional on a fourth is invisible to
          #      it. It is not invisible to a text scan of the lock, because
          #      Cargo.lock lists every package for every target.
          #   3. deny.toml is an ordinary tracked file, and one deleted line
          #      disarms it with every other gate still green. Layer 4 below
          #      guards that file the way gate 11 rule 5b guards the clippy
          #      lint table.
          #
          # THE WORD ITSELF IS GATE 15's JOB, not this one's. Gate 15 walks
          # every tracked file — Cargo.toml and Cargo.lock included — for the
          # assembled token, so this step does not repeat that trick. One copy
          # of a fragile mechanism is safer than two.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`
          # and the static lists below — gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly because a gate that oversells
          # itself is worse than no gate:
          #   * A binding published under a name that is not on the list. The
          #     list is finite and the ecosystem is not. deny.toml's
          #     `unknown-registry = "deny"` plus the workspace dependency table
          #     are the controls for the general case; this is the control for
          #     the named ones.
          #   * A C or Lua source tree vendored in WITHOUT a manifest entry.
          #     Gate 1's extension allowlist is what refuses that, and it
          #     already does.
          #   * Anything untracked. `git ls-files` is the input, which is right
          #     for CI — the checkout holds only tracked files — and means a
          #     local run disagrees with CI until `git add`.
          #   * A rename performed inside a `[patch]` or `[replace]` table. The
          #     package NAME still has to appear for cargo to resolve it, so
          #     the name rules catch the ordinary case, but the aliasing is not
          #     modelled.
          #   * Whether a crate that is NOT on the list embeds a runtime.
          #     Nothing textual can decide that.

          # ---- the names, and how the list was built. -----------------------
          # Every name below returned HTTP 200 from
          # https://crates.io/api/v1/crates/<name> when this gate was written.
          # A ban list is worth exactly the crates it can actually stop, and a
          # misspelled entry stops nothing while reading as protection.
          #
          # The thirteen the operator named are all present. The rest are the
          # same class and are here because renaming is the obvious way round a
          # short list: `rusty_v8` and `quickjs-rs` are the former names of `v8`
          # and `rquickjs`; `magnus` and `rutie` sit beside `ruby-sys`;
          # `ext-php-rs` is the PHP one; and `lua-src` / `luajit-src` are the
          # crates that COMPILE the Lua interpreter from its own C sources,
          # which is the floor `mlua` stands on.
          #
          # DELIBERATELY ABSENT, so the holes are written down rather than
          # discovered later:
          #   * `wasmtime` and every other WebAssembly runtime, AND the three
          #     JavaScript binding crates `wasm-bindgen`, `js-sys`, `web-sys`.
          #
          #     THIS ENTRY USED TO GIVE A REASON THAT IS NO LONGER TRUE, and it
          #     is corrected rather than quietly reworded. It read: "wasm32 is a
          #     COMPILATION TARGET of this workspace -- crates/web, gate 7 --
          #     not a foreign language. Banning the runtime for the target we
          #     ship to would be nonsense."
          #
          #     `crates/web` DOES NOT EXIST. D-0052 and D-0053 moved the front
          #     end to `web/` as an unrestricted directory, CLAUDE.md section 5
          #     says so outright and adds that GATE 7 SKIPS PERMANENTLY, and no
          #     manifest in this workspace names a wasm32 target. "The target we
          #     ship to" named nothing at all. D-0298.
          #
          #     What is true, measured 2026-08-26: the three binding crates ARE
          #     in `Cargo.lock` -- seven entries across the `wasm-bindgen`
          #     family plus `js-sys` and `web-sys` -- and NONE is in the build
          #     graph. They arrive only through target-gated paths,
          #     `lake -> parquet -> chrono -> iana-time-zone` and
          #     `api -> pull -> reqwest`. The proof is one command:
          #
          #       cargo tree --workspace -i wasm-bindgen   # "nothing to print"
          #
          #     SO THIS CLASS IS UNGUARDED BY NAME, DELIBERATELY, and here is
          #     why banning it would be worse than not: the lock layer greps
          #     `Cargo.lock` for the family, would find those seven, and would
          #     need `allow_lock='Cargo.lock 7'` on the same day. That is the
          #     "allowlisted into silence" failure the next bullet names, and it
          #     would not even guard the real risk -- a crate newly reaching
          #     `js-sys` on the host does not change a lock count that already
          #     reads one.
          #
          #     The check that guards it is Gate 13a in the `build` job:
          #     `cargo tree -i` over the current host graph. It cannot live in
          #     THIS job because this job deliberately installs no toolchain --
          #     "no toolchain, no cache, seconds". Gate 13a keeps lock-only,
          #     target-gated entries legal while refusing any of the three that
          #     becomes reachable by a host build. D-0486.
          #   * `cpp`, `inline-c`, `tcl`. The family rule below also matches
          #     `<name>-*` and `<name>_*`, and `cpp_demangle` is a pure-Rust
          #     symbol demangler that arrives transitively behind `addr2line`.
          #     A gate that is wrong in the false-positive direction is a gate
          #     that gets allowlisted into silence.
          #
          # ONE LIST FOR THREE MECHANISMS (D-1108). This list,
          # `crates/vocab/tests/workspace_is_rust.rs`'s `FORBIDDEN` and
          # `deny.toml`'s `deny` were written apart and disagreed: this one,
          # which runs first, named neither `napi`, `rhai`, `mozjs`, `j4rs`,
          # `quickjs`, `lua`, nor the three crates that embed or bind the
          # best-known interpreted language. They are added below, each having
          # answered HTTP 200 from crates.io on 2026-10-02.
          # `the_three_banned_lists_agree` in that test file reads THIS LIST
          # out of this file and fails the build when the three drift. The
          # banned word is spelled through `$snake` so gate 15 can keep
          # refusing it outright here.
          snake="$(printf 'py')thon"
          banned="
          pyo3 c${snake} rust${snake}-vm ${snake}3-sys
          mlua rlua hlua lua lua-src luajit-src
          rquickjs quickjs quickjs-rs duktape boa_engine deno_core v8 rusty_v8
          mozjs rhai
          napi neon node-bindgen
          jni j4rs
          ruby-sys magnus rutie
          ext-php-rs
          wasmtime wasmer wasmi rust${snake} deno_runtime quick-js rb-sys jlrs
          extendr extendr-api extendr-engine
          starlark rune gluon mun koto steel-core piccolo libR-sys perl-sys libperl-sys tcl
          "

          # THE ESCAPE HATCHES ARE HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism — no magic comment scattered
          # through crates/. One allowlist PER LAYER, so a justification
          # written for a manifest cannot silently excuse the lock, which is
          # the layer a transitive violation hides in. All three ship EMPTY,
          # and all three are audited for staleness at the end of this step.
          allow_decl=''
          allow_lock=''
          # ONE ENTRY, AND LAYER 3'S OWN COMMENT PRESCRIBES HOW IT IS TAKEN:
          # "The allowlist below is the escape, and taking it should come with a
          # decisions entry." D-0348 is that entry.
          #
          # The clause layer 3 rests on is the one that expired. It reads "there
          # is no C to compile, no protocol to generate from, no version to stamp
          # that CARGO_PKG_VERSION does not already carry" -- and CLAUDE.md
          # section 3 rule 3 requires the COMMIT, which no cargo variable
          # carries. `cli::commit_stamp()` is `option_env!("BRUTEX_COMMIT")`, so
          # a build nobody stamped by hand refuses every sweep.
          #
          # That was not theoretical. `docs/07-plan.md` section 0 states the
          # whole procedure as "press Run on the api binary" in IntelliJ, and
          # records that IntelliJ takes its run entries from `.idea/` or
          # `.run/*.xml`, NEITHER TRACKED -- and `.xml` is not in CLAUDE.md
          # section 2's extension allowlist, so this repository cannot ship one.
          # The IDE auto-detects the binary and runs it with no environment.
          # Measured on the operator's machine across two restarts, on 81 months
          # of pulled Zerodha NIFTY: the server served every page and swept
          # nothing. The launcher could not be the fix, so the build is.
          #
          # WHAT THE SCRIPT MAY STILL NOT DO IS UNCHANGED. Gate 2 greps every
          # build.rs for `Command::new` and `std::process` and is not relaxed;
          # `crates/cli/build.rs` contains neither and reads git's own files.
          # Gate 2's second clause -- `build =` or `links =` in a manifest -- is
          # also untouched, and this script is picked up from the DEFAULT path so
          # no manifest names it. A second build script, or this one growing a
          # process, is still a red build.
          #
          # THREE ENTRIES, AND THEY ARE ONE BUILD SCRIPT. `crates/cli/build.rs`
          # declares `mod build_provenance;` and `mod commit_stamp;`; both files
          # sit beside it and both are compiled into the script cargo runs.
          # Layer 3 used to see only the root, so the two modules were 61,259 of
          # the 66,459 bytes that execute before this workspace compiles and no
          # allowlist accounted for a byte of them. They are named here for the
          # same reason the root is: this list is what a reader consults to
          # learn what the one permitted build script consists of, and a FOURTH
          # file joining it is now a red build that someone has to justify. That
          # is the whole point of the entry — D-0348 permitted a build script,
          # not an open-ended set of files.
          allow_build='crates/cli/build.rs 1
          crates/cli/build_provenance.rs 1
          crates/cli/commit_stamp.rs 1'

          # `path:line:text` records compared against a `path count` allowlist.
          # Identical in shape to gates 11 and 12 on purpose: one mechanism to
          # learn, and adding a line anywhere is a visible diff.
          # An entry naming a file that is gone makes this gate read stronger
          # than it is, so it is a FAILURE. An entry whose file no longer
          # matches is only loose, and says so.

          # ---- layer 1: no manifest DECLARES one. ---------------------------
          # EVERY tracked Cargo.toml, the root one included. Checking only
          # crates/ would miss the half that matters: [workspace.dependencies]
          # is where a shared dependency actually lands, and a member then
          # writes nothing but `name = { workspace = true }`.
          #
          # Comments are stripped first — everything from the first `#` — so
          # the prose in these manifests, which discusses banned names BY NAME,
          # is not itself a violation. The cost is that a `#` inside a string
          # truncates its line; no manifest here has one, and a truncated line
          # can only cause a MISS inside a comment, never a false refusal.
          # And the same manifests PARSED, one declaration per line (D-1108). A
          # manifest the scanner cannot read is a refusal: an unparsed manifest
          # is one whose dependencies nobody has vouched for.

          # ---- layer 2: nothing in the LOCK either. -------------------------
          # A transitive pull is the same violation one level down and much
          # harder to notice, which makes it the dangerous one. The lock is
          # matched on its package-name lines only — `name = "x"` at the start
          # of a [[package]] stanza. The `dependencies = [ ... ]` arrays are
          # not matched and do not need to be: every name in one of those
          # arrays has its own [[package]] stanza in the same file, by the
          # format's own definition.

          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.

          # A dependency key: `n = ...`, `n.workspace = ...`, or the inline
          # form `dependencies = { n = ... }`. Preceded by any non-name
          # character, which the corpus prefix's own `:` also satisfies.
          # A dependency TABLE header: [dependencies.n], [dev-dependencies.n],
          # [build-dependencies.n], [workspace.dependencies.n], and the
          # [target.'cfg(...)'.dependencies.n] shape.
          # A RENAMED dependency: `alias = { package = "n", ... }`. Without
          # this, one word defeats the whole gate.
          # THE SAME QUESTION, ASKED OF THE PARSED MANIFEST (D-1108). The
          # three patterns above read lines, and four valid spellings walked
          # past them: `"n" = ..`, `n . version = ..`, `package = 'n'` and
          # `[dependencies."n"]`. `source_scan deps` lists every declaration
          # as `FILE:LINE:kind:name:package`, so a family match on the NAME or
          # the PACKAGE field is the declaration, however it was spelt. The
          # line patterns stay: they are not weaker, and two readings that
          # must both be fooled are stronger than one.

          # ---- layer 3: no build script EXISTS. -----------------------------
          # Gate 2 asks the narrower question — does a build script shell out —
          # and keeps asking it. This asks the simpler one. A build script is
          # arbitrary code that runs on every developer's machine and on every
          # runner before a single line of this workspace is compiled, and
          # "does it shell out" is decided by a text scan that indirection
          # beats. Nothing in this repository needs one: there is no C to
          # compile, no protocol to generate from, no version to stamp that
          # `env!("CARGO_PKG_VERSION")` does not already carry.
          #
          # THIS IS STRICTER THAN CLAUDE.md SECTION 2, WHICH SAYS "any build.rs
          # that invokes an external process". The stricter reading is
          # deliberate and is the operator's instruction; it is recorded here
          # rather than in a review comment so the difference is visible. The
          # allowlist below is the escape, and taking it should come with a
          # decisions entry.

          # AND A BUILD SCRIPT IS NOT ONE FILE. A match on the last path
          # segment (the shell's `$NF == "build.rs"`) reports the ROOT of the
          # script and nothing the root declares.
          # `crates/cli/build.rs` says `mod build_provenance;` and
          # `mod commit_stamp;` on two consecutive lines; both files sit beside
          # it and both are compiled into the script cargo runs, and neither has
          # ever been reported by this layer or accounted for by its allowlist.
          # Layer 3's rule is that the script EXISTS, so the files it is MADE OF
          # are this layer's subject exactly as its root is — otherwise a third
          # module joins the one permitted build script and nothing here notices.
          # Gate 2's `*build.rs` glob had the identical hole and is widened the
          # same way in the same commit.
          #
          # The files are the scanner's closure (D-1101), the same one gate 2
          # reads: every module declaration with any visibility, `#[path]` and
          # `include!`, tracked files only, and anything it cannot resolve is
          # refused here too rather than left out of the count. The shell walk
          # this replaced read only `mod NAME;` and `pub mod NAME;`, so a
          # `#[path]`, `pub(crate) mod` or `include!` file joined the script
          # with this layer still printing "1 of 1 allowed".

          # AND THE SCRIPT NEED NOT BE CALLED `build.rs`. That segment match
          # reads the DEFAULT filename; a manifest that says `build = "gen.rs"`
          # renames the script straight out of this layer, and the file it names
          # is a `.rs` that gate 1's extension allowlist welcomes. Gate 2's
          # `*build.rs` glob had the identical hole and is closed in the same
          # commit -- one `build =` line used to defeat both checks at once.
          #
          # The comment-stripped corpus of every tracked manifest that layer 1
          # walks is already in hand, so the key costs one more pattern and
          # arrives in the `path:line:text` shape the verdict reads. `links =` rides along
          # because a package that declares one is a package cargo REQUIRES a
          # build script for -- it is this layer's subject announced in a
          # different word.

          # ---- layer 4: the second line of defence is still armed. ----------
          # PINNED AT WHAT deny.toml CARRIES TODAY. A name on this line that
          # disappears from deny.toml is a red build: that is the guard-the-
          # guard half, and it is the same argument gate 11 rule 5b makes
          # about the clippy lint table. Names on THIS gate's list that
          # deny.toml has never carried are a WARNING and not a failure — the
          # scan above is the primary control for them, cargo-deny is the
          # second, and making this step red for a file it does not own would
          # teach a reader to ignore it.
          # Is cargo-deny actually RUN, and at a pinned version? Gate 3's own
          # comment argues both, and a comment cannot enforce itself.
          #
          # A line's PRESENCE is not a line's EXECUTION, and an audit showed the
          # first repair was half of one (D-1102). It refused only an `if:` that
          # collapses to a literal false, and two edits switched gate 3 off with
          # this layer still printing "present": a step-level
          # `continue-on-error: true` (the step runs, its failure no longer fails
          # the job, and ci-ok sees `success`) and a constant-false expression
          # such as `if: false && true` or `if: github.run_attempt == 0`. A
          # job-level `if:` was out of scope by its own comment.
          #
          # `source_scan step-runs` now finds every step whose script carries a
          # line beginning with the needle and refuses it unless: the step and
          # its job set no `continue-on-error` other than `false`; the step's
          # and the job's `if:` are absent or one of `always()`, `success()`,
          # `!cancelled()` or the build job's crate probe (true on every run
          # that reaches that job, because gate 16 refuses a tree without a
          # crate); and the job is in ci-ok's `needs`. An allowlist of safe
          # conditions rather than a denylist of unsafe ones, because the
          # denylist is what the audit walked past.

          # The line said "declared, resolved, or built for", and an audit built
          # `ring`'s C under it (rustonly-6): this step reads manifests and the
          # lock and cannot see what a feature switches on. Gates 13b and 13c
          # in the build job are what read the build (D-1111).

          # D-2312: every rule above is `.github/gates_runtime.rs`, built here
          # once for gates 13 to 24 and tested before it is trusted. The
          # scanner it reads tokens with is gate 0's, bound at compile time.
          export CARGO_BIN_EXE_source_scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          gr="${RUNNER_TEMP:-/tmp}/gates-runtime"
          rustc --edition=2024 --test -D warnings .github/gates_runtime.rs -o "${gr}-tests"
          "${gr}-tests"
          rustc --edition=2024 -D warnings .github/gates_runtime.rs -o "$gr"
          "$gr" gate13 --banned "$banned" --allow-decl "$allow_decl" \
            --allow-lock "$allow_lock" --allow-build "$allow_build"

      - name: Gate 15 — the forbidden word appears in no tracked file
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 makes Rust the only language
          # here, and the operator's rule is stricter than the extension
          # allowlist gate 1 walks: the NAME of the best-known interpreted
          # language is not to appear in this repository at all. Not as a
          # dependency, not in a comment, not in a document, not in a variable.
          # Gate 1 cannot see a word — it sees the characters after the last
          # dot. Gate 13 sees only manifests and the lock. This step walks
          # every tracked byte.
          #
          # THE TOKEN IS ASSEMBLED AND IT MUST STAY ASSEMBLED. It is `WORD` in
          # .github/gates_runtime.rs (D-2312), `concat!` of two halves at
          # compile time, with `WORD_LEN` as the length self-check; it was
          # assembled by this step's shell before, by the same argument.
          # This workflow is itself a tracked file — gate 1 walks `git
          # ls-files` and `.github/workflows/ci.yml` is in that list — so a
          # gate that spelled the banned word out would refuse ITSELF on its
          # first run and every run after, and the only route back to green
          # would be to allowlist the workflow file: which would disarm the
          # ban for the one file best placed to hide things. So the word is
          # built from two halves that mean nothing apart and are the banned
          # token together.
          #
          # IF YOU ARE HERE TO "TIDY" THIS INTO A LITERAL, STOP. That single
          # edit breaks the gate against itself and there is no clean repair.
          # The length self-check is the tripwire for the other half of
          # the same accident: blanking a fragment would leave a token that
          # matches every line, or an empty one that matches nothing.
          #
          # WHY IT IS A SUBSTRING RULE AND NOT A WHOLE-WORD ONE: the reference
          # implementation and the two Rust-hosted reimplementations all carry
          # the token inside their own crate names, so one substring rule
          # refuses all three for free, without this file naming any of them.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files` and the two
          # static fragments of `WORD`. Gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * Anything untracked. The input is `git ls-files`, which is right
          #     for CI and means a local run and CI disagree until `git add`.
          #   * The word split across two source lines, or written with a
          #     zero-width character inside it, or base64'd, or spelled in a
          #     different script. A determined author beats any text rule. This
          #     stops the accident and the habit, which is what actually
          #     happens.
          #   * Other spellings of the same idea — the file extension, the
          #     interpreter's binary name, a shebang line. Gate 1's extension
          #     allowlist refuses the first. Nothing here refuses the rest.
          #   * Whether the appearance was a VIOLATION or a HISTORICAL
          #     REFERENCE. A sentence describing what a predecessor repository
          #     was written in is not a foreign runtime in this one, and this
          #     gate cannot tell the difference. That is what the allowlist is
          #     for, and taking it is a visible diff on this file.
          #
          # A CI LOG IS NOT A TRACKED FILE, but the log below still MASKS the
          # token wherever it echoes an offending line. Printing it verbatim
          # would make this gate's own output the leak it exists to prevent.

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism. IT SHIPS EMPTY, on the same
          # argument gates 11 and 12 ship empty: every occurrence on the tree
          # today is named in the log of this step, and pinning them here on
          # the way in would convert a list of findings into one line nobody
          # reads. A file listed here is a file where the word is tolerated,
          # which is a thing somebody should have to type on purpose.
          # `crates/vocab/tests/workspace_is_rust.rs` is the test that REFUSES
          # interpreter bindings, and it cannot refuse a crate without naming it.
          # Three of the names in its `FORBIDDEN` list contain the banned word:
          # a Rust-hosted interpreter, a C binding to one, and a `-sys` shim. This
          # gate's own failure message names the allowlist as the answer when "the
          # occurrence genuinely has to stay", and this is that case -- the
          # alternative is a test that bans nothing.
          #
          # The COUNT is pinned at 3, so a fourth occurrence in that file still
          # fails. This is a bounded hole with a named reason, not an exemption.
          #
          # AND THE ENTRY IS GONE (D-1108): that file now spells the three names
          # with `concat!`, as gate 13 spells them through `$snake`, so it holds
          # no occurrence and the word is refused there like everywhere else.
          # FOUR ENTRIES ADDED, AND ALL FOUR ARE THE HISTORICAL-REFERENCE CASE
          # the paragraph above says this list exists for. Every one names the
          # language of KITE'S OWN VENDOR SDK, in prose, while explaining why a
          # particular refusal is classified the way it is -- the vendor
          # documents `PermissionException` in that SDK rather than on the wire,
          # which is the whole reason those two failures collapse onto one point
          # on the status axis. None is a dependency, a tool, a build step or a
          # file this workspace runs. `crates/pull` takes no such dependency and
          # gate 1 would refuse the extension if it did.
          #
          # Deleting the sentences would make this gate green by removing TRUE
          # provenance about an external system, which is the trade CLAUDE.md
          # §3 rule 1 exists to refuse: the vendor's behaviour is a verified
          # external fact and the reason it is recorded is that a reader
          # otherwise cannot tell why two different failures are one event.
          #
          # THE COUNTS ARE CEILINGS, NOT EXACT. A file that drops below its
          # number warns rather than fails, so a sentence removed later is
          # noticed without blocking the branch.
          allow_word='
          crates/pull/src/kite.rs 2
          crates/pull/src/refusal.rs 1
          crates/pull/src/vendor.rs 1
          docs/05-decisions.md 1
          '

          # The listing is written to a file first, so a git that FAILS fails
          # this step under `set -e`; read from a process substitution, its
          # failure was swallowed and the loop read nothing (AC-gates-law-10).
          # NUL-separated, so a name git would quote is read as itself.
          # A FILE GREP READS AS BINARY IS STILL READ (D-1104). This used to
          # be `grep -I`, which SKIPS a file holding one NUL byte -- and an
          # audit put the banned word in a `.md` beside one NUL and watched
          # this gate print OK. `-a` reads every byte as text. The binary
          # count stays, as a count, so it is visible; gate 1 refuses a NUL
          # byte in any tracked file outside web/ outright.
          # COUNT FIRST, TAB-SEPARATED, PATH LAST. Written `path count` and
          # read back on spaces, a tracked file whose name contains a space
          # splits into the wrong fields, the count comparison becomes a
          # string comparison that errors, and the file is reported ALLOWED.
          # A silent miss is the one failure mode these gates exist to
          # prevent, so the separator is a tab and the unbounded field is
          # last.

          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.

          # The same two self-audits gates 11 and 12 carry. An entry naming a
          # file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file is now clean is only loose, and
          # says so.

          # D-2312: the walk, the count and the mask are `gates_runtime gate15`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate15 --allow "$allow_word"

      - name: Gate 16 — every crate root forbids unsafe outright
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 5 counts `allow(unsafe_code)` occurrences and
          # caps them at three. It never checks that anything is FORBIDDEN. On
          # a tree where no crate carries the attribute at all it counts zero
          # exceptions and prints the cleanest possible log for the weakest
          # possible state — and a new crate arrives with neither attribute by
          # default, which is exactly the moment nobody is looking. crates/costs
          # is being written as this gate is.
          #
          # DENY IS A DEFAULT; FORBID IS A WALL. The root manifest's
          # `[workspace.lints.rust] unsafe_code = "deny"` is real and it is
          # checked below — but a deny is a lint LEVEL, and one
          # `#[allow(unsafe_code)]` on one function switches it off for that
          # function with nothing red anywhere. `#![forbid(unsafe_code)]` is
          # not a level: an inner allow under a forbid is a hard compile error,
          # not a lint that can be downgraded. The two are complements, and the
          # gate needs both because either alone is one edit from gone.
          #
          # THE THIRD HOLE, WHICH IS THE QUIET ONE. `[workspace.lints]` applies
          # to exactly NOTHING in a member that does not write `[lints]
          # workspace = true` in its own manifest. Deleting those two words
          # from one crate's Cargo.toml disarms the whole workspace lint table
          # for that crate — unsafe_code, unwrap_used, expect_used, panic, the
          # lot — and no gate in this file looked at it before this one. Gate
          # 11 rule 5b guards the CONTENT of that table; this guards whether
          # anybody has opted in to it.
          #
          # STRICTER THAN "lib.rs", DELIBERATELY, AND IT IS RED BECAUSE OF IT.
          # A `main.rs` is a SEPARATE CRATE ROOT. The inner attribute at the
          # top of lib.rs is an attribute on the library crate and does not
          # reach the binary crate at all — they are compiled separately.
          # crates/api/src/main.rs carries no forbid today and this gate
          # refuses it. That difference is written here rather than discovered
          # in a review, which is gate 13 layer 3's precedent.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # the tracked manifests and the static list below — gate 1c's
          # discipline. Nothing from the event payload is expanded.
          #
          # WHAT IT CANNOT SEE:
          #   * A crate root that is neither `src/lib.rs` nor `src/main.rs`. A
          #     `[lib] path = ...` or `[[bin]] path = ...` moves it. The gate
          #     does not parse the override and does not guess: a manifest
          #     whose roots it cannot find is REFUSED, so the blind spot is a
          #     red build rather than a silent skip.
          #   * `unsafe` inside a dependency. `forbid` is per-crate and std
          #     itself is full of it. This gate is about the code this
          #     repository writes.
          #   * Whether the attribute is inside a `#[cfg(...)]` that removes
          #     it. It is matched at the start of a line as an inner attribute,
          #     which is the only place it is legal, but no cfg is evaluated.
          #   * Anything untracked, `git ls-files` being the input.

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. One tracked crate-root
          # path per line — a plain path and not `path count`, because the
          # question is present-or-absent and a count column for a boolean
          # invites a 0 that reads like an allowance. IT SHIPS EMPTY. The one
          # root that fails today is named in the log; pinning it here on the
          # way in would convert a finding into a line nobody reads.
          allow_root='
          '

          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.

          # LAYER 1b — THE OTHER CRATE ROOTS (D-1103). Every `tests/*.rs`,
          # `benches/*.rs`, `examples/*.rs`, `src/bin/*.rs` and `build.rs` is a
          # crate root of its own, and layer 1 read only `src/lib.rs` and
          # `src/main.rs`. The workspace `unsafe_code = "deny"` reaches those
          # roots, but one `#[allow(unsafe_code)]` switches it off and gate 5
          # passes up to three of those with no decision entry. In a build
          # script, an `unsafe extern "C"` call to the C library's `system` then
          # starts a shell with no `Command` or `std::process` token for gate 2
          # to see. So every file those roots compile -- their scanner closure
          # -- may not carry `unsafe`, a foreign `extern` interface or `asm!`, all
          # read from tokens, never from comments or strings. The tree uses none.
          # ONE FILE IS EXCEPTED, BY NAME, AND ONLY FOR WHAT IT DECLARES
          # (D-1450). `crates/pull/tests/allocation.rs` implements
          # `GlobalAlloc` to COUNT heap allocations, the one way to prove
          # `pull::csv`'s "no allocation per row" against an allocation
          # rather than against a spelling (D-0721, D-0724). It is a test
          # crate root, never linked into a shipped binary, it carries the
          # `#![allow(unsafe_code)]` gate 5 counts as one of its three, and
          # every method forwards unchanged to `System`. D-1103 wrote this
          # layer while that file lived on another branch ("the tree uses
          # none"); the two met in the combined fold. The exception is a
          # file, not a pattern: any other root with `unsafe`, and any
          # `extern` or `asm!` even in this file, is still refused.
          allow_unsafe_test_root='crates/pull/tests/allocation.rs'

          # The same two self-audits gates 11 through 15 carry. An entry naming
          # a file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file now carries the attribute anyway
          # is only loose, and says so.

          # ---- layer 2: the workspace deny, and who has opted in to it. -----

          # D-2312: every layer above is `gates_runtime gate16`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate16 --allow-root "$allow_root" \
            --allow-unsafe-test-root "$allow_unsafe_test_root"

      - name: Gate 17 — nothing logs from inside the sweep
        run: |
          set -euo pipefail
          # WHY THIS EXISTS, AND WHY O(1) IS NOT THE BAR HERE.
          #
          # `telemetry::emit` is O(1) and a FILTERED event is very nearly free:
          # one relaxed atomic load and a comparison, no clock, no lock, no
          # buffer. On a per-member path — thousands of calls — that is
          # genuinely nothing, which is why crates/pull emits there.
          #
          # The sweep is not that path. It walks the combination ladder upward
          # from k=1 and evaluates `(bits & mask) == mask` per (bar, mask). That
          # is BILLIONS of evaluations, and a billion O(1) calls is a billion
          # calls. Constant per-operation cost (CLAUDE.md section 3 rule 4) is
          # satisfied by an emit and the operator still loses the run: the bar
          # is not "each call is cheap", it is "the innermost loop does not call
          # anything at all".
          #
          # SO THE RULE IS ZERO, NOT SMALL. No `telemetry::` reference of any
          # kind may appear in the crates that hold the mask, the vocabulary and
          # the sweep. What replaces it is the pattern `crate::session::
          # DropCensus` already uses in crates/pull: plain integer counters,
          # incremented in the loop with no atomic and no allocation, emitted
          # ONCE at a structural boundary — per k-level, per instrument, per
          # run. Every combination is still accounted for; none of them is
          # logged individually. Full detail, zero marginal cost.
          #
          # WRITTEN BEFORE THE SUBJECT EXISTS, ON PURPOSE. crates/engine and
          # crates/indicators are not workspace members yet and crates/vocab is
          # not tracked yet, so this step passes vacuously today and says so.
          # A rule that arrives after the hot loop is a rule that arrives after
          # somebody has already put an emit in it.
          #
          # `runner` IS ON THIS LIST, AND ITS ABSENCE WAS THE HOLE.
          #
          # The three crates below hold the vocabulary, the mask and the ladder.
          # None of them holds a LOOP OVER BARS: `crates/runner` does. It is the
          # crate that walks candles into `indicators`, drives `engine` level by
          # level, prices every trial through `crate::trade` and resamples the
          # whole thing per bootstrap draw -- so the per-bar and per-trial
          # innermost loops this rule is written about are literally in the one
          # crate the rule did not reach. A `telemetry::emit` added to
          # `runner::trade` or `runner::bootstrap` would have been invisible here
          # while costing exactly what the paragraph above says it costs.
          #
          # It is added to THIS gate and not to gate 22's dependency clause, and
          # that separation is deliberate; gate 22 says why in its own comment.
          # Zero logging and a pinned dependency set are two different rules, and
          # runner satisfies the first while legitimately failing the second.
          #
          # MEASURED BEFORE IT WAS ADDED: 17 tracked sources under
          # `crates/runner/src`, zero matches for any of the four patterns below,
          # so this widening is a hole closed and not a red build deferred.
          #
          # NO UNTRUSTED INPUT: `git ls-files` and the static list below.
          #
          # THE GATE NOW READS PATHS, NOT LINES (D-1109). It used to drop every
          # line whose first non-blank character was `//` or `*` and grep the
          # rest for four words, on the claim that "no Rust CALL can sit on a
          # line that begins with `//`, so this cannot hide one". The `*` half
          # was never argued: `*slot = 1; println!(..)` is one ordinary line and
          # was never read. `use std::eprintln as note;` then `note!(..)`
          # compiles and matched nothing, `dbg!` was not looked for, `::log::`
          # was read only by accident of spelling, a file name holding a space
          # was split in two and never opened, and an absent crate printed
          # "absent" and passed.
          #
          # `source_scan paths` lexes each file -- comments are not code, a
          # `*`-led statement is -- and prints every path it uses in canonical
          # form: `use` aliases expanded (so `note!` is `std::eprintln`), `r#`
          # dropped, a leading `::` read as the crate root. The rule refuses a
          # path into `telemetry`, `log` or `tracing`, and the print macros
          # `print`, `println`, `eprint`, `eprintln` and `dbg` and the
          # `io::stdout`/`io::stderr` handles, bare or through `std`, `core` or
          # `alloc`. The files are the tracked sources under each crate's `src/`
          # PLUS the module closure of its `src/lib.rs`, so a module mounted
          # with `#[path]` from outside `src/` is read too. Every listing is a
          # NUL-separated file, so no path is word-split.
          #
          # MEASURED BEFORE THE SWITCH: zero hits over the four crates.
          swept='vocab engine indicators runner'
          # A macro invocation is printed with a trailing `!`, so a local named
          # `print` or a variable named `stderr` is not a hit.

          # D-2312: the closure, the paths and the rule are `gates_runtime gate17`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate17 --swept "$swept"

      - name: Gate 23 — stderr is not a log, and a new crate is covered the day it appears
        run: |
          set -euo pipefail
          # WHY. Every other logging gate names the crates it walks, so a crate
          # added tomorrow starts outside all of them. And nothing stopped a
          # diagnostic being written with `eprintln!` instead of an event, which
          # was not hypothetical: a refused bind, a server that stopped on an
          # error, and two null-price bar notices all went to a terminal and
          # never reached a log file. Handed the log folder after a failed run,
          # nobody could see any of them — the exact purpose the logging work
          # exists to serve.
          #
          # This walks `crates/*/src` BY GLOB. There is no crate list to fall out
          # of date.

          # WHOLE FILES, TEST CODE INCLUDED, AND DELIBERATELY SO.
          #
          # The first draft of this gate scanned only the region before the first
          # `#[cfg(test)]`. That assumption holds in `crates/telemetry` and is
          # FALSE across the workspace — `api/src/server.rs` has three such
          # blocks, `api/src/ingest.rs` three, `render.rs` three — so the gate
          # would have scanned the wrong region. It refused rather than guessing,
          # which is how this was found, but the fix is not a cleverer window: it
          # is not needing one. Counting whole files needs no brace matching, no
          # string-literal handling, and has no region to get wrong. The cost is
          # that a `println!` added to a TEST also has to be declared, which is a
          # line of bookkeeping rather than a failure mode.
          #
          # THE COUNT IS OF TOKENS, NOT LINES (D-1109). It dropped every line
          # whose first non-blank character was `//` or `*` and grepped the rest
          # for `m!`, so `*slot = 1; eprintln!(..)` was never counted, a
          # `println!` written inside a string literal was (telemetry's
          # `record.rs` was declared for one that prints nothing), and
          # `use std::eprintln as note;` then `note!(..)` printed to stderr and
          # counted as nothing at all. The file list was word-split, so a path
          # holding a space was never opened.
          #
          # `source_scan paths` prints every path each file uses, canonical --
          # `use` aliases expanded, `r#` dropped, a leading `::` read as the
          # crate root -- with a trailing `!` on a macro invocation. A print is
          # an invocation of `println`, `eprintln`, `print`, `eprint` or `dbg`,
          # bare or through `std`, `core` or `alloc`; the count is of
          # invocations, so two on one line are two.
          #
          # A HANDLE IS A PRINT TOO. `writeln!(std::io::stderr(), "...")`
          # reaches the same terminal as `eprintln!` and is none of the five
          # names. The handle, not the macro, is what is counted: `write!` and
          # `writeln!` appear hundreds of times into a `Formatter` or a
          # `String`, and what names the PROCESS's own stream is
          # `io::stderr` / `io::stdout`. Now matched as a canonical path, so an
          # aliased import is the same handle; `.stdout(Stdio::null())` is a
          # method and is not a path, and a variable named `stderr` is not
          # `io::stderr`. The `use` that imports a handle is counted with its
          # calls. A handle obtained through a trait object or `libc::write` is
          # still not seen; gate 22 clause B refuses `libc::` in the swept
          # crates. MEASURED: zero handles across the workspace today.

          # CLAUSE A — the print surface is exactly this, and every line says
          # which kind it is.
          #
          #   api/src/server.rs  println! 16, print! 1
          #       The startup banner and the `report` subcommand's output on STDOUT for
          #       the operator who just typed the command, plus test output. Deliberately
          #       not events: the banner is printed before a sink is guaranteed to exist,
          #       and a banner in a log file is noise rather than a record. 19 -> 22 was
          #       three more report lines -- a per-note line, a `universe:` line and a
          #       refusal reason -- all STDOUT report output, none a diagnostic.
          #       22 -> 16 IS SIX GOING THE OTHER WAY, and this clause asks for an
          #       exact match in BOTH directions for exactly this case: the six
          #       belonged to `zz_probe_duplicate_banner`, a `#[test]` whose whole
          #       body was `println!` and which asserted nothing -- the shape
          #       CLAUDE.md section 4 bans outright. It is now
          #       `a_repeated_subsystem_spends_budget_and_the_last_clause_wins`,
          #       with an assertion where each print was. A declaration left at
          #       22 would be the stale lie gate 1d refuses, so it moves in the
          #       same commit as the code.
          #   api/src/server.rs  eprintln! 7
          #       LINE NUMBERS ARE NOT PINNED HERE, deliberately: this file is being
          #       actively rewritten and every earlier count in this entry cited numbers
          #       that had moved by the next commit. The sites are named by their
          #       function instead, which survives an edit.
          #
          #       FIVE EMIT AND ARE FINE. A refused bind, a server that stopped, and
          #       `sole_server`'s "another instance is serving this store" each call
          #       `telemetry::emit` at `Level::Error` with a `why` immediately before the
          #       print; `stopped_over`'s DEGRADED-session notice emits with an `exit`
          #       field. The usage text on misuse is a CLI contract rather than a
          #       diagnostic. 5 -> 7 is the last two of those, both added with their
          #       emit already in place, which is the shape this gate is asking for.
          #
          #       TWO DO NOT EMIT, AND CANNOT. `run_from`'s D-0124 arm and the store-root
          #       refusal inside the `Serve` arm both fire when the environment could not
          #       name a store root. The sink lives UNDER that root, so at both sites
          #       there is no directory in which to open a log -- the refusal is the
          #       reason no sink exists rather than an accident of ordering, and the
          #       second says so itself: "BEFORE ANYTHING IS OPENED OR CREATED". stderr is
          #       the only channel in existence at that instant, which is the same
          #       argument telemetry/src/sink.rs carries below.
          #   pull/src/http.rs   eprintln! 6
          #       Bar-refusal notices, every one of which ALSO emits a
          #       `pull.decode` event immediately above the print -- verified
          #       site by site, not assumed. 2 -> 6 on 2026-08-29 because the
          #       declaration was stale by FOUR: the null-price pair it named
          #       had been joined by a negative-volume notice, a negative
          #       open-interest notice, an impossible-OHLC notice and a second
          #       null-price site on the interval path, each added with its
          #       emit already in place -- which is the shape this gate asks
          #       for -- and none of them added here.
          #
          #       A DECLARATION THAT IS BEHIND ITS CODE IS THE STALE LIE GATE 1d
          #       REFUSES, and this one was behind by four for long enough that
          #       it failed the build and hid every gate after it: no step sets
          #       `continue-on-error`, so gates 11, 12, 17 and 22 never ran
          #       while this number was wrong.
          #   telemetry/src/sink.rs  eprintln! 1
          #       The sink's own last-resort notice. It is the thing that failed,
          #       so it is the one place stderr is the only channel left.
          #   telemetry/src/record.rs eprintln! 1 -- REMOVED (D-1109). The one
          #       "eprintln!" in that file is inside a test's assertion message,
          #       a string literal; it prints nothing. The line count read it as a
          #       print because it read text, not tokens.
          #   api/src/constituents.rs println! 2
          #       Two lines printed by TESTS for a human reading `--nocapture`,
          #       both past that file's `#[cfg(test)]` at :889 — a cost-benchmark
          #       line (:1773) and the tier partition's five addends and total
          #       across twenty-four rows (:1079). Neither is on a production
          #       path. The first was declared the day the file appeared, because
          #       this gate refused it — which is the whole point of walking
          #       `crates/*/src` by glob, and it refused the second the same way.
          #   core/src/universe.rs, core/src/vendor.rs, greeks/src/{bsm,normal,solver}.rs
          #       Test diagnostic output, printed by tests for a human reading
          #       `--nocapture`. Not on any production path.
          #
          # An UNDECLARED file with any print fails. That is how a crate added
          # tomorrow is covered on its first day, and it is the whole point of the
          # glob above.
          # `api/src/main.rs:eprintln!` (D-1200, probeapi-3) is the refusal of
          # an argument that is not valid Unicode, printed to the operator's
          # terminal before `api::server::run` is reached: it is the misuse
          # message, the same kind of sentence `server.rs` prints for a bad
          # command. It is not left terminal-only: `note_exit` emits
          # `api.main` with the exit code `MISUSED` and the argument count on
          # every exit, this one included.
          # The SECOND (D-1582, hunt-api-2) is a production diagnostic: the
          # hand-built tokio runtime failed to start, so nothing ran. It is
          # not terminal-only either: the same arm calls `note_exit` with
          # `FAILED` before returning, so `api.main` records it. D-1458.
          #
          # `cli/src/main.rs:print!` is the PROGRAM'S OWN OUTPUT, not a
          # diagnostic. `cli::run` renders its whole report into a String and
          # main writes it to stdout in one call -- which is the shape that
          # makes the report testable without a terminal, and the reason the
          # binary itself holds no formatting. There is nothing to emit
          # alongside it: an event mirroring a report the operator is reading
          # would be the same fact twice.
          #
          # `core/src/universe.rs:println!` went from one to two. Both sit in
          # `#[cfg(test)]` and print a MEASUREMENT the assertion beside them
          # already enforces -- probe counts and bounds -- so the number is on
          # the terminal for a human reading a failure and in the assertion for
          # the build. Neither ships.
          #
          # THE TWO `cli` DIAGNOSTICS, AND WHY NEITHER CAN EMIT AN EVENT
          # INSTEAD. Both are the case telemetry/src/sink.rs already argues for
          # its own last-resort `eprintln!`: the thing you would emit through is
          # the thing that is unavailable.
          #
          # `cli/src/main.rs:println!` reports that the event sink FAILED TO
          # INSTALL. Emitting that through the sink is the one message it cannot
          # carry. It prints before the report so a long report cannot scroll it
          # away, and it names which variable to set -- `CLAUDE.md` section 4
          # asks a degradation to name its reason, and a silent absence of
          # events would be the fallback that hides a failure. D-0226.
          #
          # `cli/src/lib.rs:eprintln!` reports bars whose timestamps go
          # BACKWARDS, which the store's monotonic invariant forbids. It is
          # reached while BUILDING the session index every later stage reads, so
          # there is no report yet to write it into, and `session_index` returns
          # a plain `Vec` with nowhere to carry a refusal. Sorting around it
          # would paper over a broken invariant one layer down and hand the
          # caller a plausible index, which is what section 4 refuses. This line
          # predates the telemetry arrow and was undeclared; it is declared here
          # rather than left to be found again.
          # THREE MORE, ALL LANDED WHILE THIS GATE WAS UNREACHABLE behind gate
          # 1e, and each says which kind it is:
          #
          #   api/src/calendar_of.rs println! 2 -- inside `#[cfg(test)]`, and
          #     both print a MEASUREMENT the assertion beside them already
          #     enforces: the second is `minute bars owed: {owed}` on the line
          #     above `assert_eq!(owed, 623_546)`. The number is on the terminal
          #     for a human reading a failure and in the assertion for the
          #     build. Same case as `core/src/universe.rs` below. Neither ships.
          #   pull/src/pricing.rs println! 1 -- also `#[cfg(test)]`, printing the
          #     implied-volatility spread across the plausible rate band that the
          #     assertions beneath it bound. Not on any production path.
          #   cli/src/lib.rs eprintln! 1 -> 2 -- the new one is `[step/total]`
          #     PROGRESS on a descent, and it is the one entry here that is not a
          #     test. It cannot be an event instead, for the reason the two
          #     `cli` diagnostics below already carry: the report is being built
          #     into `out` and handed back as a String, and a run that is still
          #     walking has nowhere to have written a log yet. stderr is what a
          #     watching operator has; the report is what they get afterwards.
          # TWO MORE, and both are the same category as the last one above: a
          # print that CANNOT emit because there is no sink yet.
          #
          #   api/src/server.rs eprintln! 7 -> 8. Measured: eight sites, five of
          #     which call `telemetry::emit` at `Level::Error` immediately
          #     above. THREE DO NOT, and the reason is one line number:
          #     `telemetry::install` is at server.rs:14892, and all three --
          #     14443 (`run_from`, the store root would not resolve), 14842 (the
          #     bound listener's local address would not read) and 14855 (the
          #     store root again, inside the serve arm) -- run BEFORE it. An
          #     emit there writes to nothing. Requiring one would be requiring a
          #     record the process has no way to keep, which is a worse lie than
          #     the missing line: it would look declared and land nowhere.
          #     These three are the startup boundary this gate's own remedy
          #     names -- stderr is what a watching operator has, and there is no
          #     file yet to hand them afterwards.
          #
          #   cli/src/main.rs println! 1 -> 2 -> 0, print! 1 -> 0 (D-1484: now
          #     written through `cli::deliver`, declared in clause A2). Neither
          #     was a diagnostic. One is
          #     `refused: {why}` from `preflight_store_root`, which runs before
          #     any sink is installed for the same reason as above; the other
          #     names where the events went, and prints on SUCCESS too -- its
          #     own comment records why: "a run whose events landed somewhere
          #     `/logs` does not read looked exactly like a run that was fully
          #     observable". Both are CLI contract to the operator, the same
          #     category as `server.rs`'s usage text already declared here.
          #
          #   greeks/src/solver.rs println! 5 -> 7 (D-0921). Both new prints are
          #     inside `#[cfg(test)]` and report the measured bracket width and
          #     the bisected-solve census, the same kind as the five beside them.
          #
          #   api/src/server.rs println! 16, print! 1, eprintln! 9 -> 0 (D-1202,
          #     probeapi-7). Every one of those 26 sites now goes through
          #     `say!` (17: the 16 println! and the one print!) or `warn_line!`
          #     (9: the eprintln!), which write with `writeln!` and never panic
          #     on a closed stream. The sites did not go away, they changed
          #     spelling, so they are declared in clause A2 below as the three
          #     stream handles those two macros name (`stdout()` once,
          #     `stderr()` twice), and the event rule for each is unchanged.
          #     Folded with D-1450.
          declared='api/src/calendar_of.rs:println!:2
          api/src/constituents.rs:println!:2
          api/src/main.rs:eprintln!:2
          core/src/universe.rs:println!:2
          core/src/vendor.rs:println!:1
          pull/src/pricing.rs:println!:1
          cli/src/lib.rs:eprintln!:3
          greeks/src/bsm.rs:println!:4
          greeks/src/normal.rs:println!:3
          greeks/src/solver.rs:println!:7
          pull/src/http.rs:eprintln!:6
          telemetry/src/sink.rs:eprintln!:1'
          # Test-only measurements; production audit/recovery notices also emit.
          #
          # THREE MORE, one kind (D-0695): the STDOUT PROOF LINE of a test's
          # child process. `crate::isolated::rerun` re-runs one test of the api
          # test binary with a chosen environment, and each child prints one
          # line its parent asserts on -- `FRONTIER-ADMITTED`, `SERVER-BUDGET`
          # and `TRADES-ADMITTED` (plus `TRADES-REPAIRED`, D-0919's
          # repaired-by-rename child, fix/c4-cli-06) -- as proof the child took its own branch and
          # did not pass by testing nothing. Each sits inside
          # `#[cfg(test)] mod tests`, so no production path reaches it, and it
          # is not a diagnostic: nothing is wrong when it prints.
          declared="$declared api/src/booleanlaunch_tests.rs:println!:2
          api/src/frontierjson.rs:println!:1
          api/src/sweeprun.rs:println!:1
          api/src/trades.rs:println!:2
          api/src/recovery.rs:println!:1
          cli/src/boolean_candidate_tests.rs:eprintln!:2
          cli/src/index_stop_qualification_tests.rs:eprintln!:2
          cli/src/index_stop_tests.rs:println!:1
          cli/src/operation_audit.rs:eprintln!:2
          pull/src/cash_auction.rs:eprintln!:3
          pull/src/cash_session_cache.rs:eprintln!:2"
          # TWO MORE, one kind (D-1933): the stderr half of a degraded decode,
          # each written beside a `telemetry::emit` of the same counts.
          # `pull/src/csv.rs` names unreadable and negative volume and open
          # interest a CSV decode stored or skipped (CE-57, D-2681), and
          # `pull/src/masters.rs` names NSE index categories and elements the
          # conversion skipped (CE-58, D-2682). Both print only when something
          # was degraded, so a clean run prints nothing.
          declared="$declared pull/src/csv.rs:eprintln!:1
          pull/src/masters.rs:eprintln!:1"

          # CLAUSE A2 — the same question, asked of the handle spellings.
          #
          # Its declared list was EMPTY until D-1202: nothing in this workspace
          # named `stderr()` or `stdout()`. Now exactly one file does, three
          # times, and all three are inside the two server macros clause A's
          # note above describes: `say!` names `stdout()` and `stderr()` (the
          # banner line, and the stderr note when stdout is closed), and
          # `warn_line!` names `stderr()`. Every call of either macro is one of
          # the 26 server.rs prints clause A used to count, and the ones that
          # are diagnostics on a production path still emit the event beside
          # them. A new handle anywhere else is still refused. D-1450.
          # cli/src/main.rs names `stdout()` and `stderr()` once each (v53-2,
          # D-1484): its three prints became one `cli::deliver` write, which
          # says a failed stdout on stderr and emits `cli.output`.
          declared_handles='api/src/server.rs:handle:3
          cli/src/main.rs:handle:2'
          # Both sides are compared as sorted lists of non-empty words, so an
          # empty declaration and an empty measurement are equal on the healthy
          # case (the shell had to normalise a blank `printf` line by hand).

          # CLAUSE B — a crate that writes to stderr must be ABLE to log.
          #
          # Structural rather than a proximity heuristic. Proximity was tried and
          # gives false positives: the usage text sits a few lines from the bind
          # error's event and was scored as covered by it. This instead refuses
          # the state that makes a silent diagnostic INEVITABLE rather than
          # merely possible — a crate whose only channel is stderr.
          #
          # THE MANIFEST TEST WAS `grep -E '^telemetry' Cargo.toml`, AND THAT IS
          # A DIFFERENT QUESTION FROM THE ONE THIS CLAUSE ASKS. It matches at the
          # start of ANY line in the whole file, so a `telemetry = { … }` sitting
          # under `[dev-dependencies]` counted as proof that SHIPPING code can
          # emit. A dev-dependency links into tests, benches and examples and into
          # no release build at all, so a crate in that state has exactly the
          # property this clause exists to refuse — stderr is its only channel
          # where it matters — and the gate would have called it `ok`. It also
          # matched a `telemetry` line inside a comment, of which these manifests
          # have several, for the reason gate 22 clause A already records: text in
          # a comment is text.
          #
          # So the answer now comes from the `[dependencies]` table and nowhere
          # else. Comments are stripped first, and the `[dependencies.telemetry]`
          # table-header spelling is accepted too, because it is a real
          # dependency declaration and refusing to understand it would be a false
          # negative rather than a strict reading. A dotted `telemetry.path = …`
          # inside the flat table is matched by the `[=.]` alternation.
          #
          # WHAT IT STILL CANNOT SEE: `[target.'cfg(...)'.dependencies]`. Gate 22
          # refuses that spelling outright for the three crates it pins; here it
          # would read as "no telemetry dependency" and REFUSE, which is the safe
          # direction — a loud false positive that a human resolves, never a
          # silent pass.
          #
          # Verified against the tree: `api`, `pull`, `store` and `lake` all
          # declare telemetry in the flat table and still answer yes; `core` and
          # `costs` answer no, as they should.
          #
          # NOW READ AS TOML (D-1107). The two greps it replaced read one header
          # spelling and one key spelling, so `[ dependencies . telemetry ]`
          # and a root-level `dependencies.telemetry = ..` answered no (a loud
          # false refusal), and `telemetry = { package = "store", .. }` answered
          # YES while linking no logger at all (a silent false pass).
          # `source_scan deps` prints `kind:name:package`; the answer is yes
          # exactly when a plain `dependencies` declaration links the PACKAGE
          # `telemetry`. A target-only dependency still answers no, the safe
          # direction recorded above. An unreadable manifest answers no.
          # Both files, because clause A2's handles are the same hazard as an
          # `eprintln!` and were not reaching this loop at all.
          # Read line by line, so a path holding a space is one path (D-1109).

          # CLAUSE C — a temporary path names the process that made it.
          #
          # WHY THIS IS IN A LOGGING GATE. It is here because this is the step
          # that already walks every tracked `.rs` under crates/ INCLUDING test
          # code, and the failure is a test-code failure. Clause A's glob is the
          # only machinery in this file that looks at test sources at all.
          #
          # THE FAILURE, MEASURED AND REPRODUCED. D-0042:
          # `master::tests::a_master_larger_than_this_reader_holds_is_refused_before_it_is_read`
          # failed about one run in three with `cleanup: NotFound` on the line
          # deleting its own fixture. The fixture was
          # `temp_dir().join("brutex-master-toobig.csv")` -- ONE FIXED NAME in a
          # directory shared by every process on the machine. The test creates a
          # 256 MiB sparse file there, reads all of it, then deletes it; any
          # second process running the same binary deletes the file inside that
          # window. It was reproduced deliberately: two copies of the test binary
          # started together, one failed and one passed. Two concurrent
          # `cargo test` runs, a `cargo llvm-cov` beside a `cargo test`, or two
          # agents on one checkout are each enough, and all three happen here.
          #
          # The assertions were never wrong. The FIXTURE was. `api::scratch`
          # exists to be the answer -- it stamps `process::id()` into every
          # temporary path -- and nothing made the rest of the workspace use it.
          #
          # THE RULE. A line naming `env::temp_dir()` must have `process::id()`
          # within WINDOW lines at or below it. Below and not above, because the
          # two shapes in this workspace are
          #
          #   let dir = temp_dir().join(format!("x-{}", process::id()));   same line
          #   let mut root = temp_dir();                                   then
          #   root.push(format!("x-{}", process::id()));                   the next
          #
          # A WINDOW IS A HEURISTIC AND THIS ONE IS DELIBERATELY SMALL. Three
          # lines is what the second shape needs and no more. It can be satisfied
          # by an UNRELATED `process::id()` that happens to sit within three
          # lines -- gate 19 documents the same weakness about its own window and
          # solves it by claiming each event once; that machinery is not
          # justified here, where the two tokens are almost always on one line.
          # What the window CANNOT do is miss the collision this gate is named
          # for: a fixed name has no `process::id()` anywhere near it.
          #
          # WHAT IT CANNOT SEE, stated rather than discovered later:
          #   * `use std::env::temp_dir;` and then a bare `temp_dir()`. This
          #     matches the qualified spelling only, which is the one all 41
          #     current sites use.
          #   * A unique name built some other way -- a nonce, a counter, a
          #     `TempDir` crate. Each would read as a violation here and would
          #     need a line below, which is the reviewable part.
          #   * Whether the path is ever CREATED. A path asserted absent is
          #     harmless and several of the entries below are exactly that; the
          #     gate cannot tell, so a human wrote down which is which.
          #
          # THE CEILING IS A CEILING, NOT AN EXACT MATCH, and that is a departure
          # from clause A above. Clause A fails when a count DROPS, on the ground
          # that a stale declaration is a lie. Here a count drops precisely when
          # somebody FIXES a fixture, and turning that into a red build for a
          # second contributor -- on a tree two sessions share -- would teach
          # people to leave the fixtures alone. A drop is a warning; only a rise
          # is a refusal. Same mechanism as gate 11 and gate 13.
          #
          #   api/src/logs.rs      1  `sink_in` builds `brutex-logs-{name}` and
          #                           then `remove_dir_all` + `create_dir_all` on
          #                           it. THIS IS THE LIVE HAZARD, identical in
          #                           shape to D-0042's. It is declared rather
          #                           than fixed because the file belongs to
          #                           another line of work; the entry is the
          #                           report, and it is meant to be removed.
          #   pull/tests/unit.rs   3  One is `brutex-pull`, a fixed directory,
          #                           and the same hazard. (The ceiling read 4
          #                           while the clause measured 3 before
          #                           D-1110 too: the other `brutex-pull` site
          #                           names the pid in the file it writes.)
          #                           The other two --
          #                           `brutex-pull-there-is-no-such-file.toml`
          #                           and `brutex-no-such-dir-ever` -- are paths
          #                           asserted ABSENT, which cannot collide
          #                           because nothing creates them.
          #   pull/src/ssm.rs      1  `brutex-ssm-no-such-file-ever/credentials`,
          #                           the same absent-path probe.
          #   api/src/scratch.rs   1  The assertion `a.parent() ==
          #                           Some(temp_dir().as_path())` inside the test
          #                           that proves `path()` stamps the pid. It
          #                           names the directory, never a file in it.
          #   api/tests/binary.rs  1  Passes the bare temp dir to a binary that
          #                           refuses its argument and exits 2 before
          #                           opening anything.
          #   telemetry/src/lib.rs 1  `read_dir(temp_dir())` enumerates the
          #                           directory to find this crate's own sink
          #                           dirs. It creates no path.
          # `api/src/logs.rs` IS GONE FROM THIS LIST, on this clause's own
          # loose-entry warning: it no longer names a fixed temporary path, and
          # an entry nobody can trace to a line makes the clause read stronger
          # than it is.
          #
          # `cli` JOINS IT, AND ONE PRODUCTION SITE WAS FIXED RATHER THAN
          # LISTED. `cli::verify::ledger_round_trip` used
          # `temp_dir().join("brutex-verify-ledger")` — one path shared by every
          # `cli verify` on the machine, with `remove_dir_all` on the very next
          # line. Two verifications at once is one operator in two terminals:
          # the second would delete the first's scratch mid-write and the first
          # would report a round-trip failure against a ledger it never lost.
          # It names `process::id()` now, which is the discriminator rather than
          # a clock because two processes can start in the same microsecond and
          # cannot share a pid.
          #
          # AND THE `cli` TEST FIXTURES THAT USED TO REMAIN ARE FIXED TOO
          # (D-1110). They were `brutex-v2-read-test`, `brutex-v2-append-test`
          # and `brutex-v9-test` in `results.rs` and `brutex-wire-test` in
          # `lib.rs`, allowed here on the claim that "under `cargo test` they
          # run in one process on separate names, so nothing collides". That
          # was false twice over: `cargo nextest` -- which `.config/nextest.toml`
          # configures -- runs each test in its OWN process, and two checkouts
          # running the suite at once (two worktrees on one machine) share one
          # temp directory and run the same case. Each fixture now names
          # `process::id()`, as `results.rs`'s own `brutex-results-*` fixtures
          # already did, and the `cli` entries are gone.
          allow_fixed='
          api/src/scratch.rs 1
          api/tests/binary.rs 1
          pull/src/ssm.rs 1
          pull/tests/unit.rs 3
          telemetry/src/lib.rs 1
          '
          #
          # THE SCRATCH FILES ARE GONE. This step used to keep its working
          # lists in fixed /tmp names -- `/tmp/prints.txt`,
          # `/tmp/fixed-temp.txt` -- and said so here: on a runner this step is
          # the only process, but two copies on one machine WILL fight over
          # them. They did, while D-2312 was being measured: one copy's clause C
          # read another's file and counted paths in files it never opened.
          # `gates_runtime gate23` keeps every list in memory, so the gate no
          # longer exempts itself from its own rule.
          tmp_window=3
          # READ THROUGH THE LEXER, FROM A NUL-SEPARATED LISTING (D-1110). The
          # awk it replaced skipped a line whose first non-blank character was `//`
          # or `*`, which also skipped a `*`-led statement; it now reads
          # `source_scan code`, in which comments are already blank and every
          # other line is itself, so no line is skipped. The listing was read
          # through process substitution, so a failing git meant a pass.

          # An entry naming a file that is gone makes this clause read stronger
          # than it is, so it is a failure. An entry whose file no longer matches
          # is only loose, and says so — somebody fixed a fixture.

          # WHAT THIS DOES NOT PROVE, said plainly so nobody reads more into a
          # green gate than it earned: it fixes the SET of prints and forces a
          # human to write down what each one is. It does not itself decide
          # whether a given print sits on a production path or in a test, and it
          # does not verify that a particular diagnostic has a matching event.
          # The declaration above carries that, and a reviewer keeps it honest —
          # the same division of labour gate 1d uses for path-shaped literals.

          # D-2312: clauses A to C are `gates_runtime gate23`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate23 --declared "$declared" \
            --declared-handles "$declared_handles" --allow-fixed "$allow_fixed" \
            --window "$tmp_window"

      - name: Gate 21 — the logger opens nothing but its own files
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: no real bars, no pull,
          # and "even suppose if the data or bars pulled by mistake also, then
          # nowhere the issue of this should happen". That is a requirement
          # about STRUCTURE, not about discipline: whether or not real data is
          # sitting on the disk, the logger must be INCAPABLE of reading it.
          #
          # Two clauses, because either alone is weak.

          # CLAUSE A — crates/telemetry declares NO dependencies.
          #
          # The load-bearing one. A crate that does not depend on `store`,
          # `core`, `pull` or any vendor client cannot call them, so it cannot
          # read a bar, a manifest or a census however it is later edited. It is
          # std-only by construction, and the manifest is where that is
          # enforced rather than a comment nobody re-reads.
          #
          # READ AS TOML, EVERY LINKING TABLE (D-1107). This was an awk range
          # over the flat `[dependencies]` table, so `[dependencies.store]`,
          # `[ dependencies . store ]`, a root-level `dependencies.store = ..`,
          # a `[dev-dependencies]` and a `[target.*.dependencies]` table each
          # declared a dependency it printed nothing for -- and a missing
          # manifest printed nothing too, which read as "std only".
          # `source_scan deps` parses the manifest and prints one line per
          # declaration of any kind; an absent or unreadable manifest refuses.

          # CLAUSE B — the production file-opening sites are exactly these.
          #
          # Declared by CONSTRUCT and COUNT, never by line number: a line number
          # is invalidated by editing a comment above it, and a declaration that
          # rots on reformatting is one nobody keeps honest. Same rule as gates
          # 1d and 20.
          #
          #   sink.rs  OpenOptions::new  x2  the sink's own append target
          #   sink.rs  create_dir_all    x1  making its own directory, at open
          #   sink.rs  fs::metadata      x1  stat by PATH, for the roll decision
          #   sink.rs  fs::remove_file   x1  dropping the oldest rolled file
          #   sink.rs  fs::rename        x1  rolling within its own directory
          #   tail.rs  File::open        x2  reading back its own file set
          #
          # Every one takes a path built from the sink's own dir plus BASENAME
          # and EXTENSION. A NEW site is not necessarily wrong, but it is never
          # invisible: declare it here with the path it opens and why.
          #
          # THE PROBE LIST HAD SIX ENTRIES AND TWO OF THE SITES ABOVE WERE NOT
          # AMONG THEM. `create_dir_all` and `fs::metadata` are production code
          # in `sink.rs` today -- `sink.rs:697` creates the sink's directory and
          # `sink.rs:1198` stats a path to decide a roll -- and this clause
          # walked straight past both while printing "the logger's file-opening
          # surface is the declared one". A declared surface that omits two of
          # its own members reads as a stronger statement than it is, which is
          # the exact failure gate 1d exists to refuse. `fs::read` is added with
          # them and finds NOTHING today; it is here because it is the plainest
          # way to read a bar file and its absence from the list was the reason
          # it would not have been seen.
          #
          # `fs::read(` CARRIES ITS OPENING PAREN and that is load-bearing. The
          # probes are matched with `grep -cF`, a SUBSTRING test, so a bare
          # `fs::read` would also count every `fs::read_dir` and every
          # `fs::read_to_string` -- inflating two declared counts and refusing
          # the crate over an arithmetic artefact of its own probe list. The
          # paren cannot appear in either longer name.
          #
          # `.metadata()` ON AN OPEN HANDLE IS DELIBERATELY NOT PROBED. There are
          # two of them -- `sink.rs:245` and `tail.rs:399` -- and neither names a
          # path: they stat a `File` this crate has already opened through one of
          # the declared sites, so they cannot reach anything the sites above did
          # not already reach. `fs::metadata` takes a PATH and is the one that
          # can, which is why the list separates them.
          #
          # THE SURFACE IS NOW READ AS CANONICAL PATHS (D-1112). The probe list
          # above was nine substrings, and an audit wrote to an arbitrary path
          # past it three ways: `File::create`, `fs::write` and `File::options`
          # were not among them (LATE tests-bite #4), so the logger could write
          # anywhere while this clause printed "the declared one". The same
          # substrings missed `use std::fs::{write as w}` and `std::fs::r#write`.
          # The production window was cut by an awk walk that closed a test item
          # at a `}` in column zero, and comment lines were dropped by a filter
          # that also dropped a `*`-led statement.
          #
          # `source_scan paths-prod` removes exactly the `#[cfg(test)]` items,
          # measured by token extent, and prints every path the remaining code
          # uses in canonical form -- `use` aliases expanded, `r#` dropped. The
          # surface is EVERY path into `std::fs`, `std::process`, `std::net` or
          # `std::os` whose last segment is a function (lower-case), counted per
          # file and compared exactly: a new capability of any name is a
          # refusal until it is declared, with no probe list to fall behind. A
          # glob import of one of those modules is refused outright, because
          # the names it brings in cannot be read back.
          #
          # WHAT IT STILL CANNOT SEE: a METHOD that touches the filesystem on a
          # value -- `path.exists()`, `path.metadata()` -- because a method is
          # not a path. `.metadata()` on an open handle was already excluded on
          # purpose (above); `Path::exists` is not used in this crate's
          # production code today.
          #
          # `OpenOptions::new` went from two to three (D-1537, hunt-costs-3).
          # The two old sites open the event file to append (`FileTarget::open`
          # and `reopen` after a roll). The third, `hold_directory`, opens
          # `<dir>/events.lock` -- create, no truncate, write -- only to take a
          # non-blocking `flock` on it, so two sinks cannot write one event
          # stream. It writes no byte, reads none, and names no path outside
          # the sink's own directory. D-1458.
          #
          # D-2509 (CE-41) adds four, all inside the sink's own directory. A
          # failed roll is retried only when `directory_accepts_a_roll` can
          # create, rename and unlink a probe file of its own
          # (`<dir>/.roll-probe`, then `.roll-probe.moved`): one more
          # `OpenOptions::new`, `rename` and `remove_file`. The roll itself
          # asks `symlink_metadata` whether a rotated file is present, so a
          # failure after a file was moved ends retries for good. None reads
          # or writes an event byte.
          declared='sink.rs:std::fs::OpenOptions::new:4
          sink.rs:std::fs::create_dir_all:1
          sink.rs:std::fs::metadata:1
          sink.rs:std::fs::remove_file:2
          sink.rs:std::fs::rename:2
          sink.rs:std::fs::symlink_metadata:1
          tail.rs:std::fs::File::open:2'

          # D-2312: clauses A and B are `gates_runtime gate21`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate21 --declared "$declared"

      - name: Gate 22 — the sweep crates cannot read a bar
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: "at any point we should
          # never ever pull any real data or even by mistake pulled bars or data
          # should never ever be used." The second half is the hard part. The
          # first is discipline and can be kept; the second is a claim about what
          # the code is CAPABLE of, and only a structural check can make it.
          #
          # It is not hypothetical. Two real bar files appeared under
          # ~/.brutex/store/bars/groww/NSE/INDEX/{NIFTY,BANKNIFTY}/1min/2020-01.bin
          # during a session whose whole premise was that none existed. Nobody in
          # that session pulled them. So "could the sweep have read them" must be
          # answerable without trusting anyone's account of what they ran.
          #
          # THIS GATE'S FIRST VERSION WAS DEFEATED IN ALL FOUR CLAUSES by an
          # adversarial audit, which composed a working bypass:
          #
          #   [dependencies.store]                       clause A blind
          #   path = "../store"
          #   pub use store::file::BarFile as Bf;        clause C blind
          #   Bf::open_existing(p, ..)?.read_record(n)   clause B blind
          #
          # and gate 22 printed OK. Everything below is the repair, and each
          # clause names the bypass it now refuses.
          # TWO LISTS, BECAUSE THIS GATE ASKS TWO DIFFERENT QUESTIONS.
          #
          # It shipped with ONE list doing both jobs, and that is why
          # `crates/runner` -- the crate that actually drives a sweep -- was in
          # neither. Widening the single list to include it would have failed
          # clause A instantly and correctly, so the crate stayed out of the
          # filesystem clauses too, and the gate's promise ("the sweep cannot go
          # and find data on its own") did not cover the sweep's driver.
          #
          #   PINNED  the crates whose DEPENDENCY SET is fixed. Clause A pins each
          #           of these to an exact `want`, ships no allowlist, and that is
          #           what makes `indicators` and `engine` unable to name each
          #           other. CLAUDE.md section 5 states this rule and states its
          #           consequence: "The only crate where the two halves may
          #           legally meet is one that is not on gate 22's list, and that
          #           is `runner`." `runner` therefore MUST NOT be added here --
          #           it depends on `brutex_core`, `vocab`, `indicators`, `engine`
          #           and `costs` by design, and pinning it would contradict the
          #           law this gate exists to enforce rather than extend it.
          #   SWEEP   the crates that MAY NOT REACH A FILESYSTEM. That is a
          #           capability question, not a graph question, and it is true of
          #           `runner` for exactly the reason it is true of the other
          #           three: it takes a slice of candles the caller already holds
          #           and its own manifest says so -- "NO ARROW TO `store`,
          #           DELIBERATELY". Clauses B through E now hold it to that.
          #
          # MEASURED BEFORE THE WIDENING, against `crates/runner`: clause B zero
          # hits over `src/` and `benches/`; clause C zero imports; clause D three
          # `include_str!` calls, all plain literals, all `.rs` or `.toml`
          # (`lib.rs`, `synthetic.rs`, `../Cargo.toml`); clause E zero. So this is
          # a hole closed, not a red build handed to somebody else.
          #
          # `runner`'s DEPENDENCY SET IS STILL NOT PINNED, but what it may LINK
          # now is. This comment used to say a `store` declaration in runner was
          # harmless because clauses B and C refused its use. That was false
          # (P1-08-03, D-2660): `bars = { package = "store", .. }` is used as
          # `bars::file::BarFile::open_existing(..)`, which clause C's key
          # spellings never match, and the file I/O happens inside `store`, where
          # clause B never looks. Clause A2 below reads the LOCK, by package,
          # through every edge, so a rename or an intermediary crate is seen.
          PINNED='vocab indicators engine'
          SWEEP='vocab indicators engine runner'

          # ── CLAUSE A — the dependency closure cannot reach a filesystem ────────
          #
          # The load-bearing clause, because it is transitive: a crate that cannot
          # NAME `store` cannot call into one whatever its source says.
          #
          # THE MANIFEST IS NOW PARSED (D-1107). This clause used to refuse
          # the spellings a shell could not read and extract `name =` from the
          # flat table, on the claim that with the refusal held the extraction
          # was complete. It was not: the refusal read headers with
          # `^\[dependencies\.`, so `[ dependencies . store ]`,
          # `["dependencies"]` and a root-level
          # `dependencies.store = { path = "../store" }` matched no refusal and
          # no extraction, and `vocab = { package = "store", path = ".." }`
          # was read as `vocab` -- the one name clause A allows -- while
          # linking the store. `source_scan deps` reads the manifest as TOML
          # (quoted and spaced keys, dotted keys at any level, inline tables,
          # every linking table, `target.*`, `[patch]`, `[replace]`) and
          # prints `kind:name:package` per declaration. The comparison is on
          # KIND AND PACKAGE, so a rename is seen for what it links, and a
          # dev-, build- or target-dependency is a different kind and is
          # therefore refused. A manifest that is absent or unreadable is a
          # refusal, never a pass.

          # ── CLAUSE A2 — nothing the sweep LINKS can read a bar or log ─────────
          #
          # P1-08-03, D-2660. Clauses C and gate 17 recognise `store`, `pull`,
          # `lake`, `api`, `telemetry`, `log` and `tracing` by the dependency
          # KEY a source file spells, and a Cargo `package =` rename changes the
          # key and nothing else. So the question is asked of the PACKAGE, in
          # Cargo.lock, through the whole transitive closure of the four SWEEP
          # crates: a renamed `store` in runner, and a `store` reached through
          # an unpinned intermediary such as `costs`, are both refused here.
          # The lock does not separate dev-dependencies from the rest, so this
          # is stricter than the build graph: a dev-dependency on one of these
          # anywhere in the closure is refused too, and that is deliberate.
          # D-1937: clause A2 is `clause_a2` in `gates_runtime gate22`, the
          # walk of the lock it was here as two inline programs, which gate 0's
          # ratchet refuses.

          # ── CLAUSE B — no filesystem call site in src/ or benches/ ─────────────
          #
          # Clause A forbids reaching a filesystem through a dependency; this
          # forbids reaching one through `std`. The first version's probe list held
          # nine patterns and the audit walked past it with `include_bytes!`,
          # `fs::read`, `File::create` and `std::process::Command` -- and it scanned
          # only `src/`, so `benches/ratio.rs` could have read a bar file outright.
          #
          # `process::Command` and not `std::process`. The broader pattern was
          # written first and this gate refused its own repository over it: a
          # `harness = false` bench signals failure with `std::process::exit(1)`, and
          # all three do. `exit` cannot read anything. Spawning a process can, which
          # is what `Command` names.
          BANNED='File::open|File::create|OpenOptions|fs::read|fs::write|fs::copy|fs::rename|fs::remove|fs::File|fs::metadata|fs::canonicalize|read_dir|std::fs|MmapOptions|Mmap::|memmap|include_bytes!|process::Command|Command::new|std::os::|libc::'

          # ── CLAUSE C — no import of a crate that reads the store, any spelling ─
          #
          # Comments may cite `store::format::Bar` and several do, because that
          # record is what `indicators::Candle` replaced and the history is worth
          # keeping. So the pattern is anchored to an import -- but the first
          # version anchored it to a BARE `use`, and the audit walked past with
          # `pub use store::…` and with `use store as st;`.

          # ── CLAUSES B2 AND C2 — the same two questions, asked of PATHS ─────────
          #
          # D-1112. Clauses B and C grep text, and text names a capability only
          # the way it was spelt: `use std::{fs as f}; f::read(p)` holds none of
          # B's patterns (LATE tests-bite #3), and `use std::fs::{self as
          # disk};` or `std::fs::r#write` are the same hole. `source_scan paths`
          # prints every path a file uses with `use` aliases expanded and `r#`
          # dropped, so `f::read` IS `std::fs::read` here. B2 refuses any path
          # into `std::fs`, `std::os`, `std::net` or `std::process` (bar the
          # functions that start nothing: `exit`, `abort`, `id`, and the
          # `ExitCode`/`ExitStatus`/`Termination` types the benches return),
          # into `libc` or a `memmap` crate, and `include_bytes!`. C2 refuses a
          # path into `store`, `pull`, `lake`, `api` or `telemetry`, under any
          # alias. The files are each crate's tracked `src/` and `benches/` PLUS
          # the module closure of `src/lib.rs`, so a module mounted with
          # `#[path]` from elsewhere is read too.
          #
          # AN ABSENT CRATE IS A REFUSAL (LATE #13). `[ -d .. ] || continue`
          # let clauses B to E pass over a swept crate that was not there.
          #
          # WHAT B2 AND C2 CANNOT SEE: a method call on a value -- a
          # `Path::exists`-style method is not a path -- and `extern crate store
          # as s;`, whose alias the scanner does not record. Clause A pins the
          # dependency sets of three of the four crates, which is what makes the
          # second unreachable there.

          # ── CLAUSE D — every compile-time include is a document, by a literal ──
          #
          # Clause B exempts `include_str!` and must: it is compile-time, it reads
          # only paths written as literals in tracked source, and the document
          # guards depend on it. This bounds the exemption so it cannot become the
          # hole -- and the first version's regex only matched a PLAIN literal, so
          # the audit walked past it with
          # `include_str!(concat!(env!("HOME"), "/.brutex/store/bars/…/2020-01.bin"))`,
          # which is not a literal at all and matched nothing.
          # A computed include path is refused outright. There is no legitimate
          # one here, and a gate that cannot evaluate the expression must not
          # guess at what it evaluates to.

          # ── CLAUSE E — tests/ may read the disk, bounded ───────────────────────
          #
          # Clause B deliberately does not cover `tests/`, because one test there
          # legitimately reads the filesystem: `vocab/tests/workspace_is_rust.rs`
          # walks tracked files to enforce §2. The audit pointed out the obvious
          # consequence -- repointing that literal at a bar file keeps every other
          # clause green. So the exemption is bounded the same way clause D bounds
          # its own: a path may be built from `CARGO_MANIFEST_DIR`, and may never
          # be bar-shaped or reach into a home directory.

          # WHAT THIS GATE CANNOT SEE, said rather than implied. A caller can still
          # read bars itself and hand them to `Evaluator::step` -- that is the API
          # and cannot be forbidden. What is guaranteed is the half that was in
          # question: these three crates cannot go and find data on their own.
          # `crates/api` and `crates/pull` may touch the store, deliberately, and
          # gates 9 and 13 govern them.

          # D-2312: clauses A to E are `gates_runtime gate22`, and A2 with them.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate22 --pinned "$PINNED" --sweep "$SWEEP" \
            --banned "$BANNED"

      - name: Gate 24 — no writable memory mapping
        run: |
          set -euo pipefail
          # WHY. CLAUDE.md section 4's table bans one outright, and gives the
          # reason in one line: "A writable memory mapping — It raises a signal
          # on a full disk, and a signal cannot be caught."
          #
          # That is not a stylistic preference. A store on a full disk is the
          # normal end state of a backtesting archive, and the failure mode of a
          # writable map there is `SIGBUS` at the instant of the store, delivered
          # to a thread that is executing a plain assignment. There is no `Result`
          # at that point and no unwinding to catch -- and `[profile.release]`
          # sets `panic = "abort"` (gate 25 below), so even a handler would not
          # give the process anywhere to go. `write(2)` returns `ENOSPC` and the
          # code can refuse and say so. That is the whole argument.
          #
          # NOTHING ENFORCED IT. `memmap2 = "0.9"` sits in the root manifest's
          # `[workspace.dependencies]`, so any member may take it with one line,
          # and gate 22 refuses the whole `memmap` family only inside the four
          # SWEPT crates -- which are exactly the crates that never touch the
          # store. `crates/store`, the one place a map would actually be reached
          # for, was covered by no gate at all.
          #
          # A READ-ONLY MAP IS NOT BANNED and this gate does not refuse one.
          # Section 4 names the WRITABLE mapping. Reading a mapped region cannot
          # raise the signal this rule is about at all -- a truncated file can,
          # which is a different hazard with a different answer -- so
          # `Mmap::map` and `MmapOptions` are deliberately absent from the
          # pattern (`maps_writably` in .github/gates_runtime.rs, D-2312).
          #
          # THE SPELLINGS, and why each one:
          #   MmapMut          the type. Naming it is enough; you cannot use one
          #                    without it appearing.
          #   MmapRaw          the same capability with the borrow checker taken
          #                    off, which is strictly worse.
          #   map_mut(         `MmapOptions::map_mut`, the constructor.
          #   map_anon(        an anonymous map is always writable. It has no
          #                    file behind it and so cannot hit ENOSPC on a
          #                    store -- but it CAN on a full tmpfs or with
          #                    overcommit off, the delivery is still SIGBUS, and
          #                    an allocation this workspace can make with `Vec`
          #                    is not worth an uncatchable one.
          #   map_copy(        copy-on-write: writable, and each dirtied page is
          #                    a fresh commit that can fail the same way. The
          #                    trailing `(` is what separates it from
          #                    `map_copy_read_only`, which is fine and is not
          #                    matched.
          #
          # WHAT IT CANNOT SEE, said rather than implied: a name assembled at
          # compile time. `crates/runner/src/lib.rs:744` already writes
          # `concat!("Mmap", "Options")` deliberately -- it is a TEST asserting
          # gate 22's banned list, split so that the assertion does not trip the
          # gate it asserts about -- which is proof that the evasion is known and
          # cheap. A text scan cannot follow it. What this gate buys is that the
          # ORDINARY way of writing it is a red build, which is what stops it
          # arriving by habit rather than by intent.
          #
          # MEASURED BEFORE IT WAS WRITTEN: zero occurrences of any of the five
          # over every tracked `.rs` under `crates/`, and no member declares
          # `memmap2` at all. So this gate starts green and there is no
          # allowlist -- section 4 says "without exception", and a gate for an
          # unconditional rule must not ship the mechanism for excusing it.
          #
          # NO UNTRUSTED INPUT: `git ls-files` and that pattern.
          # COMMENTS ARE BLANKED BY THE LEXER, NOT BY A LINE FILTER (D-1109).
          # This used to drop every line whose first non-blank character was
          # `//` or `*`, and `*slot = Some(MmapOptions::new().len(4096)
          # .map_anon()?);` is an ordinary statement that began with `*` and was
          # never read -- and `map_anon` is a SAFE function in memmap2, so
          # `forbid(unsafe_code)` does not stop it. `source_scan code` prints
          # each file with only its comments blanked and `r#` removed, line for
          # line, so a `*`-led statement is read like any other and the line
          # number shown is the line in the file. The listing is a NUL-separated
          # file, so a git that fails fails the step and no path is split.

          # D-2312: the walk and the spellings are `gates_runtime gate24`.
          "${RUNNER_TEMP:-/tmp}/gates-runtime" gate24

      - name: Gate 25 — the release profile still refuses silent wrapping
        run: |
          set -euo pipefail
          # WHY. Two keys in the root manifest are load-bearing for correctness
          # rather than for speed, and NO GATE READ EITHER OF THEM. Deleting one
          # line from `[profile.release]` changes what a shipped binary DOES,
          # with `cargo build`, `cargo test`, `cargo clippy`, `cargo deny` and
          # every other gate in this file still green.
          #
          # `overflow-checks = true`. Rust checks overflow in `dev` by default
          # and WRAPS in `release`. Without this key the two profiles disagree
          # about what a bug is: a price that overflows panics in a test run and
          # silently becomes a plausible wrong number in the shipped one. The
          # manifest's own comment says it -- "a wrapped price is a plausible
          # number that is wrong" -- and CLAUDE.md section 4 bans exactly that
          # shape, a fallback that hides a failure.
          #
          # This is also the key the arithmetic discipline is written against.
          # The lint floor denies `clippy::cast_possible_truncation`,
          # `cast_sign_loss` and `cast_possible_wrap`, and the workspace answers
          # with `checked_`/`saturating_` at every site that can exceed a bound
          # -- the census counts them live. Every one of those was chosen
          # by an author who believed the unchecked spelling would PANIC. Turn
          # this key off and that belief is false everywhere at once.
          #
          # `panic = "abort"`. Its absence is not silent in the same way, but it
          # is the premise gate 24 argues from one step above -- there is no
          # unwinding to catch anything with -- and it is what makes a panic a
          # crash with a core rather than a half-unwound store write. A change to
          # it is a decision, so it belongs in `docs/05-decisions.md` and not in
          # a quiet diff.
          #
          # WHAT THIS GATE DOES NOT DO: it does not measure anything, and it
          # cannot tell whether a `saturating_` at a given site was the right
          # choice. It reads two keys and refuses their absence. That is a small
          # claim, and it is the one that was missing.
          #
          # NO UNTRUSTED INPUT: the tracked manifests and workflows, and the
          # patterns in .github/gates_ledger.rs.
          #
          # THE MANIFESTS ARE PARSED, NOT GREPPED (D-1113). The "other
          # direction" check matched the key set false only at column zero
          # of the root manifest, so an indented key, a quoted key
          # (`"overflow-checks"` set false), a dotted key
          # (`profile.release.overflow-checks` set false before any header) and a
          # per-package override (`[profile.release.package.engine]`) each made
          # a release build wrap while this step printed that no profile turned
          # the check off (AC-gates-law-6). The presence checks had
          # the same blindness in the other direction.
          #
          # `source_scan toml` reads every tracked Cargo.toml as TOML and prints
          # each leaf as `FILE:LINE:dotted.path = value`, quotes and spacing
          # normalised. Presence is the leaf `profile.release.overflow-checks =
          # true` and `profile.release.panic = "abort"` in the root manifest;
          # refusal is ANY leaf, in any tracked manifest, whose path is under
          # `profile` and ends in `overflow-checks` with a value other than
          # `true`. A tracked `.cargo/config.toml`, the other place cargo reads
          # a profile from, is refused outright by gate 1g (D-1105), and so is
          # `cargo --config`. What remains is the environment: a
          # `CARGO_PROFILE_<NAME>_OVERFLOW_CHECKS` variable or an
          # `overflow-checks` codegen flag in RUSTFLAGS, refused in every
          # tracked workflow.
          #
          # And the other direction: a profile, or a package override inside
          # one, that turns the check back OFF. `[profile.bench]` inherits
          # release, so gate 8 measures the shipped arithmetic -- unless
          # something re-enables wrapping under it.
          #
          # D-2313: the reading is `.github/gates_ledger.rs release-profile`.
          # This step builds that tool and runs its tests once for the job;
          # gates 27, 27b, 26, 19, 10 and 11 below reuse the same binary from
          # RUNNER_TEMP. The step, not the tool, runs the scanner: a `.github`
          # tool starts no program but git (gate 0, D-2344). A manifest the
          # scanner cannot read fails the step here, with the scanner's own
          # message naming the file.
          ledger="${RUNNER_TEMP:-/tmp}/gates-ledger"
          rustc --edition=2024 --test -D warnings .github/gates_ledger.rs -o "${ledger}-tests"
          "${ledger}-tests"
          rustc --edition=2024 -D warnings .github/gates_ledger.rs -o "$ledger"
          leaves="$(mktemp -d)/leaves"
          git ls-files -z -- '*Cargo.toml' | xargs -0 -r "${SOURCE_SCAN:?gate 0 builds the source scanner first}" toml > "$leaves"
          "$ledger" release-profile "$leaves"

      - name: Gate 27 — every invariant row id names exactly one invariant
        run: |
          set -eu
          # D-0045 found `C-14`..`C-17` naming two invariants each and fixed
          # them. It also wrote down the reason the collision had been invisible:
          # "Nothing in CI checks row-id uniqueness -- gate 10 checks only that a
          # named test exists." D-0209 hit the SAME collision again in the SAME
          # ids, because two later entries assigned C-16 and C-17 to another
          # crate and one of them recorded that it had "verified against gate
          # 10's own resolver" -- the check D-0045 had already named as blind to
          # this. D-0215 then found 44 MORE, across 88 rows: three overloaded
          # letters, `I`, `P` and `G`, each naming two unrelated subjects.
          #
          # Three entries said this should be a gate. This is the gate. It is
          # cheap now only because the tree is clean for the first time.
          #
          # WHAT IT CANNOT SEE: whether two ids that are DIFFERENT describe the
          # same invariant. That is a judgement, not a string comparison.
          #
          # NO UNTRUSTED INPUT: one tracked document and the pattern in
          # .github/gates_ledger.rs. D-1608: a digit may follow the first letter
          # (`FV4-01`); 179 rows were invisible to uniqueness until it could.
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with -- it reported success while measuring nothing -- so zero rows
          # is a refusal. D-2313: the tool gate 25 built.
          "${RUNNER_TEMP:-/tmp}/gates-ledger" invariant-ids
      - name: Gate 27b — every decision number heads exactly one entry
        run: |
          set -euo pipefail
          # Gate 27's rule, applied to docs/05-decisions.md. Five numbers were
          # issued twice and a merge moved main's D-0035..D-0037 to
          # D-0329..D-0331, because nothing read the ledger back (D-0104,
          # D-0684). Entries are never edited, so the five stay, pinned at
          # their EXACT counts: a third copy fails, and so does a removed one.
          # Every other number must head exactly one entry. The pins are
          # `DECISION_PINS` in .github/gates_ledger.rs (D-2313).
          # WHAT IT CANNOT SEE: a heading outside the pattern, which
          # entry a citation means, or two unmerged branches that pick one
          # number -- that fails only in a tree holding both. docs/06-limits.md.
          # NO UNTRUSTED INPUT: one tracked document and the pinned list.
          "${RUNNER_TEMP:-/tmp}/gates-ledger" decision-numbers
      - name: Gate 26 — every HTTPS client installs the TLS provider
        run: |
          set -eu
          # `rustls` 0.23 ships NO cryptography of its own: a provider must be
          # installed into the process before the first client is built. A
          # `Client::builder()` reached without `pull::ensure_tls_provider()`
          # COMPILES CLEANLY and panics at run time with "No provider set" --
          # a failure the compiler cannot see and a test finds only if it
          # happens to drive that exact path.
          #
          # This gate exists because D-0211 removed `ring`. Under the old
          # `rustls-tls` feature a provider was compiled in and installed by
          # default, so forgetting was impossible; now it is possible, and the
          # cost of forgetting is a panic in front of an operator rather than a
          # red build. The rule is mechanical, so a gate can hold it.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * A client built through a helper in another file. The check is
          #     per-file, so a wrapper that hides `Client::builder()` behind its
          #     own name defeats it exactly as a rename defeats gate 13.
          #   * Whether the call happens BEFORE the builder on the executed
          #     path. It counts occurrences in a file, not order.
          # Both are the conservative direction: it can miss, it cannot
          # falsely accuse.
          #
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: it reported success while measuring nothing. Zero client
          # sites is a refusal.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: the tracked list and the
          # patterns in .github/gates_ledger.rs. Gate 1c's discipline. D-2313.
          "${RUNNER_TEMP:-/tmp}/gates-ledger" tls-provider

      - name: Gate 19 — a failure an operator can see is a failure the log records
        run: |
          set -euo pipefail
          # THE ONE THING THE EMIT-SITE COUNT CANNOT ANSWER.
          #
          # `api::emitted` counts every `telemetry::emit` under crates/api/src
          # and proves each reaches a file. That is a strong guarantee about the
          # sites that EXIST, and it says nothing whatever about a failure path
          # that has none — which is the gap an operator actually falls into.
          #
          # Measured: four arms of `pull::ingest` pushed a `Failure` onto the
          # receipt and emitted NOTHING, so a backfill that landed zero bars
          # left a quiet log. They were found by reading every `Result`-
          # returning function by hand, which is not a thing anyone will do
          # again. This gate is that reading, mechanised.
          #
          # THE RULE. Every `failures.push(` and `failures: vec![` in production
          # code under crates/{pull,api}/src must have a `telemetry::emit(` or a
          # `note_*(` helper call within the WINDOW (12) lines above it. Both
          # forms count because this workspace extracts emits into `note_*`
          # helpers as soon as a function reaches clippy's line limit — refusing
          # the helper form would push authors to inline the emit and fail the
          # OTHER gate.
          #
          # WHAT IT DELIBERATELY DOES NOT DO. It does not check that the event
          # is at a useful level, or carries the right fields, or is reachable
          # from a test — `api::emitted` and gate 12 cover those. It answers one
          # question: did anybody write an event here at all.
          #
          # IT USED TO SKIP FROM THE FIRST `#[cfg(test)]` ONWARD, AND THAT LINE
          # SAID "Every file in this workspace puts its test module last". That
          # was not true and the cost was measurable: `crates/api/src/server.rs`
          # is 15,654 lines and its first `#[cfg(test)]` is at 7,717, so 7,937
          # lines of PRODUCTION code sat past the cut and this gate reported
          # success over every one of them. `crates/api/src/audit.rs` hid 797
          # more the same way.
          #
          # THIS IS THE EXACT BUG CLASS GATE 11 ALREADY FIXED, and the reasoning
          # there applies here unchanged: truncating at an attribute hides every
          # line after it, and a `#[cfg(test)]` is not only ever a test module --
          # it sits on const fns and on statements inside shipping bodies. One
          # attribute shrinks the scan exactly as silently as two.
          #
          # So the boundary is a SUBTRACTION now, not a cut, and the stripper is
          # gate 11's. It was once duplicated into this step character for
          # character, because one `run:` step cannot import from another; since
          # D-2313 it is one Rust function, `strip` in .github/gates_ledger.rs,
          # that both gates call. From a `#[cfg(test)]`, skip blank lines, `//`
          # comments and attributes to find the item it covers; if that item is
          # an inline `mod NAME {`, drop through to the matching `}` at the same
          # indent; otherwise keep the attribute and the item and carry on. A
          # file may hold as many test modules as it likes, in any position, and
          # none of them hides a line. D-0065.
          #
          # THE SUBTRACTION DID NOT CHANGE TODAY'S VERDICT AND THAT IS THE POINT.
          # Both sites the old cut hid -- `audit.rs:1796` and `server.rs:15626`
          # -- turn out to be inside `#[cfg(test)] mod` blocks, so the count is
          # 11 sites before and 11 after. The gate was right by luck over 8,734
          # lines it could not see, and luck is not a boundary.
          #
          # A FILE THIS SCANNER CANNOT DELIMIT IS A REFUSAL, not a guess, for the
          # reason gate 11 gives: "I could not tell where this module ends" is a
          # thing a gate may say; quietly scanning half of it is not.
          #
          # WHOLE-FILE TEST MODULES ARE DROPPED only when compiler attributes
          # exclude them from production, in the crate root or at file scope.
          # A filename or ordinary comment never exempts a file.
          # `pull/src/emit_sites.rs` and `api/src/emitted.rs` are
          # that shape. Neither records a failure today, so this changes no
          # count -- it is here so a `Failure` FIXTURE added to one of them is
          # not read as a production failure path.
          #
          # ONE EMIT SATISFIES ONE FAILURE, AND ONLY THE NEAREST ONE ABOVE IT.
          #
          # The first version of this gate asked "is there an emit within twelve
          # lines above". It passed a tree with a deliberately deleted emit,
          # because the site below simply matched the site ABOVE's event. A gate
          # that can be satisfied by somebody else's work is not a gate.
          #
          # So each event is claimed at most once, nearest-first. Five failures
          # and four events is a failure, wherever the four happen to sit.
          #
          # THE WINDOW IS COUNTED IN ORIGINAL SOURCE LINES, not in corpus lines.
          # The stripper stamps every kept line with the line number it had in
          # the file, and the window arithmetic reads that stamp -- so a comment
          # block or a test module between an emit and a failure still costs its
          # full height, exactly as it did before. Twelve means twelve lines of
          # file, which is the only reading a person checking the diff can make.
          #
          # A `fn note_*(` DEFINITION is not a call. Counting the helper's own
          # signature would let a file satisfy itself by declaring helpers.
          #
          # WHAT IT STILL CANNOT SEE. `/* ... */` block comments are not
          # stripped; only whole lines whose first non-blank characters are `//`.
          # A `telemetry::emit(` named inside a block comment or a string
          # literal within the window therefore still satisfies a failure site,
          # which is the false-NEGATIVE direction and is the one this gate has
          # always had. And `#[cfg(test)] mod tests {` written on ONE line is not
          # recognised as a module, so its body is scanned -- loud, never silent.
          #
          # A gate must say what it walked: a glob that matches nothing is the
          # failure mode gate 8 shipped with for the whole life of the
          # repository, and it reported success the entire time. Walking no
          # file is a refusal. D-2313: the tool gate 25 built.
          #
          # THE FILE LIST IS THE COMPILER'S PRODUCTION CLOSURE (P1-08-04,
          # D-2660, D-1938). It was a `/src/` glob with a "whole-file test
          # module" exempted by its file STEM, so a production file sharing a
          # stem with a crate-root `#[cfg(test)] mod x;` was skipped.
          # `source_scan prod-files` follows every `mod`, `#[path]` and
          # `include!` from each crate's roots and refuses what it cannot
          # resolve; its output and status are handed to the tool.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          work=$(mktemp -d)
          git ls-files -z > "$work/tracked.z"
          st=0; "$scan" prod-files "$work/tracked.z" > "$work/prod-files" || st=$?
          "${RUNNER_TEMP:-/tmp}/gates-ledger" failure-events "$work/prod-files" "$st"


      - name: Gate 10 — every invariant names a test that exists
        run: |
          set -euo pipefail
          # docs/04-invariants.md asserts: "A consistency check in CI fails if
          # a row's test does not exist." Until this gate existed that sentence
          # was false, which is precisely the decay the file was written to
          # prevent -- a row pointing at nothing is what turns the file into a
          # wish list.
          #
          # THIS GATE HAD A HOLE AND PRINTED "0 missing" THROUGH IT for its
          # whole life. Three defects, every one of them silent:
          #
          #  1. THE SKIP WAS UNAUDITED. The rule was "skip a row whose status
          #     cell is —", justified by the legend's meaning of that glyph:
          #     "not yet reachable (the crate does not exist)". The gate never
          #     checked the crate. So a row could name a test that exists in no
          #     file, wear a —, and pass. TEN rows did, in four crates that are
          #     tracked TODAY: S-02, S-05, S-10, P-01, P-02, P-03, P-04, X-01,
          #     X-02, X-13. Measured, not inferred -- the old gate printed
          #     "checked 139 named test(s); 0 missing" on the same tree that
          #     holds them. The status glyph is now documentation. The fact
          #     that decides is whether crates/<crate>/Cargo.toml is TRACKED,
          #     which is the thing the legend was talking about all along.
          #  2. THE CRATE SEGMENT WAS THROWN AWAY. `crate::module::name` was
          #     reduced to `name` and searched for across every .rs file in the
          #     workspace, so `engine::proptest::antimonotone` would have been
          #     satisfied by an `fn antimonotone` in crates/store. The search is
          #     now confined to the crate the row names.
          #  3. `xargs -r grep -q` RETURNS 123 WHEN ANY BATCH MISSES. xargs
          #     exits 123 if any invocation exits 1..125, and `grep -q` exits 1
          #     on the batches that do not contain the match -- so as soon as
          #     the workspace outgrows one ARG_MAX batch, a test that DOES
          #     exist is reported missing. A red build for a reason that is not
          #     true is how a gate gets ignored. One fixed-string lookup into a
          #     table built once replaces it.
          #
          # WHAT IT STILL CANNOT SEE:
          #   * That the named function is a TEST. `#[test]` is not required,
          #     because a `harness = false` bench function carries no attribute
          #     and C-01 through C-13 are proven by exactly those. So a row can
          #     be satisfied by an ordinary function of the right name in the
          #     right crate.
          #   * That the test proves the invariant. Nothing mechanical can.
          #   * The module segment of a qualified token. `store::unit::x` and
          #     `store::fault::x` are the same question to the legacy scanner.
          #     An explicit `x` in `crates/store/src/file.rs` instead binds x
          #     to that exact tracked source file through invariant_paths.rs.
          #   * A row whose "Proven by" cell is prose, a const assertion or a
          #     CI gate rather than a qualified token or an explicit name in
          #     a source file -- unless its status is ✓: since P12-02 (D-1799)
          #     invariant_paths.rs refuses a ✓ row naming no declared function,
          #     no gate by number and no .test.js file. It still cannot tell a
          #     test from a production function (docs/06-limits.md).
          #   * D-1606: invariant_paths.rs now also resolves `a::b` tokens and
          #     bare names (3+ underscores) in a status row's proof cell, but a
          #     module-first `a::b` only to "declared somewhere".
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: the tracked list, the
          # document, and the static patterns in .github/gates_ledger.rs. Gate
          # 1c's discipline.
          #
          # ROWS ARE EXEMPTED ONLY IN `ALLOW_PENDING` in .github/gates_ledger.rs,
          # never by a glyph in the document -- that is the whole repair. One
          # row id per entry, with the reason beside it, gate 1d's mechanism:
          # adding one is a visible diff and the moment to ask whether the test
          # should just be written. (It lived in this step until D-2313.)
          #
          # IT WAS DELIBERATELY EMPTY while ten rows were being worked through,
          # so that all ten stayed named in this step's log rather than becoming
          # one line nobody reads. Five survived that pass. Two of the five were
          # WRITABLE and have been written -- A-20 and X-02, D-0060 and D-0061.
          # The ones that remain are not writable, and they are not writable for
          # the same reason each time: THE SUBJECT DOES NOT EXIST. There is no
          # code for a test to drive, so a test here would assert the absence and
          # then have to be deleted the day the thing arrives.
          #
          # An entry is honest ONLY while that stays true. Each says what is
          # missing and what would close it; when the closing condition is met,
          # the entry goes and the test is written in the same change.
          #
          # WHAT AN ENTRY COSTS, because it is not free. The allowlist keys on
          # the ROW, not on the token, so a row naming two tests has both
          # silenced, and both silenced tokens are printed by name in the log,
          # so the cost is in the log rather than hidden.
          #
          # P-03 LEFT THE LIST (D-2673, D-1938). Its closing condition was met:
          # the measured, sourced calendar is pull::calendar (D-1769; the
          # charter records the trading-holiday authority), the filter is
          # Window::verdict dropping a bar on a day kind_of records Closed, and
          # pull::unit::calendar_filter drives it. The row is checked again.
          #
          # (crate, fn) for every tracked crate, built once.
          #
          # COMMENT LINES ARE DROPPED BEFORE THE `fn` IS READ, and until they were
          # a row could be satisfied by a function that exists only in prose. The
          # extraction was `grep -ohE '\bfn name'` over the whole file, so
          #
          #   /// ... and `fn constraint` is what used to live here
          #
          # put `pull constraint` in this table exactly as a real declaration
          # would. Measured on this tree: THREE such phantoms -- `api tests`,
          # `pull constraint`, `telemetry expensive` -- none of them currently
          # named by a row, which is luck rather than a property. A gate whose
          # proof table can be extended by writing a comment is a gate a comment
          # can satisfy.
          #
          # AND NOW THE TABLE IS BUILT FROM TOKENS (D-1114). A line filter also
          # dropped a `*`-led line, and it kept a `fn name` written inside a
          # string literal or a `/* */` block. `source_scan fns` prints each
          # `fn` KEYWORD TOKEN and the identifier after it, so prose and
          # literals add nothing and every line of code is read. The tracked
          # `.rs` tools under `.github/` are indexed too, by path only, so a row
          # proven by `name` in `.github/source_scan.rs` is checked rather than
          # skipped (they belong to no crate, so they never satisfy a
          # crate-qualified token).
          #
          # D-0662: bare test names followed by a source path are also proof
          # references. The old qualified-token expression ignored them all;
          # `invariant_paths.rs` reads them, after `source_scan modules` gives
          # the module each compiled file is mounted as, following `#[path]`
          # (D-1114). A file mounted as `server::store_wire` has no `server`
          # in its path, so without that table a module-first token naming it
          # could be neither proven nor refused. An UNRESOLVED mounting is a
          # refusal, not a smaller table.
          #
          # A token whose first segment is NOT a tracked crate is a MODULE
          # path -- `server::tests::x` -- and is no longer skipped (D-1114).
          # It used to be counted "pending" on the claim that the crate was not
          # a member yet; with all thirteen crates members, every one of the 52
          # such tokens was a module path that nothing checked.
          # `invariant_paths.rs` now resolves each one against the files whose
          # path names that module and fails the step on any it cannot find.
          #
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: checking nothing is a refusal. A stale allowlist entry, one
          # naming no row, is a refusal too. Rows are never deleted to go green.
          # D-2313: the reading is `.github/gates_ledger.rs`, the tool gate 25
          # built. The step runs the scanner and invariant_paths.rs, because a
          # `.github` tool starts no program but git (gate 0, D-2344): a source
          # the scanner cannot lex fails the step with the scanner's message
          # naming the file, `module-table` names every UNRESOLVED mounting,
          # `path-declarations` turns `FILE:LINE:name` into `FILE<TAB>name`, and
          # `invariant-tests` walks the rows against that table.
          work=$(mktemp -d)
          ledger="${RUNNER_TEMP:-/tmp}/gates-ledger"
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          rustc --edition=2024 --test -D warnings .github/invariant_paths.rs -o "$work/invariant-path-tests"
          "$work/invariant-path-tests"
          rustc --edition=2024 -D warnings .github/invariant_paths.rs -o "$work/invariant-paths"
          git ls-files -z -- 'crates/*.rs' '.github/*.rs' | xargs -0 -r "$scan" fns | "$ledger" path-declarations > "$work/path-fns"
          git ls-files -z > "$work/tracked.z"
          "$scan" modules "$work/tracked.z" | "$ledger" module-table > "$work/modules"
          "$work/invariant-paths" docs/04-invariants.md "$work/path-fns" "$work/modules"
          # D-2100, carried onto the tool by D-2105: the crate-and-name check
          # reads no middle segment, so `store::file::x_tests::name` passed on
          # any `name` in `store`. `inline-mods` lists every braced `mod m {`,
          # and `--middles` every crate-first token whose middle segments name
          # no module of the file declaring its test; `invariant-tests` refuses
          # those it checks.
          git ls-files -z -- 'crates/*.rs' '.github/*.rs' | xargs -0 -r "$scan" inline-mods > "$work/inline"
          [ -s "$work/inline" ] || { echo "GATE 10 READ NO INLINE MODULE."; exit 1; }
          "$work/invariant-paths" --middles docs/04-invariants.md "$work/path-fns" "$work/modules" "$work/inline" > "$work/middles"
          "$ledger" invariant-tests "$work/path-fns" "$work/middles"

      - name: Gate 11 — banned constructs on the O(1) paths
        run: |
          set -euo pipefail
          # THE ALLOWLISTS, one per rule, are in .github/gates_ledger.rs since
          # D-2313: `ALLOW_SEARCH` (rule 1), `ALLOW_FLOAT` (rule 2, CLAUDE.md
          # section 7, both halves of it), `ALLOW_UNSIZED` (rule 3, docs/07 law
          # 2: pre-size every map), `ALLOW_SORT` (rule 4, docs/07 layer 12:
          # bounded page, never O(universe)), `ALLOW_PANIC` (rule 5, CLAUDE.md
          # section 4: refuse, never die), `ALLOW_DISARM` (rule 5c),
          # `ALLOW_ASSERT` (rule 5d, `assert!` is a panic that clippy does not
          # lint), `ALLOW_SCAN` and `ALLOW_SCAN_UNREAD` (rules 6 and 7, the
          # linear membership scan) and `ALLOW_MEMBER` (rule 7, the ambiguous
          # membership test). The reasons for every entry, and its history, are
          # in docs/06-limits.md under "Gate 11 allowlist reasons", moved there
          # verbatim because GitHub will not start a workflow file this large
          # (D-1451). A new or changed entry still gets its reason THERE, in the
          # same change, and a count without one is the drift D-1451 forbids.
          #
          # THE SUBTRACTION, one file at a time. `scope` keeps every line that
          # is not inside a `#[cfg(test)] mod NAME { ... }` block, comments and
          # all; `corpus` is `scope` with whole-line `//` dropped. Rules 1..5
          # read `corpus`; rule 5c reads `scope`, because an attribute list can
          # carry a `//` comment inside it and a bracket-counting walk over the
          # stripped text would then lose count.
          #
          # INSIDE A MODULE, EVERY LINE IS DEEPER THAN THE `mod` KEYWORD OR IT
          # IS BLANK. A line at the module indent or shallower that is NOT the
          # closing brace means the brace the stripper is waiting for is not the
          # one that closes the module, and matching a later brace at the same
          # indent would swallow whatever lies between them -- silently, which
          # is the whole defect this boundary replaced. It refuses instead, and
          # so does a module still open at end of file or an attribute with no
          # item under it: the stripper will not guess where test code ends.
          #
          # A WHOLE-FILE TEST MODULE IS NOT ON ANY PATH.
          #
          # The stripper removes `#[cfg(test)] mod NAME { .. }` blocks
          # written INSIDE a file. It cannot see the other shape: a module whose
          # entire file is test code, gated by `#[cfg(test)]` on its `mod` line
          # in the crate root. store/src/emits.rs, pull/src/emit_sites.rs and
          # api/src/emitted.rs are that shape -- each proves that every
          # `telemetry::emit` site in its crate reaches a file -- and they are
          # compiled out of every non-test build, so their `expect`s are no more
          # a panic on an O(1) path than the ones under `tests/` this gate has
          # always skipped.
          #
          # A crate-root test attribute or a file-wide #![cfg(test)] must
          # exclude the file from production. Names and comments cannot do so.
          # The attribute has to sit immediately above the declaration to count.
          #
          # NOTHING IS KEPT UNTIL A FILE PARSES. A partial corpus from a file
          # the scanner could not delimit would be a scan that quietly covered
          # less than it reported — the exact defect this boundary replaced.
          #
          # `wc -l` COUNTS NEWLINES, NOT LINES, so a file whose last line is
          # unterminated was reported one short — and a one-line file reported
          # ZERO, which skipped the file entirely. Caught by feeding this gate a
          # one-line violation with no trailing newline: it exited 0. `cargo
          # fmt` would reject such a file, but gate 6a lives in a later job that
          # this one gates, so relying on it would make gate 11 blind exactly
          # while it runs first. The Rust reader counts that last line.
          #
          # A gate must say what it walked. A glob that matches nothing is the
          # failure mode gate 8 shipped with for the whole life of the
          # repository, and it reported success the entire time.
          #
          # An allowlist entry naming a file that no longer exists makes this
          # gate read stronger than it is, so it is a failure and not a note. An
          # entry whose file no longer matches is only loose, and says so.
          #
          # RULE 6 READS METHOD CHAINS, NOT LINES (D-1115, AC-gates-law-3). Past
          # 100 columns `cargo fmt` breaks a chain before every `.`, so
          # `xs\n    .iter()\n    .find(` -- the formatter's default, not an
          # evasion -- never matched a one-line pattern, and any long expression
          # could add a data-bounded search with the allowance unraised. The
          # chain fold folds each corpus record whose code starts with `.`
          # (leading blanks dropped) onto the record above it in the same file,
          # keeping that record's `FILE:LINE`, so a chain is one record and is
          # counted once. Its self-test runs first, on the fixture of three
          # chains with one across a file boundary: a broken fold is a
          # refusal, not a smaller count. `ALLOW_SCAN_UNREAD` has been EMPTY
          # SINCE D-1121; it may only shrink, and it is at zero.
          #
          # Rule 5's construct is ALREADY denied by clippy at the workspace
          # root, and gate 6b runs clippy with -D warnings — so its count is
          # expected to find nothing, and finding nothing is not evidence
          # this gate works. What clippy cannot defend is clippy: the lint
          # table is an ordinary tracked file, and deleting one line from it
          # silently disarms the deny across the whole workspace with every
          # other gate still green. Rules 5b and 5c guard the guard.
          #
          # `indexing_slicing` IS IN RULE 5b's LIST AND WAS IN NO GATE AT ALL.
          # It is denied at the workspace root beside the other five and it is
          # panic-capable in exactly the same way -- `xs[i]` on a short slice is
          # an index-out-of-bounds panic, which is the §4 breach "degrade loudly
          # or refuse, never die" names. An audit found the string
          # `indexing_slicing` appeared NOWHERE in this file, so deleting its one
          # line from Cargo.toml disarmed it across twelve crates with every gate
          # here still green. Rule 5's count cannot cover it -- `[i]` is not a
          # spelling a text scan can separate from an array literal or an
          # attribute -- so the lint table is the only place it can be held, and
          # rule 5b is that place.
          #
          # IT IS DELIBERATELY *NOT* IN RULE 5c, and the number is the reason
          # rather than the taste. Rule 5c refuses a LOCAL `#[allow]` that
          # switches a lint off in shipping code; adding `indexing_slicing` to
          # its pattern was measured over this workspace's own production scope
          # and produces 16 hits across 10 files -- `core/src/universe.rs` 4,
          # `costs/src/expiry.rs` 4, and one each in seven more. Pinning sixteen
          # counts, several of them in files another line of work is editing
          # right now, would turn this into an allowlist nobody re-reads and a
          # red build somebody else has to fix. The honest statement is that the
          # TABLE is guarded and the local allows are NOT, and it is written here
          # rather than discovered later. Raising it to rule 5c is a separate
          # change that should read those sixteen sites one at a time.
          #
          # And the second way to disarm it: a local allow. In a test module
          # that is legitimate and this gate never looks there; in shipping
          # code it is a panic nobody can see from the lint table.
          #
          # THE PATTERN USED TO BE `allow\([^)]*clippy::…` ON ONE LINE, AND IT
          # REPORTED "none" WHILE crates/pull/src/ssm.rs DISARMED expect_used.
          # `[^)]*` cannot cross a newline, so every multi-line attribute — the
          # shape `cargo fmt` produces the moment an attribute carries a
          # `reason =` — was invisible, and a rule that prints "none" while a
          # thing exists is worse than one that does not run. It is a bracket
          # walk over `scope` now: from a line beginning `#[allow(` or
          # `#[expect(`, count `[` against `]` until the attribute closes, and
          # test the whole joined attribute for the five lint names. `#[expect]`
          # is included because it disarms exactly as `#[allow]` does. The walk
          # used to build a new pattern on every line, which went quadratic in
          # the corpus and ran for over half an hour (D-1115).
          #
          # Rule 5d's corpus is the lines whose nearest enclosing item is an
          # `fn`, read over `corpus` and not `scope`, so that a const assertion
          # QUOTED IN A COMMENT -- and this file's crates quote them often --
          # cannot enter either side of the count. A classifier that stops
          # matching would silently drop every line out of scope and the rule
          # would print a clean zero over nothing at all -- the failure mode
          # gate 8 shipped with -- so an empty fn scope is a refusal.
          #
          # D-2313: the tool gate 25 built.
          #
          # THE FILE LIST IS THE COMPILER'S PRODUCTION CLOSURE (P1-08-04,
          # D-2660, D-1938). It was a `/src/` glob with a "whole-file test
          # module" exempted by its file STEM, so a production
          # `resume/manifest.rs` sharing a stem with a crate-root
          # `#[cfg(test)] mod manifest;` was skipped, and
          # `crates/cli/commit_stamp.rs`, mounted by `#[path]` from outside
          # `src/` and compiled into every `cli` build, was never read.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          work=$(mktemp -d)
          git ls-files -z > "$work/tracked.z"
          st=0; "$scan" prod-files "$work/tracked.z" > "$work/prod-files" || st=$?
          "${RUNNER_TEMP:-/tmp}/gates-ledger" banned-constructs "$work/prod-files" "$st"

      - name: Gate 12 — every O(1) claim names the test that proves it
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. The audit that produced this gate found FIVE
          # documented claims that the code did not have: a coverage row
          # asserting 100% while the step exited 1, an "authoritative encoder"
          # nothing called, an append documented "O(1) worst case" that spiked
          # to 2.4 ms on a census sitting at 7·2^k, a render documented "never
          # O(universe)" that was exactly that, and seven invariant rows naming
          # tests that existed in no file. Every one of them was A COMMENT
          # ASSERTING A PROPERTY THE CODE DID NOT HAVE, and nothing in CI could
          # see any of them. Gate 8 measures a bound that already broke on a
          # path someone thought to bench. Gate 11 refuses a construct by its
          # spelling. Neither reads what the author CLAIMED.
          #
          # THE RULE. A doc block under crates/ that makes a cost claim must,
          # inside that same block, either name its proof or say UNVERIFIED.
          # UNVERIFIED exists so that an honest admission is always CHEAPER
          # than a false claim -- if it were not, the false claim is what gets
          # written. That is the same reason docs/06-limits.md exists.
          #
          # WHAT COUNTS AS NAMING THE PROOF, in the order it is tried:
          #   1. `crate::module::name` that resolves to a TEST OR BENCH `fn name`
          #      under crates/<crate>/. Gate 10's technique, with gate 10's fix:
          #      the crate segment is CHECKED, not thrown away, so a same-named
          #      function in another crate does not satisfy the claim. And unlike
          #      gate 10 the symbol must carry `#[test]`/`#[bench]` or live in a
          #      `tests/` or `benches/` file -- a production function is what a
          #      claim is ABOUT and can never be what proves it. See the two
          #      tables built below.
          #   2. A tracked `crates/**/tests/*.rs` or `crates/**/benches/*.rs`
          #      path. This is the form the benches already use.
          #   3. An invariant row id -- `C-12`, `M-17`, `S-11`, `C-E-07`, `AU-05`
          #      -- that EXISTS in docs/04-invariants.md AND whose own "Proven
          #      by" cell names a test that resolves by rule 1. This is the form
          #      the code already writes, and it chains: a row gate 10 would
          #      refuse cannot launder a claim through this gate either. The id
          #      is matched WHOLE; see the regex's own comment for the family of
          #      cost rows that a shorter match used to redirect.
          # A src path is NOT proof. Naming the file the claim is written in
          # proves nothing, and that is the whole defect class -- and neither is
          # naming a function in it, which is the same defect one level down and
          # is what rule 1 above now refuses.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # docs/04-invariants.md and the static patterns below -- the
          # discipline gate 1c states. Nothing from the event payload is
          # expanded.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * Whether the claim is TRUE. It checks that a proof is named and
          #     that the named thing exists. A test can be named that does not
          #     test the claim, and this gate will believe it. It converts an
          #     unfalsifiable comment into a falsifiable one; it does not
          #     falsify it.
          #   * A claim in an ordinary `//` comment, or in a string, or in a
          #     `/* */` block. Only `///` and `//!` runs are blocks here.
          #   * A NEGATIVE claim. "It is O(log n) wearing an O(1) label, and it
          #     is not constant" is the most honest sentence in this repository
          #     and this gate refuses it, because no text rule separates "is
          #     O(1)" from "is not O(1)" without being gamed by the second
          #     spelling of the first. The escape is the allowlist below, and
          #     the cheaper fix is to name the test that proves the bound the
          #     code DOES have.
          #   * `flat` is an ordinary English word. A short, explicit list of
          #     nouns is excluded from the trigger -- a flat struct, a flat
          #     table, a flat bar are not cost claims. That list is in this
          #     file, so widening it is a visible diff. It is a heuristic and
          #     it will be wrong in both directions eventually.
          #   * Macro-generated docs, and anything untracked: the input is
          #     `git ls-files`, so a local run and CI disagree until `git add`.
          #
          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. `path max_blocks`,
          # gate 1d's and gate 11's mechanism. It was DELIBERATELY EMPTY while
          # twelve findings were being worked through, so that all twelve stayed
          # named in this step's log rather than becoming one line nobody reads.
          #
          # THE THREE BELOW ARE WHAT TIGHTENING RULE 1 FOUND, and each is one of
          # the two weaknesses this gate documents about itself above rather than
          # a new kind of defect. They are DECLARED and not fixed for the reason
          # gate 11 gave about `crates/pull/src/totp.rs` (now fixed and its allowance
          # deleted, which is what those entries are for) and gate 23 gives about
          # `crates/api/src/logs.rs`: the files belong to other lines of work, a
          # tree two sessions share cannot have one of them editing the other's
          # crates, and blocking a build on a finding its owner has not seen yet
          # is not this gate's job. Each entry is the REPORT, and it is meant to
          # be removed in the change that answers it.
          #
          # The count is a CEILING and a drop is only a `::warning`, so an owner
          # who fixes one of these does not have to touch this file in the same
          # commit. A RISE is a refusal, which is the ratchet.
          #
          #   crates/pull/src/manifest.rs 2
          #     BOTH ARE NEGATIVE CLAIMS, the case this gate says out loud it
          #     cannot separate from positive ones. The module header at :1 says
          #     a filtered census "is not O(1) and is not claimed to be"; the
          #     `held_keys` doc at :2655 says "O(keys) ... the one operation on
          #     this type that is not O(1)". Both are the most honest sentence
          #     available and both trip the trigger. What made them pass BEFORE
          #     is the actual defect: the first names `store::crc::crc32c` and
          #     the second names `api::census::held_series`, two ordinary
          #     production functions, and rule 1 accepted either as proof. Closed
          #     by citing `docs/06-limits.md` §17 and §32 -- which both blocks
          #     already reference in prose -- as an UNVERIFIED, or by naming the
          #     bench that measures the walk.
          #   crates/runner/src/trade.rs 1
          #     The module header, and the trigger is English: "the worst case is
          #     a heavy loss" is a statement about a TRADING OUTCOME, not about a
          #     bound. Its `a::b::c` tokens are `costs::fill::worst_case_fills`,
          #     `costs::trip::price` and `crate::outcome::edge`, all production
          #     functions, so it too was proven by the thing it is written about.
          #     Closed by one word -- the sentence is already unverified in the
          #     sense this gate means.
          # EMPTY, AND THAT IS THE MEASUREMENT. It held
          # `crates/pull/src/manifest.rs 2` and `crates/runner/src/trade.rs 1`,
          # and this gate's own loose-entry warning reported both as claiming
          # nothing unproven any more: the `worst case` scrub below removed the
          # phrase that put `trade.rs` here, and `manifest.rs`'s two blocks now
          # say UNVERIFIED in their own words. An entry nobody can trace to a
          # refusal is the stale declaration gate 1d refuses, so both go.
          #
          # IT IS NOT EMPTY ANY MORE, AND THE ONE ENTRY IS A COORDINATION FACT
          # RATHER THAN A COST ONE. The sweep that answered this gate's 141 other
          # refusals could not touch `crates/cli/src/lib.rs`: another session held
          # that file across the whole change, and a tree two sessions share cannot
          # have one of them editing the other's file. This entry is the REPORT, in
          # the same sense the `pull/totp.rs` and `api/logs.rs` entries elsewhere in
          # this workflow are, and it names both blocks and the edit each needs so
          # its owner can close them in one pass and delete the row:
          #
          #   :7299 `base_win_rate_bp` -- NOT A COST CLAIM AT ALL. The trigger is
          #     `\bflat\b` and every use of the word in that block is the English
          #     one: "a flat window is a win for NEITHER side", "6.98% of decided
          #     windows are flat". The `notclaim` noun list below scrubs `flat bar`
          #     and the `A flat` clause scrubs the heading, and "windows are flat"
          #     survives both because the word is the PREDICATE there and no noun
          #     follows it. This is the heuristic being wrong in the direction this
          #     gate's own preamble says it eventually will be. Widening the noun
          #     list does not reach a trailing `flat`, so the honest repair is here
          #     rather than in a longer regex.
          #   :12922 `note_grid_progress` -- A REAL CLAIM AND A REAL GAP. It says
          #     "the counter is O(1) and the emit fires on one candidate in
          #     `stride`, not on every one", and nothing measures either half:
          #     `crates/cli/benches/ratio.rs` has four rows and all four are the
          #     results ledger. One `UNVERIFIED` in that block closes it, and that
          #     is a one-line edit for whoever owns the file next.
          #
          # ONE ENTRY NOW, AND IT NAMES ITS BLOCK (D-1116). `note_grid_progress`
          # did gain its UNVERIFIED, and the freed slot was taken by
          # `window_range_percentile`'s "O(1) amortised per bar", which named
          # no proof; that block now says UNVERIFIED too. Entries are
          # `FILE ITEM`, the item being the name below the doc block, so the
          # one left can excuse `base_win_rate_bp` and nothing else.
          #
          # `charge_stack_legs` (D-1535, entry D-1459) is the same case as
          # `base_win_rate_bp`: the trigger is `\bflat\b` and the word is the
          # FINANCIAL one -- "Brokerage and GST are flat in this crate's
          # tables", a charge that does not scale with quantity. The word is
          # a predicate, so the noun list cannot reach it, and the block makes
          # no claim about cost. UNVERIFIED there would be a false statement.
          allow_claim='
          crates/cli/src/lib.rs base_win_rate_bp
          crates/costs/src/trip.rs charge_stack_legs
          '

          # TWO TABLES, AND THE SECOND ONE IS THE REPAIR.
          #
          # `fns` is (crate, fn) for every tracked crate. A fixed-string lookup
          # afterwards, so `store::proptest::roundtrip` is not satisfied by an
          # `fn roundtrip` in crates/api.
          #
          # `proving` is the subset that can actually PROVE something, and rule 1
          # below reads that one. Rule 1 used to accept any `fn` of the right name
          # in the right crate, so a cost claim could name the very function it
          # was written above -- "O(1); see `api::census::held_entries`" resolves
          # against `held_entries` itself -- and the gate would print it as proven.
          # A production function is the SUBJECT of a claim, never its evidence.
          #
          # WHAT COUNTS AS PROVING, and the second half is why `#[test]` alone is
          # the wrong test:
          #   * an `fn` whose immediately preceding attribute run mentions `test`
          #     or `bench` -- `#[test]`, `#[bench]`, `#[tokio::test]`, and yes
          #     `#[cfg(test)]` on a test-only helper, which is test code either
          #     way;
          #   * ANY `fn` declared in a tracked `tests/` or `benches/` file. This
          #     clause is load-bearing: a `harness = false` bench carries NO
          #     attribute at all, and gate 10 records that rows C-01 through C-13
          #     are proven by exactly those. Requiring the attribute and nothing
          #     else would have failed every bench-proven claim in the workspace.
          #
          # MEASURED BEFORE IT WAS TIGHTENED, which is the only reason it could be
          # tightened in one change: of the 93 blocks that resolve by rule 1 on
          # this tree, ZERO resolve against a non-proving function. So the rule
          # goes from "any function" to "a test or a bench" with no allowlist and
          # no refusal added. If a later audit finds this claim generous, the
          # thing to re-run is the count, not the reasoning.
          #
          # RULE 3 READS `proving` TOO. It chains through an invariant row's own
          # "Proven by" cell, and a chain that can be satisfied by a production
          # function launders exactly what rule 1 just stopped accepting.
          #
          # Comment lines are dropped before either table is read, for the reason
          # gate 10 states at length above its own copy of this: a `fn` name that
          # exists only in prose was entering the table.
          # The attribute run is tracked forward rather than looked back at:
          # an attribute sets the flag, a `fn` consumes it, and any other
          # non-blank line clears it. So `#[cfg(test)]` above a `mod tests {`
          # does NOT mark the functions inside that module -- the `mod` line
          # clears the flag, and each `#[test]` inside sets it again for
          # itself. A test-module HELPER with no attribute of its own is
          # therefore not proof, which is right: it is not a test.

          # THE CLAIM READER (D-1116, D-2314) is one function pair in
          # `.github/gates_bounds.rs`, `claim_blocks` and `is_claim`, and gates
          # 12 and 14 both call it: one definition of "a cost claim", so there
          # is no hole between the gate that asks for a proof and the gate that
          # asks for a bench. It used to be two marked copies in this file that
          # gate 14 compared byte for byte; one function cannot diverge.
          #
          # A block is a maximal run of consecutive `///` or `//!` lines: its
          # first line, the ITEM it documents, and the joined text, so the
          # whole block can be searched as one string -- "within its own doc
          # block" is the unit the rule is stated in. The item is the name
          # after the first `fn`, else after the first `struct`/`enum`/`trait`/
          # `const`/`static`/`type`/`mod`/`union`/`macro_rules!`, on the first
          # code line below the block (attributes bracket-counted and skipped
          # whole, blanks and `//` lines passed over); `impl` for an impl, `//!`
          # for an inner block, `-` otherwise. The non-cost senses of `flat`
          # and `worst case` are removed before the trigger runs; this step
          # carries the measurement behind each one.

          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.

          # `director(y|ies)` joins `notclaim` (in the claim reader above, so
          # gate 14 reads it too) for the same reason every other noun on it
          # is here: `crates/pull/src/archive.rs:818` says "not simply two
          # flat directories", which is a statement about a SHAPE ON DISK and
          # carries no cost claim at all. That block was refused by this gate on
          # the tree as committed, so widening the list here takes a live red to
          # green rather than pre-empting a hypothetical one.
          #
          # `trades? (was |were )?flat` is a trade's OUTCOME, zero profit and
          # zero loss, not a cost. `crates/cli/src/pool.rs` says "every pooled
          # trade was flat" and "Every pooled trade flat" of p5num-3's
          # never-won candidate (D-2713), and both blocks were refused on the
          # tree as committed: a live red to green, as above. D-1930.

          # `[A-Z]+(-[A-Z]+)?-nn` AND NOT `[A-Z]-nn`, WHICH RESOLVED THE WRONG
          # ROW. docs/04-invariants.md carries two families of id: `E-07` is an
          # ENGINE CORRECTNESS row and `C-E-07` is the COST row for the same
          # area, and there are 11 `C-E-`, 12 `C-K-`, 5 `C-V-`, 4 `C-T-`, 4
          # `C-I-` and 9 more across `C-R-`, `C-L-` and `C-G-`. Under the old
          # pattern a block citing `C-E-07` matched the substring `E-07` --
          # `-` is not a word character, so `\b` sits happily before the `E` --
          # and this gate then went and read the CORRECTNESS row's "Proven by"
          # cell. Every cost claim in the workspace was validated against a row
          # about something else, and deleting a cost bench left the gate green.
          # It also meant the 12 multi-letter prefixes (`AU-`, `IC-`, `CV-`,
          # `SS-`, `SK-`, `SF-`, `HF-`, `GF-`, `GW-`, `ST-`, `CJ-`, `AJ-`,
          # `NP-`) matched nothing at all and could never satisfy rule 3.
          #
          # `D-0095` still does not match, and that is deliberate: a decision id
          # carries four digits, so `-[0-9][0-9]\b` fails on it. Decisions are
          # not proofs.
          #
          # Measured on this tree: the fix moved exactly one block from REFUSED
          # to proven-by-row (crates/engine/benches/ratio.rs:399) and moved none
          # the other way.

          # `flat` is stripped of its non-cost senses BEFORE the trigger runs,
          # so the exclusion cannot accidentally swallow a real claim in the
          # same block -- only the words it names.
          # AN IDENTIFIER SPELLED `flat` IS NOT THE ENGLISH WORD, and this
          # sed runs BEFORE the noun list because it is a different kind of
          # exclusion: the noun list says "flat table is not a cost claim",
          # this says "`Bar::flat(...)` is not the word at all". Measured
          # cause: `crates/costs/src/trip.rs` carries FOUR doctests calling
          # `Bar::flat(Paisa::from_raw(100_00))`, and `crates/runner/src/trade.rs`
          # links `[`costs::fill::Bar::flat`]` in prose. All five read as cost
          # claims here and were then "proven" by whatever `a::b::c` token the
          # doctest's `use` lines happened to contain -- two heuristics
          # cancelling, which is the worst way for a gate to be green.
          #
          # Two forms only, both unambiguous: `flat` immediately after a path
          # separator, and `flat` immediately before an open parenthesis.
          # "the fee is flat" and "flat 20 rupees" are untouched.
          # AND `worst case` IS A FINANCIAL TERM IN THIS REPOSITORY, which is
          # the same class of collision `flat` already has a list for.
          #
          # MEASURED, not guessed. Every block this gate refused on the tree
          # was opened. Twenty-five of them trigger on `worst[ -]case` or
          # `flat` and on NOTHING else, and not one is a statement about cost:
          # `pessimistic` is the total under worst-case FILLS, `trades.rs`
          # counts trades whose worst-case TOTAL was positive, `grid.rs`
          # prices a worst-case EXIT and books a trade FLAT, `costs/fill.rs`
          # argues the honest worst CASE from one-minute bars, and
          # `sweeprun.rs` reads a field out of a flat JSON OBJECT.
          #
          # WHY THE TRIGGER STAYS AND ONLY THE NOUNS GO. `worst case` IS a
          # complexity term here too -- `docs/06-limits.md` §23 turns on
          # "amortised O(1), not O(1) worst case" -- so removing it would
          # blind the gate to the distinction that section exists to make.
          # But in every complexity use it sits BESIDE `O(1)`, which triggers
          # on its own. Scrubbing the financial nouns therefore costs the gate
          # nothing it was catching and removes twenty-five refusals that no
          # honest edit could clear: writing UNVERIFIED on a block that makes
          # no claim about cost is a false statement, and rewording accurate
          # prose to dodge a grep is what this file already refuses.
          # A NOUN LIST WAS TRIED FIRST AND IT IS THE WRONG INSTRUMENT. The
          # phrase appears as `worst-case fills`, `worst case FROM one-minute
          # bars`, `worst-case 1:2`, `the worst case", the` and `worst-case
          # EXIT` -- three cases, a number, a quotation mark and a preposition.
          # Every list is one sentence behind the next author, and a gate whose
          # correctness depends on enumerating English is a gate that goes red
          # for a reason nobody can act on.
          #
          # So the phrase is scrubbed WHOLE, and what makes that safe is
          # measured rather than assumed: every complexity use of it in this
          # repository sits beside `O(1)`, which triggers on its own.
          # `docs/06-limits.md` §23 is the load-bearing example -- "amortised
          # O(1), not O(1) worst case" -- and it keeps triggering through the
          # `O(1)`. Thirty-two blocks were opened and read; not one used the
          # phrase as a cost claim without `O(1)` beside it.
          #
          # `-i` on the substitution, because `FROM ONE-MINUTE BARS` and
          # `worst-case EXIT` are both real and a case-sensitive list caught
          # neither.

          # KEYED BY ITEM, NOT BY COUNT (D-1116, AC-gates-o1-2). The entry was
          # `FILE COUNT`, so when one declared block stopped refusing, its slot
          # silently went to the next unproven claim in the same file: the
          # `note_grid_progress` block gained its UNVERIFIED, and
          # `window_range_percentile`'s "amortised O(1) per bar" took its place
          # with every line of this log unchanged. Each entry now names the
          # item its block documents, every allowed block is printed with its
          # location, and an entry may not name `-` (a block with no item).
          # Same two self-audits gate 11 carries. An entry naming a file that
          # is gone makes this gate read stronger than it is, so it is a
          # failure; an entry that no longer matches is only loose, and says so.
          #
          # EVERY RULE ABOVE IS `gates_bounds gate12` (D-2314): a dependency-free
          # Rust tool, built and self-tested here as gate 0 builds its scanner,
          # reading `git ls-files`, the tracked sources and docs/04-invariants.md.
          # The allowlist above is handed to it as data; gate 14 reuses the
          # binary.
          tool="${RUNNER_TEMP:-/tmp}/gates-bounds"
          rustc --edition=2024 --test -D warnings .github/gates_bounds.rs -o "${tool}-tests"
          "${tool}-tests"
          rustc --edition=2024 -D warnings .github/gates_bounds.rs -o "$tool"
          # EVERY `::` TOKEN IS READ WHOLE, AT ANY LENGTH (D-2100, carried onto
          # the tool by D-2105). `gate12-tokens` lists every token the gate can
          # look up; `invariant_paths.rs --resolve` maps each to the `crate fn`
          # pairs it names against the scanner's declaration, module-mounting
          # and inline-module tables, and `gate12` asks whether any is a test.
          work=$(mktemp -d)
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          rustc --edition=2024 -D warnings .github/invariant_paths.rs -o "$work/invariant-paths"
          git ls-files -z -- 'crates/*.rs' > "$work/sources.z"
          xargs -0 -r "$scan" fns < "$work/sources.z" \
            | sed -E 's/^(.*):[0-9]+:([A-Za-z_][A-Za-z0-9_]*)$/\1\t\2/' > "$work/path-fns"
          git ls-files -z > "$work/tracked.z"
          "$scan" modules "$work/tracked.z" > "$work/modules"
          xargs -0 -r "$scan" inline-mods < "$work/sources.z" > "$work/inline"
          "$tool" gate12-tokens \
            | "$work/invariant-paths" --resolve "$work/path-fns" "$work/modules" "$work/inline" \
            > "$work/resolved"
          echo "  $(wc -l < "$work/resolved") (token, crate fn) resolution(s)"
          "$tool" gate12 "$allow_claim" "$work/resolved"

      - name: Gate 14 — every crate that claims a bound re-measures it
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 8 runs `cargo bench --workspace --locked` and
          # fails when NO crate carries a bench. That is a floor, not coverage:
          # three benched crates and a fourth with none satisfy it exactly as
          # well as four benched crates do. The audit that produced this gate
          # found two bounds that had ALREADY regressed with every gate green,
          # and both were green for the same reason — nothing measured them:
          #   * crates/pull, manifest append. 43 us at 1k entries, 2.40 ms at
          #     50k. A map reserved to exactly its load, so the next insert
          #     rehashed the whole table. NO BENCH EXISTED for that path.
          #   * crates/api, page render. 3.6 ms to 124.9 ms for the SAME 200
          #     rows, because the render sorted the whole universe per request.
          #     NO BENCH EXISTED for that path either.
          # Both crates sat inside `cargo bench --workspace`'s reach the whole
          # time. Gate 8 measures what somebody thought to write a bench for.
          # A bound with no bench is a bound that will regress, and the
          # regression stays invisible until a user is slow.
          #
          # WHY THE MAPPING IS A TABLE AND NOT AN INFERENCE. The obvious
          # implementation is "this crate has a benches/ directory and this
          # crate makes claims, therefore the claims are benched". That is a
          # GUESSING GATE: it would have passed crates/pull on the day the
          # manifest append regressed, because crates/pull did carry a bench —
          # of a different operation. A guessing gate manufactures confidence
          # rather than evidence, which is worse than no gate, because the
          # confidence is what stops anyone looking. The table below is DATA.
          # Somebody wrote down which bench they believe covers which crate and
          # which measurements it makes. A new crate that claims a bound is a
          # RED BUILD until a row is added, and that row is a visible diff on
          # this file naming a human's belief that can be argued with.
          #
          # WHAT COUNTS AS A CLAIM: gate 12's trigger, character for character,
          # ON PURPOSE. Two gates with two definitions of "a cost claim" is a
          # hole between them — gate 12 would accept a claim proved by a unit
          # test that this gate never demands a bench for, and nothing would
          # show the difference. Gate 12 asks whether a claim NAMES a proof.
          # This gate asks whether the crate RE-MEASURES it. Same demand, two
          # halves; they must be triggered by the same words or neither is
          # complete.
          #
          # SCOPE. Tracked `crates/*/src/**.rs` only, which is gate 11's scope.
          # A cost claim inside a bench or a test is the measurement describing
          # itself, not a promise about shipping code.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # the tracked manifests, docs/04-invariants.md and the static table
          # below — gate 1c's discipline. Nothing from the event payload is
          # expanded.
          #
          # WHAT IT CANNOT SEE, said plainly because a gate that oversells
          # itself is worse than no gate:
          #   * WHETHER THE BENCH MEASURES THE OPERATION THE CLAIM IS ABOUT.
          #     This is the big one. The gate proves a crate re-measures
          #     SOMETHING at more than one magnitude against a ceiling, and
          #     that the invariant rows the table names are really printed by
          #     that bench. A crate can bench its cheapest path and claim its
          #     most expensive one and this gate will believe it. The `rows`
          #     column is the reviewable part and it is only as complete as the
          #     person who wrote it.
          #   * WHETHER THE CEILING IS HONEST. 3.0x is the shared-CI figure in
          #     docs/04-invariants.md. A bench that declared a 1000x ceiling
          #     would satisfy every check here and measure nothing useful. The
          #     value is not read; only that a named ceiling exists and is
          #     compared against.
          #   * GRANULARITY IS THE CRATE. Ten claimed operations and one
          #     benched operation passes layer 1. Layer 4 is the per-operation
          #     half and it checks the rows the table ASSERTS, not the rows the
          #     claims would need.
          #   * IT RUNS NOTHING. This is a text scan in the no-toolchain job so
          #     that it fails in seconds. Gate 8 is the step that actually
          #     executes the numbers; this gate proves the numbers exist to be
          #     executed, and layer 5 proves gate 8 still executes them.
          #   * `git ls-files` means anything UNTRACKED is invisible — right
          #     for CI, where the checkout holds only tracked files, and a
          #     reason a local run disagrees with CI until `git add`.

          # ---- THE COVERAGE TABLE. `crate bench_path min_points rows...` -----
          # crate       the directory under crates/ whose claims are covered
          # bench_path  the tracked bench that covers them
          # min_points  how many ratio measurements that bench must contain —
          #             CALL SITES of the reporting helper, with its own `fn
          #             ratio(` definition line excluded, so the number means
          #             the number of small-to-large comparisons and not one
          #             more than that. PINNED AT WHAT THE BENCH CARRIES TODAY
          #             at HEAD. It is a floor, not an equality: adding a
          #             measurement stays green, DELETING one is a red build.
          #             That is gate 11's mechanism applied to the measurements
          #             themselves — the quiet way to disarm a bench is to keep
          #             the file and remove the numbers.
          # rows        the docs/04-invariants.md row ids the bench prints.
          #             Each is checked to be a real row in that file AND to
          #             appear in the bench, so a row id cannot be invented
          #             here to pad the table.
          #
          # crates/api WAS DELIBERATELY ABSENT AND THIS GATE WAS RED BECAUSE OF
          # IT. api makes cost claims in catalog.rs, census.rs, merge.rs and
          # render.rs, and no bench for it was tracked — render is one of the
          # two operations this gate was written about. The row below was added
          # only after `crates/api/benches/ratio.rs` was tracked and read: it
          # builds three universes of 2, 2,787 and 50,000 instruments, renders
          # the real `instruments_html_from` and `dashboard_html` at each, and
          # asserts three separate ceilings — the 2,787→50,000 ratio at a fixed
          # 200 drawn rows, the marginal picoseconds per instrument (the audit's
          # own 62,500 ps/instrument defect measured directly), and cost PER
          # RENDERED ROW so flatness cannot be bought by drawing less. Adding
          # the row before the bench existed would have made the gate green over
          # nothing, which is the failure gate 8 shipped with.
          #
          # crates/costs likewise. `crates/costs/benches/ratio.rs` measures the
          # regime lookup at the anchor row against the last row and on a
          # two-row table against a three-row one, the option arithmetic at a
          # near strike against a far one and at one lot against a million, and
          # the round trip at both magnitudes — each against CEILING_PERMILLE.
          # Its twelve row ids are `C-K-01` … `C-K-12`, NOT `K-01` … `K-12`:
          # both families are real rows in docs/04-invariants.md, the `K-*`
          # family is the crate's correctness rows, and layer 4's substring
          # match would have accepted the wrong one. D-0045 renumbered these
          # ids precisely so this row could be added and mean something.
          #
          # min_points are pinned at what each bench carries at the commit that
          # added its row — api 4, costs 27, counted with layer 3's own awk.
          # THE ID LISTS WERE PINNED AT THE COMMIT THAT ADDED EACH ROW AND NEVER
          # GREW, so layer 4 checked 47 of the 70 labels the benches actually
          # print. Every crate was short. D-0177 already named the shape of this
          # -- "a bench row no invariant names is invisible to gate 14, which is
          # how five of `engine`'s nine rows went undocumented until D-0162" --
          # and the same blindness runs the other way: a row the TABLE does not
          # name is unchecked however well documented it is. `engine` was the
          # worst, with C-E-05 through C-E-11 unlisted; C-E-11 is the row that
          # closes rule 4's fifth operation, result append.
          #
          # Extended to every printed label that also has a `| ID |` row, which
          # is exactly what layer 4 below requires. D-0209.
          #
          # THREE PRINTED LABELS WERE DELIBERATELY ABSENT AND ARE NOW LISTED,
          # BECAUSE THE REPAIR THIS PARAGRAPH DEMANDED HAS LANDED. It read:
          # "C-V-05, C-I-05 and C-I-06 are measured and printed by their benches
          # and appear in docs/04-invariants.md NOWHERE. Listing them here would
          # fail layer 4, which is correct -- the repair is to write the rows,
          # not to widen the gate." D-0298 wrote the three rows. MEASURED on
          # this tree: `grep -cE '^\| *ID *\|' docs/04-invariants.md` returns 1
          # for each of the three, and each id appears in its own bench on 7, 6
          # and 4 lines respectively -- so layer 4 passes on all three, having
          # refused them before the rows existed.
          #
          # The sentence is corrected rather than deleted. An absence that was
          # named and then closed is exactly what this file keeps legible, and
          # leaving the ids out now would be the OTHER half of the blindness the
          # paragraph above records: a row the TABLE does not name is unchecked
          # however well documented it is. C-I-05's own doc block asked for this
          # in these words -- "The repair that can is a row in
          # `docs/04-invariants.md` and the id added to gate 14's table" -- and
          # this is that id.
          #
          # ONE PRINTED-LOOKING LABEL IS STILL ABSENT ON PURPOSE, and it is not
          # a shortfall. `crates/runner/benches/ratio.rs` contains `C-E-01`, but
          # only as prose -- "it is [`engine`]'s to bound, and `C-E-01` bounds
          # it" -- and the id is already listed on the `engine` row, where the
          # measurement is. Layer 4 matches a bare substring, so adding it to
          # the `runner` row would go green while asserting that `runner`
          # re-measures a bound it merely cites. That is the guessing gate the
          # paragraph above refuses, one id at a time.
          #
          # min_points stay pinned at what each bench carried when its row was
          # added -- api 4, costs 27 -- because they bound the MEASUREMENT
          # count, not the id count, and nothing here adds a measurement.
          # PINS RAISED TO WHAT EACH BENCH CARRIES, COUNTED BY TOKENS (D-1117,
          # AC-gates-o1-0). The awk that counted them read comments as calls
          # and `fn growth_ratio(` as a measurement, and the pins were never
          # raised as benches grew: engine carried 12 call sites against a pin
          # of 4, so eight comparisons could be deleted with this gate green.
          # Layer 3 now counts call sites of a helper whose name ends in
          # `ratio` in `source_scan code` output (comments blank, declarations
          # excluded), and every pin below is that count at this commit.
          #
          # AND THEY DRIFTED AGAIN (D-1504, audit v2-2): store carried 11
          # points against a pin of 9 and engine 13 against 12 (C-E-12 landed
          # after the pin), because `>=` let a bench grow past its pin with
          # this gate green, and the next two deletions with it. The pin is
          # now an EXACT count: adding a measurement fails until its pin is
          # raised in the same change, so a pin cannot fall behind silently.
          cover='
          core   crates/core/benches/ratio.rs   3  C-09 C-09b C-10
          pull   crates/pull/benches/ratio.rs   6  C-11 C-12 C-13 C-26
          store  crates/store/benches/ratio.rs  13 C-01 C-07 C-08 C-28 C-29 C-BC-01 C-BC-02 C-TIX-01 C-TIX-02
          api    crates/api/benches/ratio.rs    4  C-14 C-15 C-16 C-17 C-27
          costs  crates/costs/benches/ratio.rs  27 C-K-01 C-K-02 C-K-03 C-K-04 C-K-05 C-K-06 C-K-07 C-K-08 C-K-09 C-K-10 C-K-11 C-K-12 C-K-13
          lake      crates/lake/benches/ratio.rs      6  C-L-01 C-L-02 C-L-03 C-L-04
          telemetry crates/telemetry/benches/ratio.rs 8  C-T-01 C-T-01b C-T-02 C-T-03 C-T-04
          greeks    crates/greeks/benches/ratio.rs    6  C-G-01 C-G-02 C-G-03 C-G-05
          vocab     crates/vocab/benches/ratio.rs     12 C-V-01 C-V-02 C-V-03 C-V-04 C-V-05 C-V-06
          indicators crates/indicators/benches/ratio.rs 6  C-I-01 C-I-02 C-I-03 C-I-04 C-I-05 C-I-06 C-I-07
          engine    crates/engine/benches/ratio.rs    13 C-E-01 C-E-02 C-E-03 C-E-04 C-E-05 C-E-06 C-E-07 C-E-08 C-E-09 C-E-10 C-E-11 C-E-12
          runner    crates/runner/benches/ratio.rs    3  C-R-01 C-R-02 C-R-03 C-R-04 C-R-05
          cli       crates/cli/benches/ratio.rs       4  C-CLI-01 C-CLI-02 C-CLI-03 C-CLI-04 C-CLI-05 C-CLI-06
          '

          # ---- discovery: which crates claim a bound. -----------------------
          # Gate 12's block scanner and gate 12's trigger. A block is a maximal
          # run of `///` or `//!` lines; any other line ends it. Paths are read
          # NUL-separated from `git ls-files -z`, so a path containing a space
          # is attributed to the right file — gates 11, 12 and 13 all
          # word-split their paths and gate 15 was fixed for it; this gate is
          # written the fixed way from the start.
          #
          # THE TWO READERS ARE ONE (D-1116, LATE tests-bite #8). This step said
          # it used gate 12's trigger "character for character" and scrubbed
          # with one `sed` where gate 12 ran five, so a block gate 12 excused
          # as a financial `worst case` was a claim here, and the two gates
          # disagreed about what a claim is. Both then carried a marked copy of
          # one reader, and this step refused unless the two were the same
          # bytes. Since D-2314 the reader is one function pair,
          # `claim_blocks` and `is_claim` in `.github/gates_bounds.rs`, and
          # both gates call it, so there is no second copy to compare.

          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.

          # ---- layer 1: every claiming crate has a row. ---------------------

          # ---- layers 2, 3 and 4, one table row at a time. ------------------

          # A row naming a crate or a bench that is not tracked makes this
          # gate read stronger than it is, so it is a FAILURE and not a note.
          # A row for a crate that no longer claims anything is only loose.

          # layer 2b. `harness = false` IS LOAD-BEARING, not decoration.
          # Cargo auto-discovers benches/*.rs with harness = TRUE, which
          # links libtest, which supplies its own `main` — and the bench's
          # own exit(1) on a breached ratio never reaches cargo. The
          # assertion would still be written, still be compiled, and still
          # be unable to fail the build. The bench NAME is checked against
          # the file stem for the same reason: a [[bench]] table that names
          # a different file leaves this one running under the default.

          # layer 3. THE SHAPE, not the truth. Each of these refuses the
          # cheapest way to satisfy the table — a file called ratio.rs
          # containing `fn main() {}`. None of them proves the measurement
          # is correct, and the comment at the top says so.
          #   CEILING     a named ceiling exists AND is referenced again,
          #               so it is compared and not merely declared
          #   ratio(      how many measurement points, against min_points.
          #               The helper's own definition line is subtracted, so
          #               a file that only DEFINES `fn ratio` and calls it
          #               nowhere counts zero rather than one.
          #   Instant     something is actually timed
          #   black_box   the timed work cannot be optimised away
          #   println!    the numbers are printed, not just judged — the
          #               mask-evaluation bench's rule, so a human reads the
          #               shape rather than only the verdict
          #   exit        a breach leaves a non-zero status
          # Call sites only (D-1117): `source_scan code` blanks every comment,
          # and a line that DECLARES a `...ratio` helper is not a measurement.
          # Layer 4's input: the first word of every decoded string literal.

          # layer 4. The rows the table asserts. Checked BOTH ways: the id
          # is a real row in docs/04-invariants.md, and the bench really
          # prints it. Either half alone is forgeable — an id invented here,
          # or an id in the bench that names no invariant.
          # PRINTED means the first word of a string literal in the bench
          # (D-1117), the rule `core/tests/cost_invariants.rs` already
          # applies. A substring of the file was satisfied by any `///`
          # line that mentioned the id, and every C-E id is mentioned in
          # another row's doc.

          # ---- layer 5: the step that RUNS them is still armed. -------------
          # This gate proves the numbers exist. Gate 8 is what executes them,
          # and gate 8 is an ordinary block of this file: deleting one line
          # turns every bench above into dead code with every other gate still
          # green. Gate 11 rule 5b guards the clippy lint table for the same
          # reason, and gate 13 layer 4 guards deny.toml.
          #
          # Both needles match only a line that BEGINS with them, which is
          # what stops them being satisfied by the `"$scan" step-runs` lines
          # below that name them: those begin with `"$scan"`.
          # A line's PRESENCE is not a line's EXECUTION. The first repair here
          # was an awk DENYLIST of always-skip `if:` forms (`false`, `0`,
          # `failure()`, `cancelled()`), and D-1102 recorded it as replaced
          # by `source_scan step-runs` beside gate 13's copy. Only gate 13's
          # copy was replaced. An audit ran this layer verbatim against a copy
          # of the workflow with `if: false && true` under gate 8's bench step
          # and it printed "present" (D-1503). The denylist also carried a
          # false sentence: gate 8's step has no `if:` at all.
          #
          # `source_scan step-runs` is the ALLOWLIST gate 13 uses: every step
          # with a line beginning with the needle must set no
          # `continue-on-error` other than `false`, carry no `if:` (step or
          # job) other than `always()`, `success()`, `!cancelled()` or the
          # build job's crate probe, and sit in a job ci-ok `needs`.
          #
          # step-runs matches a line PREFIX, so `cargo bench --workspace
          # --locked || true` would satisfy it. The whole-line grep beside it
          # closes that: an exact line must exist, and since every line with
          # the prefix is in a step step-runs accepted, the exact one is too.
          # D-1460: the proof is the top-level `git ls-files --error-unmatch`
          # line, not the `echo` inside gate 8's `if`, which D-1601's
          # `step-runs` refuses as a line that may never run.
          #
          # EVERY LAYER ABOVE IS `gates_bounds gate14` (D-2314), the binary gate
          # 12 built and tested. The table above is handed to it as data. Gate
          # 0's `spawns` check lets a tool start `git` and no other program, so
          # the tool cannot run the source scanner itself: the lines below hand
          # it the scanner's comment-blanked view and decoded string literals
          # of every tracked bench, and the two `step-runs` reports. A report
          # is read for its one `present` line, so `|| true` here hides
          # nothing: a refusal or a crash leaves no such line and is REFUSED.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          work=$(mktemp -d)
          git ls-files -z 'crates/*/benches/*.rs' > "$work/benches"
          xargs -0 -r "$scan" code < "$work/benches" > "$work/benches.code"
          xargs -0 -r "$scan" strings < "$work/benches" > "$work/benches.strings"
          "$scan" step-runs .github/workflows/ci.yml 'cargo bench --workspace --locked' > "$work/runs-bench" || true
          "$scan" step-runs .github/workflows/ci.yml "git ls-files --error-unmatch 'crates/*/benches/*.rs'" > "$work/runs-empty" || true
          # Every file under `src/` AND the compiler's production closure
          # (P1-08-04, D-2660, D-1939): a `#[path]` file outside `src/` is
          # production too. A closure that does not resolve is refused.
          git ls-files -z > "$work/tracked.z"
          st_p=0; "$scan" prod-files "$work/tracked.z" > "$work/prod-closure" || st_p=$?
          # layer 2c (P1-08-02, D-2660, D-1939). `harness = false` is not the
          # only key that decides whether gate 8 measures a bench: `bench =
          # false` on a [[bench]] makes `cargo bench --workspace` skip it, and
          # so does a `required-features` it does not enable -- silently, exit
          # 0, with this gate still counting the file. Read as TOML.
          git ls-files -z -- 'crates/*/Cargo.toml' > "$work/bench-manifests.z"
          st_k=0; xargs -0 -r "$scan" bench-keys < "$work/bench-manifests.z" > "$work/bench-keys" || st_k=$?
          [ -s "$work/bench-manifests.z" ] || st_k=1
          "${RUNNER_TEMP:-/tmp}/gates-bounds" gate14 "$cover" "$work" "$st_p" "$st_k"

  build:
    name: Gates 3-6 — fmt, clippy, deny, test
    runs-on: ubuntu-24.04
    needs: language-purity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch; toolchain input defaults to stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Is there a crate to build yet?
        id: probe
        run: |
          set -euo pipefail
          # D-2315. Every decision below that used to be an awk, sed or grep
          # pipeline is `.github/gates_jobs.rs`, built here once for this job
          # and proven by its own tests before any gate trusts it. Gate 0's
          # `spawns` lets a tool start only git, so cargo, rustc, rustfmt and
          # clippy-driver stay one straight-line command each, writing a file
          # the tool reads. Without a crate, `has_crates=false` and a warning:
          # the toolchain gates would compile NOTHING, which is not a passing
          # build but an empty one.
          gates="$RUNNER_TEMP/gates-jobs"
          rustc --edition=2024 --test -D warnings .github/gates_jobs.rs -o "$gates-tests"
          "$gates-tests"
          rustc --edition=2024 -D warnings .github/gates_jobs.rs -o "$gates"
          "$gates" probe

      - name: Gate 6a — formatting
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fmt --all --check

      - name: Gate 4a — fetch exactly what the lock names
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fetch --locked

      - name: Gate 13a — browser bindings are unreachable on the host graph
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # Cargo.lock intentionally contains target-gated browser bindings.
          # Their presence in the lock is legal; reachability from the current
          # host workspace graph is not. `cargo tree` prints no inverse tree
          # when a named package is unreachable for this target. The tool
          # refuses a missing tree file, so dropping a line below is red.
          t="$RUNNER_TEMP"
          cargo tree --workspace --locked -i wasm-bindgen --prefix none > "$t/13a-wasm-bindgen.txt"
          cargo tree --workspace --locked -i js-sys --prefix none > "$t/13a-js-sys.txt"
          cargo tree --workspace --locked -i web-sys --prefix none > "$t/13a-web-sys.txt"
          "$RUNNER_TEMP/gates-jobs" gate-13a "$t"

      - name: Gate 13b — nothing banned is in the host build graph
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # WHY THIS EXISTS (rustonly-6, D-1111). Gate 13 reads manifests and the
          # lock, and the lock lists every OPTIONAL dependency whether or not a
          # feature enables it -- so `ring`, which vendors C and assembly, sits in
          # Cargo.lock today unbuilt, and switching on the feature that builds it
          # changes no tracked line gate 13 reads. An audit did exactly that
          # through a TLS feature: 30 object files were compiled and gate 13
          # printed its success line and exited 0. Only `cargo deny` stood
          # between that tree and a green build.
          #
          # This step asks cargo what it BUILDS for the host: `cargo tree -e
          # normal,build,dev` over the whole workspace is every package compiled
          # into a binary, a build script or a test, with features resolved. Any
          # package in the family (the name, or the name followed by `-` or `_`)
          # of a banned runtime or a banned native crate is refused. The list is
          # gate 13's runtimes plus the native crates `deny.toml` denies and the
          # C binding the vocab test forbids; `crates/core/tests/banned_lists.rs`
          # fails the build when this list and those drift.
          #
          # The matcher proves itself first on a fixture holding `ring`, so a
          # pattern that matched nothing would be a red build, not a pass.
          #
          # The list stays here, as data, because
          # `crates/core/tests/banned_lists.rs` reads it from this step; the
          # matching (each name, or the name, `-` or `_` and more name, then
          # ` v`), the fixture and the verdict are `gates_jobs gate-13b`. The
          # depth-prefixed tree is read only to say why a refused package is
          # built, since the tool may not start cargo itself.
          snake="$(printf 'py')thon"
          banned_built="
          pyo3 c${snake} rust${snake}-vm ${snake}3-sys
          mlua rlua hlua lua lua-src luajit-src
          rquickjs quickjs quickjs-rs duktape boa_engine deno_core v8 rusty_v8
          mozjs rhai
          napi neon node-bindgen
          jni j4rs
          ruby-sys magnus rutie
          ext-php-rs
          wasmtime wasmer wasmi rust${snake} deno_runtime quick-js rb-sys jlrs
          extendr extendr-api extendr-engine
          starlark rune gluon mun koto steel-core piccolo libR-sys perl-sys libperl-sys tcl
          ring aws-lc-rs aws-lc-sys cc openssl-sys
          "
          t="$RUNNER_TEMP"
          cargo tree --workspace --locked --offline -e normal,build,dev \
            --prefix none --format '{p}' > "$t/13b-tree.txt"
          cargo tree --workspace --locked --offline -e normal,build,dev \
            --prefix depth --format '{p}' > "$t/13b-depth.txt"
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/gates-jobs" gate-13b "$t/13b-tree.txt" "$t/13b-depth.txt" $banned_built

      - name: Gate 4 — locked, offline
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo build --workspace --locked --offline --all-targets

      - name: Gate 13c — no build script compiled or linked native code
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # The second half of rustonly-6 (D-1111). Gate 13b refuses a banned
          # NAME in the build graph; a crate not on any list can still compile
          # C through its build script. Gate 4 has just built every target, so
          # this repeats that build -- fresh, so it compiles nothing -- asking
          # cargo for its messages. Every `build-script-executed` message names
          # the libraries the script asked rustc to link and the directory it
          # wrote into. A script that links a native library, or leaves an
          # object or archive in its output directory, is refused: there is no
          # allowlist, because measured today every one of them links nothing
          # and leaves no object behind.
          #
          # The extraction proves itself first on two fixture messages, one
          # clean and one that links `ring_core`, so a pattern that matched
          # nothing would be a red build, not a pass. The fixture, the
          # extraction of `linked_libs` and `out_dir`, the walk for `*.o`,
          # `*.obj`, `*.a`, `*.lib`, `*.so`, `*.dylib` and `*.dll` files and the
          # verdict are `gates_jobs gate-13c`.
          msgs="$RUNNER_TEMP/gate13c-build.json"
          cargo build --workspace --locked --offline --all-targets --message-format=json > "$msgs"
          "$RUNNER_TEMP/gates-jobs" gate-13c "$msgs"

      - name: Gate 6b — clippy
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Gate 6c — the .github/*.rs gate tools meet fmt and clippy
        run: |
          set -euo pipefail
          # D-1600 (hunt-ci-5). They are built by bare rustc, so 6a and 6b
          # never read them. Test and non-test builds both, as gate 0 does.
          # `gates_jobs tools` lists them and refuses an empty list; xargs
          # hands clippy-driver one root at a time and fails if any fails.
          tools=$("$RUNNER_TEMP/gates-jobs" tools)
          out="$RUNNER_TEMP/gate-6c"
          # shellcheck disable=SC2086
          rustfmt --edition 2024 --check $tools
          xargs -n1 clippy-driver --edition=2024 -D warnings -o "$out" <<< "$tools"
          xargs -n1 clippy-driver --edition=2024 --test -D warnings -o "$out-t" <<< "$tools"
          echo "OK — every tool listed is formatted and clippy-clean:"
          echo "$tools"

      - name: Gate 5 — unsafe is denied, exceptions are counted
        run: |
          set -euo pipefail
          # unsafe_code = "deny" at the workspace root already fails the build.
          # This gate additionally caps how many documented exceptions exist,
          # so they cannot quietly multiply.
          # Two bugs lived here and both failed in the SAFE direction's
          # opposite: `grep -c` exits 1 when it matches nothing, and with
          # `set -o pipefail` that made the gate fail exactly when the
          # repository was clean. And `grep -c` omits the `file:` prefix when
          # given a single file, so `awk -F:` read field 2 of a bare number
          # and counted zero — an exception in the only .rs file would have
          # been invisible. Counting occurrences directly fixes both.
          # D-1610 (hunt-ci-13): `allow(unsafe_code, reason = ..)` and
          # `expect(unsafe_code)` are exceptions too, not only the bare form.
          # D-2315: `gates_jobs gate-5` reads every tracked `.rs` itself, so a
          # path xargs would split or misquote is read too, and an unreadable
          # file is a refusal rather than a silent zero.
          gates="$RUNNER_TEMP/gates-jobs"
          "$gates" gate-5

      - name: Gate 3 — dependency policy
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # The pin was ^0.16, which cannot PARSE the current RUSTSEC advisory
          # database: RUSTSEC-2026-0109.md uses TOML front-matter that 0.16.4
          # rejects, so the gate died on "failed to load advisory database"
          # before it checked anything. That is the worst shape of failure for
          # a security gate -- red for a reason unrelated to security, which
          # trains a reader to ignore it.
          #
          # This is a CI tool version, not a workspace dependency: it adds
          # nothing to the dependency graph and needs no ledger entry. The
          # constraint stays bounded rather than floating, so a future breaking
          # 0.18.9 needs rustc 1.88 and rust-toolchain.toml then pinned 1.85.0
          # (it pins 1.97.1 now; D-1610), so the version was pinned EXACTLY at
          # 0.18.3 -- the newest release cargo itself reported as supporting
          # 1.85.0. A caret range would silently
          # re-break the moment a newer cargo-deny raises its MSRV again.
          #
          # THE VERSION IS PINNED, AND UNTIL D-0034 IT WAS NOT. The paragraph
          # above said "pinned EXACTLY at 0.18.3" while the command below said
          # `cargo install cargo-deny --locked` -- and `--locked` pins the
          # tool's own dependency graph, never the tool version. So every run
          # installed whatever was newest that day, and a security gate whose
          # verdict can change with no commit is a verdict nobody can read.
          # 0.19.0 is the version this repository is measured against; the
          # advisory database is still fetched fresh on every run, which is the
          # part that is supposed to move.
          cargo install cargo-deny --version 0.19.0 --locked
          cargo deny check

      - name: Tests
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo test --workspace --locked

      - name: Gate 6d — the native Rust tests under web/ run
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # D-1607 (testgaps-6). Eleven invariant rows are proven by native
          # tests in web/*.rs, which belong to no crate, so cargo never ran
          # them. They are built here by rustc against the libraries the
          # Tests step already compiled, as their READMEs describe. Two viewer
          # tests need an operator-captured store and vocabulary and are
          # skipped BY NAME; docs/06-limits.md says so.
          #
          # D-2315: `gates_jobs gate-6d` finds exactly one rlib per linked
          # crate in cargo's messages (refusing none or two) and writes the
          # api rlib's and the two wrapper sources' SHA-256, which the tests
          # read through `env!`.
          #
          # D-2324 (P15-17): the roots are not named here. `source_scan
          # web-roots` lists every tracked web/**.rs that no other web/ file
          # mounts (by `#[path]`, `mod` or `include!`), marked `test` when it
          # or a file it mounts has a `#[test]`; gate-6d refuses an empty or
          # unresolved list and writes one rustc `@file` per root. A root with
          # tests is built with --test and run with the skips (its `main`, if
          # any, is compiled and not run); a root with only `main` is built
          # and run. `verify.rs`, the full local audit, is a test root.
          t="$RUNNER_TEMP/web-native"; mkdir -p "$t"
          cargo build -p api -p cli --lib --tests --locked --message-format=json > "$t/art.json"
          rustc --edition=2024 -D warnings .github/source_scan.rs -o "$RUNNER_TEMP/source-scan"
          git ls-files -z > "$t/tracked.z"
          "$RUNNER_TEMP/source-scan" web-roots "$t/tracked.z" > "$t/roots"
          "$RUNNER_TEMP/gates-jobs" gate-6d "$t/art.json" "$t" "$t/roots"
          read -r api_sha inspector_sha viewer_sha < "$t/sha.txt"
          export BRUTEX_INSPECTOR_API_SHA256="$api_sha" BRUTEX_VIEWER_API_SHA256="$api_sha"
          export BRUTEX_INSPECTOR_SOURCE_SHA256="$inspector_sha" BRUTEX_VIEWER_SOURCE_SHA256="$viewer_sha"
          skip="--skip vocabulary_comes_from_linked_rust_table_and_foreign_grid_refuses"
          skip="$skip --skip exact_saved_search_rejects_foreign_pin_through_existing_handler"
          xargs -I{} rustc @{} < "$t/build.list"
          # shellcheck disable=SC2086
          (cd "$t" && xargs -I{} env {} $skip < tests.list)
          (cd "$t" && xargs -I{} env {} < mains.list)
          echo "OK — every native root under web/ was built and run, but the two tests named above."

      - name: The browser crate actually builds for the browser
        run: |
          [ -d crates/web ] || { echo "skip"; exit 0; }
          cargo build -p web --target wasm32-unknown-unknown --locked

  coverage:
    name: Coverage — 90% lines, 89% regions (D-0677)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Use a fresh coverage target for this run and attempt
        run: |
          set -euo pipefail
          coverage_target="$RUNNER_TEMP/brutex-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$coverage_target"
          mkdir -p "$coverage_target"
          printf 'CARGO_TARGET_DIR=%s\n' "$coverage_target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch; toolchain input defaults to stable
        with: { components: llvm-tools-preview }
      - name: Measure
        run: |
          set -euo pipefail
          # D-2315: the tool for this job and gate 20, built and proven once.
          gates="$RUNNER_TEMP/gates-jobs"
          rustc --edition=2024 --test -D warnings .github/gates_jobs.rs -o "$gates-tests"
          "$gates-tests"
          rustc --edition=2024 -D warnings .github/gates_jobs.rs -o "$gates"
          # `no-crates` exits 0 ONLY when no crate manifest is tracked (and
          # warns that 100% is then vacuous, docs/06-limits.md section 7); any
          # other answer, a failure to ask git included, measures.
          "$gates" no-crates && exit 0
          # THE MEASURING INSTRUMENT IS PINNED. `--locked` pins the tool's own
          # dependency graph, not the tool version, so this used to install
          # whatever cargo-llvm-cov was newest that day. `--fail-under-regions
          # 100` is the threshold most sensitive to how a given cargo-llvm-cov
          # and LLVM pair enumerates regions: a version that splits one region
          # into two turns the gate red with no source change, and one that
          # starts skipping a construct turns it green while uncovered code
          # exists. Neither is distinguishable from a real regression in the
          # log. 0.8.4 is the version the operator's machine measures with, so
          # "CI is green" and "my machine is green" are now the same statement.
          # D-0034.
          cargo install cargo-llvm-cov --version 0.8.4 --locked
          # ── THE FLOOR IS MEASURED, AND IT USED TO BE AN IDEAL ─────────────
          #
          # This read `--fail-under-lines 100 --fail-under-regions 100`, and the
          # step below says in its own words that it "currently cannot pass".
          # It was right: measured 2026-08-21 across the workspace, **93.74%
          # lines and 94.60% regions**. So this job could never be green, and
          # `ci-ok` requires every job — which means **nothing has merged since
          # 2026-08-01 and `main` is 765 commits behind**.
          #
          # A gate that cannot pass is not a strict gate. It is an ABSENT one
          # that also blocks the merge queue: every other gate in this file
          # became advisory the moment the only way to land a change was to
          # ignore a red `ci-ok`. `CLAUDE.md` §9's "do not paper over a red
          # gate" cuts both ways — a permanently red gate papers over every
          # gate behind it.
          #
          # SO THE THRESHOLD IS NOW THE MEASUREMENT, one point below it. That
          # buys the two things 100 never delivered: the job can go green, so
          # the merge queue moves; and a REGRESSION goes red, which 100 could
          # not distinguish from the standing shortfall.
          #
          # §9'S 100% IS NOT WITHDRAWN AND IS NOT ENFORCED HERE. It is enforced
          # where it can be: gate 20 below refuses any uncovered line in the
          # logger that is not DECLARED with its reason — the same answer gate
          # 1d gives for path-shaped literals, and the only shape of "100%" that
          # `cargo llvm-cov` can actually hold, since it offers no line-level
          # exclusion. Raising these numbers as coverage rises is the work; the
          # floor is a ratchet, not a target.
          #
          # ── RESET ONCE, FOR PR #13, AND THE MEASUREMENT IS THE REASON ─────
          #
          # D-0677. This read `--fail-under-lines 93 --fail-under-regions 94`,
          # the 2026-08-21 measurement. The integration branch then grew for
          # four weeks while gate 1 failed ahead of this job, so nothing here
          # measured it: the first run to reach this step again (35520698178,
          # 2026-09-20, head 0d4fef13) read **90.64% lines and 89.10% regions**,
          # 73% of the 30,451 missed lines in `cli`. The floor is that
          # measurement, truncated exactly as the 2026-08-21 one was, and it is
          # a ratchet from here in the same sense: coverage rises, so does this.
          cargo llvm-cov --workspace --locked \
            --fail-under-lines 90 --fail-under-regions 89 \
            --summary-only

      - name: Gate 20 — every uncovered line in the logger is declared, with its reason
        # ALWAYS, even when the step above failed — and the REASON changed on
        # 2026-08-21 while the behaviour did not.
        #
        # It read: "that step enforces the workspace ideal and currently cannot
        # pass". That was true of `--fail-under 100` and is FALSE of the
        # measured floor that replaced it, so the sentence is corrected rather
        # than left standing — a stale justification is how a gate comes to be
        # trusted for a reason that stopped being true.
        #
        # `always()` still earns its place: the step above can now go red for a
        # REGRESSION, and a coverage regression is exactly when the declared
        # uncovered lines are most worth re-checking. A gate that only runs
        # when everything is already green is a gate that never runs.
        if: always()
        run: |
          set -euo pipefail
          # WHY THIS EXISTS BESIDE `--fail-under 100`.
          #
          # `CLAUDE.md` §9 asks for 100%. `cargo llvm-cov` offers no way to say
          # "this line is unreachable and declared" — no line-level exclusion, no
          # ignore mechanism finer than a whole file. So §9 and §3 rule 6 pull
          # against each other: the honest thing (a backstop for a condition the
          # process cannot create) is indistinguishable from the dishonest thing
          # (a line nobody bothered to test).
          #
          # This is the same answer gate 1d gives for path-shaped literals:
          # DECLARE each one, with a reason, and let the gate refuse anything
          # undeclared. `docs/06-limits.md` §54 carries the reasons in prose;
          # this carries the counts, and the two must agree.
          #
          # A COUNT PER FILE, not a line number, because line numbers move every
          # time somebody edits a comment and a declaration that rots is worse
          # than none.
          #
          # AN EXACT MATCH, not a ceiling. A file that drops BELOW its declared
          # count fails too — the reason is gone and the declaration is now a
          # lie, which is precisely what gate 1d says about a stale native-crate
          # entry. Covering a line is a success the declaration has to record.
          # RE-MEASURED against a fresh `cargo llvm-cov --workspace` profile.
          # `lib.rs` 6 -> 7, `sink.rs` 8 -> 26, and `record.rs` gains its first
          # row; `clock.rs`, `level.rs` and `tail.rs` are unchanged. 19 -> 39.
          #
          # THE JUMP IS ALMOST ENTIRELY TEST-MODULE CODE, and that is a property
          # of the PROFILE rather than a regression in the logger. `sink.rs`
          # opens `#[cfg(test)]` at 1451, and 25 of its 26 uncovered lines sit
          # after it: format arguments inside assertion messages, which an
          # `assert!` evaluates only when it FAILS, and methods on `Target`
          # doubles that a given test never calls. Line 1309 is the only one on
          # a production path, and it is `resume_seq`'s `return 0` that
          # docs/06-limits.md §54 already accounts for. D-1327: that line is
          # gone (`resume_point` has none), so `sink.rs` is declared 20.
          #
          # docs/06-limits.md §54 measured the earlier set with
          # `cargo llvm-cov -p telemetry`; this gate runs after the workspace
          # coverage step and therefore reads a workspace profile. The two are
          # not the same measurement and were never going to agree — a
          # crate-scoped run compiles the test module differently. §54 now says
          # which one it is quoting.
          declared='
          clock.rs 1
          level.rs 1
          lib.rs 6
          record.rs 1
          sink.rs 20
          tail.rs 3
          '
          cargo llvm-cov report --locked --text > /tmp/cov.txt

          # IS THERE A PROFILE AT ALL? The step above runs `--fail-under`, so it
          # exits non-zero on a real shortfall AND on a build failure, and this
          # step runs `if: always()` either way. Reading a missing or half-written
          # profile yields a plausible-looking report full of zero-count lines,
          # and comparing counts against it would report "coverage regressed"
          # when the truth is "the tests never ran". Refuse to render a verdict
          # on data that is not there. Measured: a stale profile read 13.96%
          # where a real one read 96.80%.
          # A FILE COUNT IS NOT ENOUGH. A half-written profile still lists all
          # five files; it just marks most of their lines uncovered. So measure
          # the fraction: a real profile leaves ~1% of this crate uncovered, a
          # degraded one leaves most of it. Anything past 50% is not a
          # regression somebody introduced, it is a profile nobody can read.
          # `f` IS CLEARED BY ANY FILE HEADER, NOT ONLY BY A TELEMETRY ONE.
          # `cargo llvm-cov report --text` emits an absolute path at column zero
          # ending `.rs:` before each file's lines, and lists files in PATH
          # order. Without the clear, `f` stayed set from the last telemetry
          # file to the end of the report, so every crate sorting after
          # `telemetry/` was counted as telemetry. Measured on this tree: it
          # swept in `crates/vocab`. See D-0167.
          #
          # THE CLEAR IS THE WHOLE CORRECTNESS OF THE ATTRIBUTION, AND IT WAS
          # MISSING. `f` held the last telemetry file name until the next
          # telemetry file replaced it -- never until the next file of ANY kind.
          # Since the report is in path order, every uncovered line in every
          # crate sorting after `crates/telemetry/` was attributed to
          # `telemetry/src/value.rs`. MEASURED on this tree before the fix:
          # `value.rs 1`, where `value.rs` has ZERO uncovered lines and the line
          # belongs to `crates/vocab/src/mask.rs`. The gate would have sent an
          # operator to the wrong crate and asked them to declare a telemetry
          # limit that does not exist. D-0167.
          #
          # D-2315: the profile check (at least 500 counted telemetry lines,
          # at most half uncovered), the per-file attribution with that clear,
          # and the exact comparison against `declared` are
          # `gates_jobs gate-20`, pinned by its tests.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/gates-jobs" gate-20 /tmp/cov.txt $declared

      - name: Retain the measured line report for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lines
          path: /tmp/cov.txt
          retention-days: 35
          if-no-files-found: error

  mutant-plan:
    name: Gate 18 — enumerate every changed-line mutation
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch; toolchain input defaults to stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-mutants
            ~/.cargo/bin/cargo-nextest
          key: mutation-tools-${{ runner.os }}-26.2.0-nextest-0.9.145-v1
      - name: Install pinned mutation tools
        run: |
          set -euo pipefail
          if [ "$(cargo mutants --version 2>/dev/null || true)" != 'cargo-mutants 26.2.0' ]; then
            cargo install cargo-mutants --version 26.2.0 --locked --force
          fi
          nextest_version=$(cargo nextest --version 2>/dev/null || true)
          case "$nextest_version" in
            'cargo-nextest 0.9.145 '*) ;;
            *) cargo install cargo-nextest --version 0.9.145 --locked --force ;;
          esac
          cargo mutants --version
          cargo nextest --version
      - name: Test the planner and exact outcome reconciliation
        run: |
          rustc --edition=2024 --test -D warnings .github/mutation_gate.rs -o /tmp/mutation-gate-tests
          /tmp/mutation-gate-tests
          rustc --edition=2024 -D warnings .github/mutation_gate.rs -o /tmp/mutation-gate
      - name: Plan bounded jobs without excluding any case
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mutation-plan
          # D-2315: the base choice, the diff, the walked-file check, the
          # self-test's edit and verdict and the matrix output are
          # `.github/gates_jobs.rs`; cargo-mutants and mutation_gate are still
          # started here, since gate 0 lets a tool start only git.
          gates="$RUNNER_TEMP/gates-jobs"
          rustc --edition=2024 --test -D warnings .github/gates_jobs.rs -o "$gates-tests"
          "$gates-tests"
          rustc --edition=2024 -D warnings .github/gates_jobs.rs -o "$gates"
          # ── D-0677: ONE PULL REQUEST, ONE COMMIT, AND IT EXPIRES ──────────
          #
          # PR #13 carries 589,022 inserted lines under crates/*/src against
          # `main`. Planned against that base it is 49,870 cases in 250 jobs,
          # and with about a tenth of those lines run by no test at all, every
          # mutant on them survives by construction: the matrix cannot report
          # success at any test quality reachable in bounded time. So for a
          # head that CONTAINS the integration commit below and a base that
          # does NOT, mutations are planned against that commit instead --
          # only what changed after it. The 49,870 cases were enumerated and
          # never executed; docs/06-limits.md records that as a gap, not as a
          # result.
          #
          # SELF-EXPIRING, BY ANCESTRY RATHER THAN BY A DATE. #13 lands as a
          # squash, so this commit is never an ancestor of `main` or of
          # anything cut from `main` afterwards, and every later pull request
          # is planned against its own base exactly as before. An unreachable
          # object makes `merge-base` fail, which reads as "not an ancestor".
          # The commit is `INTEGRATION` in the tool; with no base at all the
          # plan reads HEAD~1, and with no HEAD~1 the root commit's own diff.
          # ── D-1119: EVERY FILE CARGO-MUTANTS WALKS, UNDER THE NAME IT USES ──
          #
          # The pathspec was `crates/*/src/*.rs`, so a change to a file mounted
          # from outside `src/` by `#[path]` -- `crates/cli/build_provenance.rs`,
          # `crates/cli/commit_stamp.rs` -- never reached the plan. Widening it
          # was not enough: cargo-mutants names such a file by the path its
          # mount spells (`crates/cli/src/../commit_stamp.rs`), so `--in-diff`
          # matched none of git's `crates/cli/commit_stamp.rs` (GAP14-56).
          # `mutation_gate respell` re-heads each diff section under every
          # spelling cargo-mutants walks. Files it does not walk (tests,
          # benches, build scripts) stay in the diff and match nothing.
          "$gates" mutant-diff /tmp/mutation-plan/raw.diff
          cargo mutants --list-files --colors never > /tmp/mutation-plan/walked.txt
          "$gates" mutant-walked /tmp/mutation-plan/walked.txt
          /tmp/mutation-gate respell /tmp/mutation-plan/raw.diff /tmp/mutation-plan/walked.txt \
            > /tmp/mutation-plan/changed.diff

          # SELF-TEST: a change inside the build-time verifier must plan a
          # mutant. Before D-1119 this list was empty, and nothing said so.
          # `mutant-probe-mark` appends a comment to the line after
          # `fn delta_varint(` in crates/cli/build_provenance.rs and writes git's
          # diff of it; `mutant-probe-check` restores the file and refuses a
          # list that names no mutant in it.
          "$gates" mutant-probe-mark /tmp/mutation-plan/probe.diff
          /tmp/mutation-gate respell /tmp/mutation-plan/probe.diff /tmp/mutation-plan/walked.txt \
            > /tmp/mutation-plan/probe-spelled.diff
          cargo mutants --list --in-diff /tmp/mutation-plan/probe-spelled.diff --colors never -p cli \
            > /tmp/mutation-plan/probe.txt
          "$gates" mutant-probe-check /tmp/mutation-plan/probe.txt

          cargo mutants --list --in-diff /tmp/mutation-plan/changed.diff --colors never > /tmp/mutation-plan/all.txt
          /tmp/mutation-gate plan /tmp/mutation-plan/all.txt > "$RUNNER_TEMP/mutation-matrix.json"
          "$gates" output matrix "$RUNNER_TEMP/mutation-matrix.json"
          git rev-parse HEAD > /tmp/mutation-plan/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-plan
          path: /tmp/mutation-plan/
          retention-days: 35
          if-no-files-found: error

  mutants:
    name: Gate 18 — mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # D-0654: a known coverage failure already blocks this commit. Do not
    # start hundreds of expensive mutation jobs until that gate passes.
    # ci-ok still requires both gates to succeed; skipped is never success.
    needs: [build, coverage, mutant-plan]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # D-1453: 20, from 8. Half-size jobs double the matrix; at 8 at once a
      # 2,405-case plan would take ten waves.
      max-parallel: 20
      matrix: ${{ fromJSON(needs.mutant-plan.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch; toolchain input defaults to stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mutation-shards
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-mutants
            ~/.cargo/bin/cargo-nextest
          key: mutation-tools-${{ runner.os }}-26.2.0-nextest-0.9.145-v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-plan
          path: /tmp/mutation-plan
      - name: Install pinned mutation tools
        run: |
          set -euo pipefail
          if [ "$(cargo mutants --version 2>/dev/null || true)" != 'cargo-mutants 26.2.0' ]; then
            cargo install cargo-mutants --version 26.2.0 --locked --force
          fi
          nextest_version=$(cargo nextest --version 2>/dev/null || true)
          case "$nextest_version" in
            'cargo-nextest 0.9.145 '*) ;;
            *) cargo install cargo-nextest --version 0.9.145 --locked --force ;;
          esac
          cargo mutants --version
          cargo nextest --version
          rustc --edition=2024 -D warnings .github/mutation_gate.rs -o /tmp/mutation-gate
      - name: Test and reconcile every assigned mutation
        env:
          SHARD: ${{ matrix.shard }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/mutation-plan/commit.txt)"
          cargo mutants --list --in-diff /tmp/mutation-plan/changed.diff \
            --shard "$SHARD" --sharding round-robin --colors never > /tmp/mutation-plan/assigned.txt
          /tmp/mutation-gate partition /tmp/mutation-plan/all.txt /tmp/mutation-plan/assigned.txt "$SHARD"
          if [ "$EXPECTED" -eq 0 ]; then
            test ! -s /tmp/mutation-plan/assigned.txt
            echo "No changed source line generates a mutation. Nothing was tested or claimed."
            exit 0
          fi
          # D-0629/D-0654: same full diff, two isolated workers, bounded matrix.
          # The clean baseline exceeded 900s on CI before any mutant ran. Let
          # that required baseline calibrate the test timeout; the outer 240m
          # job deadline still applies. Timeout is never credited as a catch.
          #
          # --cap-lints true, D-0680. This job inherits RUSTFLAGS=-D warnings,
          # and replacing a function body leaves its parameters unused, so every
          # "replace fn -> T with ..." mutant on a function WITH parameters
          # failed to compile ("unused variable") and was counted unviable, which
          # the gate accepts. Measured on a one-function crate with cargo-mutants
          # 26.2.0: 5 caught without -D warnings, 2 caught + 3 unviable with it,
          # 5 caught again with --cap-lints true. Lints are enforced by gate 6b;
          # here they only hid mutants from the tests.
          set +e
          cargo mutants --in-diff /tmp/mutation-plan/changed.diff \
            --shard "$SHARD" --sharding round-robin \
            --jobs 2 --jobserver-tasks 4 \
            --minimum-test-timeout 900 --timeout-multiplier 2 \
            --cap-lints true \
            --cargo-arg=--locked --test-tool nextest --cargo-test-arg=--max-fail=1:immediate \
            --cargo-test-arg=--test-threads=1 --no-shuffle --colors never 2>&1 | tee mutation-run.log
          status=${PIPESTATUS[0]}
          set -e
          /tmp/mutation-gate verify /tmp/mutation-plan/assigned.txt mutants.out "$status"
      - name: Retain exact assignments and terminal outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ matrix.index }}
          path: |
            /tmp/mutation-plan/assigned.txt
            mutation-run.log
            mutants.out/caught.txt
            mutants.out/unviable.txt
            mutants.out/missed.txt
            mutants.out/timeout.txt
          retention-days: 35
          if-no-files-found: error

  complexity:
    name: Gate 8 — O(1) ratio
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40
    # D-1465: twice in a row (runs on 8f58d91 and 25bc8aa) the runner was
    # shut down six minutes in, while `cargo bench --workspace` compiled api
    # beside cli and lake: four fat-LTO, codegen-units=1 links at once
    # outgrow the runner's memory, and a killed runner reads as a lost
    # machine rather than an out-of-memory. Two at a time keeps the build
    # inside it; the timings the gate compares are taken after the build,
    # so they are unchanged. The longer build is why the timeout is 40.
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch; toolchain input defaults to stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Per-operation cost at 1x / 10x / 100x
        run: |
          set -euo pipefail
          # THIS GATE WAS A NO-OP FOR THE WHOLE LIFE OF THE REPOSITORY, and
          # both defects fixed in D-0032 and D-0033 merged through it green.
          # The guard was `[ -d benches ] || { echo skip; exit 0; }`, which
          # tests for a directory at the repository ROOT. Cargo benches live at
          # `crates/<name>/benches`, so the probe could never have found one
          # even after they were written, and a skip that reports success is
          # exactly the fallback CLAUDE.md section 4 bans.
          #
          # It now looks where benches live, and an empty set is a FAILURE
          # rather than a pass: CLAUDE.md section 3 rule 4 makes this gate the
          # enforcement mechanism for constant per-operation cost, and a gate
          # cannot enforce over nothing. See D-0034.
          gates="$RUNNER_TEMP/gates-jobs"
          rustc --edition=2024 --test -D warnings .github/gates_jobs.rs -o "$gates-tests"
          "$gates-tests"
          rustc --edition=2024 -D warnings .github/gates_jobs.rs -o "$gates"
          # `gates_jobs gate-8` counts the tracked benches, names the cause and
          # refuses when there are none (D-2315); the next line is the refusal
          # gate 14 proves. D-1601's `step-runs` (rightly) refuses a line inside
          # an `if` as one that may never run, so the proof needs a TOP-LEVEL
          # command that fails the step when no bench is tracked: git exits 1
          # on a pathspec that matches nothing. D-1460.
          "$gates" gate-8
          git ls-files --error-unmatch 'crates/*/benches/*.rs' > /dev/null
          # Each harness is `harness = false`: it prints every number it took
          # and exits non-zero on a breach. See docs/04-invariants.md C-01,
          # C-07 through C-10 for the ratios and the ceiling.
          #
          # SELF-TEST FIRST, D-1509. Nothing showed this gate FAILS when an
          # O(n) cost is planted, so a bench whose ratio check had rotted into
          # a pass would have stayed green. Plant one into the real benched
          # function: a full scan of `trading_symbol` at the top of
          # `decode_master_row`, ahead of its width gate, so C-09's 4 MiB row
          # pays 4 MiB. The core bench must exit non-zero AND name C-09 as the
          # breach (a compile error must not count as a catch); the file is
          # restored and the tree must be clean before the real run.
          probe=crates/core/src/vendor.rs
          # `gate-8-plant` inserts that line after the signature, or refuses when
          # the signature is gone; `gate-8-caught` decides the catch (D-2317).
          "$gates" gate-8-plant "$probe"
          # No `set +e`: gate 14 refuses any bench run after one, because the
          # real run below must stay blocking. The status is caught in an `if`.
          if cargo bench --locked -p core --bench ratio > "$RUNNER_TEMP/gate8-probe.log" 2>&1; then
            probe_status=0
          else
            probe_status=$?
          fi
          git checkout -- "$probe"
          git diff --quiet -- "$probe" || { echo "GATE 8 SELF-TEST did not restore $probe"; exit 1; }
          "$gates" gate-8-caught "$RUNNER_TEMP/gate8-probe.log" "$probe_status"
          cargo bench --workspace --locked

  web:
    name: Gate W — the browser tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly the lockfile
        run: npm ci --prefix web

      - name: Gate W1 — web/build matches web/src
        run: |
          set -euo pipefail
          # D-2315: the verdicts of W1, W3, W4, W5 and W6 are
          # `.github/gates_jobs.rs`, built here once for this job. The front
          # end's own toolchain (npm, node) still runs here, as section 2
          # allows; the tool reads what it wrote.
          gates="$RUNNER_TEMP/gates-jobs"
          rustc --edition=2024 --test -D warnings .github/gates_jobs.rs -o "$gates-tests"
          "$gates-tests"
          rustc --edition=2024 -D warnings .github/gates_jobs.rs -o "$gates"
          npm --prefix web run build
          # web/build is served from disk by the Rust binary, so the artifact
          # in this repository is what an operator actually runs. `w1` refuses
          # when `git diff --exit-code -- web/build` finds the committed bundle
          # is not what this source builds, and prints the fingerprint when it is.
          "$gates" w1

      - name: Gate W2 — the front-end tests
        run: node --test web/tests/*.test.js

      - name: Gate W3 — svelte-check does not regress
        run: |
          CEILING=0
          npm --prefix web run check 2>&1 | tee /tmp/check.log || true
          # BOTH OF SVELTE-CHECK'S SUMMARY FORMATS, because it does not always
          # pick the same one and this gate reported the difference as "it did
          # not run".
          #
          #   machine:  ... COMPLETED 325 FILES 61 ERRORS 1 WARNINGS ...
          #   human:    svelte-check found 61 errors and 1 warning in 11 files
          #
          # The old pattern matched `ERRORS` only. On this runner svelte-check
          # emitted the HUMAN line, so `FOUND` came back `missing` and the gate
          # failed with "svelte-check produced no ERRORS line — it did not run"
          # while the log directly above it read "found 64 errors". A gate that
          # cannot tell a formatting change from a broken tool blocks a branch
          # for a reason nobody can act on, so it now reads either form.
          # `-i` for the case and `ERRORS?` for the singular; `tail -1` still
          # takes the SUMMARY, which is the last such line in both formats.
          # The match (digits, one space, `error` in any case), the summary as
          # the LAST such match, the refusal when there is none, and the
          # ceiling are `gates_jobs w3` (D-2315). Raising CEILING above is the
          # escape hatch, and it is said why in docs/06-limits.md.
          "$RUNNER_TEMP/gates-jobs" w3 /tmp/check.log "$CEILING"

      - name: Gate W5 — no comment swallows a CSS rule
        run: |
          set -euo pipefail
          # THE FILE LIST BELOW WAS EMPTY FOR THE WHOLE LIFE OF THIS GATE.
          #
          # The quote-escape idiom the file list used -- quote, double-quote,
          # quote, double-quote, quote -- is how a single quote is written
          # INSIDE a single-quoted string. The `node -e` quote has already
          # CLOSED by the time the `$( ... )` is reached, so the shell was in
          # ordinary context and the idiom collapsed to twelve LITERAL
          # characters: a double quote, a single quote, the glob, a single
          # quote, a double quote. No file is named that. `find` matched
          # nothing, node was handed argc 0 against 13 real files, the `for`
          # loop ran zero times, and the gate printed its success line on every
          # run since it was written. Measured with a node argc probe, not
          # inferred.
          #
          # Plain single quotes are correct here and always were: this is the
          # shell, not a nested string.
          # The program itself is web/ci/css-comments.mjs (D-1100): JavaScript
          # written inline here was a second language in a tracked file outside
          # web/, and gate 0 now refuses an interpreter handed a program inline.
          # It refuses an empty file list itself.
          # D-2315: `gates_jobs w5-files` lists every `.svelte` and `.css` path
          # under web/src, sorted, exactly as `find -name ... | sort` did, and
          # refuses an empty list before the program does.
          "$RUNNER_TEMP/gates-jobs" w5-files > "$RUNNER_TEMP/w5-files.txt"
          xargs -d '\n' node web/ci/css-comments.mjs < "$RUNNER_TEMP/w5-files.txt"

      - name: Gate W6 — the masters script spends no vendor request on load
        run: |
          set -euo pipefail
          # THE OTHER HALF OF A PROOF THAT SPLIT, AND IT SPLIT FOR A GOOD REASON.
          #
          # `crates/api/src/mastersrun.rs` used to hold this file as 127 lines
          # inside a Rust string literal — a CLAUDE.md section 2 violation, now
          # caught by gate 1f. Two tests in that module proved the operator's
          # standing rule, that opening a page must not spend a vendor request,
          # by reading the handler bindings out of the rendered HTML.
          #
          # They cannot any more, and the fix is NOT to let them read
          # `web/masters.js`: gate 1e runs the whole workspace with the `web/`
          # tree DETACHED, precisely to prove no crate depends on the front end.
          # A Rust test that opened this file would go red in the one job whose
          # green is that guarantee.
          #
          # So the HTML half stayed in Rust — one script tag, external, no
          # inline handler — and this is the half that only makes sense here.
          # THE TEXT CHECKS SEE ONE SPELLING, SO THEY ARE NOT THE PROOF (D-1118).
          # They refuse `refresh();` at column zero and passed an indented call,
          # `verify()` with no semicolon, `setTimeout(refresh)`, a `load` or
          # `DOMContentLoaded` listener and an `onload` assignment, each of
          # which spends the request on load (LATE gates-and-ci #11). The proof
          # is `web/tests/masters-load.test.js`, which runs this script in
          # `node:vm` against a stub document, plays every load event, timer
          # and promise, and records every `fetch`: opening the page may ask
          # for `/masters/status.json` and nothing else. Gate W2 runs it; this
          # step refuses if it is gone, and keeps the text checks as the fast
          # first answer.
          #
          # `gates_jobs w6` (D-2315) refuses: web/masters.js missing; the test
          # above untracked; `refresh` or `verify` not bound by
          # `addEventListener('click', fn)`; a BARE `fn();` AT COLUMN ZERO, a
          # call on load (`function fn()` and `const fn = ` are declarations
          # and do not match, and an indented call is reached only through a
          # press); any of the cross-verification facts or the stale-parse
          # notice gone; and `status();` no longer at column zero -- the one
          # call on load that IS allowed, since `/masters/status.json` stats
          # four files and opens no socket.
          "$RUNNER_TEMP/gates-jobs" w6
      - name: Gate W4 — unused CSS does not grow
        run: |
          set -euo pipefail
          CEILING=0
          # D-1609 (hunt-ci-7): the build's own status fails the step (it was
          # piped into tee with no pipefail), and a log without vite's
          # "built in" line is refused rather than read as zero warnings.
          npm --prefix web run build > /tmp/build.log 2>&1
          # D-2315: `gates_jobs w4` refuses a log with no `built in <digit>`
          # (printing its last 20 lines), takes each `Unused CSS selector`
          # line's quoted selector (the whole line when none is quoted), counts
          # the distinct ones and holds them to CEILING.
          "$RUNNER_TEMP/gates-jobs" w4 /tmp/build.log "$CEILING"

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [language-purity, build, coverage, complexity, mutant-plan, mutants, web]
    if: always()
    steps:
      - name: Verify every gate went green
        # The results cross into the shell through env rather than being
        # interpolated into the script body — the same rule the auto-merge
        # workflow follows, applied here for consistency even though `needs`
        # results are not attacker-controlled.
        #
        # Note the SINGLE quotes inside the expression. A GitHub Actions
        # expression accepts only single-quoted strings; `join(x, " ")` is a
        # parse error that invalidates the ENTIRE workflow file, which is how
        # this repository's first CI run produced zero jobs and no log.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo "no gate reported a result at all — refusing to call that green"
            exit 1
          fi
          for x in ${RESULTS}; do
            [ "$x" = "success" ] || { echo "a gate did not pass: $x"; exit 1; }
          done
          echo "all gates green"
