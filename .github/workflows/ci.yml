          work=$(mktemp -d)
          corpus="$work/corpus"
          scope="$work/scope"
          : > "$corpus"; : > "$scope"

          # THE SUBTRACTION, one file at a time. `scope` keeps every line that
          # is not inside a `#[cfg(test)] mod NAME { ... }` block, comments and
          # all; `corpus` is `scope` with whole-line `//` dropped. Rules 1..5
          # read `corpus`; rule 5c reads `scope`, because an attribute list can
          # carry a `//` comment inside it and a bracket-counting walk over the
          # stripped text would then lose count.
          strip='
            function emit(line, no,   t) {
              print F ":" no ":" line > SCOPE
              t = line; sub(/^[ \t]+/, "", t)
              if (t !~ /^\/\//) print F ":" no ":" line
            }
            function flush(  i) { for (i = 1; i <= nb; i++) emit(bl[i], bn[i]); nb = 0 }
            function hold(line, no) { nb++; bl[nb] = line; bn[nb] = no }
            BEGIN { st = 0; depth = 0; nb = 0; drop = 0 }
            {
              if (st == 2) {
                drop++
                if ($0 ~ CLOSE) { st = 0; next }
                # INSIDE THE MODULE, EVERY LINE IS DEEPER THAN THE `mod`
                # KEYWORD OR IT IS BLANK. A line at the module indent or
                # shallower that is NOT the closing brace means the brace this
                # scanner is waiting for is not the one that closes the module,
                # and matching a later brace at the same indent would swallow
                # whatever lies between them -- silently, which is the whole
                # defect this boundary replaced. Refuse instead.
                #
                # Blank lines and whole-line comments are exempt, and that
                # costs nothing: neither can hide a construct, and the first
                # line of actual code past the module still trips the check.
                lead = $0; sub(/[^ \t].*$/, "", lead)
                t = $0; sub(/^[ \t]+/, "", t)
                if (t != "" && t !~ /^\/\// && length(lead) <= length(IND)) exit 3
                next
              }
              t = $0; sub(/^[ \t]+/, "", t)
              if (st == 0) {
                if (t ~ /^#\[cfg\(test\)\][ \t]*$/) { st = 1; depth = 0; nb = 0; hold($0, NR); next }
                emit($0, NR); next
              }
              if (depth > 0) { depth += gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if (t == "" || t ~ /^\/\//) { hold($0, NR); next }
              if (t ~ /^#\[/) { depth = gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if ($0 ~ /^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?mod[ \t]+[A-Za-z0-9_]+[ \t]*\{[ \t]*$/) {
                IND = $0; sub(/[^ \t].*$/, "", IND)
                CLOSE = "^" IND "\\}[ \t]*$"
                drop += nb + 1; nb = 0; st = 2; next
              }
              flush(); emit($0, NR); st = 0
            }
            # A module still open at EOF, or an attribute with no item under
            # it, is the same refusal for the same reason: this scanner will
            # not guess where test code ends.
            END { print drop > SUM; if (st != 0) exit 3 }
          '

          walked=0; kept=0; dropped=0; undelimited=0
          # A WHOLE-FILE TEST MODULE IS NOT ON ANY PATH.
          #
          # The stripper below removes `#[cfg(test)] mod NAME { .. }` blocks
          # written INSIDE a file. It cannot see the other shape: a module whose
          # entire file is test code, gated by `#[cfg(test)]` on its `mod` line
          # in the crate root. store/src/emits.rs, pull/src/emit_sites.rs and
          # api/src/emitted.rs are that shape -- each proves that every
          # `telemetry::emit` site in its crate reaches a file -- and they are
          # compiled out of every non-test build, so their `expect`s are no more
          # a panic on an O(1) path than the ones under `tests/` this gate has
          # always skipped.
          #
          # A crate-root test attribute or a file-wide #![cfg(test)] must
          # exclude the file from production. Names and comments cannot do so,
          # and neither can a file's stem: the list below is the compiler's.
          # THE FILE LIST IS THE COMPILER'S PRODUCTION CLOSURE (P1-08-04,
          # D-2660). It was a `/src/` glob with a "whole-file test module"
          # exempted by its file STEM, so a production `resume/manifest.rs`
          # sharing a stem with a crate-root `#[cfg(test)] mod manifest;` was
          # skipped, and `crates/cli/commit_stamp.rs`, mounted by `#[path]` from
          # outside `src/` and compiled into every `cli` build, was never read.
          # `source_scan prod-files` follows every `mod`, `#[path]` and
          # `include!` from each crate's lib/main/bin root, skips what sits
          # under `#[cfg(test)]` or `#[cfg(all(test, ..))]`, and refuses what it
          # cannot resolve. A file that opens with `#![cfg(test)]` is dropped.
          scan="${SOURCE_SCAN:?gate 0 builds the source scanner first}"
          git ls-files -z > "$work/tracked.z"
          if ! "$scan" prod-files "$work/tracked.z" > "$work/prod-files"; then
            echo "REFUSED  the production closure could not be resolved:"
            grep '^UNRESOLVED ' "$work/prod-files" | sed 's/^/  /'
            exit 1
          fi
          [ -s "$work/prod-files" ] || { echo "READ NO PRODUCTION FILE."; exit 1; }


          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            # `wc -l` COUNTS NEWLINES, NOT LINES, so a file whose last line is
            # unterminated is reported one short — and a one-line file reports
            # ZERO, which set `end=0` and skipped the file entirely. Caught by
            # feeding this gate a one-line violation with no trailing newline:
            # it exited 0. `cargo fmt` would reject such a file, but gate 6a
            # lives in a later job that this one gates, so relying on it would
            # make gate 11 blind exactly while it runs first.
            tot=$(awk 'END{print NR}' "$f")
            # Pre-created, because a file that is nothing but a test module
            # produces neither, and `set -e` would kill the gate on the `cat`.
            : > "$work/one.scope"; : > "$work/one.sum"
            # NOTHING IS APPENDED UNTIL THE FILE PARSES. A partial corpus from
            # a file the scanner could not delimit would be a scan that quietly
            # covered less than it reported — the exact defect this boundary
            # replaced.
            if awk -v F="$f" -v SCOPE="$work/one.scope" -v SUM="$work/one.sum" \
                   "$strip" "$f" > "$work/one.corpus"; then
              cat "$work/one.corpus" >> "$corpus"
              cat "$work/one.scope" >> "$scope"
              d=$(cat "$work/one.sum")
              dropped=$((dropped + d)); kept=$((kept + tot - d))
            else
              printf 'UNDELIMITED TEST MODULE  %s\n' "$f"
              undelimited=$((undelimited + 1))
            fi
          done < "$work/prod-files"

          # A gate must say what it walked. A glob that matches nothing is the
          # failure mode gate 8 shipped with for the whole life of the
          # repository, and it reported success the entire time.
          echo "walked ${walked} production source file(s) of the crates"
          echo "  ${kept} line(s) in scope, ${dropped} inside a #[cfg(test)] module"
          echo "  $(awk 'END{print NR}' "$corpus") line(s) after comment stripping"
          if [ "$walked" -eq 0 ]; then
            echo "GATE 11 WALKED NOTHING. A gate that scans no file is not a gate."
            exit 1
          fi
          if [ "$undelimited" -ne 0 ]; then
            echo
            echo 'A #[cfg(test)] module above has no closing brace at the same'
            echo 'indent as its own `mod` keyword, so this scanner cannot tell'
            echo 'where it ends and will not guess. `cargo fmt` does not emit'
            echo 'that shape; if it is deliberate, the boundary above is what'
            echo 'has to change, not this message.'
            exit 1
          fi

          bad=0

          check() {
            rule="$1"; pattern="$2"; allow="$3"; law="$4"; src="${5:-$corpus}"
            hits=$( { grep -E "$pattern" "$src" || true; } )
            n=$( { printf '%s' "$hits" | grep -c . || true; } | tr -d ' ')
            echo
            echo "rule ${rule}: ${n} occurrence(s) — ${law}"
            for f in $( { printf '%s\n' "$hits" | grep . | cut -d: -f1 | sort -u; } || true ); do
              c=$( { printf '%s\n' "$hits" | grep -c "^${f}:" || true; } | tr -d ' ')
              a=$( { printf '%s\n' "$allow" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
              [ -n "$a" ] || a=0
              if [ "$c" -gt "$a" ]; then
                printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
                { printf '%s\n' "$hits" | grep "^${f}:" \
                    | awk -F: '{printf "           %s:%s\n", $1, $2}' | head -8; } || true
                bad=1
              else
                printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
              fi
            done
            # An entry naming a file that no longer exists makes this gate read
            # stronger than it is, so it is a failure and not a note. An entry
            # whose file no longer matches is only loose, and says so.
            for p in $( { printf '%s\n' "$allow" | awk 'NF{print $1}'; } || true ); do
              if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
                bad=1
              elif ! grep -q "^${p}:" <<< "$hits"; then
                printf '  ::warning title=Gate 11 allowlist is loose::'
                printf '%s no longer matches rule %s — tighten it\n' "$p" "$rule"
              fi
            done
            :
          }

          # ---- rules 6 and 7. THE LINEAR MEMBERSHIP SCAN. ------------------
          # The reasons for every entry in the list below, and its history, are in
          # docs/06-limits.md under "Gate 11 allowlist reasons", rules 6 and 7,
          # moved there verbatim because GitHub will not start a workflow file this
          # large (D-1451). A new or changed entry still gets its reason THERE, in the
          # same change, and a count here without one is the drift D-1451 forbids.
          allow_scan='
          crates/api/src/audit_json.rs 1
          crates/api/src/autopilot.rs 2
          crates/api/src/backtest.rs 1
          crates/api/src/booleanjson.rs 2
          crates/api/src/expressionsearchjson.rs 1
          crates/api/src/indexstoprankingjson.rs 1
          crates/api/src/pullrun.rs 1
          crates/api/src/server.rs 9
          crates/api/src/store_wire.rs 1
          crates/cli/src/boolean_campaign_codec.rs 2
          crates/cli/src/boolean_qualification_reader.rs 1
          crates/cli/src/boolean_rung_scope.rs 1
          crates/cli/src/candidate_universe.rs 1
          crates/cli/src/global_replay_v4.rs 1
          crates/cli/src/index_stop_qualification_numeric.rs 1
          crates/cli/src/index_stop_search.rs 1
          crates/cli/src/index_stop_store.rs 1
          crates/cli/src/index_stop_vix_codec.rs 1
          crates/cli/src/lib.rs 7
          crates/cli/src/population_admission_v2.rs 1
          crates/cli/src/population_finalization_v2.rs 1
          crates/cli/src/population_v6.rs 1
          crates/cli/src/pre_admission_data.rs 1
          crates/cli/src/results.rs 1
          crates/cli/src/stored.rs 1
          crates/cli/src/strict_range_knobs.rs 1
          crates/pull/src/cash_auction.rs 2
          crates/pull/src/config.rs 3
          crates/pull/src/fno.rs 1
          crates/pull/src/manifest.rs 1
          crates/pull/src/resolve.rs 1
          crates/pull/src/rolling.rs 3
          crates/pull/src/ssm.rs 1
          crates/pull/src/vendor.rs 8
          crates/runner/src/exit_grid_policy.rs 1
          crates/runner/src/grid.rs 2
          crates/runner/src/research_family.rs 1
          crates/runner/src/signal_candle_stop.rs 2
          crates/runner/src/validate.rs 5
          crates/telemetry/src/record.rs 1
          '

          # ---- rule 7: the ambiguous membership test -----------------------
          # The reasons for every entry in the list below, and its history, are in
          # docs/06-limits.md under "Gate 11 allowlist reasons", rule 7: the ambiguous membership test,
          # moved there verbatim because GitHub will not start a workflow file this
          # large (D-1451). A new or changed entry still gets its reason THERE, in the
          # same change, and a count here without one is the drift D-1451 forbids.
          allow_member='
          crates/api/src/assets.rs 1
          crates/api/src/calendar_of.rs 2
          crates/api/src/constituents.rs 2
          crates/api/src/coverage.rs 1
          crates/api/src/credential_law.rs 1
          crates/api/src/merge.rs 2
          crates/api/src/server.rs 2
          crates/api/src/sweeprun.rs 5
          crates/cli/src/batch.rs 1
          crates/cli/src/candidate_universe.rs 1
          crates/cli/src/execution_capability.rs 1
          crates/cli/src/global_replay_v2.rs 1
          crates/cli/src/global_replay_v3.rs 1
          crates/cli/src/institutional_evidence.rs 2
          crates/cli/src/institutional_statistics.rs 1
          crates/cli/src/lib.rs 5
          crates/cli/src/population.rs 3
          crates/cli/src/population_admission_v2.rs 2
          crates/cli/src/population_admission_v3.rs 2
          crates/cli/src/population_finalization_v2.rs 2
          crates/cli/src/population_observations_v1.rs 1
          crates/cli/src/population_statistics_v2.rs 7
          crates/cli/src/population_statistics_v3.rs 3
          crates/cli/src/pre_admission_data.rs 2
          crates/cli/src/selection.rs 2
          crates/cli/src/selection_v3.rs 1
          crates/cli/src/selection_v4.rs 2
          crates/cli/src/selection_v5.rs 3
          crates/cli/src/stored.rs 5
          crates/cli/src/stored_data_completeness.rs 1
          crates/core/src/vendor.rs 2
          crates/costs/src/day.rs 2
          crates/engine/src/lib.rs 1
          crates/greeks/src/solver.rs 1
          crates/pull/src/calendar.rs 1
          crates/pull/src/fnowork.rs 1
          crates/pull/src/pricing.rs 2
          crates/runner/src/closed.rs 1
          crates/runner/src/lib.rs 1
          crates/runner/src/outcome.rs 1
          crates/runner/src/rank.rs 1
          crates/runner/src/split.rs 1
