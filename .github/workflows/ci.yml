# Explanatory YAML comments: docs/34-ci-workflow-notes.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  language-purity:
    name: Gate 1+2 — one language
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gate 1 — extension allowlist
        run: |
          set -euo pipefail
          # THE ONLY EXTENSIONS THIS REPOSITORY MAY CONTAIN OUTSIDE web/, and this
          # line is now CLAUDE.md section 2 quoted rather than section 2 widened:
          # "Allowed tracked extensions: `.rs` `.toml` `.md` `.lock` `.html`
          # `.css` `.yml` (the last only under `.github/`)."
          #
          # IT USED TO READ `rs|toml|md|lock|html|css|yml|json` FOR EVERY PATH,
          # which is wider than the law in two separate ways, and the tree was
          # only clean because a SECOND gate cleaned up after this one: gate 1b
          # confines `.json` and `.yml` to `.github/`, `.claude/` and `web/`. Two
          # gates disagreeing about the same rule is not defence in depth -- gate
          # 1's list is the sentence a reader takes as the statement of section 2,
          # and a wider sentence is a wrong one. So the split is by PATH here too,
          # exactly as the `web/` exception already is.
          allowed='rs|toml|md|lock|html|css'
          # `.yml` ONLY UNDER `.github/`. The parenthesis in section 2 is part of
          # the rule, and nothing enforced it here. Both tracked `.yml` files --
          # this workflow and `auto-merge.yml` -- already live there, so this
          # narrowing costs nothing today and is the point at which a `.yml`
          # dropped at the root becomes a red build rather than a gate-1b one.
          github_allowed="${allowed}|yml"
          # `.json` is in section 2's list ONLY under `.claude/`, and exactly one
          # tracked file carries it: `.claude/launch.json`, which holds the two
          # run configurations docs/07-plan.md section 0 names. It is read by the
          # PREVIEW TOOLS. It is NOT read by IntelliJ -- an earlier version of
          # this comment said "IntelliJ and the preview tools", and IntelliJ takes
          # its run entries from .idea/ or .run/*.xml, neither of which is
          # tracked. An operator opening the clone in IntelliJ still gets that
          # IDE's own Cargo auto-detection of the `api` binary, which is the
          # thing section 0 says is the IDE inferring rather than the repository
          # promising. Gate 1b already sanctions `.claude/` by path and states the
          # reason -- operator tooling, not source, not shipped -- so this line
          # makes gate 1 agree with gate 1b instead of being wider than gate 1b
          # AND wider than the law.
          #
          # THE DIVERGENCE THIS COMMENT USED TO NAME IS NOW CLOSED, and closed the
          # way this comment demanded rather than the way a gate could have taken
          # on its own. It read: "Resolving that is a CLAUDE.md edit and a
          # `docs/05-decisions.md` entry, which a CI gate must not make on its own
          # -- a gate that widens the law to match the tree is the shape this whole
          # file exists to refuse." Section 2 now carries the `.claude/` clause and
          # D-0210 is the entry. The gate did not move; the law did.
          claude_allowed="${allowed}|json"
          # Under web/ ONLY, the browser languages are allowed -- D-0052. This
          # is narrowed by PATH, not relaxed by extension: putting `ts` on the
          # line above would permit a build script anywhere in the tree, which
          # is the thing CLAUDE.md section 2 exists to forbid.
          web_allowed='.*'
          # Files with no extension that are still legitimate.
          allowed_names='LICENSE|CODEOWNERS|\.gitignore|\.gitattributes'
          bad=0
          while IFS= read -r f; do
            base="${f##*/}"
            if printf '%s\n' "$base" | grep -Eq "^(${allowed_names})$"; then continue; fi
            case "$base" in
              *.*) ext="${base##*.}" ;;
              *)   ext="" ;;
            esac
            # WHICH LIST APPLIES IS DECIDED BY THE PATH, not by the file.
            # Under web/ the browser languages are legal; everywhere else the
            # hard rule is untouched, so a .ts under crates/ fails here exactly
            # as it always did.
            case "$f" in
              web/*)     list="$web_allowed"    ; where='web/' ;;
              .github/*) list="$github_allowed" ; where='.github/' ;;
              .claude/*) list="$claude_allowed" ; where='.claude/' ;;
              *)         list="$allowed"        ; where='outside web/' ;;
            esac
            if ! printf '%s\n' "$ext" | grep -Eq "^(${list})$"; then
              printf 'FORBIDDEN FILE  %s  (extension %s, %s)\n' \
                "$f" "${ext:-<none>}" "$where"
              bad=1
            fi
          done < <(git ls-files)
          if [ "$bad" -ne 0 ]; then
            echo
            echo "This repository is Rust only outside web/. See CLAUDE.md section 2"
            echo "and docs/05-decisions.md D-0052."
            echo "Outside web/:  ${allowed//|/ }"
            echo "Under .github/: ${github_allowed//|/ }"
            echo "Under .claude/: ${claude_allowed//|/ }"
            echo "Under  web/:    ${web_allowed//|/ }"
            exit 1
          fi
          echo "OK — every tracked file is in the allowlist for where it lives."

      - name: Gate 1e — the engine builds with no front-end toolchain
        run: |
          set -euo pipefail
          # WHAT §2 ACTUALLY REQUIRES, quoted, because the previous version of this
          # gate tested something else and that is why it enforced nothing:
          #
          #   "no crate may depend on the front end's toolchain to build, test or
          #    run. `cargo build`, `cargo test` and `cargo clippy` must pass on a
          #    machine with no Node, no package manager and no `web/` build ever
          #    run."
          #
          # The operative words are "no `web/` BUILD ever run". `web/build/` is
          # TRACKED, so a fresh clone already has the bundle and `crates/api` may
          # embed it without any bundler existing. §2 does not require the build to
          # survive `web/` being absent -- it requires it to survive the TOOLCHAIN
          # being absent.
          #
          # The old gate moved the whole `web/` tree aside, which breaks `api`'s
          # embed by construction. Its own comment called that failure "expected",
          # and so it captured the output with `set +e` and NEVER READ THE EXIT
          # STATUS -- it only grepped for seven toolchain words. An audit proved the
          # consequence with a stub cargo exiting 101: the gate exited 0. So §2's
          # central build promise was enforced by nothing at all.
          #
          # This version shadows the toolchain instead. Every binary a crate could
          # reach for is replaced by a stub that logs and fails, then the workspace
          # is built with that stub directory first on PATH. Two things must hold,
          # and both are now checked:
          #
          #   1. the build SUCCEEDS -- the exit status is read
          #   2. no stub was ever invoked
          #
          # A crate that shells out to a bundler trips clause 2 AND, because the
          # stub exits 127, clause 1 as well.
          stub="$(mktemp -d)"
          # Each stub APPENDS TO A FILE as well as writing to stderr, and the file is
          # what the check reads. Cargo suppresses a build script's stderr unless the
          # script itself fails, so a `build.rs` doing
          # `let _ = Command::new("vite").status();` invoked the stub and left no
          # trace in the captured output at all -- the first version of this clause
          # missed exactly that, verified by injecting it. A file on disk is outside
          # cargo's output capture.
          invoked="$stub/.invoked"
          for tool in node npm npx yarn pnpm bun deno vite webpack esbuild rollup tsc; do
            printf '#!/bin/sh\nprintf "%%s\\n" "%s" >> "%s"\necho "GATE-1E-INVOKED: %s" >&2\nexit 127\n' \
              "$tool" "$invoked" "$tool" > "$stub/$tool"
            chmod +x "$stub/$tool"
          done
          echo "shadowed: $(ls "$stub" | tr '\n' ' ')"

          set +e
          out="$(PATH="$stub:$PATH" cargo build --workspace --locked --all-targets 2>&1)"
          status=$?
          set -e

          if [ -s "$invoked" ]; then
            echo "FORBIDDEN: a crate invoked a front-end toolchain during the build:"
            sort -u "$invoked" | sed 's/^/  /'
            exit 1
          fi
          # The check the old gate discarded. A failing build with no toolchain on
          # PATH is exactly what §2 forbids, whatever the reason.
          if [ "$status" -ne 0 ]; then
            echo "GATE 1E FAILED: cargo build exited $status with the front-end"
            echo "toolchain shadowed. §2 requires it to pass on a machine with no"
            echo "Node and no package manager. The tail of the build:"
            printf '%s\n' "$out" | tail -40
            exit 1
          fi
          # And the words, kept as a second signal: a crate could reach a toolchain
          # by an absolute path the stub directory does not shadow.
          if printf '%s' "$out" | grep -qiE 'node_modules|yarn\.lock|pnpm-lock|package\.json'; then
            echo "FORBIDDEN: the build read front-end package metadata."
            printf '%s\n' "$out" | grep -iE 'node_modules|yarn\.lock|pnpm-lock|package\.json'
            exit 1
          fi

          # §2's SENTENCE NAMES THREE COMMANDS AND THIS STEP SHADOWED ONE. The
          # quote at the top of this gate is "`cargo build`, `cargo test` and
          # `cargo clippy` must pass on a machine with no Node" -- and everything
          # above it tested `cargo build`. That is not a pedantic gap. `cargo
          # build --all-targets` COMPILES the test binaries and never runs them,
          # so a `#[test]` that does `Command::new("npm")` at RUNTIME was
          # invisible to every clause above: the stub is on PATH, but nothing
          # ever reached the line that would have invoked it.
          #
          # THE COST IS THE TEST RUN, NOT A REBUILD, and that is worth saying
          # because this job is the cheap one everything else waits on. The build
          # above already compiled every test target into the same target
          # directory, so this invocation links nothing new and spends its time
          # executing. It does duplicate the `Tests` step in the `build` job --
          # deliberately, because that run has no stub on PATH and therefore
          # proves nothing about §2.
          #
          # `cargo clippy` IS STILL NOT SHADOWED, and the reason is that it would
          # buy nothing rather than that it was forgotten: clippy compiles and
          # does not execute, so every point at which it could reach a toolchain
          # is a point `cargo build --all-targets` has already walked with the
          # same stub directory in front of PATH.
          set +e
          tout="$(PATH="$stub:$PATH" cargo test --workspace --locked 2>&1)"
          tstatus=$?
          set -e

          # `$invoked` accumulates across both runs and the build clause already
          # exited on a non-empty file, so anything in it now was written while
          # the tests ran.
          if [ -s "$invoked" ]; then
            echo "FORBIDDEN: a crate invoked a front-end toolchain while its tests ran:"
            sort -u "$invoked" | sed 's/^/  /'
            echo "The build was clean and the test run was not, which means the"
            echo "call is in test code rather than in a build script."
            exit 1
          fi
          if [ "$tstatus" -ne 0 ]; then
            echo "GATE 1E FAILED: cargo test exited $tstatus with the front-end"
            echo "toolchain shadowed. §2 requires it to pass on a machine with no"
            echo "Node and no package manager. The tail of the run:"
            printf '%s\n' "$tout" | tail -40
            exit 1
          fi
          if printf '%s' "$tout" | grep -qiE 'node_modules|yarn\.lock|pnpm-lock|package\.json'; then
            echo "FORBIDDEN: the test run read front-end package metadata."
            printf '%s\n' "$tout" | grep -iE 'node_modules|yarn\.lock|pnpm-lock|package\.json'
            exit 1
          fi
          echo "OK — the workspace builds AND tests with node, npm, yarn, pnpm and"
          echo "     five bundlers shadowed, and no stub was ever invoked."
      - name: Gate 1b — .json and .yml are confined
        run: |
          set -euo pipefail
          # JSON and YAML are config, not source, and only belong in two places.
          #
          # THE SECOND PLACE IS `web/`, NOT `crates/web/`.
          #
          # D-0052 moved the front end out of the crate graph to `web/`, and
          # D-0053 made that directory unrestricted -- any language, any
          # toolchain, any extension. Gate 1a was updated for the move; this
          # gate was not, and it kept naming a path that no longer exists.
          #
          # The result was a gate that failed on `web/package.json` -- a file a
          # SvelteKit app cannot exist without, and one D-0053 explicitly
          # permits. A stale allowlist refusing a legal file is the same class
          # of failure as a permissive one accepting an illegal file: the gate
          # stopped describing the rule it was written to enforce.
          #
          # `.claude/` is the run configuration IntelliJ and the preview tools
          # read. It is operator tooling, not source, and it is not shipped.
          bad=$(git ls-files '*.json' '*.yml' \
                | grep -Ev '^(\.github/|\.claude/|web/)' || true)
          if [ -n "$bad" ]; then
            printf 'CONFIG OUTSIDE ITS HOME:\n%s\n' "$bad"; exit 1
          fi
          echo "OK."

      - name: Gate 1f — no browser code inside a Rust string literal
        run: |
          set -euo pipefail
          # GATES 1, 13 AND 15 ARE ALL STRUCTURALLY BLIND TO THIS, and a real
          # violation lived under `crates/` because of it: 127 lines of
          # JavaScript inside `const SCRIPT: &str = r#"..."#` in
          # `crates/api/src/mastersrun.rs`, emitted as `<script>{SCRIPT}</script>`
          # on the live `/masters` route. An extension walk sees a `.rs` file, a
          # manifest walk sees no dependency, and a one-word walk sees no
          # forbidden word. Only a gate that reads the CONTENT catches it.
          #
          # CLAUDE.md section 2 forbids "any generated source in another
          # language, checked in", and the `web/` exception is a PATH, not a
          # licence to write browser code wherever it is convenient.
          #
          # `crate::calendar` had already NAMED this attack -- "a `<script>`
          # block living inside a Rust string literal is another language
          # smuggled past the gate" -- and pointed at
          # `render::every_page_carries_the_one_script_this_repository_chose_and_no_other`
          # as the guard. That test iterates `render::every_page()`, and the
          # offending page is routed from its own module, so it was never in the
          # sample. D-0060's lesson, recurring one route later: an invariant is
          # only as true as its sample. A GATE has no sample to go stale.
          #
          # LIMIT, STATED RATHER THAN GLOSSED: each file is read only as far as
          # its first `#[cfg(test)]`, because tests legitimately name `<script`
          # to assert its ABSENCE and there is no sound way to find a test
          # module's end by counting braces -- braces live inside string
          # literals, which is the very thing this gate exists to read. A
          # production item placed AFTER a test module is therefore not scanned.
          # Nothing in the tree does that today; if that changes, this gate is
          # narrower than it reads.
          bad=0
          for f in $(git ls-files 'crates/*.rs' 'crates/**/*.rs'); do
            body=$(awk '/^#\[cfg\(test\)\]/{exit} {print NR": "$0}' "$f")
            # A `<script` is allowed ONLY when it carries `src=` -- the external
            # shape `/typeahead.js` and `/masters.js` both use. Comment lines are
            # prose about the rule, not the rule being broken.
            hits=$(printf '%s\n' "$body" \
                   | grep -vE '^[0-9]+:[[:space:]]*//' \
                   | grep -E '<script|document\.(getElementById|querySelector|createElement)|await fetch\(|addEventListener|\.innerHTML' \
                   | grep -v 'src=' || true)
            if [ -n "$hits" ]; then
              printf 'BROWSER CODE IN A RUST FILE: %s\n%s\n' "$f" "$hits"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo ""
            echo "Browser code belongs under web/, which CLAUDE.md section 2"
            echo "makes unrestricted. Serve it the way /typeahead.js and"
            echo "/masters.js are served: a file on disk, read at REQUEST time by"
            echo "assets::Assets, referenced as <script src=\"...\" defer>. Never"
            echo "include_str! and never inline, so no crate depends on the front"
            echo "end to BUILD -- which is the other half of the same section."
            exit 1
          fi
          echo "OK — no <script> body, no browser API and no inline handler"
          echo "     appears in any .rs production region under crates/."
      - name: Gate 1c — no literal credential path
        run: |
          set -euo pipefail
          # This repository is public. A Parameter Store path names an account,
          # an environment and a vendor relationship; once pushed it lives in
          # every fork's history forever. Documents carry only the generic
          # shape /<org>/<env>/<vendor>/<field> — which does not match this
          # pattern, because <env> is not a real environment name.
          # See docs/05-decisions.md D-0013 and docs/04-invariants.md X-08.
          #
          # WHAT THIS GATE DOES NOT SEE, stated because X-08 used to claim more
          # than it proves and crates/pull's whole safety argument leans on it.
          # It matches a SLASH-JOINED path whose environment segment is one of
          # the ten words below. It cannot see a bare `const ORG: &str = "..."`,
          # and it cannot see a joined path whose env segment is outside that
          # alphabet. Gate 1d below is the check for the crate where that gap
          # matters; docs/06-limits.md §18 records what neither of them can do.
          #
          # No untrusted input reaches this step: the inputs are `git ls-files`
          # and a static pattern. Nothing from the event payload is expanded.
          envs='prod|production|dev|development|stage|staging|uat|qa|sandbox|live'
          hits=$(git ls-files -z \
                 | xargs -0 -r grep -nE "/[A-Za-z0-9][A-Za-z0-9_.-]*/(${envs})/" \
                 || true)
          if [ -n "$hits" ]; then
            printf 'LITERAL CREDENTIAL PATH IN A TRACKED FILE:\n%s\n' "$hits"
            echo
            echo "Use the shape /<org>/<env>/<vendor>/<field>. The real"
            echo "segments are resolved at runtime. See D-0013."
            exit 1
          fi
          # The runtime configuration itself is never tracked.
          tracked=$(git ls-files | grep -E '(^|/)credentials\.toml$' || true)
          if [ -n "$tracked" ]; then
            printf 'CREDENTIAL CONFIG IS TRACKED:\n%s\n' "$tracked"; exit 1
          fi
          echo "OK — no literal credential path, no tracked credential config."

      - name: Gate 1d — every segment-shaped literal in crates/pull is declared
        run: |
          set -euo pipefail
          seg_shape='org env region vendor fields ap-south-1'

          # ---- group 2: vendor wire names. THE ONES THIS GATE EXISTS FOR.
          # Each is a data vendor's own public product name, written down here
          # as the name its bars are filed under — `Descriptor::wire` in
          # crates/pull/src/vendor.rs. `groww` and `dhan` carry the reasoning
          # above. `truedata` and `gdfl` are the same case and were checked the
          # same way before being added: both are already tracked and public in
          # docs/08-vendor-samples.md and docs/05-decisions.md, so removing
          # them from crates/pull would leak nothing back. Whether either is
          # ALSO an operator's real `<vendor>` segment is operator-side and
          # unknowable from inside this repository — docs/06-limits.md §18.
          # Note for the reader: CLAUDE.md §8 says crates/pull "holds no org,
          # env, or vendor literal". Four vendor literals are on this line. The
          # sentence and the tree disagree and the tree is not being hidden.
          # charts, v1 and v2 joined as URL PATH COMPONENTS of a vendor's candle
          # endpoint: PathSegment::Literal("charts") at vendor.rs:3640 and the
          # two API version segments beside it at 3639 and 3837. They name a
          # route on a broker's public API — not an account, not an environment,
          # not a field — and gate 1c passes on the same tree. Read before
          # adding: the question this list answers is whether the word is a
          # VENDOR'S, and these three are its URL and nothing else.
          # `instruments` joins for the same reason `charts` did: it is a
          # `PathSegment::Literal` in a vendor's URL (vendor.rs:4330), a route on a
          # public API rather than anything about an account.
          vendor_wire='groww dhan truedata gdfl charts v1 v2 instruments'

          # ---- group 2b: the CLAIM STANDINGS, which are wire words about WHO
          # made a claim and are not vendor, org, env or field names at all.
          #
          # `pull::vendor::ClaimStanding::word` emits `vendor_doc` and
          # `operator` on `/feeds.json` so a page can say which of two
          # disagreeing history floors binds without matching prose against the
          # string "the operator" — D-0131. `vendor_doc` trips this gate for
          # the same reason `groww` does: it is lower-case, underscored and
          # segment-shaped. It names a KIND OF SOURCE, never a path segment,
          # and no Parameter Store path this repository reads has a `vendor_doc`
          # or an `operator` component.
          #
          # Declared rather than excluded by pattern: an allowlist that grows by
          # rule stops being an allowlist, which is the failure mode group 1's
          # own comment names.
          claim_standing='vendor_doc operator'

          # ---- group 3: invented configuration fixtures. Nonsense by
          #   1 2 3 9 -- FOUR BARE DIGITS, and each was read before it was added.
          #   "1", "2" and "9" are invented vendor_id values in resolve.rs and
          #   universe.rs test rows beside invented ISINs (INE000A01001). "3" is
          #   the VALUE of the X-Kite-Version header in vendor.rs -- a public API
          #   version number, not a credential. Group 10's note explains why an
          #   all-digit literal is scanned rather than waved through: a twelve-
          #   digit account number is a perfectly ordinary <org> segment. These
          #   four are one digit each and name no account.
          # construction — no operator's path reads `orgone/testenv/vendorone`.
          # 5633 and 999 sit beside 1 2 3 9: invented instrument_id and vendor_id
          # values in http.rs and universe.rs fixtures, next to invented ISINs.
          config_fixture='
          orgone testenv vendorone vendortwo fieldone fieldtwo fieldthree
          field-one_2 a-value
          1 2 3 9 5633 999
          '

          # ---- group 4: deliberately secret-SHAPED fixtures, which exist to
          # prove the secret backstop rejects them. Keyboard walks and the
          # oldest joke password in the trade; none is a credential.
          secret_fixture='
          k7f2p9q1w8e3-5t6y0u4i2o9 k7f2p9q1w8e3r5t6y0u4i2o
          k7f2p9q1w8e3r5t6y0u4i2o9 kfpqwerstyuioasdfghjklzx
          hunter2 hunter2-and-then-some stale fresh 9876
          shhh the-token default-secret other-token
          '

          # ---- group 5: test scaffolding — expect() messages, assert labels,
          # fixture names and words quoted inside prose. The gate scans comments
          # on purpose, so a word quoted in a doc comment lands here too.
          # `brutex-no-such-dir-ever` is a path chosen to NOT exist.
          #
          # The last two lines are the socket and decoder tests in
          # crates/pull/src/http.rs, and every one of them is a word this
          # repository chose rather than one a vendor did:
          #   x            — a JSON string standing where a number belongs
          #   nz snapshots — fold.rs refusal text asserted back
          #   decodes unchanged records — expect() messages
          #   cached       — the SECOND object in the two-object splice fixture
          #                  (D-0049). Deliberately not `live`, which group 7
          #                  already carries for a different reason.
          #   stolen       — the path a test redirect points at, named to read
          #                  as what following it would have meant (D-0050)
          #   redirect window_async — substrings a refusal must contain
          # before broker censused declares indistinguishable mixed nested options
          # too-deep u unused -- scratch directories and assertion substrings,
          # every one inside a test. folder.rs builds directories with those
          # names; nse.rs and resolve.rs assert that refusal messages CONTAIN
          # before, declares and indistinguishable; http.rs passes u and unused as
          # throwaway URL arguments it never reads.
          scaffold='
          a v one two no ok big good invalid genesis manifest write read-only deny
          anything mkdir notutf8 atthebound brutex-pull june july nifty
          core store pull ratio
          real next small bounded three summed everything february
          non-zero non-decreasing held centuries negative per-day per-second
          brutex-no-such-dir-ever
          x nz snapshots decodes unchanged records
          cached stolen redirect window_async
          b h 2026 half nope other reads signs forwards readable
          bars empty idempotent lands paise shared lock-held
          brutex-ssm-no-such-file-ever
          before broker censused declares indistinguishable mixed nested options
          too-deep u unused
          ab archive-extra-second broker-clean broker-conflict broker-duplicate
          broker-extra-second broker-shifted cash-cas cash-ordinary
          cash-unknown-a cash-unknown-b cash-unmeasured-calendar ceiling client
          coarse-unverified conflicting correction daily-midnight daily-open date
          elsewhere five-minute flag fold-absent-bucket fold-absent-tail gap-receipt
          gapfill headers historical-candidate-hole historical-incomplete
          historical-partial historical-tail historical-unverified-schedule
          incomplete local-ist loopback millisecond must-not-be-created not-a-date
          not-a-price okay receipt record request request-cash-eligibility
          request-derivative-exempt request-empty request-exception request-holiday
          request-intervals request-span request-unmeasured request-unordered
          response resume runtime runtime-truncated runtime-unverified shared-archive
          short test trailing true unavailable unreadable-rows versioned whole width
          '
          # D-0610: reviewed fixture symbols and version-refusal inputs.
          scaffold="$scaffold abb forcemot irfc
          brutex-nse-cash-session-v1 brutex-nse-cash-session-v2"

          # ---- group 6: granularity and session tokens. `Granularity::dir`
          # and `SessionKind::label` in crates/pull/src/vendor.rs. These name a
          # bar interval and are the STABLE ON-DISK DIRECTORY NAMES, which
          # CLAUDE.md §3 rule 8 forbids renaming.
          #
          # `1d` and `day` are NOT directory names and never reach the disk.
          # They appear in a doc comment on `Granularity::wire` that explains
          # why the wire word is DECLARED per vendor rather than derived from
          # the directory name: `1day`, `1d` and `day` are all real spellings
          # used by real brokers for the same rung, so there is no rule that
          # turns one into the others and inventing one would be CLAUDE.md
          # section 3 rule 1. The gate scans comments on purpose, so prose
          # about a spelling lands here exactly as a constant would -- which is
          # the correct behaviour, because a real segment pasted into a doc
          # comment publishes it just as effectively.
          #
          # `60min` REPLACED `1hr` ON 14 AUG 2026, AND THE PARAGRAPH ABOVE IS
          # WHY THAT NEEDED AN ARGUMENT RATHER THAN AN EDIT.
          #
          # It says these are the stable on-disk directory names and that §3
          # rule 8 forbids renaming one. `1hr` was NOT one. It was
          # `Granularity::dir`'s word for the hour rung, and the directory is
          # created from `store::path::Timeframe`, whose word for that rung has
          # been `60min` since the store was widened. The two disagreed, and
          # nothing noticed because `Granularity::store_timeframe` answered
          # `None` for the rung -- so no bar could ever be written under either
          # spelling and `1hr` never named a directory on any disk.
          #
          # Rule 8 protects HISTORY. There is none here to protect: the rename
          # orphans nothing, because nothing was ever filed. What it removes is
          # a second name for one rung, which `web/src/routes/db/+page.svelte`
          # had been absorbing by hand in an alias table. `1hr` stays on this
          # list -- the doc comment recording the rename quotes it, and a word
          # this gate has already seen must not start failing because the code
          # explaining it was written. D-0132.
          timeframe='
          tick 1s 5s 1min 2min 3min 5min 10min 15min 30min 60min 1hr 1day 1week continuous
          1d day intraday
          '

          # ---- group 7: rate-governor display strings, crates/pull/src/rate.rs.
          # `WindowSpan::{Second,Minute,Day}` and `RequestKind::{Live,
          # Historical}` rendering themselves for a log line or a refusal.
          # `live` IS one of the ten environment words gate 1c matches on, and
          # that is why it was looked at rather than waved through: here it is
          # the live-quote endpoint group as opposed to the historical one, in
          # a two-variant enum, and it is joined to no path.
          governor='second minute day live historical'

          # ---- group 8: the vendors' own record field names. CLAUDE.md §8
          # says in as many words that crates/pull "holds the shape and the
          # field names". `FieldNames`/`ResponseShape` in vendor.rs, the
          # column labels fetch.rs quotes back in a refusal, and the file
          # extension archive.rs checks. None is a credential field.
          #
          # `data` is an ENVELOPE key — the object a vendor hangs its bars
          # under, exactly as `payload` above already is, and since D-0049 the
          # decoder reads only the one the descriptor names. `from` and `to`
          # are the two query parameters a GET vendor takes its window in
          # (`Method::Get` in http.rs). All three are wire vocabulary, which is
          # the category this group exists for.
          # symbol interval p success -- each read against its own call site.
          # symbol is an NSE record field (nse.rs:632); interval a vendor query
          # placeholder (vendor.rs:4337); p the page parameter NSE endpoints take
          # (nse.rs:1057); success a status VALUE in a canned response body
          # (http.rs:1744). All four are vendor vocabulary on the wire. None names
          # an account, an environment or a credential field.
          record_field='
          open high low close volume timestamp open_interest payload csv
          data from to candles
          status error code message
          symbol interval p success
          duplicates
          '

          # ---- group 9: an HTTP HEADER NAME, not a value. One broker sends
          # its token in a header called `access-token`; the token itself is
          # read from Parameter Store and never appears in this repository.
          # Read this line twice before adding anything to it.
          #
          # `x-token` was read twice. It is the header name on the INVENTED
          # descriptor the http.rs tests are built from — `x-` is the
          # conventional prefix for a name no registry owns, and no vendor in
          # crates/pull/src/vendor.rs uses it. The other broker's header is
          # `Authorization`, which this gate never sees because its capital
          # letter puts it outside the lower-case pattern being scanned; that
          # is the scan's shape, not an exemption, and the descriptor spells it
          # that way because that is the name on the wire.
          header_name='access-token x-token'

          # ---- group 10: bare integers a refusal message must contain, so the
          # test asserts the refused value is IN the message. These are domain
          # bounds — u32::MAX, the year-9999 epoch-millisecond ceiling, the two
          # lengths of February. All-digit literals are NOT excluded from the
          # scan by shape, deliberately: a twelve-digit account number is a
          # perfectly ordinary `<org>` segment, and `253402281000` is twelve
          # digits. It is on this list because it was read, not because a
          # pattern let it past.
          bound_number='10000 1970 9999 28 29 4294967295 253402281000 48 750
          0 1e300'
          # D-0610: fixture IDs, malformed dates/flags, timestamps and bounds.
          bound_number="$bound_number 00000000 01 12345 1250640000 1296345600
          1296345600000 1296345601 1333 1577923200 18446744073709551616
          20210129 2029 2147483648 502070400 86400"

          # ---- group 11: FIELD LABELS IN A `Debug` RENDERING, not values.
          # `HttpSource`'s Debug impl is hand-written precisely so the token is
          # never printed, and these two strings are the captions it prints
          # instead: `base_url` beside the descriptor's URL, and `token` beside
          # the fixed string `<redacted>`. `token` is on an allowlist in a
          # credential gate and that is worth stopping on — it is the word
          # "token", four characters, standing where a value would be if this
          # impl were derived. That it appears here is the evidence the redact
          # is in place, not evidence of a leak.
          #
          # `key` is the third caption, and the paragraph above argues it
          # unchanged: it is the word standing where a value would be if this
          # impl were derived, and the value beside it is the fixed string
          # `<redacted>` — crates/pull/src/http.rs:87 reads
          # `.field("key", &self.key.as_ref().map(|_| "<redacted>"))`. Its
          # presence on this list is the evidence the redact exists, not
          # evidence of a leak, which is exactly what the note about `token`
          # says and is the reason both are read rather than waved through.
          debug_label='base_url token key'

          # ---- group 12: DATES ON THE WIRE, in the two compact formats.
          # `DateFormat::{CompactYmd,CompactDmy}` render 2025-07-01 as
          # `20250701` and `01072025`, and the test that pins all four formats
          # asserts both. Group 10's note explains why all-digit literals are
          # scanned rather than waved through, and the `YYYY-MM-DD` exclusion
          # above is anchored to that one spelling on purpose — so these two
          # are declared here by hand. Both are the same calendar date this
          # repository already writes in the clear a dozen times over; neither
          # names an account, an environment, a vendor or a field.
          wire_date='20250701 01072025'

          # ---- group 13: AWS SigV4's own wire vocabulary, crates/pull/src/ssm.rs.
          # Every word here is published by AWS and fixed by the signing
          # algorithm. None is an operator's choice, so none can be one of their
          # path segments. `ssm` is the service code that appears in the
          # credential scope; `aws4_request` is the terminator the algorithm
          # mandates; the rest are HTTP header names AWS defines.
          #
          # `us-east-1`, `20150830` and `20150831` are lifted VERBATIM from
          # AWS's own published SigV4 test vectors, which is what ssm.rs checks
          # the implementation against — they are the only external proof this
          # repository has that the signature is computed correctly, and
          # changing them to something invented would delete that proof.
          # CLAUDE.md §8 names ap-south-1 as the region this repository reads
          # from; us-east-1 appears nowhere but inside those vectors.
          aws_sigv4='
          ssm aws4_request authorization content-type host
          x-amz-date x-amz-target x-amz-security-token
          us-east-1 20150830 20150831
          '

          # ---- group 14: the AWS shared-credentials file format. These are the
          # INI keys and the default profile name AWS itself defines for
          # ~/.aws/credentials, read by `AwsIdentity::from_credentials_file`.
          # Only the names of the keys are here; gate 1c already refuses the
          # file itself from ever being tracked.
          aws_shared='
          credentials profiles default
          aws_access_key_id aws_secret_access_key aws_session_token
          '

          # ---- group 15: the redacting `Debug`'s own field labels.
          # `AwsIdentity` hand-writes `Debug` so the secret and the session
          # token render as `<redacted>`; these are the labels printed beside
          # them. That `secret` and `session_token` appear as literals AT ALL is
          # that redaction working, not a value escaping.
          redact_label='key_id secret session_token'

          # ---- group 16: published hash test vectors. `abc` is the NIST
          # SHA-256 input whose digest ssm.rs pins, and `000fff` is the
          # three-byte lower-case hex-padding check beside it.
          hash_vector='abc 000fff'

          # ---- group 17: the vendors' REQUEST field names, and one published
          # example value. Group 8 above carries the names each vendor uses in
          # its RESPONSE; these are the names it requires in the REQUEST, and
          # they arrived with the parameter map that stops Dhan answering
          # DH-905. Every one is read first-hand from the vendor's own
          # documentation page:
          #   securityId exchangeSegment instrument   dhanhq.co/docs/v2/historical-data
          #   exchange segment trading_symbol start_time end_time
          #                                             groww.in/trade-api/docs
          # `exchange`, `segment` and `instrument` are ordinary English words a
          # vendor chose for a field; they name no account and no environment.
          # `13` is the securityId of NIFTY in Dhan's OWN worked example, used
          # in a test so the request can be asserted against a value the vendor
          # published rather than one invented here.
          #
          # The twelve month TOKENS are the calendar, lower-cased. Groww writes a
          # contract expiry as `04Jan24` and `pull::fno::read_contract` reads it
          # into this store's `2024-01-04`, so the table it compares against is
          # the twelve English month abbreviations and nothing else. `19200` is
          # the strike in the vendor's OWN worked example, used in the tests so
          # the paisa conversion is asserted against a number the vendor
          # published rather than one invented here -- the same reason Dhan's
          # `13` is on this list. `2020` is the year Groww states its F&O history
          # begins and `2019` is the year one before it, asserted in the refusal
          # so the message names BOTH ends of the gap an operator just typed --
          # a refusal that says only "before the floor" sends them to the
          # vendor's dashboard instead of to the field. Two calendar years. A month name is not a secret in any sense
          # section 8 is about.
          #
          # `expiries`, `contracts`, `underlying_symbol`, `expiry_date`, `year`
          # and `month` are Groww's expired-F&O contract lookup -- two path
          # segments and four query fields, read from
          # groww.in/trade-api/docs/curl/backtesting. An expired option is in no
          # instrument master, so its name has to be discovered before its bars
          # can be asked for; `pull::vendor::FnoDiscovery` is the shape that
          # records how. Six ordinary English words a vendor chose. They name no
          # org, no env and no account, which is what section 8 is about.
          #
          # `underlying` joined them as the field key on the `pull.fno discovery
          # refused` event -- the one that carries a failed walk's WHOLE reason,
          # because the journal's note is stride-bound to 68 bytes and a
          # discovery failure's reason begins with the URL, so the vendor's
          # status was exactly the part that fell off. It holds an instrument
          # name, which is public market vocabulary.
          request_field='
          securityId exchangeSegment instrument
          exchange segment trading_symbol start_time end_time
          13
          groww_symbol candle_interval 1minute
          expiries contracts underlying_symbol expiry_date year month underlying
          jan feb mar apr may jun jul aug sep oct nov dec
          19200 2019 2020
          '

          # ---- group 18: RFC 6238 APPENDIX B, and the words beside it.
          # crates/pull/src/totp.rs implements TOTP so a stale broker token can
          # be RECOGNISED. It never mints one -- CLAUDE.md section 8 forbids it,
          # because a local mint would invalidate the token another system
          # shares -- and this gate seeing these six numbers is the evidence
          # that the implementation is pinned to the published vectors rather
          # than to whatever it happens to produce.
          #
          # Every value below is printed in RFC 6238, a public standards
          # document, and reproduces from the RFC's own key at the RFC's own
          # timestamps. They name no account, no environment, no vendor and no
          # field. `gezdgnbvgy3tqojqgezdgnbvgy3tqojq` is the base32 spelling of
          # the RFC's 32-byte SHA-256 test key -- the string "12345678901234567890"
          # repeated, which is the least secret secret in cryptography.
          #
          # A real TOTP secret can never appear here: section 8 puts it in
          # Parameter Store, never in a tracked file, so a six-digit literal in
          # this crate is either a published vector or a defect. That is exactly
          # the distinction this gate exists to force someone to make by hand.
          #
          # `legal`, `malformed` and `provably` are that module's own test
          # names and refusal words -- base32 alphabets that are legal, inputs
          # that are malformed, and a bound that is provably reached.
          totp_vector='
          755224 287082 359152 969429 338314 254676 287922
          162583 399871 520489 005924 050471 081804 279037 353130
          gezdgnbvgy3tqojqgezdgnbvgy3tqojq
          legal malformed provably
          '

          # ---- group 19: two more test scaffolding words that arrived with the
          # census and the null-price decoder. `census-incremental` is a
          # temporary directory name chosen for the test that proves the census
          # APPENDS rather than rewrites -- the one that asserts on the file's
          # INODE, because asserting on its size passed under both strategies
          # and let a mutant survive. `fits` and `skipped` are assertion labels:
          # a window that fits inside both the vendor cap and one month, and a
          # bar the Groww decoder skipped because a price cell held null.
          # `daily` and `unstorable` are `Scratch::new(...)` temp-directory
          # names in crates/pull/tests/broker.rs -- one for the test that a
          # daily pull lands under `1day/` and folds a session into one bar,
          # one for the test that a rung the store cannot carry is refused BY
          # NAME rather than filed under the nearest directory that exists.
          # Both name a scratch path this repository chose, not a segment any
          # vendor or account uses.
          late_scaffold='census-incremental fits skipped daily unstorable all counts'
          # `crates/pull/src/folder.rs` and its tests, added by another line of work. Read in
          # context before declaring, one at a time, because declaring a literal is a claim
          # that it is not a parameter-path segment:
          #
          #   vendor-data     `pub const ROOT_DIR` -- a LOCAL filesystem directory the folder
          #                   scanner walks. Not a Parameter Store segment; nothing joins it
          #                   into a `/<org>/<env>/<vendor>/<field>` path.
          #   bent            scratch directory names in `tests/folder.rs`, each naming the
          #   bought-nothing  case it sets up -- a folder whose files are bent, one that
          #   wrong-kind      bought nothing, one holding the wrong kind, one never created,
          #   never-created   one already sealed.
          #   sealed
          #   earliest        ordinary field and label words in the same module.
          #   latest
          #   files
          #   pulled
          #   read
          #   verb
          #
          # Declared rather than left refusing. The distinction this used to draw against
          # gate 11's `crates/pull/src/totp.rs` entry no longer has a second half: that one
          # WAS a real §4 violation left visible for its owner, and it has since been fixed
          # and its allowance deleted. The principle it illustrated stands -- blessing a
          # defect hides it, so an allowlist entry must be a report with an owner. These are not
          # defects -- a scratch directory called `sealed` is not a credential path, and saying
          # so is what this gate asks for. Their owner should still confirm the list.
          folder_scaffold='vendor-data bent bought-nothing wrong-kind never-created sealed earliest latest files pulled read verb'

          # ---- group 20: THE MANIFEST FORMAT'S OWN FIELD NAMES, and nothing
          # else. `pull::manifest::Layout::declare` refuses a degenerate format
          # geometry and NAMES THE FIELD it refused —
          # `ManifestError::DegenerateLayout { field }` — exactly as
          # `store::layout::Layout::declare` does one crate away, and for the
          # reason stated there: a `const` panic cannot format a field name, so
          # the fallible door is where an operator finds out which of the four
          # numbers was wrong.
          #
          # All four are field names on a struct in THIS repository, spelled the
          # way the struct spells them. None is an account, an environment, a
          # vendor or a field of a vendor's record: `magic` is the eight bytes a
          # manifest begins with, `version` is its format number, and the two
          # strides are the byte width of one entry in the two widths this
          # workspace computes offsets in. D-0067.
          layout_field='magic version entry_stride entry_stride_len'

          # ---- group 22: TELEMETRY FIELD KEYS AND OUTCOME WORDS. D-0075.
          # `crates/pull` gained a telemetry dependency and 15 emit sites, and
          # every `.with("key", ...)` puts a bare lower-case word in the source
          # — which is exactly the shape this gate scans for. None of these is
          # a path segment: they are the LEFT side of a log field, and the
          # right side is the value. They are declared one by one rather than
          # waved through with a pattern, because "it looks like a log field"
          # is precisely the excuse a real credential segment would wear.
          #
          # WHAT IS DELIBERATELY NOT HERE. No org, no environment, no vendor
          # and no field name from the Parameter Store shape. `value_len` is
          # the closest this list comes to a credential and it is a LENGTH:
          # `crates/pull/src/ssm.rs` logs how long the token is and never the
          # token, and never the parameter name. Gate 1c still refuses the
          # path itself in any tracked file, and this group does not touch it.
          telemetry_field='
          bars bars_out before_open before_window after_window at_or_after_close
          bucket_secs bytes cap_days chunk chunks dropped entries epoch
          first_chunk_to folded from_version generation ghosts header
          instrument_id keys landed members outcome per_day per_minute
          per_second reason refused region_bytes repairing representable
          rows rows_in snapshots url value_len why absent degraded dir
          field file kept loaded max rotated vendors
          asked blank byte_len chars duplicate fault
          about census rows_read slices
          not-base32 too-long hmac-refused
          at
          unreadable_volume unreadable_oi
          timeframe
          '

          # THE SECOND BATCH, and why each is not a path segment. The emit
          # sites in `secret.rs`, `totp.rs`, `work.rs` and `config.rs` landed
          # after this group was first written, so the gate correctly went red
          # on all fifteen. Every one is the LEFT side of a `.with(...)`:
          #
          #   asked blank duplicate kept  — `work.rs` counts, one plan's
          #     four outcomes. Integers on the right, never a name.
          #   byte_len chars max          — LENGTHS. `secret.rs` logs how many
          #     bytes the credential is and never the credential; `totp.rs`
          #     logs how many characters were offered against `MAX_SECRET_LEN`.
          #   fault not-base32 too-long   — `totp.rs` outcome words: a
          #   hmac-refused                  `TotpError` rendered to a stable
          #     token so a page can group by it. They name a FAILURE, not a
          #     location. `hmac-refused` joined them when the `unreachable!`
          #     that gate 11 names in this file became a refusal: it says the
          #     BUILD is wrong, not the operator's secret, which is why it is a
          #     separate word rather than folded into one of the other three.
          #   file loaded vendors         — `config.rs`, reporting that the
          #     untracked local configuration was read and how many vendors it
          #     named. The count, never the contents.
          #   rotated                     — `secret.rs`, a bool: whether a
          #     re-read returned a different value. CLAUDE.md §8's "a stale
          #     token is re-read; if the re-read returns the same dead value,
          #     the pull halts loudly".
          #
          # `field` IS THE ONE WORTH ARGUING ABOUT, so it is argued here. §8's
          # shape is `/<org>/<env>/<vendor>/<field>`, and `secret.rs` logs
          # `.with("field", <the field's name>)` — the fourth segment's VALUE,
          # not just the key. That is deliberate and it is inside §8's own
          # carve-out: "`crates/pull` holds the shape and the field names; it
          # holds no `org`, `env`, or `vendor` literal." The field names are
          # already tracked source. The two segments §8 keeps out of this
          # repository — `org` and `env` — are read at run time from the
          # untracked configuration and appear in NO event on any of these
          # paths. A log handed to somebody still cannot be turned into a
          # parameter path.

          # THE THIRD BATCH — the four run-scoped failure events, D-0087.
          # `refused_whole` and the two census arms returned `Err` and logged
          # NOTHING, so a backfill that landed zero bars left a quiet log. All
          # four are the LEFT side of a `.with(...)`:
          #
          #   about      — the folder or path a refused RUN was about. A local
          #     archive directory the operator typed, or a store path this
          #     repository rendered. Never a Parameter Store segment.
          #   census     — the census file's own path on disk, same shape.
          #   rows_read  — a COUNT. The rows a refused run did read, so the
          #     receipt cannot blame a vendor that answered perfectly.
          #   slices     — a COUNT of appended slices whose census went
          #     unpublished.
          #
          # Two counts and two filesystem paths. No org, no env, no vendor, no
          # field of a vendor's record.

          # THE FOURTH BATCH — one word, `at`, from `resolve.rs`.
          #
          # `pull::resolve::note_refused` emits the six refusals `crawl` can
          # record, and it names the document that refused with
          # `.with("at", &at)` — the same word as `IndexFailure::at`, which is
          # the field this event exists to make visible. Gate 19 refused all
          # six sites for logging nothing at all; fixing that necessarily put a
          # new bare lower-case word in the source, which is the shape gate 1d
          # scans for. The two gates pulling in opposite directions is the
          # system working: one demands the event, the other demands the event
          # be accounted for.
          #
          # It is not a path segment. The RIGHT side is a URL the crawl built
          # from `INDEX_HOST` plus a category path — an exchange address on
          # the public internet, and the same value `url` already carries in
          # this group. The LEFT side is a two-letter English preposition, and
          # §8's shape has no `at` in it: the four segments are `org`, `env`,
          # `vendor` and `field`, none of which this event carries. Nothing on
          # this path reads Parameter Store, and `resolve.rs` holds no
          # credential of any kind — it crawls a public index site.
          #
          # THE SIXTH BATCH -- `timeframe`, from `ingest.rs`. The rung a spot pull
          # ran at, on the once-per-target event. It is the LEFT side of a
          # `.with(...)` whose right side is `rung.as_str()`, one of the words in
          # the `timeframe` group above, and section 8`s shape has no `timeframe` in
          # it: the four segments are org, env, vendor and field.
          #
          # `2min` and `10min` joined the timeframe group in the same commit. They
          # are exchange rungs the other session added to `Timeframe::KNOWN`, and
          # they are periods of time -- not an org, an env, a vendor or a field.
          #
          # THE FIFTH BATCH — `unreadable_volume` and `unreadable_oi`, from
          # `csv.rs`. Two counts on the once-per-file decode event, and both name
          # a SUBSTITUTION this build made: a volume field that would not parse
          # is stored as `0` and an open interest as absent. CLAUDE.md §4 permits
          # the degrade and forbids it being silent, and these are what stop it
          # being silent — `rows` including rows whose volume was invented is not
          # the same fact as `rows` where every field was read.
          #
          # Not path segments. Both are the LEFT side of a `.with(...)` and the
          # right side is an integer COUNT, never a name; `unreadable_oi` is
          # abbreviated the way the struct field is not, because the wire key is
          # read in a column and the struct field is read in prose. §8's shape is
          # `/<org>/<env>/<vendor>/<field>` and neither word can be any of those
          # four: `csv.rs` decodes a body that is already in memory, reads no
          # Parameter Store, and holds no credential.

          # ---- group 24: AN INVENTED AWS ERROR BODY, WHOSE WHOLE PURPOSE IS TO
          # PROVE A PATH IS NOT LEAKED. crates/pull/src/ssm.rs test module.
          #
          # READ THIS ONE TWICE, because it is the only group whose entries are
          # shaped exactly like the four segments CLAUDE.md §8 keeps out of this
          # repository. That is not a coincidence and it is not a slip: the
          # fixture is a fabricated `AccessDeniedException` body carrying a full
          # parameter ARN, and the test asserts that the renderer emits NONE of
          # it. `ssm.rs:893` reads
          #
          #     for leak in ["SomeFutureException", "parameter/", "anorg", "arn:aws"]
          #
          # and fails if any appears in the message an operator sees. So `anorg`
          # is tracked precisely so that a build which starts leaking an org
          # segment goes red.
          #
          # Each is transparently invented -- `anorg`, `anenv`, `avendor` and
          # `afield` are "an org", "an env", "a vendor", "a field" spelled as
          # identifiers, and no vendor in crates/pull/src/vendor.rs is named
          # `avendor`. `000000000000` is a zeroed AWS account id, the value AWS
          # documentation itself uses as a placeholder, and twelve digits is
          # the account-id width. `assumed-role` is a fixed ARN component of an
          # STS role session, not a segment anyone chose.
          #
          # Gate 1c still refuses the real path in any tracked file and this
          # group does not touch it: none of these six is a real org, env,
          # vendor or field, and the file that holds them is the one proving
          # the real ones never reach a log.
          ssm_leak_fixture='anorg anenv avendor afield 000000000000 assumed-role'

          # ---- group 23: A YEAR-MONTH IN AN ASSERTION. D-0070.
          # `pull::unit::a_daily_bucket_is_an_ist_day_...` asserts the month a
          # folded bar derives to, and that assertion is the whole proof of the
          # fold fix: before it, a bar stamped 00:00 IST on 2026-01-01 derived
          # to 2025-12. The literal is a `store::path::YearMonth` rendering,
          # not a path segment — the store's own month component is written
          # from a `YearMonth` and never from a caller's string.
          year_month='2026-01'

          # ---- group 20: THE EXCHANGE'S OWN PUBLISHED FILENAMES, and three
          # test words that arrived with them. crates/pull/src/nse.rs.
          #
          # `ind_niftybanklist` and `ind_niftytotalmarket_list` are the names
          # NSE Indices Limited gives two of its constituent files, published at
          # niftyindices.com and read 14 Aug 2026 (docs/00-charter.md §4d).
          # They are here for a reason worth reading twice: they are quoted in a
          # REFUSAL MESSAGE, because the argument for refusing is that the two
          # disagree with each other -- one is word-joined and the other is
          # underscore-separated, so no rule turns an index's name into its
          # filename and any rule guessed from one is already wrong about the
          # other. A message that made that argument without showing both
          # spellings would be asking the reader to take it on trust.
          #
          # Neither is a credential path segment and neither could become one:
          # they name a public file on a public exchange host, they contain no
          # org, env, vendor or field, and nse.rs COMPOSES NO FILENAME AT ALL --
          # `constituent_link` reads the URL the exchange published and refuses
          # a page that carries none. That is the whole point of the module and
          # these two literals are the evidence for it, not an exception to it.
          #
          # `nifty-bank` is the page name in that refusal's own test. `doctype`
          # and `transport` are assertion substrings: the first proves an
          # interstitial is refused AS HTML rather than read as an index with no
          # members, and the second proves an empty document and a failed fetch
          # print as different facts.
          nse_published='
          ind_niftybanklist ind_niftytotalmarket_list
          nifty-bank doctype transport
          '

          # ---- group 21: THE JOIN'S OWN VOCABULARY. crates/pull/src/universe.rs.
          #
          # `isin`, `symbol` (already on group 17), `matched`, `lacks`,
          # `no-isin` and `ambiguous` are the words a resolution emits for WHAT
          # BECAME OF A NAME. They name a verdict, never a path component, and
          # no Parameter Store path this repository reads has an `ambiguous` or
          # a `no-isin` segment. They are on the wire because a page has to
          # render the bucket, and D-0105's rule -- the slugs are the wire's own
          # words -- makes emitting them the correct choice rather than
          # inventing a second vocabulary for the browser.
          #
          # `isin` is worth its own sentence. It is the International Securities
          # Identification Number, an ISO 6166 identifier the EXCHANGE issues
          # and publishes in every constituent file. It identifies an
          # instrument, not an account: it is printed on public filings, it is
          # the join key D-0125 already chose, and it carries none of the four
          # things this gate protects.
          #
          # `kite` is the wire name of a vendor whose descriptor this build does
          # not yet carry, used in a TEST as the feed a symbol-keyed join is
          # attributed to. It is on the same footing as `groww` and `dhan` in
          # group 2, and for the same reason: it is that vendor's own public
          # product name, already tracked in docs/00-charter.md section 4z.
          #
          # `350` and `400` are the two counts in the collapse test -- a
          # universe that shrank from 750 to 350, losing 400 -- asserted to
          # appear IN the refusal so the message cannot stop naming them.
          join_verdict='
          isin no-isin matched lacks ambiguous
          kite 350 400
          '

          # ---- group 22: TWO WORDS FROM THE EXCHANGE'S OWN NAVIGATION.
          # crates/pull/src/resolve.rs tests.
          #
          # `sectoral-indices` and `strategy` are asserted substrings: a test
          # that breaks one category's listing checks the failure it collects
          # NAMES that category, so a refusal cannot stop saying which family
          # went missing. They are components of a public exchange URL --
          # niftyindices.com/indices/equity/sectoral-indices -- and the four
          # such paths live in `nse::Category::path`, where they are slash-
          # joined and therefore never reach this scan; these two are the bare
          # words a test quotes.
          #
          # Neither names an org, an env, a vendor or a field, and no Parameter
          # Store path this repository reads has a `strategy` component. They
          # describe a family of stock-market indices.
          nav_word='sectoral-indices strategy'

          # ---- group 23: TWO HTTP STATUS CODES, asserted to appear IN a
          # refusal. crates/pull/src/resolve.rs tests.
          #
          # `302` and `403` are read back out of the message the document
          # transport produces, so a refusal cannot stop naming the status it
          # refused on -- the same device group 10's bounds use. A three-digit
          # HTTP status names no account, no environment, no vendor and no
          # field; it is defined by RFC 9110 and is the same number for every
          # host on the internet.
          http_status='302 403'

          # ---- group 24: THE WITHDRAWN-INDEX REGRESSION. nse.rs tests.
          #
          # `nifty-ipo` is a real index the exchange has COMMENTED OUT of its
          # own thematic listing, copied into a test fixture from the live page
          # on 14 Aug 2026 along with the markup around it. It is the regression
          # that caught `without_comments`: a byte scanner reads inside an HTML
          # comment where a browser does not, and the crawl found 62 index links
          # on a page that lists 44. A withdrawn page answering 404 makes every
          # pass incomplete, which makes a snapshot permanently unpublishable.
          #
          # It is the public name of a stock-market index on a public exchange
          # site, it names no org, env, vendor or field, and it is on this list
          # because the fixture must keep quoting it -- a regression test that
          # stops naming the case it guards stops guarding it.
          #
          # `an-index` is the placeholder page name in the sibling test.
          withdrawn_index='nifty-ipo an-index'

          # ---- group 25: THE THIRD BROKER'S ROW. crates/pull/src/vendor.rs.
          #
          # `zerodha` is that vendor's own public product name, written down as
          # the name its bars are filed under -- `Descriptor::wire`, and the
          # store prefix `core::vendor::Vendor::as_str`. Same footing as `groww`
          # and `dhan` in group 2 and checked the same way: it is already
          # tracked and public in docs/00-charter.md section 4z. Whether it is
          # ALSO an operator's real <vendor> segment is operator-side and
          # unknowable from inside this repository -- docs/06-limits.md
          # section 18, exactly as for the other four.
          #
          # `instrument_token` is the vendor's own name for the numeric id it
          # issues, used as the PLACEHOLDER in the bars path
          # (/instruments/historical/:instrument_token/:interval) and as a
          # column header in its instrument dump. It names an instrument, not
          # an account.
          #
          # `api-key` IS A CREDENTIAL FIELD AND IS THE LINE TO READ TWICE.
          #
          # It is the <field> of /<org>/<env>/<vendor>/<field> -- the LAST
          # component of the shape, and the only one of the four that is not
          # operator-specific. CLAUDE.md section 8 says in as many words that
          # crates/pull "holds the shape and the field names"; this is a field
          # name, and it is here because `Auth::key_field` now carries it so the
          # descriptor decides how many secrets a scheme needs rather than a
          # match on the feed in crates/api.
          #
          # It names no org, no env and no vendor, and it is ALREADY PUBLIC in
          # this repository: docs/00-charter.md section 4 lists Groww's fields as
          # api-key, totp-secret and access-token, and `access-token` has been on
          # group 9 since the first broker row. The VALUE is read from Parameter
          # Store at runtime and appears in no tracked file, no environment
          # variable and no log -- section 8, and `pull::http::Credential`
          # redacts it in Debug.
          zerodha_row='zerodha instrument_token api-key'

          # ---- group 24: DHAN'S ROLLING-OPTION VOCABULARY, and it is wire
          # vocabulary in the same sense every row above is.
          #
          # `rollingoption` is the path segment of Dhan's expired-options
          # endpoint (`docs/14-expired-options-data.md`). `ce` and `pe` are the
          # two objects one answer carries -- the vendor's spelling of CALL and
          # PUT, which the REQUEST spells the other way, and `rolling::side_key`
          # is the one place those two spellings meet. `iv`, `oi`, `spot` and
          # `strike` are four of the nine words its `requiredData` array admits,
          # named in the request because the vendor DEFAULTS that array to a
          # subset and a default is a decision taken elsewhere that changes what
          # lands on disk.
          #
          # None names an org, an env, an account or a field of a credential.
          # They are seven words a broker chose for its own JSON, and this
          # repository can no more rename them than it can rename `open`.
          # `1` `2` `3` are Dhan's expiry ORDINALS -- near, next, far -- and `4`
          # is the one past the end, present only in the test that proves an
          # ordinal the vendor does not serve is REFUSED rather than guessed at.
          # Four single digits. None can be an org, an env or a vendor.
          rolling_word='rollingoption ce pe iv oi spot strike 1 2 3 4'

          # ---- group 25: TEST SCAFFOLD NAMES AND ONE BOUND.
          #
          # `contractpath` is a scratch directory in `tests/broker.rs`; `bin` is
          # the extension that test counts to prove two contracts do not share a
          # file. `call` and `put` are the two labels its loop prints so a
          # failure names which side it was on -- English words in an assertion
          # message, never a path.
          #
          # `9223372036854775807` is `i64::MAX` written out, and it is there to
          # prove `shift_six` REFUSES it rather than wrapping: a volatility that
          # overflows is not a volatility. A number with no decimal point cannot
          # be a parameter path segment in any case; it is listed because the
          # scanner is shape-based and shape alone cannot tell a bound from a
          # name, which is the same reason `19200` and `2019` are already here.
          rolling_scaffold='contractpath bin call put 9223372036854775807'

          # ---- group 26: TEST FIXTURE NAMES AND PLACEHOLDER TOKENS.
          #
          # Every one is a value a TEST constructs, and each is named for the
          # fault it arranges rather than for anything a vendor or an account is
          # called:
          #
          #   dir-is-a-file lock-is-a-dir  scratch roots in `ingest.rs`, each
          #     named for the filesystem shape it puts in the writer's way -- a
          #     directory where a file belongs and the reverse.
          #   interleaved                  a word asserted to appear IN a refusal
          #     sentence, so the message keeps naming the condition it refused.
          #   feed                         a scratch subdirectory in
          #     `archive.rs`. The English noun, not a vendor.
          #   t                            a placeholder CREDENTIAL VALUE in
          #     `http.rs` tests -- one character, chosen so it can never be
          #     mistaken for a real token, and `Credential` redacts it in Debug
          #     regardless. Section 8 is about real secrets reaching tracked
          #     files; a single letter is the opposite of that.
          #   z zzz                        the filler `http.rs` repeats to build
          #     an over-long body and prove the refusal is CUT rather than
          #     echoed whole.
          #
          # None is an org, an env, a vendor or a field of a credential. They are
          # listed because the scanner is shape-based, and a short lowercase word
          # has the same shape as a path segment whatever it means.
          pull_fixture='dir-is-a-file lock-is-a-dir interleaved feed t z zzz'

          # SIXTY-SEVEN MORE, IN FOUR GROUPS, ALL OF THEM ACCUMULATED WHILE THIS
          # GATE COULD NOT RUN. It sits behind gate 1e in the same job, so every
          # literal added since the workspace stopped compiling arrived
          # undeclared. Not one is an org, an env, a vendor or a credential
          # field; they are listed because the scanner is SHAPE-based and a short
          # lowercase word has a path segment's shape whatever it means.
          #
          #   `vendor_error` — the broker's OWN error vocabulary, quoted so a
          #     refusal can be classified by what the vendor actually said.
          #     `ga001` is Groww's failure code, `dh-901` and the 800-815 block
          #     are Dhan's, `tokenexception` and `not_entitled` are Kite's
          #     exception NAMES, and `pykiteconnect` is the SDK those names are
          #     documented in rather than on the wire. Charter §3 territory:
          #     these are verified external facts, and dropping them to satisfy
          #     a scanner would delete the provenance that says why two
          #     different failures are one event.
          vendor_error='ga001 dh-901 tokenexception not_entitled session_dead
          throttled retry_bounded request_wrong error_name error_type
          reason_given pykiteconnect metadata methods null source 0x'
          #
          #   `event_field` — telemetry KEY names and the values they carry.
          #     `stage` is the newest: `pull::ingest::note_not_filed` takes it so
          #     one helper can say WHERE a filing gave up — address, bars or
          #     overlay — rather than three helpers whose event shapes drift.
          #     The rest are counters and units on lines `/logs` already draws.
          event_field='address captures closed committed failures ingested
          outside-session outside-window outside_session overlay ovl paisa
          premium rupees runlog sent stage unmeasured vendor-hole name
          envelope outside'
          #
          #   `pull_scratch` — scratch ROOTS a test builds, each named for the
          #     fault it arranges: a store that cannot be written, a solver
          #     given an unsolvable quote, bytes kept verbatim. Same class as
          #     `dir-is-a-file` above and named the same way.
          pull_scratch='fromrows plausible solvable unwritable verbatim'
          #
          #   `bare_number` — digits the scanner cannot tell from a segment.
          #     Dhan's 8xx status block, Kite's 7030, a `nifty-50` index name,
          #     and round bounds in test fixtures. A number is not a path.
          bare_number='001 100 200 250 50 6 7030 8 800 803 804 805 806 807 808
          809 810 811 812 813 814 815 901 nifty-50'

          # ---- group 27: FOUR TELEMETRY FIELD KEYS AND ONE FAILURE-KIND VALUE,
          # and these are the only entries below that are in PRODUCTION code.
          # Every one was read at its call site before it was written down.
          #
          #   kind             `crates/pull/src/capture.rs:162`, the LEFT side of
          #     `.with("kind", ...)` on the `pull.capture` refusal event, and the
          #     name of the `&str` parameter `note_refused` takes. That event
          #     deliberately carries no URL, no body and no header — the URL and
          #     body ARE the evidence that failed to land, and a header can carry
          #     the credential — so feed, kind and the local I/O reason are all
          #     that is left of it. Four letters naming a field on a log line.
          #     §8's shape is `/<org>/<env>/<vendor>/<field>` and has no `kind`.
          #   rung             `ingest.rs:529`, the LEFT side of
          #     `.with("rung", ...)` on the once-per-target `pull.run` event. Its
          #     right side is `Timeframe::as_str`, one of the words already in
          #     the `timeframe` group. Same case as `timeframe` itself, which the
          #     sixth batch above argues at length.
          #   corrected        `http.rs:964` and `csv.rs:464`, both LEFT sides
          #   negative_volume  and both COUNTS on the right — how many bars
          #     carried a negative volume and were recorded as zero, and how many
          #     rows were skipped outright. CLAUDE.md §4 permits the degrade and
          #     forbids it being silent; these two are what stop it being silent,
          #     exactly as `unreadable_volume` and `unreadable_oi` already do.
          #
          # `unreadable` is the one VALUE here rather than a key:
          # `capture.rs:444` and `http.rs:2744` pass it as the `kind` argument
          # above, so it names a CLASS OF FAILURE — the captured body could not
          # be written — and `capture.rs:550` reuses the word for that test's
          # scratch directory. It names no account, no environment, no vendor and
          # no field, and the crate joins it into no path.
          capture_field='kind rung corrected negative_volume unreadable'

          # ---- group 28: SCRATCH ROOTS AND ONE TEMPORARY FILE STEM. Every word
          # is the argument to `scratch(...)`, `Scratch::new(...)` or `tmp(...)`
          # in a test, and every one is named for the case it arranges rather
          # than for anything a vendor or an account is called. Same class as
          # `dir-is-a-file` and `pull_scratch` above and read the same way:
          #
          #   restart-collision concurrent-names all-names-held   capture.rs
          #     — a writer restarted onto an occupied name, several writers
          #     racing for names at once, and every bounded name already taken.
          #   short-body not-csv json-body index-lands no-partial              masters.rs
          #   same-source-lock lock-names json-will-not-convert no-comma
          #   wrong-shape
          #     — a truncated answer, a body that is not CSV, one that is JSON,
          #     a landing that reaches the index, a landing that leaves no
          #     `.partial`, two landings contending for one source's lock, the
          #     names a lock takes, JSON that will not convert, a row with no
          #     comma, and a document of the wrong shape.
          #   partialcount     ingest.rs, the partial-batch counter's own test.
          #   spanning-months  tests/broker.rs, a batch that crosses a month end.
          #   identity         tests/unit.rs:121-122, the STEM handed to `tmp`
          #     twice by the test that proves two calls never collide. It is a
          #     temporary file name in the OS temp directory, carrying the pid
          #     and a serial; nothing joins it into a Parameter Store path.
          #
          # None is an org, an env, a vendor or a field. They are listed because
          # the scanner is SHAPE-based and a short lower-case word has a path
          # segment's shape whatever it means.
          pull_scratch_2='
          restart-collision concurrent-names all-names-held
          short-body not-csv json-body index-lands no-partial
          same-source-lock lock-names json-will-not-convert no-comma
          wrong-shape partialcount spanning-months identity
          '

          # ---- group 29: ASSERTION LABELS, A FILENAME PREFIX AND TWO
          # DELIBERATELY MALFORMED FIXTURES.
          #
          #   zerodha-unreadable-0  `capture.rs:727`, the PREFIX a test builds
          #     capture filenames from while it occupies every bounded name. It
          #     is `<feed wire name>-<failure kind>-<index>` — `zerodha` is
          #     already declared in group 25 and `unreadable` in group 27 — and
          #     it names a file on the operator's own disk, never a segment of a
          #     parameter path.
          #   partial      `masters.rs:1770`, matched as a FILENAME SUBSTRING:
          #     the test reads the directory and asserts no `.partial` survived
          #     a landing. The English adjective, not a path component.
          #   splittable   `session.rs`, an `expect()` message on three calls.
          #   untouched    `http.rs:4176`, an `assert_eq!` label.
          #   emit-sites   `emit_sites.rs:1412`, the `origin` argument of
          #     `ingest::from_rows` — a label folded into a refusal message as
          #     "(from {origin})", and here it is that test module's own name.
          #   novalue      `masters.rs:2474` and `:2489`, two of the four
          #   not-a-pair     deliberately malformed `Set-Cookie` values the
          #     cookie jar must skip. They are invented nonsense whose whole
          #     purpose is to not parse.
          pull_assert='zerodha-unreadable-0 partial splittable untouched
          emit-sites novalue not-a-pair'

          # ---- group 30: TWO YEAR-MONTHS AND TWO BARE NUMBERS, all four
          # asserted rather than emitted.
          #
          # `2025-07` and `2025-08` are `store::path::YearMonth` renderings read
          # back off disk by `tests/broker.rs:1270,1274` — the test that proves a
          # batch spanning a month end lands one bar in each file. Same case as
          # `year_month` above, and they are scanned rather than excluded because
          # the `YYYY-MM-DD` exclusion is anchored to that one spelling on
          # purpose: a `YYYY-MM` is two characters short of it.
          #
          # `401` is an HTTP status asserted to appear IN a refusal, the same
          # device `302` and `403` already are: a credentialed source offered a
          # transport that sends no token must name the cause rather than let the
          # vendor answer it. `42` is asserted NOT to appear — it is the value of
          # a JSON key that is not a list, and the test proves a number does not
          # become an index name. A three-digit RFC 9110 status and a two-digit
          # counter-example name no account, no environment, no vendor and no
          # field.
          pull_asserted_number='2025-07 2025-08 401 42'

          allowed="${seg_shape} ${vendor_wire} ${claim_standing} ${config_fixture}
          ${secret_fixture} ${scaffold} ${timeframe} ${governor}
          ${record_field} ${header_name} ${bound_number}
          ${debug_label} ${wire_date} ${aws_sigv4} ${aws_shared}
          ${redact_label} ${hash_vector} ${request_field}
          ${totp_vector} ${late_scaffold} ${folder_scaffold} ${layout_field}
          ${telemetry_field} ${year_month} ${nse_published} ${join_verdict} ${nav_word} ${http_status} ${withdrawn_index} ${zerodha_row}
          ${rolling_word} ${rolling_scaffold} ${pull_fixture}
          ${ssm_leak_fixture}
          ${vendor_error} ${event_field} ${pull_scratch} ${bare_number}
          ${capture_field} ${pull_scratch_2} ${pull_assert} ${pull_asserted_number}"
          # MATERIALISED ONCE, AND NOT PIPED. `printf '%s\n' $allowed |
          # grep -qxF` was the shape here, and under `set -euo pipefail` it is
          # unsound in the direction that fails a green build:
          #
          #   `grep -q` exits the instant it MATCHES, which closes the pipe;
          #   `printf` then takes EPIPE and the pipeline's status is failure;
          #   `pipefail` promotes that; `!` inverts it; and the gate reports a
          #   word that IS declared as undeclared.
          #
          # It fires on a MATCH, never on a miss, so it cannot hide a real
          # undeclared literal -- but it invents one at random. Whether printf
          # has flushed before grep exits depends on the pipe buffer and the
          # scheduler, which is why this passed on a developer machine and
          # failed on a runner with the message `printf: write error: Broken
          # pipe` printed one line above `UNDECLARED SEGMENT-SHAPED LITERAL IN
          # crates/pull: authorization` -- a word declared in group 13 since
          # the group was written.
          #
          # Writing the list to a file removes the pipe rather than papering
          # over its status, and does the word-splitting once instead of once
          # per literal scanned. It is the same class of defect gate 10's own
          # comment already records for `xargs -r grep -q`, which "RETURNS 123
          # WHEN ANY BATCH MISSES ... a red build for a reason that is not".
          printf '%s\n' $allowed > /tmp/gate1d-allowed.txt
          bad=0
          while IFS= read -r word; do
            if [ -z "$word" ]; then continue; fi
            if ! grep -qxF -- "$word" /tmp/gate1d-allowed.txt; then
              printf 'UNDECLARED SEGMENT-SHAPED LITERAL IN crates/pull: %s\n' "$word"
              { git ls-files 'crates/pull' | xargs grep -nF -- "\"$word\"" || true; } \
                | head -3
              bad=1
            fi
          # COMMENTS STRIPPED FIRST, and this gate was RED for the same reason
          # gate 17 was this morning: text in a comment is text.
          #
          # The extractor pulls every double-quoted lower-case token, and prose
          # uses double quotes too. `crates/pull/src/vendor.rs:1707` reads
          #
          #     /// the decision to tier 2. It is deliberately not `>=`: "outranks" has to
          #
          # -- an English quotation inside a doc comment -- and the gate failed
          # the build on it. `outranks` is a METHOD NAME being discussed in
          # prose; it is not a literal the crate ever emits, let alone a path
          # segment.
          #
          # Same filter gate 17 and gate 23 use: drop lines whose first non-blank
          # token is `//` or `*`. Conservative in the safe direction -- a Rust
          # STRING LITERAL cannot sit on a line that begins with `//`, so this
          # cannot hide one. A trailing comment on a line that also carries code
          # is still scanned, which is a false positive and therefore loud.
          done < <(git ls-files 'crates/pull' \
                   | while IFS= read -r f; do
                       { grep -vE '^[[:space:]]*(//|\*)' "$f" || true; }
                     done \
                   | grep -ohE '"[a-z0-9][a-z0-9_-]{0,31}"' \
                   | tr -d '"' \
                   | { grep -Ev '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } \
                   | sort -u)
          if [ "$bad" -ne 0 ]; then
            echo
            echo "Either the literal is invented — add it above — or it is a real"
            echo "path segment and must not be tracked. See CLAUDE.md section 8."
            exit 1
          fi
          echo "OK — every segment-shaped literal under crates/pull is declared."
      - name: Gate 2 — no build script shells out
        run: |
          set -euo pipefail
          bad=0
          # THE GLOB READ ONE FILE OUT OF THREE, AND THE OTHER TWO ARE THE SAME
          # BUILD SCRIPT. `crates/cli/build.rs` is 5,200 bytes and the two lines
          # under its doc comment are `mod build_provenance;` and
          # `mod commit_stamp;`. Both files sit beside it, both are compiled
          # INTO the build script cargo runs, and `git ls-files '*build.rs'`
          # names neither — so roughly nine tenths of the bytes that execute
          # before this workspace compiles were never read by this gate. A
          # `Command::new("npm")` placed in `build_provenance.rs` passed it
          # silently. Measured, not inferred.
          #
          # The file set is now the CLOSURE: every tracked `build.rs`, plus
          # every module it declares with `mod NAME;`, plus every module those
          # declare, to a fixed point. Four resolutions are tried per name --
          # `<dir>/NAME.rs` and `<dir>/NAME/mod.rs`, which is where rustc looks
          # from a crate root, and the same pair under the declaring file's own
          # stem, which is where it looks from anywhere else. Only TRACKED
          # candidates join: an untracked file is not what CI compiles.
          #
          # A `build = "gen.rs"` key would rename the ROOT out of the seed list,
          # and that is not this clause's job to catch — the manifest scan below
          # refuses the key outright, which is the complementary half.
          bs=""
          queue="$( { git ls-files '*build.rs' || true; } )"
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              case " $bs " in *" $f "*) continue ;; esac
              bs="$bs $f"
              d="$(dirname "$f")"
              stem="${f%.rs}"
              mods=$( { grep -hoE '^[[:space:]]*(pub[[:space:]]+)?mod[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*;' "$f" || true; } \
                      | sed -E 's/^.*mod[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*;.*$/\1/' )
              for m in $mods; do
                for cand in "$d/$m.rs" "$d/$m/mod.rs" "$stem/$m.rs" "$stem/$m/mod.rs"; do
                  if [ -n "$( { git ls-files -- "$cand" || true; } )" ]; then
                    next="$next $cand"
                  fi
                done
              done
            done
            queue="$next"
          done
          echo "every file compiled into a build script:"
          if [ -z "$bs" ]; then
            echo "  none — no tracked build.rs"
          else
            printf '  %s\n' $bs

            # WHITESPACE IS NOT SIGNIFICANT IN A RUST PATH, and the two fixed
            # strings this used to grep for were therefore trivially evadable: a
            # build script written `std :: process :: Command :: new("npm")`
            # compiles, spawns, and matched NEITHER needle. Measured against a
            # real file. These patterns allow optional whitespace at every
            # separator. `::[[:space:]]*Command` is the third spelling and it is
            # there for the alias: `use std::process as p;` then
            # `p::Command::new(...)` defeats a pattern anchored on the word
            # `process`, and nothing defeats the type's own name. The three
            # verbs are the calls that actually start the child.
            hits=$( { printf '%s\n' $bs | xargs grep -HnE \
                     -e 'Command[[:space:]]*::[[:space:]]*new' \
                     -e '::[[:space:]]*Command' \
                     -e 'process[[:space:]]*::[[:space:]]*Command' \
                     -e '\.[[:space:]]*(spawn|output|status)[[:space:]]*\(' || true; } )

            # AND `std::process` ON ITS OWN IS NOT ONE OF THEM ANY MORE, because
            # widening the file set turned that pattern into a false refusal.
            # `crates/cli/build_provenance.rs` calls `std::process::id()` inside
            # its `#[cfg(test)]` module, to put a unique number in a temp
            # directory name. It returns THIS process's pid. It starts nothing,
            # and the old pattern refused it.
            #
            # So the exemption is a NAMED LIST of `std::process` members that
            # cannot start a child — the pid, the two ways this process ends,
            # and the three types a `main` returns — and EVERY OTHER member of
            # that module is still a refusal, `Command` above all. That is the
            # opposite of loosening the rule: before this, `std::process`
            # matched as a prefix and said nothing about which member was used.
            #
            # `grep -o` extracts each `std::process::<member>` occurrence on its
            # own line, so the filter drops OCCURRENCES and not lines: a line
            # carrying `std::process::id()` and a real spawn beside it is still
            # refused.
            pm=$( { printf '%s\n' $bs | xargs grep -HonE \
                    'std[[:space:]]*::[[:space:]]*process[[:space:]]*::[[:space:]]*[A-Za-z_][A-Za-z0-9_]*' || true; } \
                  | { grep -vE '::[[:space:]]*(id|exit|abort|ExitCode|ExitStatus|Termination)$' || true; } )

            found=$( { printf '%s\n%s\n' "$hits" "$pm" | grep . || true; } )
            if [ -n "$found" ]; then
              printf 'BUILD SCRIPT INVOKES AN EXTERNAL PROCESS:\n%s\n' "$found"
              echo "A build script is Rust, so gate 1 passes it — and then it runs"
              echo "something else. That is the side door. See CLAUDE.md section 2."
              bad=1
            fi
          fi

          # THE GLOB ABOVE KEYS ON A FILENAME, AND THE FILENAME IS ONLY A
          # DEFAULT. `build.rs` is what cargo looks for when a manifest says
          # nothing; a manifest that says `build = "gen.rs"` gets a build script
          # called `gen.rs`, and every check in this repository that spells the
          # name out walks straight past it. Two of them do: this glob, and gate
          # 13 layer 3's `$NF == "build.rs"`. One `build =` line defeats both,
          # and the file it names is a `.rs` that gate 1's extension allowlist
          # welcomes.
          #
          # So the KEY is refused, not just the name. `build =` is refused
          # because CLAUDE.md §2 bans "any `build.rs` that invokes an external
          # process" and gate 13 layer 3 goes further and bans the script
          # existing at all -- neither ban means anything if the script can be
          # renamed out of sight. `links =` is refused with it because a `links`
          # key declares that the package links a native library and cargo
          # REQUIRES a build script to accompany it: it is a build script and a
          # foreign-language dependency announced in one line.
          #
          # Comments stripped first, the same way gate 13 layer 1 strips them and
          # for the same reason -- these manifests discuss the rules they obey,
          # at length, and a rule that refuses its own justification is a rule
          # somebody deletes. The cost, stated: a `#` inside a quoted value
          # truncates its line, which can only cause a MISS and never a false
          # refusal.
          #
          # WHAT THIS DOES NOT COVER. A build script cargo picks up from the
          # DEFAULT path with no manifest key is caught by the glob above and by
          # gate 13 layer 3, not by this clause; the two halves are complementary
          # and neither is sufficient alone.
          #
          # The path list is narrowed with grep and not with a `case`, because a
          # `case` pattern's `)` inside a `$( ... )` is a bash 3.2 parse error --
          # `syntax error near unexpected token ;;`. The runner has bash 5, so
          # this would have been green in CI and red on the operator's own Mac,
          # which is the worst way for a gate to disagree with itself. The glob
          # `*Cargo.toml` also matches `NotCargo.toml`; the grep pins the
          # basename exactly.
          keys=$( { git ls-files '*Cargo.toml' \
                    | { grep -E '(^|/)Cargo\.toml$' || true; } \
                    | while IFS= read -r m; do
                        awk -v F="$m" '{ l = $0; sub(/#.*$/, "", l); print F ":" NR ":" l }' "$m"
                      done \
                    | grep -E ':[[:space:]]*(build|links)[[:space:]]*=' || true; } )
          if [ -n "$keys" ]; then
            printf 'A MANIFEST NAMES A BUILD SCRIPT OR A NATIVE LIBRARY:\n%s\n' "$keys"
            echo 'A `build =` key renames the script out of every filename check'
            echo 'in this file, and a `links =` key requires one to exist at all.'
            echo 'Nothing here needs either: there is no C to compile, no protocol'
            echo 'to generate from, and no version to stamp that'
            echo 'env!("CARGO_PKG_VERSION") does not already carry.'
            echo "See CLAUDE.md section 2 and gate 13 layer 3."
            bad=1
          fi

          [ "$bad" -eq 0 ] || exit 1
          echo "OK — no build script invokes an external process, and no manifest"
          echo "     names one under another filename."

      - name: Gate 9 — core depends on nothing
        run: |
          set -euo pipefail
          # docs/01-architecture.md gives core "May depend on: nothing". Gate 7
          # guards crates/web, but web's single allowed dependency IS core --
          # so a dependency added to core is silently forced into a wasm32
          # build where the filesystem does not exist. Without this gate the
          # architecture's most load-bearing arrow is a convention.
          #
          # AND FOR THE WHOLE LIFE OF THIS GATE IT READ ONE SPELLING OF FOUR.
          # The parse was `name =` at line start inside a flat `[dependencies]`
          # table. Cargo accepts four ways to say the same thing:
          #
          #   store = { path = "../store" }    the only form the awk could see
          #   store.path = "../store"          a dotted key, same meaning
          #   [dependencies.store]             a table header, same meaning
          #   [dev-dependencies] / [build-dependencies] /
          #   [target.'cfg(unix)'.dependencies]      all three LINK
          #
          # THIS IS MEASURED, NOT FEARED. `crates/core/tests/graph.rs` records
          # that one `[dependencies.store]` stanza "defeated NINE guarantees at
          # once", and names gate 9 as one of the nine: the awk printed nothing
          # for that stanza, and printing nothing is exactly how this step used
          # to say "core depends on nothing". A pass and a bypass spelled
          # identically is the worst shape a gate can have.
          #
          # A shell cannot parse TOML and this gate is not going to pretend it
          # can. It does what gate 22 clause A1 does instead: REFUSE every
          # spelling the extractor cannot read, so that with the refusal held
          # the extractor is a COMPLETE parse rather than a hopeful one. Here
          # refusing is doubly right -- three of those four spellings declare a
          # dependency and core may declare none of any kind. The authoritative
          # parser is Rust: `declarations` in crates/core/tests/graph.rs handles
          # all four and is tested against all four.
          f=crates/core/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          # Comments stripped first, and this manifest needs it: the empty
          # `[dependencies]` table is introduced by a comment block that spells
          # the rule out at length. Text in a comment is text -- the defect that
          # took gate 17, gate 1d and gate 22 clause A1 red in turn. The limit is
          # the one graph.rs states about itself: a `#` inside a quoted value
          # truncates its line. No manifest here has one, and a dependency name
          # cannot contain one.
          code=$(sed 's/#.*//' "$f")
          bad=0
          for spelling in '^\[dependencies\.' '^\[dev-dependencies' \
                          '^\[build-dependencies' '^\[target\.'; do
            if printf '%s\n' "$code" | grep -qE "$spelling"; then
              printf 'REFUSED  %s uses a dependency table this gate refuses outright: %s\n' \
                "$f" "$spelling"
              bad=1
            fi
          done
          # A dotted key inside the flat table declares a dependency the
          # extractor below would read as a crate named `store.path` and then
          # fail to match against anything.
          if printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
             | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+ *='; then
            printf 'REFUSED  %s declares a dependency with a dotted key\n' "$f"
            bad=1
          fi
          # With those held, this is every dependency the manifest declares.
          # `|| true` is load-bearing: core declares NOTHING, so grep exits 1,
          # and under `set -o pipefail` that killed the step before it printed a
          # line -- an exit 1 with no output, indistinguishable from a real
          # refusal. Gate 22 clause A2 was red for precisely that.
          deps=$(printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
                 | { grep -oE '^[A-Za-z0-9_-]+ *=' || true; } \
                 | sed 's/ *=//' | sort -u)
          if [ -n "$deps" ]; then
            printf 'crates/core MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "core is compiled to wasm32 through crates/web. See D-0009."
            echo "THE DEV-DEPENDENCY REFUSAL IS NOT A TECHNICALITY. This step had"
            echo "no dev-dependency clause at all, so a flat [dev-dependencies]"
            echo "table in crates/core passed it in silence. A dev-dependency is"
            echo "compiled into every test and every bench, so a crate that"
            echo "declares one CAN REACH IT whatever the shipping graph says --"
            echo "which is why graph.rs reads all three linking tables and why"
            echo "all three are refused here."
            exit 1
          fi
          # WHAT THIS STILL CANNOT SEE, because a gate that oversells itself is
          # worse than no gate: a dependency inherited from the workspace root by
          # a member that names it, and any dependency reached through a
          # `[patch]` or `[replace]` rename. Gate 13 layers 1 and 2 are what walk
          # the root manifest and the lock; this step reads one file.
          echo "OK — core declares no dependency of any kind, in any spelling."
      - name: Gate 9b — greeks depends on nothing
        run: |
          set -euo pipefail
          # Same shape as gate 9, for the same reason and a different consumer.
          # crates/greeks is taken by the `tickvault` repository by git URL, so
          # a dependency added here is a dependency forced on a repository that
          # is not this one -- and a type from this workspace in its public
          # surface makes it unusable there outright.
          #
          # Until this gate existed the property was advertised in six places
          # and enforced in none. `crates/greeks/tests/standalone.rs` was named
          # as the proof and cannot be: an integration test fails only on items
          # it NAMES, so a leaked type it does not name is invisible to it, and
          # a `pub use` adds zero code regions so the coverage gate cannot see
          # one either. Both were verified by breaking the property in a copy
          # of this workspace outside the repository -- clippy, the full test
          # suite and 100% coverage all stayed green. See D-0046.
          #
          # No untrusted input reaches this step: the inputs are a tracked
          # manifest path, `git ls-files` and static patterns. Nothing from the
          # event payload is expanded.
          #
          # AND IT INHERITED GATE 9'S PARSE, SO IT INHERITED GATE 9'S HOLE. The
          # extraction read `name =` at line start inside a flat `[dependencies]`
          # table, which is one of the four spellings Cargo accepts; a
          # `[dependencies.serde]` stanza printed NOTHING and this step said
          # "greeks depends on nothing" over a greeks that did.
          # `crates/core/tests/graph.rs` names gate 9b among the nine guarantees
          # a single such stanza defeated. The dev-dependency clause below had
          # the same shape and therefore the same hole.
          #
          # The repair is gate 22 clause A1's, carried across unchanged in
          # spirit: REFUSE the spellings a shell cannot parse instead of
          # pretending to parse them. For this crate the refusal is not a
          # compromise at all -- greeks may declare NO dependency in ANY table,
          # so a `[dev-dependencies]` or `[target.'cfg(unix)'.dependencies]`
          # header is itself the violation and there is nothing left to read
          # inside it. That is why the separate dev-dependency parse below is
          # gone rather than fixed: it is now one line in the refusal list, and
          # `[build-dependencies]` and `[target.*]` came free with it.
          #
          # A DEV-DEPENDENCY IS NOT A LESSER VIOLATION HERE, which is the reason
          # the old clause existed and the reason its replacement must be at
          # least as strong: it is not forced on a consumer, but it IS forced on
          # anyone who runs this crate's tests, and this crate's tests are part
          # of what `tickvault` takes by git URL.
          f=crates/greeks/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          # Comments stripped first. This manifest's comment block discusses
          # `[dependencies]` and `[dev-dependencies]` by name, at length, and
          # explains why both are empty -- so an unstripped scan would refuse the
          # crate over its own justification. Text in a comment is text. The
          # limit is the one graph.rs states: a `#` inside a quoted value
          # truncates its line, and no manifest here has one.
          code=$(sed 's/#.*//' "$f")
          bad=0
          for spelling in '^\[dependencies\.' '^\[dev-dependencies' \
                          '^\[build-dependencies' '^\[target\.'; do
            if printf '%s\n' "$code" | grep -qE "$spelling"; then
              printf 'REFUSED  %s uses a dependency table this gate refuses outright: %s\n' \
                "$f" "$spelling"
              bad=1
            fi
          done
          if printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
             | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+ *='; then
            printf 'REFUSED  %s declares a dependency with a dotted key\n' "$f"
            bad=1
          fi
          # With those held this is a complete parse. `|| true` is load-bearing
          # for the same reason it is in gate 22 clause A2: greeks declares
          # nothing, grep exits 1, and `set -o pipefail` would kill the step with
          # no output at all -- a silent exit 1 that reads exactly like a real
          # refusal, and had the polarity been the other way it would have passed
          # forever having checked nothing.
          deps=$(printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
                 | { grep -oE '^[A-Za-z0-9_-]+ *=' || true; } \
                 | sed 's/ *=//' | sort -u)
          if [ -n "$deps" ]; then
            printf 'crates/greeks MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "It is shared with another repository by git URL. See D-0046."
            exit 1
          fi
          # The public surface names no type from this workspace. Every other
          # crate here is reachable only by its package name, so naming one at
          # all is the leak -- including through a re-export, which is the case
          # standalone.rs cannot see.
          leaks=$(git ls-files 'crates/greeks/**/*.rs' \
                  | xargs -r grep -nE '\b(brutex_core|core::(price|instrument|universe|vendor))\b' \
                  || true)
          if [ -n "$leaks" ]; then
            printf 'A WORKSPACE TYPE APPEARS IN crates/greeks:\n%s\n' "$leaks"
            exit 1
          fi
          echo "OK — greeks depends on nothing and names no workspace type."

      - name: Gate 10b — no invariant identifier means two things
        run: |
          set -euo pipefail
          # docs/04-invariants.md carried I-16 through I-22 TWICE, in two
          # tables, with different claims and different tests. An identifier
          # that resolves to two invariants cannot be cited unambiguously in a
          # decision entry, and CLAUDE.md section 3.8 requires history to be
          # append-only -- identifiers are never renumbered or reused.
          #
          # Gate 10 could not see it: it walks rows -> tests and never asks
          # whether a row is uniquely named. See D-0329.
          f=docs/04-invariants.md
          dups=$(grep -oE '^\| [A-Z]+-[0-9]+[a-z]? ' "$f" \
                 | tr -d '| ' | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            printf 'INVARIANT IDENTIFIER DEFINED MORE THAN ONCE:\n%s\n' "$dups"
            echo
            echo "Give the LATER row an unused number. Never renumber the"
            echo "earlier one -- that rewrites history. See D-0329."
            exit 1
          fi
          echo "OK — every invariant identifier is unique."

      - name: Gate 7 — the browser crate depends on core alone
        run: |
          set -euo pipefail
          # `crates/web` no longer exists: D-0052 moved the browser code to
          # `web/`, where it is no longer a crate at all and so has no
          # Cargo.toml and no dependency line to police. The check is kept
          # rather than deleted because the INVARIANT it guards -- the browser
          # code reaches only for `core` -- outlives the layout, and a crate of
          # this name reappearing must be held to it again. The skip below is
          # therefore the correct outcome today, not a gap.
          f=crates/web/Cargo.toml
          [ -f "$f" ] || { echo "skip — crates/web does not exist (D-0052 moved it to web/)"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          extra=$(printf '%s\n' "$deps" | grep -v '^core$' || true)
          if [ -n "$extra" ]; then
            printf 'crates/web MAY ONLY DEPEND ON core. Found:\n%s\n' "$extra"
            echo "It compiles to wasm32 where the filesystem does not exist."
            exit 1
          fi
          echo "OK."

      - name: Gate 13 — no foreign runtime, not even through a dependency
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 forbids "any interpreted
          # runtime, as a dependency, a dev-dependency, or a tool" and "any
          # vendored binding to another language", WITHOUT EXCEPTION. Gate 1
          # enforces section 2 by walking tracked file EXTENSIONS — and a
          # binding does not arrive as an extension. It arrives as one line in
          # a Cargo.toml, which is a `.toml` and passes gate 1 without a
          # murmur; or, worse, as a TRANSITIVE package in Cargo.lock that
          # nobody typed at all and nobody reads. The route is concrete rather
          # than hypothetical: the cost calculator landing in crates/costs is
          # lifted from a predecessor repository whose manifest declared
          # exactly such a binding library. Until this step, the ban was
          # unenforced against the one path a violation was most likely to
          # take.
          #
          # WHY `cargo deny` IS NOT ENOUGH ON ITS OWN. Gate 3 runs
          # `cargo deny check` and deny.toml carries a [bans] list, and that
          # list IS enforced — proven differentially, not assumed: a workspace
          # holding a package by a banned name exits 2 with the entry present
          # and 0 with the entry removed. Three gaps remain anyway.
          #   1. Gate 3 lives in the `build` job, which NEEDS this one. A
          #      violation would otherwise burn a toolchain install, a fetch
          #      and a full compile before anybody hears about it.
          #   2. cargo-deny resolves only the three targets in deny.toml's
          #      [graph]. A dependency conditional on a fourth is invisible to
          #      it. It is not invisible to a text scan of the lock, because
          #      Cargo.lock lists every package for every target.
          #   3. deny.toml is an ordinary tracked file, and one deleted line
          #      disarms it with every other gate still green. Layer 4 below
          #      guards that file the way gate 11 rule 5b guards the clippy
          #      lint table.
          #
          # THE WORD ITSELF IS GATE 15's JOB, not this one's. Gate 15 walks
          # every tracked file — Cargo.toml and Cargo.lock included — for the
          # assembled token, so this step does not repeat that trick. One copy
          # of a fragile mechanism is safer than two.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`
          # and the static lists below — gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly because a gate that oversells
          # itself is worse than no gate:
          #   * A binding published under a name that is not on the list. The
          #     list is finite and the ecosystem is not. deny.toml's
          #     `unknown-registry = "deny"` plus the workspace dependency table
          #     are the controls for the general case; this is the control for
          #     the named ones.
          #   * A C or Lua source tree vendored in WITHOUT a manifest entry.
          #     Gate 1's extension allowlist is what refuses that, and it
          #     already does.
          #   * Anything untracked. `git ls-files` is the input, which is right
          #     for CI — the checkout holds only tracked files — and means a
          #     local run disagrees with CI until `git add`.
          #   * A rename performed inside a `[patch]` or `[replace]` table. The
          #     package NAME still has to appear for cargo to resolve it, so
          #     the name rules catch the ordinary case, but the aliasing is not
          #     modelled.
          #   * Whether a crate that is NOT on the list embeds a runtime.
          #     Nothing textual can decide that.

          # ---- the names, and how the list was built. -----------------------
          # Every name below returned HTTP 200 from
          # https://crates.io/api/v1/crates/<name> when this gate was written.
          # A ban list is worth exactly the crates it can actually stop, and a
          # misspelled entry stops nothing while reading as protection.
          #
          # The thirteen the operator named are all present. The rest are the
          # same class and are here because renaming is the obvious way round a
          # short list: `rusty_v8` and `quickjs-rs` are the former names of `v8`
          # and `rquickjs`; `magnus` and `rutie` sit beside `ruby-sys`;
          # `ext-php-rs` is the PHP one; and `lua-src` / `luajit-src` are the
          # crates that COMPILE the Lua interpreter from its own C sources,
          # which is the floor `mlua` stands on.
          #
          # DELIBERATELY ABSENT, so the holes are written down rather than
          # discovered later:
          #   * `wasmtime` and every other WebAssembly runtime, AND the three
          #     JavaScript binding crates `wasm-bindgen`, `js-sys`, `web-sys`.
          #
          #     THIS ENTRY USED TO GIVE A REASON THAT IS NO LONGER TRUE, and it
          #     is corrected rather than quietly reworded. It read: "wasm32 is a
          #     COMPILATION TARGET of this workspace -- crates/web, gate 7 --
          #     not a foreign language. Banning the runtime for the target we
          #     ship to would be nonsense."
          #
          #     `crates/web` DOES NOT EXIST. D-0052 and D-0053 moved the front
          #     end to `web/` as an unrestricted directory, CLAUDE.md section 5
          #     says so outright and adds that GATE 7 SKIPS PERMANENTLY, and no
          #     manifest in this workspace names a wasm32 target. "The target we
          #     ship to" named nothing at all. D-0298.
          #
          #     What is true, measured 2026-08-26: the three binding crates ARE
          #     in `Cargo.lock` -- seven entries across the `wasm-bindgen`
          #     family plus `js-sys` and `web-sys` -- and NONE is in the build
          #     graph. They arrive only through target-gated paths,
          #     `lake -> parquet -> chrono -> iana-time-zone` and
          #     `api -> pull -> reqwest`. The proof is one command:
          #
          #       cargo tree --workspace -i wasm-bindgen   # "nothing to print"
          #
          #     SO THIS CLASS IS UNGUARDED BY NAME, DELIBERATELY, and here is
          #     why banning it would be worse than not: the lock layer greps
          #     `Cargo.lock` for the family, would find those seven, and would
          #     need `allow_lock='Cargo.lock 7'` on the same day. That is the
          #     "allowlisted into silence" failure the next bullet names, and it
          #     would not even guard the real risk -- a crate newly reaching
          #     `js-sys` on the host does not change a lock count that already
          #     reads one.
          #
          #     The check that guards it is Gate 13a in the `build` job:
          #     `cargo tree -i` over the current host graph. It cannot live in
          #     THIS job because this job deliberately installs no toolchain --
          #     "no toolchain, no cache, seconds". Gate 13a keeps lock-only,
          #     target-gated entries legal while refusing any of the three that
          #     becomes reachable by a host build. D-0486.
          #   * `cpp`, `inline-c`, `tcl`. The family rule below also matches
          #     `<name>-*` and `<name>_*`, and `cpp_demangle` is a pure-Rust
          #     symbol demangler that arrives transitively behind `addr2line`.
          #     A gate that is wrong in the false-positive direction is a gate
          #     that gets allowlisted into silence.
          banned='
          pyo3
          mlua rlua hlua lua-src luajit-src
          rquickjs quickjs-rs duktape boa_engine deno_core v8 rusty_v8
          neon node-bindgen
          jni
          ruby-sys magnus rutie
          ext-php-rs
          '

          # THE ESCAPE HATCHES ARE HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism — no magic comment scattered
          # through crates/. One allowlist PER LAYER, so a justification
          # written for a manifest cannot silently excuse the lock, which is
          # the layer a transitive violation hides in. All three ship EMPTY,
          # and all three are audited for staleness at the end of this step.
          allow_decl=''
          allow_lock=''
          # ONE ENTRY, AND LAYER 3'S OWN COMMENT PRESCRIBES HOW IT IS TAKEN:
          # "The allowlist below is the escape, and taking it should come with a
          # decisions entry." D-0348 is that entry.
          #
          # The clause layer 3 rests on is the one that expired. It reads "there
          # is no C to compile, no protocol to generate from, no version to stamp
          # that CARGO_PKG_VERSION does not already carry" -- and CLAUDE.md
          # section 3 rule 3 requires the COMMIT, which no cargo variable
          # carries. `cli::commit_stamp()` is `option_env!("BRUTEX_COMMIT")`, so
          # a build nobody stamped by hand refuses every sweep.
          #
          # That was not theoretical. `docs/07-plan.md` section 0 states the
          # whole procedure as "press Run on the api binary" in IntelliJ, and
          # records that IntelliJ takes its run entries from `.idea/` or
          # `.run/*.xml`, NEITHER TRACKED -- and `.xml` is not in CLAUDE.md
          # section 2's extension allowlist, so this repository cannot ship one.
          # The IDE auto-detects the binary and runs it with no environment.
          # Measured on the operator's machine across two restarts, on 81 months
          # of pulled Zerodha NIFTY: the server served every page and swept
          # nothing. The launcher could not be the fix, so the build is.
          #
          # WHAT THE SCRIPT MAY STILL NOT DO IS UNCHANGED. Gate 2 greps every
          # build.rs for `Command::new` and `std::process` and is not relaxed;
          # `crates/cli/build.rs` contains neither and reads git's own files.
          # Gate 2's second clause -- `build =` or `links =` in a manifest -- is
          # also untouched, and this script is picked up from the DEFAULT path so
          # no manifest names it. A second build script, or this one growing a
          # process, is still a red build.
          #
          # THREE ENTRIES, AND THEY ARE ONE BUILD SCRIPT. `crates/cli/build.rs`
          # declares `mod build_provenance;` and `mod commit_stamp;`; both files
          # sit beside it and both are compiled into the script cargo runs.
          # Layer 3 used to see only the root, so the two modules were 61,259 of
          # the 66,459 bytes that execute before this workspace compiles and no
          # allowlist accounted for a byte of them. They are named here for the
          # same reason the root is: this list is what a reader consults to
          # learn what the one permitted build script consists of, and a FOURTH
          # file joining it is now a red build that someone has to justify. That
          # is the whole point of the entry — D-0348 permitted a build script,
          # not an open-ended set of files.
          allow_build='crates/cli/build.rs 1
          crates/cli/build_provenance.rs 1
          crates/cli/commit_stamp.rs 1'

          work=$(mktemp -d)
          bad=0

          # `path:line:text` records compared against a `path count` allowlist.
          # Identical in shape to gates 11 and 12 on purpose: one mechanism to
          # learn, and adding a line anywhere is a visible diff.
          verdict() {
            layer="$1"; hits="$2"; allow="$3"
            for f in $( { printf '%s\n' "$hits" | grep . | cut -d: -f1 | sort -u; } || true ); do
              c=$( { printf '%s\n' "$hits" | grep -c "^${f}:" || true; } | tr -d ' ')
              a=$( { printf '%s\n' "$allow" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
              [ -n "$a" ] || a=0
              if [ "$c" -gt "$a" ]; then
                printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
                { printf '%s\n' "$hits" | grep "^${f}:" | sed 's/^/             /' | head -8; } || true
                bad=1
              else
                printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
              fi
            done
            # An entry naming a file that is gone makes this gate read stronger
            # than it is, so it is a FAILURE. An entry whose file no longer
            # matches is only loose, and says so.
            for p in $( { printf '%s\n' "$allow" | awk 'NF{print $1}'; } || true ); do
              if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
                bad=1
              elif ! printf '%s\n' "$hits" | grep -q "^${p}:"; then
                printf '  ::warning title=Gate 13 allowlist is loose::'
                printf '%s no longer matches layer %s — drop the entry\n' "$p" "$layer"
              fi
            done
            :
          }

          # ---- layer 1: no manifest DECLARES one. ---------------------------
          # EVERY tracked Cargo.toml, the root one included. Checking only
          # crates/ would miss the half that matters: [workspace.dependencies]
          # is where a shared dependency actually lands, and a member then
          # writes nothing but `name = { workspace = true }`.
          #
          # Comments are stripped first — everything from the first `#` — so
          # the prose in these manifests, which discusses banned names BY NAME,
          # is not itself a violation. The cost is that a `#` inside a string
          # truncates its line; no manifest here has one, and a truncated line
          # can only cause a MISS inside a comment, never a false refusal.
          decl="$work/decl"; : > "$decl"
          nt=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "${f##*/}" in Cargo.toml) ;; *) continue ;; esac
            nt=$((nt + 1))
            awk -v F="$f" '{ l = $0; sub(/#.*$/, "", l); print F":"NR":"l }' "$f" >> "$decl"
          done < <(git ls-files '*Cargo.toml')

          # ---- layer 2: nothing in the LOCK either. -------------------------
          # A transitive pull is the same violation one level down and much
          # harder to notice, which makes it the dangerous one. The lock is
          # matched on its package-name lines only — `name = "x"` at the start
          # of a [[package]] stanza. The `dependencies = [ ... ]` arrays are
          # not matched and do not need to be: every name in one of those
          # arrays has its own [[package]] stanza in the same file, by the
          # format's own definition.
          lockc="$work/lock"; : > "$lockc"
          nl=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            nl=$((nl + 1))
            awk -v F="$f" '{ print F":"NR":"$0 }' "$f" >> "$lockc"
          done < <(git ls-files '*Cargo.lock')

          nb=$( { printf '%s\n' $banned | grep -c . || true; } | tr -d ' ')
          echo "walked ${nt} tracked Cargo.toml and ${nl} tracked Cargo.lock"
          echo "  $(awk 'END{print NR}' "$decl") manifest line(s) after comment stripping"
          echo "  $(awk 'END{print NR}' "$lockc") lock line(s)"
          echo "  ${nb} banned crate name(s), each matched with its -* and _* family"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$nt" -eq 0 ]; then
            echo "GATE 13 WALKED NO MANIFEST. A repository with no Cargo.toml is"
            echo "not a Rust workspace; a silent zero is not a pass."
            exit 1
          fi
          if [ "$nl" -eq 0 ]; then
            echo "GATE 13 WALKED NO LOCK FILE. Cargo.lock is the ONLY place a"
            echo "transitive binding is visible, and gate 4 builds --locked."
            echo "An untracked lock disarms the layer that matters most."
            exit 1
          fi

          dh=''; lh=''
          for n in $banned; do
            fam="(${n}|${n}[-_][A-Za-z0-9_-]+)"
            # A dependency key: `n = ...`, `n.workspace = ...`, or the inline
            # form `dependencies = { n = ... }`. Preceded by any non-name
            # character, which the corpus prefix's own `:` also satisfies.
            d1="[^A-Za-z0-9_-]${fam}(\.[A-Za-z_-]+)?[[:space:]]*="
            # A dependency TABLE header: [dependencies.n], [dev-dependencies.n],
            # [build-dependencies.n], [workspace.dependencies.n], and the
            # [target.'cfg(...)'.dependencies.n] shape.
            d2="\[[^]]*dependencies[^]]*\.${fam}\]"
            # A RENAMED dependency: `alias = { package = "n", ... }`. Without
            # this, one word defeats the whole gate.
            d3="package[[:space:]]*=[[:space:]]*\"${fam}\""
            h=$( { grep -E "${d1}|${d2}|${d3}" "$decl" || true; } )
            [ -z "$h" ] || dh="${dh}${h}
          "
            h=$( { grep -E ":name[[:space:]]*=[[:space:]]*\"${fam}\"" "$lockc" || true; } )
            [ -z "$h" ] || lh="${lh}${h}
          "
          done

          echo
          echo "layer 1: a manifest declares a binding or an embedded runtime"
          if [ -z "$( { printf '%s\n' "$dh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 1 "$dh" "$allow_decl"

          echo
          echo "layer 2: the lock resolves one, directly or transitively"
          if [ -z "$( { printf '%s\n' "$lh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 2 "$lh" "$allow_lock"

          # ---- layer 3: no build script EXISTS. -----------------------------
          # Gate 2 asks the narrower question — does a build script shell out —
          # and keeps asking it. This asks the simpler one. A build script is
          # arbitrary code that runs on every developer's machine and on every
          # runner before a single line of this workspace is compiled, and
          # "does it shell out" is decided by a text scan that indirection
          # beats. Nothing in this repository needs one: there is no C to
          # compile, no protocol to generate from, no version to stamp that
          # `env!("CARGO_PKG_VERSION")` does not already carry.
          #
          # THIS IS STRICTER THAN CLAUDE.md SECTION 2, WHICH SAYS "any build.rs
          # that invokes an external process". The stricter reading is
          # deliberate and is the operator's instruction; it is recorded here
          # rather than in a review comment so the difference is visible. The
          # allowlist below is the escape, and taking it should come with a
          # decisions entry.
          bh=$( { git ls-files | awk -F/ '$NF == "build.rs" { print $0 ":1:a build script exists" }'; } || true )

          # AND A BUILD SCRIPT IS NOT ONE FILE. `$NF == "build.rs"` reports the
          # ROOT of the script and nothing the root declares.
          # `crates/cli/build.rs` says `mod build_provenance;` and
          # `mod commit_stamp;` on two consecutive lines; both files sit beside
          # it and both are compiled into the script cargo runs, and neither has
          # ever been reported by this layer or accounted for by its allowlist.
          # Layer 3's rule is that the script EXISTS, so the files it is MADE OF
          # are this layer's subject exactly as its root is — otherwise a third
          # module joins the one permitted build script and nothing here notices.
          # Gate 2's `*build.rs` glob had the identical hole and is widened the
          # same way in the same commit.
          #
          # Four resolutions are tried per `mod NAME;` — `<dir>/NAME.rs` and
          # `<dir>/NAME/mod.rs`, which is where rustc looks from a crate root,
          # and the same pair under the declaring file's own stem, which is where
          # it looks from anywhere else. Only TRACKED candidates join: an
          # untracked file is not what CI compiles.
          bs=""
          roots="$( { git ls-files | awk -F/ '$NF == "build.rs" { print $0 }'; } || true )"
          queue="$roots"
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              case " $bs " in *" $f "*) continue ;; esac
              bs="$bs $f"
              bd="$(dirname "$f")"
              bstem="${f%.rs}"
              bmods=$( { grep -hoE '^[[:space:]]*(pub[[:space:]]+)?mod[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*;' "$f" || true; } \
                       | sed -E 's/^.*mod[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*;.*$/\1/' )
              for m in $bmods; do
                for cand in "$bd/$m.rs" "$bd/$m/mod.rs" "$bstem/$m.rs" "$bstem/$m/mod.rs"; do
                  if [ -n "$( { git ls-files -- "$cand" || true; } )" ]; then
                    next="$next $cand"
                  fi
                done
              done
            done
            queue="$next"
          done
          rootset=" $( printf '%s ' $roots ) "
          for f in $bs; do
            case "$rootset" in
              *" $f "*) ;;
              *) bh=$( { printf '%s\n%s\n' "$bh" "$f:1:a module compiled into a build script" | grep . || true; } ) ;;
            esac
          done

          # AND THE SCRIPT NEED NOT BE CALLED `build.rs`. `$NF == "build.rs"`
          # reads the DEFAULT filename; a manifest that says `build = "gen.rs"`
          # renames the script straight out of this layer, and the file it names
          # is a `.rs` that gate 1's extension allowlist welcomes. Gate 2's
          # `*build.rs` glob had the identical hole and is closed in the same
          # commit -- one `build =` line used to defeat both checks at once.
          #
          # `$decl` is already the comment-stripped corpus of every tracked
          # manifest that layer 1 walks, so the key costs one grep and arrives in
          # the `path:line:text` shape `verdict` reads. `links =` rides along
          # because a package that declares one is a package cargo REQUIRES a
          # build script for -- it is this layer's subject announced in a
          # different word.
          bk=$( { grep -E ':[[:space:]]*(build|links)[[:space:]]*=' "$decl" || true; } )
          if [ -n "$bk" ]; then
            bh=$( { printf '%s\n%s\n' "$bh" "$bk" | grep . || true; } )
          fi
          echo
          echo "layer 3: a build script exists anywhere in the tree, by file or by manifest key"
          if [ -z "$( { printf '%s\n' "$bh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 3 "$bh" "$allow_build"

          # ---- layer 4: the second line of defence is still armed. ----------
          echo
          echo "layer 4: deny.toml and the step that runs it"
          d=deny.toml
          if ! git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
            echo "  REFUSED  deny.toml is not tracked — gate 3 has no policy to read"
            bad=1
          else
            if grep -qE '^[[:space:]]*wildcards[[:space:]]*=[[:space:]]*"deny"' "$d"; then
              echo '  present  deny.toml sets wildcards = "deny"'
            else
              echo '  REFUSED  deny.toml no longer sets wildcards = "deny"'
              echo '           Every path dependency in this workspace carries a'
              echo '           version BECAUSE of that line — crates/api and'
              echo '           crates/pull both say so in their manifests. Removing'
              echo '           it turns those comments into false claims.'
              bad=1
            fi
            # PINNED AT WHAT deny.toml CARRIES TODAY. A name on this line that
            # disappears from deny.toml is a red build: that is the guard-the-
            # guard half, and it is the same argument gate 11 rule 5b makes
            # about the clippy lint table. Names on THIS gate's list that
            # deny.toml has never carried are a WARNING and not a failure — the
            # scan above is the primary control for them, cargo-deny is the
            # second, and making this step red for a file it does not own would
            # teach a reader to ignore it.
            must='pyo3 mlua rlua deno_core v8 rusty_v8 quickjs-rs boa_engine node-bindgen neon jni'
            for n in $must; do
              if grep -qE "name[[:space:]]*=[[:space:]]*\"${n}\"" "$d"; then
                printf '  present  deny.toml bans %s\n' "$n"
              else
                printf '  REFUSED  deny.toml no longer bans %s\n' "$n"
                bad=1
              fi
            done
            for n in $banned; do
              case " $must " in *" $n "*) continue ;; esac
              if ! grep -qE "name[[:space:]]*=[[:space:]]*\"${n}\"" "$d"; then
                printf '  ::warning title=Gate 13 is ahead of deny.toml::'
                printf 'this gate refuses %s and deny.toml does not list it\n' "$n"
              fi
            done
          fi
          # Is cargo-deny actually RUN, and at a pinned version? Gate 3's own
          # comment argues both, and a comment cannot enforce itself. Both
          # patterns are ANCHORED to a whole line, which is exactly what stops
          # this check from being satisfied by the two lines you are reading:
          # they begin `if grep` and match neither anchor.
          wf=.github/workflows/ci.yml
          # A line's PRESENCE is not a line's EXECUTION, and this is the repair.
          # An audit confirmed by running it that a step carrying `if: false`
          # satisfies every grep below while the command never runs -- so all four
          # of these checks were decorative. Each pattern is now tested against the
          # enclosing STEP: the line must be there AND its step must be REACHABLE.
          #
          # `[ \t]` and not `[[:space:]]`, because the latter matches a newline and
          # would let a pattern span lines in the buffered step text.
          #
          # A job-level `if:` would disable this gate too, and a skipped job is
          # visible in the checks list rather than reported as a pass, so it is out
          # of scope here deliberately.
          runs_unconditionally () {
            awk -v pat="$1" '
              function finish() {
                if (buf ~ pat) {
                  found = 1
                  # Only an `if:` THAT CAN BE FALSE is refused, and getting here
                  # took two wrong rules. "No `if:` at all" refused the real
                  # workflow, because gate 3 legitimately carries
                  # `if: steps.probe.outputs.has_crates ==`. "No `if:` without a
                  # context reference" also refused it, because gate 8 carries
                  # `if: always()` -- constant TRUE, the opposite of a bypass.
                  #
                  # So the rule names the always-skip forms instead. `false` in any
                  # quoting, `0`, and `failure()`/`cancelled()` -- which run the step
                  # only when something has already gone wrong, and so skip it on
                  # every green run. Everything else, constant or not, is allowed.
                  n = split(buf, L, "\n")
                  for (i = 1; i <= n; i++) {
                    if (L[i] !~ /^[ \t]+if:[ \t]/) continue
                    e = L[i]
                    sub(/^[ \t]+if:[ \t]*/, "", e)
                    gsub(/\$\{\{|\}\}|[ \t]/, "", e)
                    e = tolower(e)
                    # The character class permits the quoting a YAML scalar may
                    # carry, without needing a quote literal inside this program.
                    if (e ~ /^[^a-z0-9]*(false|0|failure\(\)|cancelled\(\))[^a-z0-9]*$/) {
                      dead = 1
                    }
                  }
                }
                buf = ""
              }
              /^      - / { finish() }
              { buf = buf "\n" $0 }
              END { finish(); exit (found && !dead) ? 0 : 1 }
            ' "$wf"
          }
          if runs_unconditionally '(^|\n)[ \t]+cargo deny check[ \t]*(\n|$)'; then
            echo "  present  gate 3 invokes cargo deny check, unconditionally"
          else
            echo "  REFUSED  nothing in this workflow RUNS cargo deny check. Either"
            echo "           the line is gone or its step carries an \`if:\`."
            bad=1
          fi
          if runs_unconditionally '(^|\n)[ \t]+cargo install cargo-deny --version [0-9]'; then
            echo "  present  cargo-deny is installed at a pinned version, unconditionally"
          else
            echo "  REFUSED  cargo-deny is installed unpinned — a security verdict"
            echo "           that can change with no commit is a verdict nobody"
            echo "           can read. See D-0034."
            bad=1
          fi

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 13 FAILED."
            echo
            echo "CLAUDE.md section 2 has no exception for this. A binding does"
            echo "not become acceptable by being transitive, by being a"
            echo "dev-dependency, or by being convenient. Remove it, or write"
            echo "the allowlist line above WITH the reason and a"
            echo "docs/05-decisions.md entry beside it."
            exit 1
          fi
          echo "OK — no foreign runtime is declared, resolved, or built for."

      - name: Gate 15 — the forbidden word appears in no tracked file
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 makes Rust the only language
          # here, and the operator's rule is stricter than the extension
          # allowlist gate 1 walks: the NAME of the best-known interpreted
          # language is not to appear in this repository at all. Not as a
          # dependency, not in a comment, not in a document, not in a variable.
          # Gate 1 cannot see a word — it sees the characters after the last
          # dot. Gate 13 sees only manifests and the lock. This step walks
          # every tracked byte.
          #
          # THE TOKEN IS ASSEMBLED AT RUN TIME AND IT MUST STAY ASSEMBLED.
          # This workflow is itself a tracked file — gate 1 walks `git
          # ls-files` and `.github/workflows/ci.yml` is in that list — so a
          # gate that spelled the banned word out would refuse ITSELF on its
          # first run and every run after, and the only route back to green
          # would be to allowlist the workflow file: which would disarm the
          # ban for the one file best placed to hide things. So the word is
          # built from two halves that mean nothing apart and are the banned
          # token together.
          #
          # IF YOU ARE HERE TO "TIDY" THIS INTO A LITERAL, STOP. That single
          # edit breaks the gate against itself and there is no clean repair.
          # The length self-check below is the tripwire for the other half of
          # the same accident: blanking a fragment would leave a token that
          # matches every line, or an empty one that matches nothing.
          #
          # WHY IT IS A SUBSTRING RULE AND NOT A WHOLE-WORD ONE: the reference
          # implementation and the two Rust-hosted reimplementations all carry
          # the token inside their own crate names, so one substring rule
          # refuses all three for free, without this file naming any of them.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files` and the two
          # static fragments below. Gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * Anything untracked. The input is `git ls-files`, which is right
          #     for CI and means a local run and CI disagree until `git add`.
          #   * The word split across two source lines, or written with a
          #     zero-width character inside it, or base64'd, or spelled in a
          #     different script. A determined author beats any text rule. This
          #     stops the accident and the habit, which is what actually
          #     happens.
          #   * Other spellings of the same idea — the file extension, the
          #     interpreter's binary name, a shebang line. Gate 1's extension
          #     allowlist refuses the first. Nothing here refuses the rest.
          #   * Whether the appearance was a VIOLATION or a HISTORICAL
          #     REFERENCE. A sentence describing what a predecessor repository
          #     was written in is not a foreign runtime in this one, and this
          #     gate cannot tell the difference. That is what the allowlist is
          #     for, and taking it is a visible diff on this file.
          #
          # A CI LOG IS NOT A TRACKED FILE, but the log below still MASKS the
          # token wherever it echoes an offending line. Printing it verbatim
          # would make this gate's own output the leak it exists to prevent.

          # ---- the assembly. Neither half is the word; the pair is. ---------
          frag_a=$(printf 'py')
          frag_b=$(printf 'thon')
          tok="${frag_a}${frag_b}"
          if [ "${#tok}" -ne 6 ]; then
            echo "GATE 15 CANNOT ASSEMBLE ITS OWN TOKEN — got ${#tok} characters."
            echo "Somebody edited one of the two fragments above. Read the"
            echo "paragraph beginning IF YOU ARE HERE TO TIDY THIS."
            exit 1
          fi

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism. IT SHIPS EMPTY, on the same
          # argument gates 11 and 12 ship empty: every occurrence on the tree
          # today is named in the log of this step, and pinning them here on
          # the way in would convert a list of findings into one line nobody
          # reads. A file listed here is a file where the word is tolerated,
          # which is a thing somebody should have to type on purpose.
          # `crates/vocab/tests/workspace_is_rust.rs` is the test that REFUSES
          # interpreter bindings, and it cannot refuse a crate without naming it.
          # Three of the names in its `FORBIDDEN` list contain the banned word:
          # a Rust-hosted interpreter, a C binding to one, and a `-sys` shim. This
          # gate's own failure message names the allowlist as the answer when "the
          # occurrence genuinely has to stay", and this is that case -- the
          # alternative is a test that bans nothing.
          #
          # The COUNT is pinned at 3, so a fourth occurrence in that file still
          # fails. This is a bounded hole with a named reason, not an exemption.
          # FOUR ENTRIES ADDED, AND ALL FOUR ARE THE HISTORICAL-REFERENCE CASE
          # the paragraph above says this list exists for. Every one names the
          # language of KITE'S OWN VENDOR SDK, in prose, while explaining why a
          # particular refusal is classified the way it is -- the vendor
          # documents `PermissionException` in that SDK rather than on the wire,
          # which is the whole reason those two failures collapse onto one point
          # on the status axis. None is a dependency, a tool, a build step or a
          # file this workspace runs. `crates/pull` takes no such dependency and
          # gate 1 would refuse the extension if it did.
          #
          # Deleting the sentences would make this gate green by removing TRUE
          # provenance about an external system, which is the trade CLAUDE.md
          # §3 rule 1 exists to refuse: the vendor's behaviour is a verified
          # external fact and the reason it is recorded is that a reader
          # otherwise cannot tell why two different failures are one event.
          #
          # THE COUNTS ARE CEILINGS, NOT EXACT. A file that drops below its
          # number warns rather than fails, so a sentence removed later is
          # noticed without blocking the branch.
          allow_word='
          crates/vocab/tests/workspace_is_rust.rs 3
          crates/pull/src/kite.rs 2
          crates/pull/src/refusal.rs 1
          crates/pull/src/vendor.rs 1
          docs/05-decisions.md 1
          '

          work=$(mktemp -d)
          refused="$work/refused"; : > "$refused"
          walked=0; skipped=0

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            # -I skips a file git tracks that grep reads as binary, rather than
            # letting one turn the scan into noise. There are none today; a
            # count is printed so that stops being an assumption.
            if ! grep -Iq . -- "$f" 2>/dev/null; then
              skipped=$((skipped + 1))
              continue
            fi
            n=$( { grep -IoiF -e "$tok" -- "$f" || true; } | wc -l | tr -d ' ')
            [ "$n" -gt 0 ] || continue
            # COUNT FIRST, TAB-SEPARATED, PATH LAST. Written `path count` and
            # read back on spaces, a tracked file whose name contains a space
            # splits into the wrong fields, the count comparison becomes a
            # string comparison that errors, and the file is reported ALLOWED.
            # A silent miss is the one failure mode these gates exist to
            # prevent, so the separator is a tab and the unbounded field is
            # last.
            printf '%s\t%s\n' "$n" "$f" >> "$refused"
          done < <(git ls-files)

          echo "walked ${walked} tracked file(s)"
          echo "  ${skipped} skipped as binary"
          echo "  $(awk 'END{print NR}' "$refused") file(s) contain the banned token"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$walked" -eq 0 ]; then
            echo "GATE 15 WALKED NOTHING. A gate that reads no file is not a gate."
            exit 1
          fi

          bad=0
          echo
          tab=$(printf '\t')
          while IFS="$tab" read -r c f; do
            [ -n "${f:-}" ] || continue
            a=$( { printf '%s\n' "$allow_word" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
            [ -n "$a" ] || a=0
            if [ "$c" -gt "$a" ]; then
              printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
              { grep -IniF -e "$tok" -- "$f" \
                  | sed -E "s/${tok}/[BANNED WORD]/Ig" \
                  | sed 's/^/             /' | head -8; } || true
              bad=1
            else
              printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
            fi
          done < "$refused"

          # The same two self-audits gates 11 and 12 carry. An entry naming a
          # file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file is now clean is only loose, and
          # says so.
          for p in $( { printf '%s\n' "$allow_word" | awk 'NF{print $1}'; } ); do
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
              bad=1
            elif ! awk -F'\t' -v F="$p" '$2==F{found=1} END{exit !found}' "$refused"; then
              printf '  ::warning title=Gate 15 allowlist is loose::'
              printf '%s no longer contains the token — drop the entry\n' "$p"
            fi
          done

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 15 FAILED."
            echo
            echo "The word is banned outright, including in prose about a"
            echo "predecessor repository. Reword it — 'the predecessor', 'the"
            echo "prior implementation' — or, if the occurrence genuinely has"
            echo "to stay, add its file to the allowlist above with the reason"
            echo "beside it. Do not spell the word into this workflow to make"
            echo "the match narrower: this file is scanned too."
            exit 1
          fi
          echo "OK — the banned token appears in no tracked file."

      - name: Gate 16 — every crate root forbids unsafe outright
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 5 counts `allow(unsafe_code)` occurrences and
          # caps them at three. It never checks that anything is FORBIDDEN. On
          # a tree where no crate carries the attribute at all it counts zero
          # exceptions and prints the cleanest possible log for the weakest
          # possible state — and a new crate arrives with neither attribute by
          # default, which is exactly the moment nobody is looking. crates/costs
          # is being written as this gate is.
          #
          # DENY IS A DEFAULT; FORBID IS A WALL. The root manifest's
          # `[workspace.lints.rust] unsafe_code = "deny"` is real and it is
          # checked below — but a deny is a lint LEVEL, and one
          # `#[allow(unsafe_code)]` on one function switches it off for that
          # function with nothing red anywhere. `#![forbid(unsafe_code)]` is
          # not a level: an inner allow under a forbid is a hard compile error,
          # not a lint that can be downgraded. The two are complements, and the
          # gate needs both because either alone is one edit from gone.
          #
          # THE THIRD HOLE, WHICH IS THE QUIET ONE. `[workspace.lints]` applies
          # to exactly NOTHING in a member that does not write `[lints]
          # workspace = true` in its own manifest. Deleting those two words
          # from one crate's Cargo.toml disarms the whole workspace lint table
          # for that crate — unsafe_code, unwrap_used, expect_used, panic, the
          # lot — and no gate in this file looked at it before this one. Gate
          # 11 rule 5b guards the CONTENT of that table; this guards whether
          # anybody has opted in to it.
          #
          # STRICTER THAN "lib.rs", DELIBERATELY, AND IT IS RED BECAUSE OF IT.
          # A `main.rs` is a SEPARATE CRATE ROOT. The inner attribute at the
          # top of lib.rs is an attribute on the library crate and does not
          # reach the binary crate at all — they are compiled separately.
          # crates/api/src/main.rs carries no forbid today and this gate
          # refuses it. That difference is written here rather than discovered
          # in a review, which is gate 13 layer 3's precedent.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # the tracked manifests and the static list below — gate 1c's
          # discipline. Nothing from the event payload is expanded.
          #
          # WHAT IT CANNOT SEE:
          #   * A crate root that is neither `src/lib.rs` nor `src/main.rs`. A
          #     `[lib] path = ...` or `[[bin]] path = ...` moves it. The gate
          #     does not parse the override and does not guess: a manifest
          #     whose roots it cannot find is REFUSED, so the blind spot is a
          #     red build rather than a silent skip.
          #   * `unsafe` inside a dependency. `forbid` is per-crate and std
          #     itself is full of it. This gate is about the code this
          #     repository writes.
          #   * Whether the attribute is inside a `#[cfg(...)]` that removes
          #     it. It is matched at the start of a line as an inner attribute,
          #     which is the only place it is legal, but no cfg is evaluated.
          #   * Anything untracked, `git ls-files` being the input.

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. One tracked crate-root
          # path per line — a plain path and not `path count`, because the
          # question is present-or-absent and a count column for a boolean
          # invites a 0 that reads like an allowance. IT SHIPS EMPTY. The one
          # root that fails today is named in the log; pinning it here on the
          # way in would convert a finding into a line nobody reads.
          allow_root='
          '

          root=Cargo.toml
          bad=0
          nm=0; nr=0

          echo "layer 1: every crate root carries #![forbid(unsafe_code)]"
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            nm=$((nm + 1))
            c=$(printf '%s\n' "$m" | cut -d/ -f2)
            found=0
            for base in lib main; do
              f="crates/${c}/src/${base}.rs"
              git ls-files --error-unmatch "$f" >/dev/null 2>&1 || continue
              found=$((found + 1)); nr=$((nr + 1))
              if grep -qE '^#!\[forbid\([^]]*\bunsafe_code\b' "$f"; then
                printf '  ok       %s\n' "$f"
              elif { printf '%s\n' "$allow_root" | awk 'NF{print $1}' \
                     > /tmp/gate-unsafe-allow.txt; } \
                   && grep -qxF -- "$f" /tmp/gate-unsafe-allow.txt; then
                printf '  allowed  %s — no forbid, listed above\n' "$f"
              else
                printf '  REFUSED  %s carries no #![forbid(unsafe_code)]\n' "$f"
                bad=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              printf '  REFUSED  %s — neither src/lib.rs nor src/main.rs is tracked.\n' "$m"
              printf '           This gate will not guess where the crate root is.\n'
              bad=1
            fi
          done < <(git ls-files 'crates/*/Cargo.toml')

          echo "  ${nm} crate manifest(s), ${nr} crate root(s) examined"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$nm" -eq 0 ] || [ "$nr" -eq 0 ]; then
            echo "GATE 16 EXAMINED NO CRATE ROOT. A gate that reads no lib.rs and"
            echo "no main.rs is not a gate."
            exit 1
          fi

          # The same two self-audits gates 11 through 15 carry. An entry naming
          # a file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file now carries the attribute anyway
          # is only loose, and says so.
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
              bad=1
            elif grep -qE '^#!\[forbid\([^]]*\bunsafe_code\b' "$p"; then
              printf '  ::warning title=Gate 16 allowlist is loose::'
              printf '%s forbids unsafe after all — drop the entry\n' "$p"
            fi
          done < <(printf '%s\n' "$allow_root" | awk 'NF{print $1}')

          # ---- layer 2: the workspace deny, and who has opted in to it. -----
          echo
          echo "layer 2: the workspace lint table, and every member inheriting it"
          if grep -qE '^[[:space:]]*unsafe_code[[:space:]]*=[[:space:]]*"deny"' "$root"; then
            echo '  present  root Cargo.toml sets unsafe_code = "deny"'
          else
            echo '  REFUSED  root Cargo.toml no longer denies unsafe_code. Gate 5'
            echo '           states that line already fails the build, and gate 5'
            echo '           cannot check its own premise.'
            bad=1
          fi
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            if awk '
              /^\[lints\]/ { inl = 1; next }
              /^\[/        { inl = 0 }
              inl && /^[[:space:]]*workspace[[:space:]]*=[[:space:]]*true/ { ok = 1 }
              END { exit !ok }
            ' "$m"; then
              printf '  present  %s inherits [lints] workspace = true\n' "$m"
            else
              printf '  REFUSED  %s does not write [lints] workspace = true, so the\n' "$m"
              printf '           workspace lint table applies to none of it\n'
              bad=1
            fi
          done < <(git ls-files 'crates/*/Cargo.toml')

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 16 FAILED."
            echo
            echo "Add #![forbid(unsafe_code)] to the crate root — every crate"
            echo "root, a binary being its own — and keep [lints] workspace ="
            echo "true in the manifest. A deny that one attribute switches off"
            echo "is not the guarantee CLAUDE.md section 9 is read as making."
            exit 1
          fi
          echo "OK — every crate root forbids unsafe and inherits the lint table."

      - name: Gate 17 — nothing logs from inside the sweep
        run: |
          set -euo pipefail
          # WHY THIS EXISTS, AND WHY O(1) IS NOT THE BAR HERE.
          #
          # `telemetry::emit` is O(1) and a FILTERED event is very nearly free:
          # one relaxed atomic load and a comparison, no clock, no lock, no
          # buffer. On a per-member path — thousands of calls — that is
          # genuinely nothing, which is why crates/pull emits there.
          #
          # The sweep is not that path. It walks the combination ladder upward
          # from k=1 and evaluates `(bits & mask) == mask` per (bar, mask). That
          # is BILLIONS of evaluations, and a billion O(1) calls is a billion
          # calls. Constant per-operation cost (CLAUDE.md section 3 rule 4) is
          # satisfied by an emit and the operator still loses the run: the bar
          # is not "each call is cheap", it is "the innermost loop does not call
          # anything at all".
          #
          # SO THE RULE IS ZERO, NOT SMALL. No `telemetry::` reference of any
          # kind may appear in the crates that hold the mask, the vocabulary and
          # the sweep. What replaces it is the pattern `crate::session::
          # DropCensus` already uses in crates/pull: plain integer counters,
          # incremented in the loop with no atomic and no allocation, emitted
          # ONCE at a structural boundary — per k-level, per instrument, per
          # run. Every combination is still accounted for; none of them is
          # logged individually. Full detail, zero marginal cost.
          #
          # WRITTEN BEFORE THE SUBJECT EXISTS, ON PURPOSE. crates/engine and
          # crates/indicators are not workspace members yet and crates/vocab is
          # not tracked yet, so this step passes vacuously today and says so.
          # A rule that arrives after the hot loop is a rule that arrives after
          # somebody has already put an emit in it.
          #
          # `runner` IS ON THIS LIST, AND ITS ABSENCE WAS THE HOLE.
          #
          # The three crates below hold the vocabulary, the mask and the ladder.
          # None of them holds a LOOP OVER BARS: `crates/runner` does. It is the
          # crate that walks candles into `indicators`, drives `engine` level by
          # level, prices every trial through `crate::trade` and resamples the
          # whole thing per bootstrap draw -- so the per-bar and per-trial
          # innermost loops this rule is written about are literally in the one
          # crate the rule did not reach. A `telemetry::emit` added to
          # `runner::trade` or `runner::bootstrap` would have been invisible here
          # while costing exactly what the paragraph above says it costs.
          #
          # It is added to THIS gate and not to gate 22's dependency clause, and
          # that separation is deliberate; gate 22 says why in its own comment.
          # Zero logging and a pinned dependency set are two different rules, and
          # runner satisfies the first while legitimately failing the second.
          #
          # MEASURED BEFORE IT WAS ADDED: 17 tracked sources under
          # `crates/runner/src`, zero matches for any of the four patterns below,
          # so this widening is a hole closed and not a red build deferred.
          #
          # NO UNTRUSTED INPUT: `git ls-files` and the static list below.
          swept='vocab engine indicators runner'
          bad=0
          scanned=0
          for c in $swept; do
            files=$( { git ls-files "crates/$c/src/*.rs" || true; } )
            if [ -z "$files" ]; then
              printf '  absent   crates/%s — not a tracked member yet\n' "$c"
              continue
            fi
            for f in $files; do
              scanned=$((scanned + 1))
              # COMMENTS STRIPPED FIRST, and this gate was RED for exactly the
              # reason gate 19's manifest scan already documents: text in a
              # comment is text. `crates/indicators/src/column.rs:57` reads
              #
              #   //! CI gate 17 forbids `telemetry::` in this crate outright
              #
              # -- a doc comment DESCRIBING THIS GATE -- and the gate failed the
              # build on it. The crate does not depend on telemetry at all;
              # `telemetry` appears nowhere in its Cargo.toml.
              #
              # The filter is the one gate 23 already uses: drop lines whose
              # first non-blank token is `//` or `*`. It is conservative in the
              # safe direction -- no Rust CALL can sit on a line that begins
              # with `//`, so this cannot hide one.
              #
              # WHAT IT STILL CATCHES WRONGLY, stated rather than discovered,
              # and both were REPRODUCED against a probe file rather than
              # reasoned about:
              #
              #   1. a trailing comment on a line that also carries code --
              #      `let n = 0; // no telemetry:: here` -- is scanned whole;
              #   2. the OPENING line of a block comment, `/* ... println! ... */`,
              #      does not start with `//` or `*` and is scanned whole.
              #      Continuation lines beginning ` * ` are skipped.
              #
              # Both are false POSITIVES: they fail loudly and visibly, which is
              # the direction this repository errs in, and neither can hide a
              # real call. No file under the three swept crates trips either
              # today -- 18 scanned, zero hits.
              #
              # A sound fix needs a Rust parser, not a regex, for the same
              # reason brace-counting source is unsound: a `//` can sit inside a
              # string literal.
              # AWK RATHER THAN `grep -v | grep -n`, so the reported number is
              # the line's number IN THE FILE. Stripping first and numbering
              # after renumbers every line below the first comment, and a gate
              # that points at the wrong line is worse than one that points at
              # none.
              hits=$( { awk '!/^[[:space:]]*(\/\/|\*)/ { print FNR": "$0 }' "$f" \
                        | grep -E 'telemetry::|log::|println!|eprintln!' || true; } )
              if [ -n "$hits" ]; then
                printf 'LOGGING INSIDE THE SWEEP: %s\n%s\n' "$f" "$hits"
                bad=1
              fi
            done
          done
          if [ "$bad" -ne 0 ]; then
            echo
            echo "GATE 17 FAILED."
            echo
            echo "The sweep evaluates a mask per (bar, combination). A call that"
            echo "is O(1) is still a call, and there are billions of them."
            echo "Count in a plain integer and emit ONE aggregate at the k-level"
            echo "boundary — the shape pull::session::DropCensus already uses."
            exit 1
          fi
          echo "OK — ${scanned} swept source file(s) scanned, none logs per combination."
          echo "     (vocab, engine, indicators AND runner — the per-bar and"
          echo "      per-trial loops are in the last of those.)"

      - name: Gate 23 — stderr is not a log, and a new crate is covered the day it appears
        run: |
          set -euo pipefail
          # WHY. Every other logging gate names the crates it walks, so a crate
          # added tomorrow starts outside all of them. And nothing stopped a
          # diagnostic being written with `eprintln!` instead of an event, which
          # was not hypothetical: a refused bind, a server that stopped on an
          # error, and two null-price bar notices all went to a terminal and
          # never reached a log file. Handed the log folder after a failed run,
          # nobody could see any of them — the exact purpose the logging work
          # exists to serve.
          #
          # This walks `crates/*/src` BY GLOB. There is no crate list to fall out
          # of date.
          fail=0

          # WHOLE FILES, TEST CODE INCLUDED, AND DELIBERATELY SO.
          #
          # The first draft of this gate scanned only the region before the first
          # `#[cfg(test)]`. That assumption holds in `crates/telemetry` and is
          # FALSE across the workspace — `api/src/server.rs` has three such
          # blocks, `api/src/ingest.rs` three, `render.rs` three — so the gate
          # would have scanned the wrong region. It refused rather than guessing,
          # which is how this was found, but the fix is not a cleverer window: it
          # is not needing one. Counting whole files needs no brace matching, no
          # string-literal handling, and has no region to get wrong. The cost is
          # that a `println!` added to a TEST also has to be declared, which is a
          # line of bookkeeping rather than a failure mode.
          : > /tmp/prints.txt
          : > /tmp/handles.txt
          for f in $(git ls-files 'crates/*/src/*.rs' 'crates/*/src/**/*.rs' | sort -u); do
            grep -vE '^[[:space:]]*(//|\*)' "$f" > /tmp/code.txt || true
            # `(^|[^A-Za-z_])` and not `\b`: BSD and GNU disagree about `\b`, and
            # without the guard `println!` also matches INSIDE `eprintln!`.
            # Measured: it counted 17 sites as 20.
            for m in println eprintln print eprint dbg; do
              c=$(grep -cE "(^|[^A-Za-z_])${m}!" /tmp/code.txt || true)
              if [ "$c" -gt 0 ]; then
                printf '%s:%s!:%s\n' "$(echo "$f" | sed 's|crates/||')" "$m" "$c" >> /tmp/prints.txt
              fi
            done
            # A HANDLE IS A PRINT TOO, AND FIVE MACRO NAMES ARE NOT THE SURFACE.
            #
            # `writeln!(std::io::stderr(), "...")` reaches the same terminal as
            # `eprintln!`, is none of the five names above, and therefore appeared
            # in neither clause: not in the declaration that is supposed to be the
            # COMPLETE inventory of what this workspace prints, and not in clause
            # B below, which keys off the word `eprint`. Both clauses could be
            # walked past by choosing a different spelling, which makes the
            # declaration a list of the ways somebody happened to write it rather
            # than a statement about the code.
            #
            # THE PATTERN IS THE HANDLE, NOT THE MACRO, and that choice is the
            # whole design. `write!` and `writeln!` appear over five hundred times
            # here and nearly every one writes into a `Formatter` or a `String` in
            # a `Display` impl -- counting those would produce a declaration
            # nobody could read, which is a declaration nobody does read. What is
            # rare, and what actually names the PROCESS's own stream, is
            # `stderr()` / `stdout()`, and there is one spelling of each.
            #
            # WHAT IT DELIBERATELY DOES NOT MATCH:
            #   * `.stdout(std::process::Stdio::null())` in api/src/server.rs --
            #     the parentheses are not empty, so this is a `Command` builder
            #     and not a stream. Reproduced against that line.
            #   * the words "stdout"/"stderr" inside an HTML string in
            #     api/src/logs.rs and inside a message in telemetry/src/sink.rs.
            #     Neither carries `()`.
            #   * `let e = io::stderr(); writeln!(e, ...)` is caught at the BIND,
            #     not at the write, which is the same site and enough.
            #   * a handle obtained some other way -- through a trait object, or
            #     `libc::write(2, ...)`. A text scan cannot see either, and gate
            #     22 clause B is what refuses `libc::` in the swept crates.
            #
            # MEASURED: zero across the workspace today, so this starts empty.
            c=$(grep -cE '(^|[^A-Za-z0-9_])std(err|out)\(\)' /tmp/code.txt || true)
            if [ "$c" -gt 0 ]; then
              printf '%s:handle:%s\n' "$(echo "$f" | sed 's|crates/||')" "$c" >> /tmp/handles.txt
            fi
          done

          # CLAUSE A — the print surface is exactly this, and every line says
          # which kind it is.
          #
          #   api/src/server.rs  println! 16, print! 1
          #       The startup banner and the `report` subcommand's output on STDOUT for
          #       the operator who just typed the command, plus test output. Deliberately
          #       not events: the banner is printed before a sink is guaranteed to exist,
          #       and a banner in a log file is noise rather than a record. 19 -> 22 was
          #       three more report lines -- a per-note line, a `universe:` line and a
          #       refusal reason -- all STDOUT report output, none a diagnostic.
          #       22 -> 16 IS SIX GOING THE OTHER WAY, and this clause asks for an
          #       exact match in BOTH directions for exactly this case: the six
          #       belonged to `zz_probe_duplicate_banner`, a `#[test]` whose whole
          #       body was `println!` and which asserted nothing -- the shape
          #       CLAUDE.md section 4 bans outright. It is now
          #       `a_repeated_subsystem_spends_budget_and_the_last_clause_wins`,
          #       with an assertion where each print was. A declaration left at
          #       22 would be the stale lie gate 1d refuses, so it moves in the
          #       same commit as the code.
          #   api/src/server.rs  eprintln! 7
          #       LINE NUMBERS ARE NOT PINNED HERE, deliberately: this file is being
          #       actively rewritten and every earlier count in this entry cited numbers
          #       that had moved by the next commit. The sites are named by their
          #       function instead, which survives an edit.
          #
          #       FIVE EMIT AND ARE FINE. A refused bind, a server that stopped, and
          #       `sole_server`'s "another instance is serving this store" each call
          #       `telemetry::emit` at `Level::Error` with a `why` immediately before the
          #       print; `stopped_over`'s DEGRADED-session notice emits with an `exit`
          #       field. The usage text on misuse is a CLI contract rather than a
          #       diagnostic. 5 -> 7 is the last two of those, both added with their
          #       emit already in place, which is the shape this gate is asking for.
          #
          #       TWO DO NOT EMIT, AND CANNOT. `run_from`'s D-0124 arm and the store-root
          #       refusal inside the `Serve` arm both fire when the environment could not
          #       name a store root. The sink lives UNDER that root, so at both sites
          #       there is no directory in which to open a log -- the refusal is the
          #       reason no sink exists rather than an accident of ordering, and the
          #       second says so itself: "BEFORE ANYTHING IS OPENED OR CREATED". stderr is
          #       the only channel in existence at that instant, which is the same
          #       argument telemetry/src/sink.rs carries below.
          #   pull/src/http.rs   eprintln! 6
          #       Bar-refusal notices, every one of which ALSO emits a
          #       `pull.decode` event immediately above the print -- verified
          #       site by site, not assumed. 2 -> 6 on 2026-08-29 because the
          #       declaration was stale by FOUR: the null-price pair it named
          #       had been joined by a negative-volume notice, a negative
          #       open-interest notice, an impossible-OHLC notice and a second
          #       null-price site on the interval path, each added with its
          #       emit already in place -- which is the shape this gate asks
          #       for -- and none of them added here.
          #
          #       A DECLARATION THAT IS BEHIND ITS CODE IS THE STALE LIE GATE 1d
          #       REFUSES, and this one was behind by four for long enough that
          #       it failed the build and hid every gate after it: no step sets
          #       `continue-on-error`, so gates 11, 12, 17 and 22 never ran
          #       while this number was wrong.
          #   telemetry/src/sink.rs  eprintln! 1
          #       The sink's own last-resort notice. It is the thing that failed,
          #       so it is the one place stderr is the only channel left.
          #   telemetry/src/record.rs eprintln! 1
          #   api/src/constituents.rs println! 2
          #       Two lines printed by TESTS for a human reading `--nocapture`,
          #       both past that file's `#[cfg(test)]` at :889 — a cost-benchmark
          #       line (:1773) and the tier partition's five addends and total
          #       across twenty-four rows (:1079). Neither is on a production
          #       path. The first was declared the day the file appeared, because
          #       this gate refused it — which is the whole point of walking
          #       `crates/*/src` by glob, and it refused the second the same way.
          #   core/src/universe.rs, core/src/vendor.rs, greeks/src/{bsm,normal,solver}.rs
          #       Test diagnostic output, printed by tests for a human reading
          #       `--nocapture`. Not on any production path.
          #
          # An UNDECLARED file with any print fails. That is how a crate added
          # tomorrow is covered on its first day, and it is the whole point of the
          # glob above.
          # `cli/src/main.rs:print!` is the PROGRAM'S OWN OUTPUT, not a
          # diagnostic. `cli::run` renders its whole report into a String and
          # main writes it to stdout in one call -- which is the shape that
          # makes the report testable without a terminal, and the reason the
          # binary itself holds no formatting. There is nothing to emit
          # alongside it: an event mirroring a report the operator is reading
          # would be the same fact twice.
          #
          # `core/src/universe.rs:println!` went from one to two. Both sit in
          # `#[cfg(test)]` and print a MEASUREMENT the assertion beside them
          # already enforces -- probe counts and bounds -- so the number is on
          # the terminal for a human reading a failure and in the assertion for
          # the build. Neither ships.
          #
          # THE TWO `cli` DIAGNOSTICS, AND WHY NEITHER CAN EMIT AN EVENT
          # INSTEAD. Both are the case telemetry/src/sink.rs already argues for
          # its own last-resort `eprintln!`: the thing you would emit through is
          # the thing that is unavailable.
          #
          # `cli/src/main.rs:println!` reports that the event sink FAILED TO
          # INSTALL. Emitting that through the sink is the one message it cannot
          # carry. It prints before the report so a long report cannot scroll it
          # away, and it names which variable to set -- `CLAUDE.md` section 4
          # asks a degradation to name its reason, and a silent absence of
          # events would be the fallback that hides a failure. D-0226.
          #
          # `cli/src/lib.rs:eprintln!` reports bars whose timestamps go
          # BACKWARDS, which the store's monotonic invariant forbids. It is
          # reached while BUILDING the session index every later stage reads, so
          # there is no report yet to write it into, and `session_index` returns
          # a plain `Vec` with nowhere to carry a refusal. Sorting around it
          # would paper over a broken invariant one layer down and hand the
          # caller a plausible index, which is what section 4 refuses. This line
          # predates the telemetry arrow and was undeclared; it is declared here
          # rather than left to be found again.
          # THREE MORE, ALL LANDED WHILE THIS GATE WAS UNREACHABLE behind gate
          # 1e, and each says which kind it is:
          #
          #   api/src/calendar_of.rs println! 2 -- inside `#[cfg(test)]`, and
          #     both print a MEASUREMENT the assertion beside them already
          #     enforces: the second is `minute bars owed: {owed}` on the line
          #     above `assert_eq!(owed, 623_546)`. The number is on the terminal
          #     for a human reading a failure and in the assertion for the
          #     build. Same case as `core/src/universe.rs` below. Neither ships.
          #   pull/src/pricing.rs println! 1 -- also `#[cfg(test)]`, printing the
          #     implied-volatility spread across the plausible rate band that the
          #     assertions beneath it bound. Not on any production path.
          #   cli/src/lib.rs eprintln! 1 -> 2 -- the new one is `[step/total]`
          #     PROGRESS on a descent, and it is the one entry here that is not a
          #     test. It cannot be an event instead, for the reason the two
          #     `cli` diagnostics below already carry: the report is being built
          #     into `out` and handed back as a String, and a run that is still
          #     walking has nowhere to have written a log yet. stderr is what a
          #     watching operator has; the report is what they get afterwards.
          # TWO MORE, and both are the same category as the last one above: a
          # print that CANNOT emit because there is no sink yet.
          #
          #   api/src/server.rs eprintln! 7 -> 8. Measured: eight sites, five of
          #     which call `telemetry::emit` at `Level::Error` immediately
          #     above. THREE DO NOT, and the reason is one line number:
          #     `telemetry::install` is at server.rs:14892, and all three --
          #     14443 (`run_from`, the store root would not resolve), 14842 (the
          #     bound listener's local address would not read) and 14855 (the
          #     store root again, inside the serve arm) -- run BEFORE it. An
          #     emit there writes to nothing. Requiring one would be requiring a
          #     record the process has no way to keep, which is a worse lie than
          #     the missing line: it would look declared and land nowhere.
          #     These three are the startup boundary this gate's own remedy
          #     names -- stderr is what a watching operator has, and there is no
          #     file yet to hand them afterwards.
          #
          #   cli/src/main.rs println! 1 -> 2. Neither is a diagnostic. One is
          #     `refused: {why}` from `preflight_store_root`, which runs before
          #     any sink is installed for the same reason as above; the other
          #     names where the events went, and prints on SUCCESS too -- its
          #     own comment records why: "a run whose events landed somewhere
          #     `/logs` does not read looked exactly like a run that was fully
          #     observable". Both are CLI contract to the operator, the same
          #     category as `server.rs`'s usage text already declared here.
          declared='api/src/calendar_of.rs:println!:2
          api/src/constituents.rs:println!:2
          api/src/server.rs:println!:16
          api/src/server.rs:eprintln!:9
          api/src/server.rs:print!:1
          core/src/universe.rs:println!:2
          core/src/vendor.rs:println!:1
          pull/src/pricing.rs:println!:1
          cli/src/lib.rs:eprintln!:3
          cli/src/main.rs:print!:1
          cli/src/main.rs:println!:2
          greeks/src/bsm.rs:println!:4
          greeks/src/normal.rs:println!:3
          greeks/src/solver.rs:println!:5
          pull/src/http.rs:eprintln!:6
          telemetry/src/record.rs:eprintln!:1
          telemetry/src/sink.rs:eprintln!:1'
          # Test-only measurements; production audit/recovery notices also emit.
          declared="$declared api/src/booleanlaunch_tests.rs:println!:2
          api/src/recovery.rs:println!:1
          cli/src/boolean_candidate_tests.rs:eprintln!:2
          cli/src/index_stop_qualification_tests.rs:eprintln!:2
          cli/src/index_stop_tests.rs:println!:1
          cli/src/operation_audit.rs:eprintln!:2
          pull/src/cash_auction.rs:eprintln!:3
          pull/src/cash_session_cache.rs:eprintln!:2"

          want=$(printf '%s\n' $declared | sort)
          got=$(sort /tmp/prints.txt)
          echo "  declared:"; printf '%s\n' "$want" | sed 's/^/    /'
          echo "  measured:"; printf '%s\n' "$got"  | sed 's/^/    /'
          if [ "$want" != "$got" ]; then
            echo
            echo "  REFUSED  the print surface is not the declared one."
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            echo
            echo "           A NEW print: if it is a DIAGNOSTIC on a production"
            echo "           path, emit an event too — stderr is seen by whoever"
            echo "           is watching, the FILE is what gets handed to a"
            echo "           diagnosis afterwards. Then declare it above saying"
            echo "           which kind it is. A print that is GONE: delete its"
            echo "           line, because a declaration nobody can trace to code"
            echo "           is the stale lie gate 1d refuses."
            fail=1
          fi

          # CLAUSE A2 — the same question, asked of the handle spellings.
          #
          # Its declared list is EMPTY and that is the measurement, not an
          # oversight: nothing in this workspace names `stderr()` or `stdout()`
          # today. An empty declaration against an empty measurement is the
          # strongest state this clause can be in, and the day somebody adds the
          # first one they will be told to write it down here with the same
          # sentence clause A asks for — which kind is it, and where is the event
          # that goes with it.
          declared_handles=''
          # Both sides normalised the same way, because an empty `printf` emits a
          # blank line and an empty file emits nothing, and comparing those two
          # would fail on the healthy case forever.
          want_h=$( { printf '%s\n' $declared_handles | grep . || true; } | sort)
          got_h=$( { grep . /tmp/handles.txt || true; } | sort)
          echo "  declared stream handles: ${want_h:-<none>}"
          echo "  measured stream handles: ${got_h:-<none>}"
          if [ "$want_h" != "$got_h" ]; then
            echo
            echo "  REFUSED  the set of writes to a process stream is not the"
            echo "           declared one."
            diff <(printf '%s\n' "$want_h") <(printf '%s\n' "$got_h") || true
            echo
            echo '           writeln!(io::stderr(), ...) is a diagnostic wearing'
            echo "           a different macro. If it is on a production path,"
            echo "           emit the event beside it and declare it above; if it"
            echo "           is gone, delete its line."
            fail=1
          fi

          # CLAUSE B — a crate that writes to stderr must be ABLE to log.
          #
          # Structural rather than a proximity heuristic. Proximity was tried and
          # gives false positives: the usage text sits a few lines from the bind
          # error's event and was scored as covered by it. This instead refuses
          # the state that makes a silent diagnostic INEVITABLE rather than
          # merely possible — a crate whose only channel is stderr.
          #
          # THE MANIFEST TEST WAS `grep -E '^telemetry' Cargo.toml`, AND THAT IS
          # A DIFFERENT QUESTION FROM THE ONE THIS CLAUSE ASKS. It matches at the
          # start of ANY line in the whole file, so a `telemetry = { … }` sitting
          # under `[dev-dependencies]` counted as proof that SHIPPING code can
          # emit. A dev-dependency links into tests, benches and examples and into
          # no release build at all, so a crate in that state has exactly the
          # property this clause exists to refuse — stderr is its only channel
          # where it matters — and the gate would have called it `ok`. It also
          # matched a `telemetry` line inside a comment, of which these manifests
          # have several, for the reason gate 22 clause A already records: text in
          # a comment is text.
          #
          # So the answer now comes from the `[dependencies]` table and nowhere
          # else. Comments are stripped first, and the `[dependencies.telemetry]`
          # table-header spelling is accepted too, because it is a real
          # dependency declaration and refusing to understand it would be a false
          # negative rather than a strict reading. A dotted `telemetry.path = …`
          # inside the flat table is matched by the `[=.]` alternation.
          #
          # WHAT IT STILL CANNOT SEE: `[target.'cfg(...)'.dependencies]`. Gate 22
          # refuses that spelling outright for the three crates it pins; here it
          # would read as "no telemetry dependency" and REFUSE, which is the safe
          # direction — a loud false positive that a human resolves, never a
          # silent pass.
          #
          # Verified against the tree: `api`, `pull`, `store` and `lake` all
          # declare telemetry in the flat table and still answer yes; `core` and
          # `costs` answer no, as they should.
          has_telemetry() {
            m="crates/$1/Cargo.toml"
            [ -f "$m" ] || return 1
            code=$(sed 's/#.*//' "$m")
            if printf '%s\n' "$code" | grep -qE '^\[dependencies\.telemetry\]'; then return 0; fi
            printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
              | grep -qE '^telemetry[[:space:]]*[=.]'
          }
          # Both files, because clause A2's handles are the same hazard as an
          # `eprintln!` and were not reaching this loop at all.
          for f in $( { cat /tmp/prints.txt /tmp/handles.txt \
                        | grep -E 'eprint|:handle:' || true; } | cut -d: -f1 | sort -u); do
            crate=$(echo "$f" | cut -d/ -f1)
            [ "$crate" = "telemetry" ] && continue   # it IS the logger
            if has_telemetry "$crate"; then
              echo "  ok       $crate writes to stderr and can also emit"
            else
              echo "  REFUSED  crate '$crate' writes to stderr but declares no"
              echo "           telemetry dependency in its [dependencies] table,"
              echo "           so stderr is the ONLY channel it has in a shipping"
              echo "           build. Add the dependency and emit the event."
              echo "           A dev-dependency does not answer this: it links"
              echo "           into tests and into no release build."
              fail=1
            fi
          done

          # CLAUSE C — a temporary path names the process that made it.
          #
          # WHY THIS IS IN A LOGGING GATE. It is here because this is the step
          # that already walks every tracked `.rs` under crates/ INCLUDING test
          # code, and the failure is a test-code failure. Clause A's glob is the
          # only machinery in this file that looks at test sources at all.
          #
          # THE FAILURE, MEASURED AND REPRODUCED. D-0042:
          # `master::tests::a_master_larger_than_this_reader_holds_is_refused_before_it_is_read`
          # failed about one run in three with `cleanup: NotFound` on the line
          # deleting its own fixture. The fixture was
          # `temp_dir().join("brutex-master-toobig.csv")` -- ONE FIXED NAME in a
          # directory shared by every process on the machine. The test creates a
          # 256 MiB sparse file there, reads all of it, then deletes it; any
          # second process running the same binary deletes the file inside that
          # window. It was reproduced deliberately: two copies of the test binary
          # started together, one failed and one passed. Two concurrent
          # `cargo test` runs, a `cargo llvm-cov` beside a `cargo test`, or two
          # agents on one checkout are each enough, and all three happen here.
          #
          # The assertions were never wrong. The FIXTURE was. `api::scratch`
          # exists to be the answer -- it stamps `process::id()` into every
          # temporary path -- and nothing made the rest of the workspace use it.
          #
          # THE RULE. A line naming `env::temp_dir()` must have `process::id()`
          # within WINDOW lines at or below it. Below and not above, because the
          # two shapes in this workspace are
          #
          #   let dir = temp_dir().join(format!("x-{}", process::id()));   same line
          #   let mut root = temp_dir();                                   then
          #   root.push(format!("x-{}", process::id()));                   the next
          #
          # A WINDOW IS A HEURISTIC AND THIS ONE IS DELIBERATELY SMALL. Three
          # lines is what the second shape needs and no more. It can be satisfied
          # by an UNRELATED `process::id()` that happens to sit within three
          # lines -- gate 19 documents the same weakness about its own window and
          # solves it by claiming each event once; that machinery is not
          # justified here, where the two tokens are almost always on one line.
          # What the window CANNOT do is miss the collision this gate is named
          # for: a fixed name has no `process::id()` anywhere near it.
          #
          # WHAT IT CANNOT SEE, stated rather than discovered later:
          #   * `use std::env::temp_dir;` and then a bare `temp_dir()`. This
          #     matches the qualified spelling only, which is the one all 41
          #     current sites use.
          #   * A unique name built some other way -- a nonce, a counter, a
          #     `TempDir` crate. Each would read as a violation here and would
          #     need a line below, which is the reviewable part.
          #   * Whether the path is ever CREATED. A path asserted absent is
          #     harmless and several of the entries below are exactly that; the
          #     gate cannot tell, so a human wrote down which is which.
          #
          # THE CEILING IS A CEILING, NOT AN EXACT MATCH, and that is a departure
          # from clause A above. Clause A fails when a count DROPS, on the ground
          # that a stale declaration is a lie. Here a count drops precisely when
          # somebody FIXES a fixture, and turning that into a red build for a
          # second contributor -- on a tree two sessions share -- would teach
          # people to leave the fixtures alone. A drop is a warning; only a rise
          # is a refusal. Same mechanism as gate 11 and gate 13.
          #
          #   api/src/logs.rs      1  `sink_in` builds `brutex-logs-{name}` and
          #                           then `remove_dir_all` + `create_dir_all` on
          #                           it. THIS IS THE LIVE HAZARD, identical in
          #                           shape to D-0042's. It is declared rather
          #                           than fixed because the file belongs to
          #                           another line of work; the entry is the
          #                           report, and it is meant to be removed.
          #   pull/tests/unit.rs   4  Two are `brutex-pull`, a fixed directory,
          #                           and the same hazard. The other two --
          #                           `brutex-pull-there-is-no-such-file.toml`
          #                           and `brutex-no-such-dir-ever` -- are paths
          #                           asserted ABSENT, which cannot collide
          #                           because nothing creates them.
          #   pull/src/ssm.rs      1  `brutex-ssm-no-such-file-ever/credentials`,
          #                           the same absent-path probe.
          #   api/src/scratch.rs   1  The assertion `a.parent() ==
          #                           Some(temp_dir().as_path())` inside the test
          #                           that proves `path()` stamps the pid. It
          #                           names the directory, never a file in it.
          #   api/tests/binary.rs  1  Passes the bare temp dir to a binary that
          #                           refuses its argument and exits 2 before
          #                           opening anything.
          #   telemetry/src/lib.rs 1  `read_dir(temp_dir())` enumerates the
          #                           directory to find this crate's own sink
          #                           dirs. It creates no path.
          # `api/src/logs.rs` IS GONE FROM THIS LIST, on this clause's own
          # loose-entry warning: it no longer names a fixed temporary path, and
          # an entry nobody can trace to a line makes the clause read stronger
          # than it is.
          #
          # `cli` JOINS IT, AND ONE PRODUCTION SITE WAS FIXED RATHER THAN
          # LISTED. `cli::verify::ledger_round_trip` used
          # `temp_dir().join("brutex-verify-ledger")` — one path shared by every
          # `cli verify` on the machine, with `remove_dir_all` on the very next
          # line. Two verifications at once is one operator in two terminals:
          # the second would delete the first's scratch mid-write and the first
          # would report a round-trip failure against a ledger it never lost.
          # It names `process::id()` now, which is the discriminator rather than
          # a clock because two processes can start in the same microsecond and
          # cannot share a pid.
          #
          # The five that remain are all inside `#[cfg(test)]`, same class as
          # `pull/tests/unit.rs` above: a scratch root per case, named for the
          # case. Under `cargo test` they run in one process on separate names,
          # so nothing collides.
          allow_fixed='
          api/src/scratch.rs 1
          api/tests/binary.rs 1
          cli/src/lib.rs 1
          cli/src/results.rs 4
          pull/src/ssm.rs 1
          pull/tests/unit.rs 4
          telemetry/src/lib.rs 1
          '
          #
          # AND YES, THE SCRATCH FILE BELOW IS ITSELF A FIXED /tmp NAME. It is
          # the convention clauses A and B already use -- `/tmp/prints.txt`,
          # `/tmp/code.txt` -- and on a runner this step is the only process
          # that exists, so the collision this clause polices cannot happen to
          # it there. Run two copies of this gate on one developer machine and
          # they WILL fight over it. Said out loud rather than left for somebody
          # to find, because a gate that exempts itself from its own rule
          # without saying so is the shape gate 12 exists to refuse.
          tmp_window=3
          : > /tmp/fixed-temp.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            awk -v W="$tmp_window" -v name="$(printf '%s' "$f" | sed 's|crates/||')" '
              { line[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++) {
                  t = line[i]; sub(/^[ \t]+/, "", t)
                  if (t ~ /^(\/\/|\*)/) continue
                  if (line[i] !~ /env::temp_dir\(\)/) continue
                  ok = 0
                  for (j = i; j <= NR && j <= i + W; j++) {
                    if (line[j] ~ /process::id\(\)/) { ok = 1; break }
                  }
                  if (!ok) print name ":" i
                }
              }' "$f" >> /tmp/fixed-temp.txt
          done < <(git ls-files 'crates/**/*.rs')

          echo "  clause C: $(wc -l < /tmp/fixed-temp.txt | tr -d ' ') temporary path(s)"
          echo "            that do not name their process, over"
          echo "            $(git ls-files 'crates/**/*.rs' | wc -l | tr -d ' ') tracked source file(s)"
          for p in $( { cut -d: -f1 /tmp/fixed-temp.txt | sort -u; } || true ); do
            c=$( { grep -c "^${p}:" /tmp/fixed-temp.txt || true; } | tr -d ' ')
            a=$( { printf '%s\n' "$allow_fixed" | awk -v F="$p" '$1==F{print $2; exit}'; } || true)
            [ -n "$a" ] || a=0
            if [ "$c" -gt "$a" ]; then
              printf '  REFUSED  %s — %s fixed temporary path(s), %s allowed\n' "$p" "$c" "$a"
              { grep "^${p}:" /tmp/fixed-temp.txt | sed 's/^/             crates\//' | head -6; } || true
              fail=1
            else
              printf '  allowed  %s — %s of %s\n' "$p" "$c" "$a"
            fi
          done
          # An entry naming a file that is gone makes this clause read stronger
          # than it is, so it is a failure. An entry whose file no longer matches
          # is only loose, and says so — somebody fixed a fixture.
          for p in $( { printf '%s\n' "$allow_fixed" | awk 'NF{print $1}'; } || true ); do
            if ! git ls-files --error-unmatch "crates/$p" >/dev/null 2>&1; then
              printf '  STALE ENTRY — crates/%s is not a tracked file\n' "$p"
              fail=1
            elif ! grep -q "^${p}:" /tmp/fixed-temp.txt; then
              printf '::warning title=Gate 23 clause C is loose::'
              printf 'crates/%s no longer names a fixed temporary path — drop the entry\n' "$p"
            fi
          done

          # WHAT THIS DOES NOT PROVE, said plainly so nobody reads more into a
          # green gate than it earned: it fixes the SET of prints and forces a
          # human to write down what each one is. It does not itself decide
          # whether a given print sits on a production path or in a test, and it
          # does not verify that a particular diagnostic has a matching event.
          # The declaration above carries that, and a reviewer keeps it honest —
          # the same division of labour gate 1d uses for path-shaped literals.
          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 23 FAILED."
            echo "A diagnostic that exists only on a terminal nobody kept is a"
            echo "fact this repository did not record. CLAUDE.md section 4."
            exit 1
          fi
          echo "OK - every print is declared, and stderr is never a crate's only channel."

      - name: Gate 21 — the logger opens nothing but its own files
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: no real bars, no pull,
          # and "even suppose if the data or bars pulled by mistake also, then
          # nowhere the issue of this should happen". That is a requirement
          # about STRUCTURE, not about discipline: whether or not real data is
          # sitting on the disk, the logger must be INCAPABLE of reading it.
          #
          # Two clauses, because either alone is weak.
          fail=0

          # CLAUSE A — crates/telemetry declares NO dependencies.
          #
          # The load-bearing one. A crate that does not depend on `store`,
          # `core`, `pull` or any vendor client cannot call them, so it cannot
          # read a bar, a manifest or a census however it is later edited. It is
          # std-only by construction, and the manifest is where that is
          # enforced rather than a comment nobody re-reads.
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f' crates/telemetry/Cargo.toml \
                 | grep -vE '^[[:space:]]*(#|$)' || true)
          if [ -n "$deps" ]; then
            echo "  REFUSED  crates/telemetry declares dependencies:"
            printf '%s\n' "$deps" | sed 's/^/             /'
            echo "           A logger that can reach the store can read a bar."
            fail=1
          else
            echo "  ok       crates/telemetry declares no dependencies - std only"
          fi

          # CLAUSE B — the production file-opening sites are exactly these.
          #
          # Declared by CONSTRUCT and COUNT, never by line number: a line number
          # is invalidated by editing a comment above it, and a declaration that
          # rots on reformatting is one nobody keeps honest. Same rule as gates
          # 1d and 20.
          #
          #   sink.rs  OpenOptions::new  x2  the sink's own append target
          #   sink.rs  create_dir_all    x1  making its own directory, at open
          #   sink.rs  fs::metadata      x1  stat by PATH, for the roll decision
          #   sink.rs  fs::remove_file   x1  dropping the oldest rolled file
          #   sink.rs  fs::rename        x1  rolling within its own directory
          #   tail.rs  File::open        x2  reading back its own file set
          #
          # Every one takes a path built from the sink's own dir plus BASENAME
          # and EXTENSION. A NEW site is not necessarily wrong, but it is never
          # invisible: declare it here with the path it opens and why.
          #
          # THE PROBE LIST HAD SIX ENTRIES AND TWO OF THE SITES ABOVE WERE NOT
          # AMONG THEM. `create_dir_all` and `fs::metadata` are production code
          # in `sink.rs` today -- `sink.rs:697` creates the sink's directory and
          # `sink.rs:1198` stats a path to decide a roll -- and this clause
          # walked straight past both while printing "the logger's file-opening
          # surface is the declared one". A declared surface that omits two of
          # its own members reads as a stronger statement than it is, which is
          # the exact failure gate 1d exists to refuse. `fs::read` is added with
          # them and finds NOTHING today; it is here because it is the plainest
          # way to read a bar file and its absence from the list was the reason
          # it would not have been seen.
          #
          # `fs::read(` CARRIES ITS OPENING PAREN and that is load-bearing. The
          # probes are matched with `grep -cF`, a SUBSTRING test, so a bare
          # `fs::read` would also count every `fs::read_dir` and every
          # `fs::read_to_string` -- inflating two declared counts and refusing
          # the crate over an arithmetic artefact of its own probe list. The
          # paren cannot appear in either longer name.
          #
          # `.metadata()` ON AN OPEN HANDLE IS DELIBERATELY NOT PROBED. There are
          # two of them -- `sink.rs:245` and `tail.rs:399` -- and neither names a
          # path: they stat a `File` this crate has already opened through one of
          # the declared sites, so they cannot reach anything the sites above did
          # not already reach. `fs::metadata` takes a PATH and is the one that
          # can, which is why the list separates them.
          declared='sink.rs:OpenOptions::new:2
          sink.rs:create_dir_all:1
          sink.rs:fs::metadata:1
          sink.rs:fs::remove_file:1
          sink.rs:fs::rename:1
          tail.rs:File::open:2'
          : > /tmp/io-sites.txt
          for f in crates/telemetry/src/*.rs; do
            base=$(basename "$f")
            # THE TEST BOUNDARY, asserted rather than assumed. This USED to cut at
            # the first `^#[cfg(test)]` and refuse outright on a second, on the
            # ground that "before the first" then stops meaning "production" and an
            # unsound window reporting PASS is worse than no gate. That ground was
            # right and the tool was wrong: a second block is ordinary, and 823c18d
            # added one -- a `#[cfg(test)] pub(crate) fn sweep_stale_scratch` sitting
            # ABOVE `mod tests` -- so the gate refused a file it had no quarrel with
            # and said so itself: "fix the gate before trusting it again, not the
            # file." This is that fix.
            #
            # Every `#[cfg(test)]` block is now skipped by BRACE COUNTING, so there
            # may be any number of them, and the attribute may cover a `fn` as well
            # as a `mod`. Intervening attributes are stepped over -- `mod tests`
            # carries a multi-line `#[allow(..., reason = "...")]` between the
            # `#[cfg(test)]` and the `mod` keyword.
            #
            # THE SOUNDNESS PRINCIPLE IS KEPT, three ways. The walk exits 3 if it
            # reaches EOF still inside a block, because an unbalanced brace means the
            # window is not the one it thinks it is. The emitted body is then checked
            # to contain NO `#[cfg(test)]` at all, which catches an over- or
            # under-skip that happened to balance. And the surviving line count is
            # PRINTED for every file, so a future edit that silently moves the
            # boundary shows up in the log as a changed number rather than as nothing.
            awk '
              BEGIN { st = 0 }
              st == 0 {
                if ($0 ~ /^#\[cfg\(test\)\][ \t]*$/) { st = 1; next }
                print; next
              }
              # BETWEEN THE ATTRIBUTE AND THE ITEM IT COVERS. Further attributes and
              # their continuation lines are stepped over -- `mod tests` carries a
              # multi-line `#[allow(..., reason = "...")]` before the `mod` keyword.
              st == 1 {
                t = $0; sub(/^[ \t]+/, "", t)
                # A braceless item -- `use`, `const` -- is the whole block, and ends
                # at its own semicolon.
                if (index($0, "{") == 0 && t ~ /;[ \t]*$/) { st = 0; next }
                if (index($0, "{") > 0) { st = 2 }
                next
              }
              # INSIDE THE ITEM. It closes at a `}` in COLUMN ZERO and nowhere else.
              # NOT by counting braces: that was tried and it is unsound here --
              # `json.rs` and `tail.rs` both hold `{` and `}` inside string literals,
              # so the count never returns to zero and the walk ran off the end of
              # both files. A top-level item under rustfmt closes at column zero, and
              # a brace inside a string is never a lone `}` there.
              st == 2 {
                if ($0 ~ /^\}/) { st = 0 }
                next
              }
              END { if (st != 0) exit 3 }
            ' "$f" > /tmp/body.txt || {
              echo "  REFUSED  $base: a cfg(test) block does not close before EOF."
              echo "           The production window cannot be established, so no"
              echo "           verdict is printed for this file. CLAUDE.md section 4."
              fail=1
              continue
            }
            if grep -q '^#\[cfg(test)\]' /tmp/body.txt; then
              echo "  REFUSED  $base: a cfg(test) attribute survived the walk."
              echo "           The skip is wrong in one direction or the other."
              fail=1
              continue
            fi
            printf '  window   %-14s %s production line(s) of %s\n' \
              "$base" "$(awk 'END{print NR}' /tmp/body.txt)" "$(awk 'END{print NR}' "$f")"
            # Drop comment lines, so a construct merely NAMED in prose above is
            # not counted as a call to it.
            grep -vE '^[[:space:]]*(//|\*|/\*)' /tmp/body.txt > /tmp/code.txt || true
            for probe in OpenOptions::new create_dir_all fs::metadata fs::remove_file \
                         fs::rename File::open fs::read_dir fs::read_to_string 'fs::read('; do
              c=$(grep -cF "$probe" /tmp/code.txt || true)
              if [ "$c" -gt 0 ]; then
                printf '%s:%s:%s\n' "$base" "$probe" "$c" >> /tmp/io-sites.txt
              fi
            done
          done

          want=$(printf '%s\n' $declared | sort)
          got=$(sort /tmp/io-sites.txt)

          echo "  declared:"; printf '%s\n' "$want" | sed 's/^/    /'
          echo "  measured:"; printf '%s\n' "$got"  | sed 's/^/    /'

          if [ "$want" != "$got" ]; then
            echo
            echo "  REFUSED  the logger's file-opening surface is not the declared one."
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            echo
            echo "           A NEW site: say which path it opens and why, and add"
            echo "           it above in the same commit. A site that is GONE:"
            echo "           delete its line, because a declaration nobody can"
            echo "           trace to code is the stale lie gate 1d refuses."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 21 FAILED."
            echo "CLAUDE.md section 4: no fallback that hides a failure. A logger"
            echo "that can reach real bars can be silently wrong about them."
            exit 1
          fi
          echo "OK - the logger depends on nothing and opens only its own files."

      - name: Gate 22 — the sweep crates cannot read a bar
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: "at any point we should
          # never ever pull any real data or even by mistake pulled bars or data
          # should never ever be used." The second half is the hard part. The
          # first is discipline and can be kept; the second is a claim about what
          # the code is CAPABLE of, and only a structural check can make it.
          #
          # It is not hypothetical. Two real bar files appeared under
          # ~/.brutex/store/bars/groww/NSE/INDEX/{NIFTY,BANKNIFTY}/1min/2020-01.bin
          # during a session whose whole premise was that none existed. Nobody in
          # that session pulled them. So "could the sweep have read them" must be
          # answerable without trusting anyone's account of what they ran.
          #
          # THIS GATE'S FIRST VERSION WAS DEFEATED IN ALL FOUR CLAUSES by an
          # adversarial audit, which composed a working bypass:
          #
          #   [dependencies.store]                       clause A blind
          #   path = "../store"
          #   pub use store::file::BarFile as Bf;        clause C blind
          #   Bf::open_existing(p, ..)?.read_record(n)   clause B blind
          #
          # and gate 22 printed OK. Everything below is the repair, and each
          # clause names the bypass it now refuses.
          fail=0
          # TWO LISTS, BECAUSE THIS GATE ASKS TWO DIFFERENT QUESTIONS.
          #
          # It shipped with ONE list doing both jobs, and that is why
          # `crates/runner` -- the crate that actually drives a sweep -- was in
          # neither. Widening the single list to include it would have failed
          # clause A instantly and correctly, so the crate stayed out of the
          # filesystem clauses too, and the gate's promise ("the sweep cannot go
          # and find data on its own") did not cover the sweep's driver.
          #
          #   PINNED  the crates whose DEPENDENCY SET is fixed. Clause A pins each
          #           of these to an exact `want`, ships no allowlist, and that is
          #           what makes `indicators` and `engine` unable to name each
          #           other. CLAUDE.md section 5 states this rule and states its
          #           consequence: "The only crate where the two halves may
          #           legally meet is one that is not on gate 22's list, and that
          #           is `runner`." `runner` therefore MUST NOT be added here --
          #           it depends on `brutex_core`, `vocab`, `indicators`, `engine`
          #           and `costs` by design, and pinning it would contradict the
          #           law this gate exists to enforce rather than extend it.
          #   SWEEP   the crates that MAY NOT REACH A FILESYSTEM. That is a
          #           capability question, not a graph question, and it is true of
          #           `runner` for exactly the reason it is true of the other
          #           three: it takes a slice of candles the caller already holds
          #           and its own manifest says so -- "NO ARROW TO `store`,
          #           DELIBERATELY". Clauses B through E now hold it to that.
          #
          # MEASURED BEFORE THE WIDENING, against `crates/runner`: clause B zero
          # hits over `src/` and `benches/`; clause C zero imports; clause D three
          # `include_str!` calls, all plain literals, all `.rs` or `.toml`
          # (`lib.rs`, `synthetic.rs`, `../Cargo.toml`); clause E zero. So this is
          # a hole closed, not a red build handed to somebody else.
          #
          # WHAT IS STILL NOT PINNED, said rather than implied: nothing stops
          # `crates/runner` declaring `store` in its manifest, because clause A
          # does not read it. Clause C would refuse the `use`, and clause B the
          # `std::fs` call that followed -- so the capability is still refused at
          # the two places it has to be exercised, and only the DECLARATION is
          # unguarded. Closing that needs a `want` for `runner` in clause A, which
          # needs CLAUDE.md section 5 to be rewritten first.
          PINNED='vocab indicators engine'
          SWEEP='vocab indicators engine runner'

          # ── CLAUSE A — the dependency closure cannot reach a filesystem ────────
          #
          # The load-bearing clause, because it is transitive: a crate that cannot
          # NAME `store` cannot call into one whatever its source says.
          #
          # A1 FIRST, and this is the repair. Cargo accepts four spellings of one
          # dependency, and the extraction in A2 -- `name =` at line start inside
          # the `[dependencies]` range -- can see exactly one of them:
          #
          #   store = { path = "../store" }        the only form A2 sees
          #   store.path = "../store"              a dotted key, same meaning
          #   [dependencies.store]                 a table header, same meaning
          #   [dev-dependencies]                   links into every test and bench
          #   [target.'cfg(unix)'.dependencies]    links on that target
          #
          # A shell cannot parse TOML and this gate is not going to pretend it can.
          # So instead of teaching A2 four spellings, A1 refuses every spelling A2
          # cannot read. These three manifests use none of them, so the constraint
          # costs nothing -- and with A1 held, A2 is a COMPLETE parse rather than a
          # hopeful one. The authoritative parser is Rust:
          # `engine::tests::declared_dependencies`, which handles all four and is
          # tested against all four.
          for c in $PINNED; do
            m="crates/$c/Cargo.toml"
            # Comments stripped first. A comment mentioning `[dev-dependencies]` is
            # not a `[dev-dependencies]` table, and three of these manifests
            # discuss the graph at length in exactly that way. This is the defect
            # that took `V-06` red and `hits_does_the_same_work_for_every_input`
            # green-on-a-broken-function: text in a comment is text.
            code=$(sed 's/#.*//' "$m")
            for spelling in '^\[dependencies\.' '^\[dev-dependencies' \
                            '^\[build-dependencies' '^\[target\.'; do
              if printf '%s\n' "$code" | grep -qE "$spelling"; then
                echo "REFUSED  $m uses a dependency-table spelling this gate cannot parse: $spelling"
                echo "         Use the flat [dependencies] table with `name = ...`."
                echo "         See engine::tests::declared_dependencies for why."
                fail=1
              fi
            done
            # A dotted key inside the flat table -- `store.path = "../store"` --
            # declares a dependency A2 would not see.
            if printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
               | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+ *='; then
              echo "REFUSED  $m declares a dependency with a dotted key"
              fail=1
            fi

            # A2. With A1 held this is every dependency the manifest declares.
            # `|| true` is load-bearing: `vocab` declares NOTHING, so grep exits 1,
            # and under `set -euo pipefail` that killed this gate before it printed
            # a line -- an exit 1 with no output, indistinguishable from a real
            # refusal, and had the polarity gone the other way it would have passed
            # forever having checked nothing.
            deps=$(printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
                   | { grep -oE '^[A-Za-z0-9_-]+ *=' || true; } \
                   | sed 's/ *=//' | sort -u | tr '\n' ' ')
            case "$c" in
              vocab)             want='' ;;
              indicators|engine) want='vocab ' ;;
            esac
            if [ "$deps" != "$want" ]; then
              echo "REFUSED  crates/$c declares [$deps] and must declare [$want]"
              echo "         A new dependency here is how a bar reaches the sweep."
              fail=1
            fi
          done

          # ── CLAUSE B — no filesystem call site in src/ or benches/ ─────────────
          #
          # Clause A forbids reaching a filesystem through a dependency; this
          # forbids reaching one through `std`. The first version's probe list held
          # nine patterns and the audit walked past it with `include_bytes!`,
          # `fs::read`, `File::create` and `std::process::Command` -- and it scanned
          # only `src/`, so `benches/ratio.rs` could have read a bar file outright.
          #
          # `process::Command` and not `std::process`. The broader pattern was
          # written first and this gate refused its own repository over it: a
          # `harness = false` bench signals failure with `std::process::exit(1)`, and
          # all three do. `exit` cannot read anything. Spawning a process can, which
          # is what `Command` names.
          BANNED='File::open|File::create|OpenOptions|fs::read|fs::write|fs::copy|fs::rename|fs::remove|fs::File|fs::metadata|fs::canonicalize|read_dir|std::fs|MmapOptions|Mmap::|memmap|include_bytes!|process::Command|Command::new|std::os::|libc::'
          for c in $SWEEP; do
            for dir in src benches; do
              [ -d "crates/$c/$dir" ] || continue
              hits=$(grep -rnE "$BANNED" "crates/$c/$dir" 2>/dev/null || true)
              if [ -n "$hits" ]; then
                echo "REFUSED  crates/$c/$dir reaches the filesystem:"
                printf '%s\n' "$hits" | sed 's/^/           /'
                fail=1
              fi
            done
          done

          # ── CLAUSE C — no import of a crate that reads the store, any spelling ─
          #
          # Comments may cite `store::format::Bar` and several do, because that
          # record is what `indicators::Candle` replaced and the history is worth
          # keeping. So the pattern is anchored to an import -- but the first
          # version anchored it to a BARE `use`, and the audit walked past with
          # `pub use store::…` and with `use store as st;`.
          for c in $SWEEP; do
            hits=$(grep -rnE '^[[:space:]]*(pub[[:space:]]+)?use[[:space:]]+(brutex_)?(store|pull|lake|api|telemetry)([^A-Za-z0-9_]|$)' \
                   "crates/$c/src" "crates/$c/benches" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "REFUSED  crates/$c imports a crate that reads the store:"
              printf '%s\n' "$hits" | sed 's/^/           /'
              fail=1
            fi
          done

          # ── CLAUSE D — every compile-time include is a document, by a literal ──
          #
          # Clause B exempts `include_str!` and must: it is compile-time, it reads
          # only paths written as literals in tracked source, and the document
          # guards depend on it. This bounds the exemption so it cannot become the
          # hole -- and the first version's regex only matched a PLAIN literal, so
          # the audit walked past it with
          # `include_str!(concat!(env!("HOME"), "/.brutex/store/bars/…/2020-01.bin"))`,
          # which is not a literal at all and matched nothing.
          for c in $SWEEP; do
            for dir in src benches tests; do
              [ -d "crates/$c/$dir" ] || continue
              # A computed include path is refused outright. There is no legitimate
              # one here, and a gate that cannot evaluate the expression must not
              # guess at what it evaluates to.
              computed=$(grep -rnE 'include_str!\([^")]' "crates/$c/$dir" 2>/dev/null || true)
              if [ -n "$computed" ]; then
                echo "REFUSED  crates/$c/$dir computes an include path instead of writing one:"
                printf '%s\n' "$computed" | sed 's/^/           /'
                fail=1
              fi
              for p in $(grep -rhoE 'include_str!\("[^"]+"\)' "crates/$c/$dir" 2>/dev/null \
                         | sed 's/include_str!("//; s/")//' || true); do
                case "$p" in
                  *.md|*.rs|*.toml|*.lock) : ;;
                  *) echo "REFUSED  crates/$c/$dir includes '$p', not a document or a source file"
                     fail=1 ;;
                esac
                case "$p" in
                  *bars*|*.bin|*.parquet|*.csv)
                     echo "REFUSED  crates/$c/$dir includes '$p', which is bar-shaped"
                     fail=1 ;;
                  *) : ;;
                esac
              done
            done
          done

          # ── CLAUSE E — tests/ may read the disk, bounded ───────────────────────
          #
          # Clause B deliberately does not cover `tests/`, because one test there
          # legitimately reads the filesystem: `vocab/tests/workspace_is_rust.rs`
          # walks tracked files to enforce §2. The audit pointed out the obvious
          # consequence -- repointing that literal at a bar file keeps every other
          # clause green. So the exemption is bounded the same way clause D bounds
          # its own: a path may be built from `CARGO_MANIFEST_DIR`, and may never
          # be bar-shaped or reach into a home directory.
          for c in $SWEEP; do
            [ -d "crates/$c/tests" ] || continue
            hits=$(grep -rnE 'env!\("HOME"\)|var\("HOME"\)|\.brutex|store/bars|\.bin"|\.parquet"' \
                   "crates/$c/tests" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "REFUSED  crates/$c/tests names a path outside the repository:"
              printf '%s\n' "$hits" | sed 's/^/           /'
              fail=1
            fi
          done

          # WHAT THIS GATE CANNOT SEE, said rather than implied. A caller can still
          # read bars itself and hand them to `Evaluator::step` -- that is the API
          # and cannot be forbidden. What is guaranteed is the half that was in
          # question: these three crates cannot go and find data on their own.
          # `crates/api` and `crates/pull` may touch the store, deliberately, and
          # gates 9 and 13 govern them.
          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 22 FAILED."
            echo
            echo "A sweep crate that can reach the filesystem can be handed real"
            echo "bars by accident, and the owner's constraint is that even bars"
            echo "pulled by mistake are never used. Keep the capability absent."
            exit 1
          fi
          echo "OK — vocab, indicators, engine and runner cannot reach a bar,"
          echo "     and the first three declare exactly the dependencies pinned above."

      - name: Gate 24 — no writable memory mapping
        run: |
          set -euo pipefail
          # WHY. CLAUDE.md section 4's table bans one outright, and gives the
          # reason in one line: "A writable memory mapping — It raises a signal
          # on a full disk, and a signal cannot be caught."
          #
          # That is not a stylistic preference. A store on a full disk is the
          # normal end state of a backtesting archive, and the failure mode of a
          # writable map there is `SIGBUS` at the instant of the store, delivered
          # to a thread that is executing a plain assignment. There is no `Result`
          # at that point and no unwinding to catch -- and `[profile.release]`
          # sets `panic = "abort"` (gate 25 below), so even a handler would not
          # give the process anywhere to go. `write(2)` returns `ENOSPC` and the
          # code can refuse and say so. That is the whole argument.
          #
          # NOTHING ENFORCED IT. `memmap2 = "0.9"` sits in the root manifest's
          # `[workspace.dependencies]`, so any member may take it with one line,
          # and gate 22 refuses the whole `memmap` family only inside the four
          # SWEPT crates -- which are exactly the crates that never touch the
          # store. `crates/store`, the one place a map would actually be reached
          # for, was covered by no gate at all.
          #
          # A READ-ONLY MAP IS NOT BANNED and this gate does not refuse one.
          # Section 4 names the WRITABLE mapping. Reading a mapped region cannot
          # raise the signal this rule is about at all -- a truncated file can,
          # which is a different hazard with a different answer -- so
          # `Mmap::map` and `MmapOptions` are deliberately absent from the
          # pattern below.
          #
          # THE SPELLINGS, and why each one:
          #   MmapMut          the type. Naming it is enough; you cannot use one
          #                    without it appearing.
          #   MmapRaw          the same capability with the borrow checker taken
          #                    off, which is strictly worse.
          #   map_mut(         `MmapOptions::map_mut`, the constructor.
          #   map_anon(        an anonymous map is always writable. It has no
          #                    file behind it and so cannot hit ENOSPC on a
          #                    store -- but it CAN on a full tmpfs or with
          #                    overcommit off, the delivery is still SIGBUS, and
          #                    an allocation this workspace can make with `Vec`
          #                    is not worth an uncatchable one.
          #   map_copy(        copy-on-write: writable, and each dirtied page is
          #                    a fresh commit that can fail the same way. The
          #                    trailing `(` is what separates it from
          #                    `map_copy_read_only`, which is fine and is not
          #                    matched.
          #
          # WHAT IT CANNOT SEE, said rather than implied: a name assembled at
          # compile time. `crates/runner/src/lib.rs:744` already writes
          # `concat!("Mmap", "Options")` deliberately -- it is a TEST asserting
          # gate 22's banned list, split so that the assertion does not trip the
          # gate it asserts about -- which is proof that the evasion is known and
          # cheap. A text scan cannot follow it. What this gate buys is that the
          # ORDINARY way of writing it is a red build, which is what stops it
          # arriving by habit rather than by intent.
          #
          # MEASURED BEFORE IT WAS WRITTEN: zero occurrences of any of the five
          # over every tracked `.rs` under `crates/`, and no member declares
          # `memmap2` at all. So this gate starts green and there is no
          # allowlist -- section 4 says "without exception", and a gate for an
          # unconditional rule must not ship the mechanism for excusing it.
          #
          # NO UNTRUSTED INPUT: `git ls-files` and the pattern below.
          BANNED_MAP='MmapMut|MmapRaw|(^|[^A-Za-z0-9_])map_mut\(|(^|[^A-Za-z0-9_])map_anon(_mut)?\(|(^|[^A-Za-z0-9_])map_copy\('
          scanned=0
          work=$(mktemp -d)
          : > "$work/hits"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            scanned=$((scanned + 1))
            # Whole-line comments dropped first, the filter gates 17, 22 and 23
            # already use: a comment discussing this rule is not a violation of
            # it, and this very repository writes those at length.
            #
            # AWK-STYLE LINE NUMBERS WOULD BE WRONG HERE and are not claimed:
            # `grep -n` after the strip numbers the STRIPPED stream, so the
            # number shown is not the number in the file. The file name is what
            # is load-bearing and the hit text is quoted in full, which is enough
            # to find it -- gate 17 records the same trade-off and solves it with
            # awk because it reports many; this one expects to report none ever.
            { grep -vE '^[[:space:]]*(//|\*)' "$f" \
              | { grep -E "$BANNED_MAP" || true; } \
              | sed "s|^|${f}: |" >> "$work/hits"; } || true
          done < <(git ls-files 'crates/**/*.rs')

          echo "scanned ${scanned} tracked source file(s) under crates/"
          if [ "$scanned" -eq 0 ]; then
            echo "GATE 24 SCANNED NOTHING. A gate that reads no file is not a gate."
            exit 1
          fi
          if [ -s "$work/hits" ]; then
            echo 'WRITABLE MEMORY MAPPING:'
            sed 's/^/  /' "$work/hits"
            echo
            echo "GATE 24 FAILED."
            echo
            echo "CLAUDE.md section 4 bans a writable memory mapping without"
            echo "exception: it raises SIGBUS on a full disk and a signal cannot"
            echo "be caught, least of all under panic = abort. Write through the"
            echo "file API, check the error, and refuse loudly."
            exit 1
          fi
          echo "OK — no crate maps a file or an anonymous region writably."

      - name: Gate 25 — the release profile still refuses silent wrapping
        run: |
          set -euo pipefail
          # WHY. Two keys in the root manifest are load-bearing for correctness
          # rather than for speed, and NO GATE READ EITHER OF THEM. Deleting one
          # line from `[profile.release]` changes what a shipped binary DOES,
          # with `cargo build`, `cargo test`, `cargo clippy`, `cargo deny` and
          # every other gate in this file still green.
          #
          # `overflow-checks = true`. Rust checks overflow in `dev` by default
          # and WRAPS in `release`. Without this key the two profiles disagree
          # about what a bug is: a price that overflows panics in a test run and
          # silently becomes a plausible wrong number in the shipped one. The
          # manifest's own comment says it -- "a wrapped price is a plausible
          # number that is wrong" -- and CLAUDE.md section 4 bans exactly that
          # shape, a fallback that hides a failure.
          #
          # This is also the key the arithmetic discipline is written against.
          # The lint floor denies `clippy::cast_possible_truncation`,
          # `cast_sign_loss` and `cast_possible_wrap`, and the workspace answers
          # with `checked_`/`saturating_` at every site that can exceed a bound
          # -- the census below counts them live. Every one of those was chosen
          # by an author who believed the unchecked spelling would PANIC. Turn
          # this key off and that belief is false everywhere at once.
          #
          # `panic = "abort"`. Its absence is not silent in the same way, but it
          # is the premise gate 24 argues from one step above -- there is no
          # unwinding to catch anything with -- and it is what makes a panic a
          # crash with a core rather than a half-unwound store write. A change to
          # it is a decision, so it belongs in `docs/05-decisions.md` and not in
          # a quiet diff.
          #
          # WHAT THIS GATE DOES NOT DO: it does not measure anything, and it
          # cannot tell whether a `saturating_` at a given site was the right
          # choice. It reads two keys and refuses their absence. That is a small
          # claim, and it is the one that was missing.
          #
          # NO UNTRUSTED INPUT: the tracked root manifest and the patterns below.
          [ -f Cargo.toml ] || { echo "GATE 25: no root Cargo.toml"; exit 1; }
          # Comments stripped first -- a comment mentioning a key is not a key,
          # and this manifest discusses both of them at length directly above the
          # table. Same defect gate 22 clause A records.
          rel=$(sed 's/#.*//' Cargo.toml | sed -n '/^\[profile\.release\]/,/^\[/p')
          bad=0
          if [ -z "$rel" ]; then
            echo "  REFUSED  Cargo.toml has no [profile.release] table at all"
            bad=1
          fi
          if printf '%s\n' "$rel" | grep -qE '^overflow-checks[[:space:]]*=[[:space:]]*true[[:space:]]*$'; then
            echo "  present  [profile.release] overflow-checks = true"
          else
            echo "  REFUSED  [profile.release] no longer sets overflow-checks = true."
            echo "           release would WRAP where dev panics, and every"
            echo "           checked_/saturating_ site in the workspace was"
            echo "           written believing the opposite."
            bad=1
          fi
          if printf '%s\n' "$rel" | grep -qE '^panic[[:space:]]*=[[:space:]]*"abort"[[:space:]]*$'; then
            echo '  present  [profile.release] panic = "abort"'
          else
            echo '  REFUSED  [profile.release] no longer sets panic = "abort".'
            echo "           That is a decision, and docs/05-decisions.md is"
            echo "           where a decision goes."
            bad=1
          fi
          # And the other direction: a profile that turns the check back OFF.
          # `[profile.bench]` inherits release, so gate 8 measures the shipped
          # arithmetic -- unless something re-enables wrapping under it.
          off=$( { sed 's/#.*//' Cargo.toml \
                   | grep -nE '^overflow-checks[[:space:]]*=[[:space:]]*false' || true; } )
          if [ -n "$off" ]; then
            printf '  REFUSED  a profile switches overflow checking back off:\n%s\n' "$off"
            bad=1
          else
            echo "  present  no profile sets overflow-checks = false"
          fi
          # The census is REPORTING, not a rule. It is here so the log carries
          # the size of what these two keys are protecting, and so a reader can
          # see the number move.
          sat=$( { git ls-files 'crates/**/*.rs' | xargs grep -ohE '(saturating|checked|wrapping)_[a-z_]+' \
                   || true; } | wc -l | tr -d ' ')
          echo "  context  ${sat} explicit saturating_/checked_/wrapping_ site(s) in tracked sources"
          if [ "$bad" -ne 0 ]; then
            echo
            echo "GATE 25 FAILED."
            echo
            echo "Silent wrapping is not an acceptable answer to an arithmetic"
            echo "mistake in a backtesting engine. CLAUDE.md section 4."
            exit 1
          fi
          echo "OK — the release profile still panics on overflow and aborts on panic."

      - name: Gate 27 — every invariant row id names exactly one invariant
        run: |
          set -eu
          # D-0045 found `C-14`..`C-17` naming two invariants each and fixed
          # them. It also wrote down the reason the collision had been invisible:
          # "Nothing in CI checks row-id uniqueness -- gate 10 checks only that a
          # named test exists." D-0209 hit the SAME collision again in the SAME
          # ids, because two later entries assigned C-16 and C-17 to another
          # crate and one of them recorded that it had "verified against gate
          # 10's own resolver" -- the check D-0045 had already named as blind to
          # this. D-0215 then found 44 MORE, across 88 rows: three overloaded
          # letters, `I`, `P` and `G`, each naming two unrelated subjects.
          #
          # Three entries said this should be a gate. This is the gate. It is
          # cheap now only because the tree is clean for the first time.
          #
          # WHAT IT CANNOT SEE: whether two ids that are DIFFERENT describe the
          # same invariant. That is a judgement, not a string comparison.
          #
          # NO UNTRUSTED INPUT: one tracked document and the pattern below.
          f=docs/04-invariants.md
          ids=$(grep -oE '^\| *`?[A-Z][A-Z-]*-[0-9]{2,3}[a-z]?`? *\|' "$f" \
                | sed -E 's/^\| *`?//; s/`? *\|$//')
          n=$( { printf '%s\n' "$ids" | grep -c . || true; } )
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: it reported success while measuring nothing.
          if [ "$n" -eq 0 ]; then
            echo "GATE 27 FOUND NO ROWS. Either the document moved or the pattern"
            echo "stopped matching. A silent zero is not a pass."
            exit 1
          fi
          dupes=$( { printf '%s\n' "$ids" | sort | uniq -d || true; } )
          echo "read ${n} invariant row id(s) in ${f}"
          if [ -n "$dupes" ]; then
            echo
            echo "AN ID NAMES MORE THAN ONE INVARIANT:"
            for d in $dupes; do
              printf '  %s\n' "$d"
              grep -nE "^\| *\`?${d}\`? *\|" "$f" | cut -c1-110 | sed 's/^/      /'
            done
            echo
            echo "A citation to a duplicated id resolves to whichever row comes"
            echo "first, which is a coincidence and not a citation. Renumber the"
            echo "NEWER family onto free ids by the evidence rule D-0045 set and"
            echo "D-0215 reapplied: whichever side is cited from OUTSIDE this"
            echo "document keeps the letter. C-18..C-25 stay retired."
            exit 1
          fi
          echo "OK — ${n} rows, all ids unique."
      - name: Gate 26 — every HTTPS client installs the TLS provider
        run: |
          set -eu
          # `rustls` 0.23 ships NO cryptography of its own: a provider must be
          # installed into the process before the first client is built. A
          # `Client::builder()` reached without `pull::ensure_tls_provider()`
          # COMPILES CLEANLY and panics at run time with "No provider set" --
          # a failure the compiler cannot see and a test finds only if it
          # happens to drive that exact path.
          #
          # This gate exists because D-0211 removed `ring`. Under the old
          # `rustls-tls` feature a provider was compiled in and installed by
          # default, so forgetting was impossible; now it is possible, and the
          # cost of forgetting is a panic in front of an operator rather than a
          # red build. The rule is mechanical, so a gate can hold it.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * A client built through a helper in another file. The check is
          #     per-file, so a wrapper that hides `Client::builder()` behind its
          #     own name defeats it exactly as a rename defeats gate 13.
          #   * Whether the call happens BEFORE the builder on the executed
          #     path. It counts occurrences in a file, not order.
          # Both are the conservative direction: it can miss, it cannot
          # falsely accuse.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files` and the
          # patterns below. Gate 1c's discipline.
          bad=0; sites=0; files=0
          for f in $(git ls-files 'crates/*.rs'); do
            n=$( { grep -c 'Client::builder()' "$f" || true; } | tr -d ' ')
            [ "$n" -eq 0 ] && continue
            files=$((files + 1)); sites=$((sites + n))
            g=$( { grep -c 'ensure_tls_provider()' "$f" || true; } | tr -d ' ')
            if [ "$g" -lt "$n" ]; then
              printf 'UNGUARDED CLIENT  %s — %s Client::builder() call(s), %s ensure_tls_provider()\n' \
                "$f" "$n" "$g"
              bad=1
            else
              printf '  ok  %s — %s site(s), %s guard(s)\n' "$f" "$n" "$g"
            fi
          done
          echo "checked ${sites} client construction site(s) in ${files} file(s)"
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: it reported success while measuring nothing.
          if [ "$sites" -eq 0 ]; then
            echo "GATE 26 FOUND NO CLIENT SITES. Either reqwest left the workspace"
            echo "or the pattern stopped matching. A silent zero is not a pass."
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo
            echo "Call pull::ensure_tls_provider() before building the client."
            echo "See docs/05-decisions.md D-0211."
            exit 1
          fi
          echo "OK — every client construction is guarded."

      - name: Gate 19 — a failure an operator can see is a failure the log records
        run: |
          set -euo pipefail
          # THE ONE THING THE EMIT-SITE COUNT CANNOT ANSWER.
          #
          # `api::emitted` counts every `telemetry::emit` under crates/api/src
          # and proves each reaches a file. That is a strong guarantee about the
          # sites that EXIST, and it says nothing whatever about a failure path
          # that has none — which is the gap an operator actually falls into.
          #
          # Measured: four arms of `pull::ingest` pushed a `Failure` onto the
          # receipt and emitted NOTHING, so a backfill that landed zero bars
          # left a quiet log. They were found by reading every `Result`-
          # returning function by hand, which is not a thing anyone will do
          # again. This gate is that reading, mechanised.
          #
          # THE RULE. Every `failures.push(` and `failures: vec![` in production
          # code under crates/{pull,api}/src must have a `telemetry::emit(` or a
          # `note_*(` helper call within the WINDOW lines above it. Both forms
          # count because this workspace extracts emits into `note_*` helpers as
          # soon as a function reaches clippy's line limit — refusing the helper
          # form would push authors to inline the emit and fail the OTHER gate.
          #
          # WHAT IT DELIBERATELY DOES NOT DO. It does not check that the event
          # is at a useful level, or carries the right fields, or is reachable
          # from a test — `api::emitted` and gate 12 cover those. It answers one
          # question: did anybody write an event here at all.
          #
          # IT USED TO SKIP FROM THE FIRST `#[cfg(test)]` ONWARD, AND THAT LINE
          # SAID "Every file in this workspace puts its test module last". That
          # was not true and the cost was measurable: `crates/api/src/server.rs`
          # is 15,654 lines and its first `#[cfg(test)]` is at 7,717, so 7,937
          # lines of PRODUCTION code sat past the cut and this gate reported
          # success over every one of them. `crates/api/src/audit.rs` hid 797
          # more the same way.
          #
          # THIS IS THE EXACT BUG CLASS GATE 11 ALREADY FIXED, and the reasoning
          # there applies here unchanged: truncating at an attribute hides every
          # line after it, and a `#[cfg(test)]` is not only ever a test module --
          # it sits on const fns and on statements inside shipping bodies. One
          # attribute shrinks the scan exactly as silently as two.
          #
          # So the boundary is a SUBTRACTION now, not a cut. The stripper below
          # is gate 11's, character for character, and it is duplicated rather
          # than shared because a `run:` step cannot import from another step and
          # the alternative -- a tracked shell script -- is a file extension
          # gate 1 refuses. From a `#[cfg(test)]`, skip blank lines, `//`
          # comments and attributes to find the item it covers; if that item is
          # an inline `mod NAME {`, drop through to the matching `}` at the same
          # indent; otherwise keep the attribute and the item and carry on. A
          # file may hold as many test modules as it likes, in any position, and
          # none of them hides a line. D-0065.
          #
          # THE SUBTRACTION DID NOT CHANGE TODAY'S VERDICT AND THAT IS THE POINT.
          # Both sites the old cut hid -- `audit.rs:1796` and `server.rs:15626`
          # -- turn out to be inside `#[cfg(test)] mod` blocks, so the count is
          # 11 sites before and 11 after. The gate was right by luck over 8,734
          # lines it could not see, and luck is not a boundary.
          #
          # A FILE THIS SCANNER CANNOT DELIMIT IS A REFUSAL, not a guess, for the
          # reason gate 11 gives: "I could not tell where this module ends" is a
          # thing a gate may say; quietly scanning half of it is not.
          #
          # WHOLE-FILE TEST MODULES ARE DROPPED only when compiler attributes
          # exclude them from production, in the crate root or at file scope.
          # A filename or ordinary comment never exempts a file.
          # `pull/src/emit_sites.rs` and `api/src/emitted.rs` are
          # that shape. Neither records a failure today, so this changes no
          # count -- it is here so a `Failure` FIXTURE added to one of them is
          # not read as a production failure path.
          #
          # ONE EMIT SATISFIES ONE FAILURE, AND ONLY THE NEAREST ONE ABOVE IT.
          #
          # The first version of this gate asked "is there an emit within twelve
          # lines above". It passed a tree with a deliberately deleted emit,
          # because the site below simply matched the site ABOVE's event. A gate
          # that can be satisfied by somebody else's work is not a gate.
          #
          # So each event is claimed at most once, nearest-first. Five failures
          # and four events is a failure, wherever the four happen to sit.
          #
          # THE WINDOW IS COUNTED IN ORIGINAL SOURCE LINES, not in corpus lines.
          # The stripper stamps every kept line with the line number it had in
          # the file, and the arithmetic below reads that stamp -- so a comment
          # block or a test module between an emit and a failure still costs its
          # full height, exactly as it did before. Twelve means twelve lines of
          # file, which is the only reading a person checking the diff can make.
          #
          # A `fn note_*(` DEFINITION is not a call. Counting the helper's own
          # signature would let a file satisfy itself by declaring helpers.
          #
          # WHAT IT STILL CANNOT SEE. `/* ... */` block comments are not
          # stripped; only whole lines whose first non-blank characters are `//`.
          # A `telemetry::emit(` named inside a block comment or a string
          # literal within the window therefore still satisfies a failure site,
          # which is the false-NEGATIVE direction and is the one this gate has
          # always had. And `#[cfg(test)] mod tests {` written on ONE line is not
          # recognised as a module, so its body is scanned -- loud, never silent.
          window=12
          work="$(mktemp -d)"
          found="$work/missing"; : > "$found"
          counted="$work/counted"; : > "$counted"

          strip='
            function emit(line, no,   t) {
              print F ":" no ":" line > SCOPE
              t = line; sub(/^[ \t]+/, "", t)
              if (t !~ /^\/\//) print F ":" no ":" line
            }
            function flush(  i) { for (i = 1; i <= nb; i++) emit(bl[i], bn[i]); nb = 0 }
            function hold(line, no) { nb++; bl[nb] = line; bn[nb] = no }
            BEGIN { st = 0; depth = 0; nb = 0; drop = 0 }
            {
              if (st == 2) {
                drop++
                if ($0 ~ CLOSE) { st = 0; next }
                # INSIDE THE MODULE, EVERY LINE IS DEEPER THAN THE `mod`
                # KEYWORD OR IT IS BLANK. A line at the module indent or
                # shallower that is NOT the closing brace means the brace this
                # scanner is waiting for is not the one that closes the module,
                # and matching a later brace at the same indent would swallow
                # whatever lies between them -- silently, which is the whole
                # defect this boundary replaced. Refuse instead.
                #
                # Blank lines and whole-line comments are exempt, and that
                # costs nothing: neither can hide a construct, and the first
                # line of actual code past the module still trips the check.
                lead = $0; sub(/[^ \t].*$/, "", lead)
                t = $0; sub(/^[ \t]+/, "", t)
                if (t != "" && t !~ /^\/\// && length(lead) <= length(IND)) exit 3
                next
              }
              t = $0; sub(/^[ \t]+/, "", t)
              if (st == 0) {
                if (t ~ /^#\[cfg\(test\)\][ \t]*$/) { st = 1; depth = 0; nb = 0; hold($0, NR); next }
                emit($0, NR); next
              }
              if (depth > 0) { depth += gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if (t == "" || t ~ /^\/\//) { hold($0, NR); next }
              if (t ~ /^#\[/) { depth = gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if ($0 ~ /^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?mod[ \t]+[A-Za-z0-9_]+[ \t]*\{[ \t]*$/) {
                IND = $0; sub(/[^ \t].*$/, "", IND)
                CLOSE = "^" IND "\\}[ \t]*$"
                drop += nb + 1; nb = 0; st = 2; next
              }
              flush(); emit($0, NR); st = 0
            }
            # A module still open at EOF, or an attribute with no item under
            # it, is the same refusal for the same reason: this scanner will
            # not guess where test code ends.
            END { print drop > SUM; if (st != 0) exit 3 }
          '

          # A FUNCTION, and not an inline filter, because bash's process
          # substitution parser fails on `#` comments inside `<( ... )`.
          # `grep -A 1` means the attribute has to sit immediately above the
          # declaration to count.
          whole_file_test_module() {
            # The compiler excludes this entire file in every non-test build.
            if head -1 "$1" | grep -qxF '#![cfg(test)]'; then return 0; fi
            stem="${1##*/}"; stem="${stem%.rs}"
            root="${1%/src/*}/src/lib.rs"
            [ -f "$root" ] \
              && grep -A 1 '^#\[cfg(test)\]$' "$root" \
                 | grep -Eq "^(pub(\([a-z]+\))? )?mod ${stem};$"
          }

          walked=0; kept=0; dropped=0; undelimited=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            # `wc -l` counts newlines, not lines. `awk END{print NR}` is the
            # count that survives a file whose last line is unterminated -- the
            # same correction gate 11 carries.
            tot=$(awk 'END{print NR}' "$f")
            : > "$work/one.scope"; : > "$work/one.sum"
            # NOTHING IS SCANNED UNTIL THE FILE PARSES. The corpus is the
            # comment-stripped half; `one.scope` is written by the stripper and
            # is deliberately not read here, because this gate matches code and
            # a `//` line cannot hold a call.
            if awk -v F="$f" -v SCOPE="$work/one.scope" -v SUM="$work/one.sum" \
                   "$strip" "$f" > "$work/one.corpus"; then
              d=$(cat "$work/one.sum")
              dropped=$((dropped + d)); kept=$((kept + tot - d))
            else
              printf 'UNDELIMITED TEST MODULE  %s\n' "$f"
              undelimited=$((undelimited + 1))
              continue
            fi
            awk -F: -v window="$window" -v name="$f" '
              { n = $2 + 0; t = $0; sub(/^[^:]*:[0-9]+:/, "", t) }
              t ~ /^[[:space:]]*fn[[:space:]]+note_[a-z_]+\(/ { next }
              t ~ /telemetry::emit\(|note_[a-z_]+\(/ { e[++ne] = n; next }
              t ~ /failures\.push\(|failures: vec!\[/ { p[++np] = n }
              END {
                for (i = 1; i <= np; i++) {
                  print "counted" > "/dev/stderr"
                  ok = 0
                  for (j = ne; j >= 1; j--) {
                    if (claimed[j]) continue
                    if (e[j] >= p[i]) continue
                    if (p[i] - e[j] > window) break
                    claimed[j] = 1; ok = 1; break
                  }
                  if (!ok) print name ":" p[i]
                }
              }' "$work/one.corpus" >> "$found" 2>>"$counted"
          done < <(git ls-files 'crates/pull/src/*.rs' 'crates/api/src/*.rs' \
                   | while IFS= read -r cand; do
                       whole_file_test_module "$cand" || printf %s\\n "$cand"
                     done || true)

          # A gate must say what it walked. A glob that matches nothing is the
          # failure mode gate 8 shipped with for the whole life of the
          # repository, and it reported success the entire time.
          echo "walked ${walked} production source file(s) under crates/{pull,api}/src/"
          echo "  ${kept} line(s) in scope, ${dropped} inside a #[cfg(test)] module"
          if [ "$walked" -eq 0 ]; then
            echo "GATE 19 WALKED NOTHING. A gate that scans no file is not a gate."
            exit 1
          fi
          if [ "$undelimited" -ne 0 ]; then
            echo
            echo 'A #[cfg(test)] module above has no closing brace at the same'
            echo 'indent as its own `mod` keyword, so this scanner cannot tell'
            echo 'where it ends and will not guess. `cargo fmt` does not emit'
            echo 'that shape; if it is deliberate, the boundary is what has to'
            echo 'change, not this message.'
            exit 1
          fi

          echo "checked $(wc -l < "$counted" | tr -d ' ') production failure-recording site(s)"
          if [ -s "$found" ]; then
            echo
            echo "A FAILURE IS RECORDED HERE AND NOTHING IS LOGGED:"
            sed 's/^/  /' "$found"
            echo
            echo "The receipt will show it and the log will not, so an operator"
            echo "reading /logs after a failed run sees a quiet file. Emit an"
            echo "event beside it — Error or Warn, so it clears the default"
            echo "floor — or extract a note_* helper as pull::ingest does."
            echo "CLAUDE.md section 4: degrade loudly and name the reason."
            exit 1
          fi
          echo "OK — every recorded failure has its own event beside it."


      - name: Gate 10 — every invariant names a test that exists
        run: |
          set -euo pipefail
          # docs/04-invariants.md asserts: "A consistency check in CI fails if
          # a row's test does not exist." Until this gate existed that sentence
          # was false, which is precisely the decay the file was written to
          # prevent -- a row pointing at nothing is what turns the file into a
          # wish list.
          #
          # THIS GATE HAD A HOLE AND PRINTED "0 missing" THROUGH IT for its
          # whole life. Three defects, every one of them silent:
          #
          #  1. THE SKIP WAS UNAUDITED. The rule was "skip a row whose status
          #     cell is —", justified by the legend's meaning of that glyph:
          #     "not yet reachable (the crate does not exist)". The gate never
          #     checked the crate. So a row could name a test that exists in no
          #     file, wear a —, and pass. TEN rows did, in four crates that are
          #     tracked TODAY: S-02, S-05, S-10, P-01, P-02, P-03, P-04, X-01,
          #     X-02, X-13. Measured, not inferred -- the old gate printed
          #     "checked 139 named test(s); 0 missing" on the same tree that
          #     holds them. The status glyph is now documentation. The fact
          #     that decides is whether crates/<crate>/Cargo.toml is TRACKED,
          #     which is the thing the legend was talking about all along.
          #  2. THE CRATE SEGMENT WAS THROWN AWAY. `crate::module::name` was
          #     reduced to `name` and searched for across every .rs file in the
          #     workspace, so `engine::proptest::antimonotone` would have been
          #     satisfied by an `fn antimonotone` in crates/store. The search is
          #     now confined to the crate the row names.
          #  3. `xargs -r grep -q` RETURNS 123 WHEN ANY BATCH MISSES. xargs
          #     exits 123 if any invocation exits 1..125, and `grep -q` exits 1
          #     on the batches that do not contain the match -- so as soon as
          #     the workspace outgrows one ARG_MAX batch, a test that DOES
          #     exist is reported missing. A red build for a reason that is not
          #     true is how a gate gets ignored. One fixed-string lookup into a
          #     table built once replaces it.
          #
          # WHAT IT STILL CANNOT SEE:
          #   * That the named function is a TEST. `#[test]` is not required,
          #     because a `harness = false` bench function carries no attribute
          #     and C-01 through C-13 are proven by exactly those. So a row can
          #     be satisfied by an ordinary function of the right name in the
          #     right crate.
          #   * That the test proves the invariant. Nothing mechanical can.
          #   * The module segment of a qualified token. `store::unit::x` and
          #     `store::fault::x` are the same question to the legacy scanner.
          #     An explicit `x` in `crates/store/src/file.rs` instead binds x
          #     to that exact tracked source file through invariant_paths.rs.
          #   * A row whose "Proven by" cell is prose, a const assertion or a
          #     CI gate rather than a qualified token or an explicit name in
          #     a source file. Those prose-only rows are not checked.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files`, the document,
          # and the static patterns below. Gate 1c's discipline.
