name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ==========================================================================
  # GATE 1 + 2 — the load-bearing gates. No toolchain, no cache, seconds.
  # These run first so a violation fails before anything expensive starts.
  # ==========================================================================
  language-purity:
    name: Gate 1+2 — one language
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gate 1 — extension allowlist
        run: |
          set -euo pipefail
          # The ONLY extensions this repository may contain OUTSIDE web/.
          allowed='rs|toml|md|lock|html|css|yml|json'
          # Under web/ ONLY, the browser languages are allowed -- D-0052. This
          # is narrowed by PATH, not relaxed by extension: putting `ts` on the
          # line above would permit a build script anywhere in the tree, which
          # is the thing CLAUDE.md section 2 exists to forbid.
          web_allowed='.*'
          # Files with no extension that are still legitimate.
          allowed_names='LICENSE|CODEOWNERS|.gitignore|.gitattributes'
          bad=0
          while IFS= read -r f; do
            base="${f##*/}"
            if printf '%s\n' "$base" | grep -Eq "^(${allowed_names})$"; then continue; fi
            case "$base" in
              *.*) ext="${base##*.}" ;;
              *)   ext="" ;;
            esac
            # WHICH LIST APPLIES IS DECIDED BY THE PATH, not by the file.
            # Under web/ the browser languages are legal; everywhere else the
            # hard rule is untouched, so a .ts under crates/ fails here exactly
            # as it always did.
            case "$f" in
              web/*) list="$web_allowed" ; where='web/' ;;
              *)     list="$allowed"     ; where='outside web/' ;;
            esac
            if ! printf '%s\n' "$ext" | grep -Eq "^(${list})$"; then
              printf 'FORBIDDEN FILE  %s  (extension %s, %s)\n' \
                "$f" "${ext:-<none>}" "$where"
              bad=1
            fi
          done < <(git ls-files)
          if [ "$bad" -ne 0 ]; then
            echo
            echo "This repository is Rust only outside web/. See CLAUDE.md section 2"
            echo "and docs/05-decisions.md D-0052."
            echo "Outside web/: ${allowed//|/ }"
            echo "Under  web/: ${web_allowed//|/ }"
            exit 1
          fi
          echo "OK — every tracked file is in the allowlist for where it lives."

      - name: Gate 1e — the engine builds with no front-end toolchain
        run: |
          set -euo pipefail
          # WHAT §2 ACTUALLY REQUIRES, quoted, because the previous version of this
          # gate tested something else and that is why it enforced nothing:
          #
          #   "no crate may depend on the front end's toolchain to build, test or
          #    run. `cargo build`, `cargo test` and `cargo clippy` must pass on a
          #    machine with no Node, no package manager and no `web/` build ever
          #    run."
          #
          # The operative words are "no `web/` BUILD ever run". `web/build/` is
          # TRACKED, so a fresh clone already has the bundle and `crates/api` may
          # embed it without any bundler existing. §2 does not require the build to
          # survive `web/` being absent -- it requires it to survive the TOOLCHAIN
          # being absent.
          #
          # The old gate moved the whole `web/` tree aside, which breaks `api`'s
          # embed by construction. Its own comment called that failure "expected",
          # and so it captured the output with `set +e` and NEVER READ THE EXIT
          # STATUS -- it only grepped for seven toolchain words. An audit proved the
          # consequence with a stub cargo exiting 101: the gate exited 0. So §2's
          # central build promise was enforced by nothing at all.
          #
          # This version shadows the toolchain instead. Every binary a crate could
          # reach for is replaced by a stub that logs and fails, then the workspace
          # is built with that stub directory first on PATH. Two things must hold,
          # and both are now checked:
          #
          #   1. the build SUCCEEDS -- the exit status is read
          #   2. no stub was ever invoked
          #
          # A crate that shells out to a bundler trips clause 2 AND, because the
          # stub exits 127, clause 1 as well.
          stub="$(mktemp -d)"
          # Each stub APPENDS TO A FILE as well as writing to stderr, and the file is
          # what the check reads. Cargo suppresses a build script's stderr unless the
          # script itself fails, so a `build.rs` doing
          # `let _ = Command::new("vite").status();` invoked the stub and left no
          # trace in the captured output at all -- the first version of this clause
          # missed exactly that, verified by injecting it. A file on disk is outside
          # cargo's output capture.
          invoked="$stub/.invoked"
          for tool in node npm npx yarn pnpm bun deno vite webpack esbuild rollup tsc; do
            printf '#!/bin/sh\nprintf "%%s\\n" "%s" >> "%s"\necho "GATE-1E-INVOKED: %s" >&2\nexit 127\n' \
              "$tool" "$invoked" "$tool" > "$stub/$tool"
            chmod +x "$stub/$tool"
          done
          echo "shadowed: $(ls "$stub" | tr '\n' ' ')"

          set +e
          out="$(PATH="$stub:$PATH" cargo build --workspace --locked --all-targets 2>&1)"
          status=$?
          set -e

          if [ -s "$invoked" ]; then
            echo "FORBIDDEN: a crate invoked a front-end toolchain during the build:"
            sort -u "$invoked" | sed 's/^/  /'
            exit 1
          fi
          # The check the old gate discarded. A failing build with no toolchain on
          # PATH is exactly what §2 forbids, whatever the reason.
          if [ "$status" -ne 0 ]; then
            echo "GATE 1E FAILED: cargo build exited $status with the front-end"
            echo "toolchain shadowed. §2 requires it to pass on a machine with no"
            echo "Node and no package manager. The tail of the build:"
            printf '%s\n' "$out" | tail -40
            exit 1
          fi
          # And the words, kept as a second signal: a crate could reach a toolchain
          # by an absolute path the stub directory does not shadow.
          if printf '%s' "$out" | grep -qiE 'node_modules|yarn\.lock|pnpm-lock|package\.json'; then
            echo "FORBIDDEN: the build read front-end package metadata."
            printf '%s\n' "$out" | grep -iE 'node_modules|yarn\.lock|pnpm-lock|package\.json'
            exit 1
          fi
          echo "OK — the workspace builds with node, npm, yarn, pnpm and five bundlers shadowed."
      - name: Gate 1b — .json and .yml are confined
        run: |
          set -euo pipefail
          # JSON and YAML are config, not source, and only belong in two places.
          #
          # THE SECOND PLACE IS `web/`, NOT `crates/web/`.
          #
          # D-0052 moved the front end out of the crate graph to `web/`, and
          # D-0053 made that directory unrestricted -- any language, any
          # toolchain, any extension. Gate 1a was updated for the move; this
          # gate was not, and it kept naming a path that no longer exists.
          #
          # The result was a gate that failed on `web/package.json` -- a file a
          # SvelteKit app cannot exist without, and one D-0053 explicitly
          # permits. A stale allowlist refusing a legal file is the same class
          # of failure as a permissive one accepting an illegal file: the gate
          # stopped describing the rule it was written to enforce.
          #
          # `.claude/` is the run configuration IntelliJ and the preview tools
          # read. It is operator tooling, not source, and it is not shipped.
          bad=$(git ls-files '*.json' '*.yml' \
                | grep -Ev '^(\.github/|\.claude/|web/)' || true)
          if [ -n "$bad" ]; then
            printf 'CONFIG OUTSIDE ITS HOME:\n%s\n' "$bad"; exit 1
          fi
          echo "OK."

      - name: Gate 1c — no literal credential path
        run: |
          set -euo pipefail
          # This repository is public. A Parameter Store path names an account,
          # an environment and a vendor relationship; once pushed it lives in
          # every fork's history forever. Documents carry only the generic
          # shape /<org>/<env>/<vendor>/<field> — which does not match this
          # pattern, because <env> is not a real environment name.
          # See docs/05-decisions.md D-0013 and docs/04-invariants.md X-08.
          #
          # WHAT THIS GATE DOES NOT SEE, stated because X-08 used to claim more
          # than it proves and crates/pull's whole safety argument leans on it.
          # It matches a SLASH-JOINED path whose environment segment is one of
          # the ten words below. It cannot see a bare `const ORG: &str = "..."`,
          # and it cannot see a joined path whose env segment is outside that
          # alphabet. Gate 1d below is the check for the crate where that gap
          # matters; docs/06-limits.md §18 records what neither of them can do.
          #
          # No untrusted input reaches this step: the inputs are `git ls-files`
          # and a static pattern. Nothing from the event payload is expanded.
          envs='prod|production|dev|development|stage|staging|uat|qa|sandbox|live'
          hits=$(git ls-files -z \
                 | xargs -0 -r grep -nE "/[A-Za-z0-9][A-Za-z0-9_.-]*/(${envs})/" \
                 || true)
          if [ -n "$hits" ]; then
            printf 'LITERAL CREDENTIAL PATH IN A TRACKED FILE:\n%s\n' "$hits"
            echo
            echo "Use the shape /<org>/<env>/<vendor>/<field>. The real"
            echo "segments are resolved at runtime. See D-0013."
            exit 1
          fi
          # The runtime configuration itself is never tracked.
          tracked=$(git ls-files | grep -E '(^|/)credentials\.toml$' || true)
          if [ -n "$tracked" ]; then
            printf 'CREDENTIAL CONFIG IS TRACKED:\n%s\n' "$tracked"; exit 1
          fi
          echo "OK — no literal credential path, no tracked credential config."

      - name: Gate 1d — every segment-shaped literal in crates/pull is declared
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. crates/pull is the one crate whose safety argument
          # is "every path segment written down here is invented", and until
          # this gate that sentence was a comment. Gate 1c cannot check it: it
          # only matches a slash-JOINED path with a well-known environment
          # name, so a bare `const ORG: &str = "<the real org>";` passes it —
          # demonstrated, not assumed. See docs/06-limits.md §18.
          #
          # WHAT IT CHECKS. Every double-quoted literal under crates/pull that
          # could BE a parameter path segment — lower-case, [a-z0-9_-], at most
          # MAX_SEGMENT_LEN bytes — must appear in the list below. Comments and
          # doc examples are scanned too: a real segment pasted into a doc
          # example publishes it exactly as effectively as a constant does.
          #
          # THE ONE SHAPE THAT IS NOT SCANNED, and why it is a tightening and
          # not a hole: a literal that is EXACTLY `YYYY-MM-DD` is skipped. An
          # ISO-8601 calendar date names no account, no environment, no vendor
          # and no field — it carries zero bytes of the information this gate
          # protects — and the crate's date arithmetic generates them without
          # limit, one per boundary a test pins. Nine were on the list at the
          # commit this exclusion was added: leap days, month rolls, a century
          # non-leap year. Left in, they would have grown until the allowlist
          # was a wall of dates and nobody read the words next to them, which
          # is the failure mode of an allowlist. The exclusion is anchored at
          # both ends and requires exactly four-two-two digits, so `2024-02`,
          # `prod-2024-01-01` and any segment with a letter in it are still
          # scanned. All-digit literals are still scanned — see group 10.
          #
          # WHAT IT CANNOT CHECK. That the words below are not themselves an
          # operator's real segments. `groww` and `dhan` are on the list because
          # crates/core has tracked them since its first commit, and an operator
          # whose parameter path uses the broker's public name as its vendor
          # segment has published that segment by their own choice. That is
          # operator-side and docs/06-limits.md §18 says so.
          #
          # A NEW ENTRY IS A DELIBERATE ACT. Adding a word here is the moment to
          # ask whether it is invented. That is the whole mechanism, and it is
          # why the list is split into NAMED GROUPS with a comment over each
          # rather than one undifferentiated block: a reviewer has to read which
          # group a new word joined, and a word that fits no group is the
          # question this gate exists to ask. The comments live BETWEEN the
          # assignments and never inside them — `printf '%s\n' $allowed`
          # word-splits, so a `#` inside a string would silently become an
          # allowed word, and so would every word after it on that line.
          #
          # ---- group 1: the shape's own vocabulary, and the one real region.
          # `/<org>/<env>/<vendor>/<field>` written out, plus `ap-south-1`,
          # which CLAUDE.md §8 states in the clear.
          seg_shape='org env region vendor fields ap-south-1'

          # ---- group 2: vendor wire names. THE ONES THIS GATE EXISTS FOR.
          # Each is a data vendor's own public product name, written down here
          # as the name its bars are filed under — `Descriptor::wire` in
          # crates/pull/src/vendor.rs. `groww` and `dhan` carry the reasoning
          # above. `truedata` and `gdfl` are the same case and were checked the
          # same way before being added: both are already tracked and public in
          # docs/08-vendor-samples.md and docs/05-decisions.md, so removing
          # them from crates/pull would leak nothing back. Whether either is
          # ALSO an operator's real `<vendor>` segment is operator-side and
          # unknowable from inside this repository — docs/06-limits.md §18.
          # Note for the reader: CLAUDE.md §8 says crates/pull "holds no org,
          # env, or vendor literal". Four vendor literals are on this line. The
          # sentence and the tree disagree and the tree is not being hidden.
          vendor_wire='groww dhan truedata gdfl'

          # ---- group 3: invented configuration fixtures. Nonsense by
          # construction — no operator's path reads `orgone/testenv/vendorone`.
          config_fixture='
          orgone testenv vendorone vendortwo fieldone fieldtwo fieldthree
          field-one_2 a-value
          '

          # ---- group 4: deliberately secret-SHAPED fixtures, which exist to
          # prove the secret backstop rejects them. Keyboard walks and the
          # oldest joke password in the trade; none is a credential.
          secret_fixture='
          k7f2p9q1w8e3-5t6y0u4i2o9 k7f2p9q1w8e3r5t6y0u4i2o
          k7f2p9q1w8e3r5t6y0u4i2o9 kfpqwerstyuioasdfghjklzx
          hunter2 hunter2-and-then-some stale fresh 9876
          shhh the-token default-secret other-token
          '

          # ---- group 5: test scaffolding — expect() messages, assert labels,
          # fixture names and words quoted inside prose. The gate scans comments
          # on purpose, so a word quoted in a doc comment lands here too.
          # `brutex-no-such-dir-ever` is a path chosen to NOT exist.
          #
          # The last two lines are the socket and decoder tests in
          # crates/pull/src/http.rs, and every one of them is a word this
          # repository chose rather than one a vendor did:
          #   x            — a JSON string standing where a number belongs
          #   nz snapshots — fold.rs refusal text asserted back
          #   decodes unchanged records — expect() messages
          #   cached       — the SECOND object in the two-object splice fixture
          #                  (D-0049). Deliberately not `live`, which group 7
          #                  already carries for a different reason.
          #   stolen       — the path a test redirect points at, named to read
          #                  as what following it would have meant (D-0050)
          #   redirect window_async — substrings a refusal must contain
          scaffold='
          a v one no ok big good invalid genesis manifest write read-only deny
          anything mkdir notutf8 atthebound brutex-pull june july nifty
          core store pull ratio
          real next small bounded three summed everything february
          non-zero non-decreasing held centuries negative per-day per-second
          brutex-no-such-dir-ever
          x nz snapshots decodes unchanged records
          cached stolen redirect window_async
          b h 2026 half nope other reads signs forwards readable
          bars empty idempotent lands paise shared lock-held
          brutex-ssm-no-such-file-ever
          '

          # ---- group 6: granularity and session tokens. `Granularity::dir`
          # and `SessionKind::label` in crates/pull/src/vendor.rs. These name a
          # bar interval and are the STABLE ON-DISK DIRECTORY NAMES, which
          # CLAUDE.md §3 rule 8 forbids renaming.
          #
          # `1d` and `day` are NOT directory names and never reach the disk.
          # They appear in a doc comment on `Granularity::wire` that explains
          # why the wire word is DECLARED per vendor rather than derived from
          # the directory name: `1day`, `1d` and `day` are all real spellings
          # used by real brokers for the same rung, so there is no rule that
          # turns one into the others and inventing one would be CLAUDE.md
          # section 3 rule 1. The gate scans comments on purpose, so prose
          # about a spelling lands here exactly as a constant would -- which is
          # the correct behaviour, because a real segment pasted into a doc
          # comment publishes it just as effectively.
          timeframe='
          tick 1s 5s 1min 3min 5min 15min 30min 1hr 1day 1week continuous
          1d day
          '

          # ---- group 7: rate-governor display strings, crates/pull/src/rate.rs.
          # `WindowSpan::{Second,Minute,Day}` and `RequestKind::{Live,
          # Historical}` rendering themselves for a log line or a refusal.
          # `live` IS one of the ten environment words gate 1c matches on, and
          # that is why it was looked at rather than waved through: here it is
          # the live-quote endpoint group as opposed to the historical one, in
          # a two-variant enum, and it is joined to no path.
          governor='second minute day live historical'

          # ---- group 8: the vendors' own record field names. CLAUDE.md §8
          # says in as many words that crates/pull "holds the shape and the
          # field names". `FieldNames`/`ResponseShape` in vendor.rs, the
          # column labels fetch.rs quotes back in a refusal, and the file
          # extension archive.rs checks. None is a credential field.
          #
          # `data` is an ENVELOPE key — the object a vendor hangs its bars
          # under, exactly as `payload` above already is, and since D-0049 the
          # decoder reads only the one the descriptor names. `from` and `to`
          # are the two query parameters a GET vendor takes its window in
          # (`Method::Get` in http.rs). All three are wire vocabulary, which is
          # the category this group exists for.
          record_field='
          open high low close volume timestamp open_interest payload csv
          data from to candles
          status error code message
          '

          # ---- group 9: an HTTP HEADER NAME, not a value. One broker sends
          # its token in a header called `access-token`; the token itself is
          # read from Parameter Store and never appears in this repository.
          # Read this line twice before adding anything to it.
          #
          # `x-token` was read twice. It is the header name on the INVENTED
          # descriptor the http.rs tests are built from — `x-` is the
          # conventional prefix for a name no registry owns, and no vendor in
          # crates/pull/src/vendor.rs uses it. The other broker's header is
          # `Authorization`, which this gate never sees because its capital
          # letter puts it outside the lower-case pattern being scanned; that
          # is the scan's shape, not an exemption, and the descriptor spells it
          # that way because that is the name on the wire.
          header_name='access-token x-token'

          # ---- group 10: bare integers a refusal message must contain, so the
          # test asserts the refused value is IN the message. These are domain
          # bounds — u32::MAX, the year-9999 epoch-millisecond ceiling, the two
          # lengths of February. All-digit literals are NOT excluded from the
          # scan by shape, deliberately: a twelve-digit account number is a
          # perfectly ordinary `<org>` segment, and `253402281000` is twelve
          # digits. It is on this list because it was read, not because a
          # pattern let it past.
          bound_number='10000 1970 9999 28 29 4294967295 253402281000
          0 1e300'

          # ---- group 11: FIELD LABELS IN A `Debug` RENDERING, not values.
          # `HttpSource`'s Debug impl is hand-written precisely so the token is
          # never printed, and these two strings are the captions it prints
          # instead: `base_url` beside the descriptor's URL, and `token` beside
          # the fixed string `<redacted>`. `token` is on an allowlist in a
          # credential gate and that is worth stopping on — it is the word
          # "token", four characters, standing where a value would be if this
          # impl were derived. That it appears here is the evidence the redact
          # is in place, not evidence of a leak.
          debug_label='base_url token'

          # ---- group 12: DATES ON THE WIRE, in the two compact formats.
          # `DateFormat::{CompactYmd,CompactDmy}` render 2025-07-01 as
          # `20250701` and `01072025`, and the test that pins all four formats
          # asserts both. Group 10's note explains why all-digit literals are
          # scanned rather than waved through, and the `YYYY-MM-DD` exclusion
          # above is anchored to that one spelling on purpose — so these two
          # are declared here by hand. Both are the same calendar date this
          # repository already writes in the clear a dozen times over; neither
          # names an account, an environment, a vendor or a field.
          wire_date='20250701 01072025'

          # ---- group 13: AWS SigV4's own wire vocabulary, crates/pull/src/ssm.rs.
          # Every word here is published by AWS and fixed by the signing
          # algorithm. None is an operator's choice, so none can be one of their
          # path segments. `ssm` is the service code that appears in the
          # credential scope; `aws4_request` is the terminator the algorithm
          # mandates; the rest are HTTP header names AWS defines.
          #
          # `us-east-1`, `20150830` and `20150831` are lifted VERBATIM from
          # AWS's own published SigV4 test vectors, which is what ssm.rs checks
          # the implementation against — they are the only external proof this
          # repository has that the signature is computed correctly, and
          # changing them to something invented would delete that proof.
          # CLAUDE.md §8 names ap-south-1 as the region this repository reads
          # from; us-east-1 appears nowhere but inside those vectors.
          aws_sigv4='
          ssm aws4_request authorization content-type host
          x-amz-date x-amz-target x-amz-security-token
          us-east-1 20150830 20150831
          '

          # ---- group 14: the AWS shared-credentials file format. These are the
          # INI keys and the default profile name AWS itself defines for
          # ~/.aws/credentials, read by `AwsIdentity::from_credentials_file`.
          # Only the names of the keys are here; gate 1c already refuses the
          # file itself from ever being tracked.
          aws_shared='
          credentials profiles default
          aws_access_key_id aws_secret_access_key aws_session_token
          '

          # ---- group 15: the redacting `Debug`'s own field labels.
          # `AwsIdentity` hand-writes `Debug` so the secret and the session
          # token render as `<redacted>`; these are the labels printed beside
          # them. That `secret` and `session_token` appear as literals AT ALL is
          # that redaction working, not a value escaping.
          redact_label='key_id secret session_token'

          # ---- group 16: published hash test vectors. `abc` is the NIST
          # SHA-256 input whose digest ssm.rs pins, and `000fff` is the
          # three-byte lower-case hex-padding check beside it.
          hash_vector='abc 000fff'

          # ---- group 17: the vendors' REQUEST field names, and one published
          # example value. Group 8 above carries the names each vendor uses in
          # its RESPONSE; these are the names it requires in the REQUEST, and
          # they arrived with the parameter map that stops Dhan answering
          # DH-905. Every one is read first-hand from the vendor's own
          # documentation page:
          #   securityId exchangeSegment instrument   dhanhq.co/docs/v2/historical-data
          #   exchange segment trading_symbol start_time end_time
          #                                             groww.in/trade-api/docs
          # `exchange`, `segment` and `instrument` are ordinary English words a
          # vendor chose for a field; they name no account and no environment.
          # `13` is the securityId of NIFTY in Dhan's OWN worked example, used
          # in a test so the request can be asserted against a value the vendor
          # published rather than one invented here.
          request_field='
          securityId exchangeSegment instrument
          exchange segment trading_symbol start_time end_time
          13
          groww_symbol candle_interval 1minute
          '

          # ---- group 18: RFC 6238 APPENDIX B, and the words beside it.
          # crates/pull/src/totp.rs implements TOTP so a stale broker token can
          # be RECOGNISED. It never mints one -- CLAUDE.md section 8 forbids it,
          # because a local mint would invalidate the token another system
          # shares -- and this gate seeing these six numbers is the evidence
          # that the implementation is pinned to the published vectors rather
          # than to whatever it happens to produce.
          #
          # Every value below is printed in RFC 6238, a public standards
          # document, and reproduces from the RFC's own key at the RFC's own
          # timestamps. They name no account, no environment, no vendor and no
          # field. `gezdgnbvgy3tqojqgezdgnbvgy3tqojq` is the base32 spelling of
          # the RFC's 32-byte SHA-256 test key -- the string "12345678901234567890"
          # repeated, which is the least secret secret in cryptography.
          #
          # A real TOTP secret can never appear here: section 8 puts it in
          # Parameter Store, never in a tracked file, so a six-digit literal in
          # this crate is either a published vector or a defect. That is exactly
          # the distinction this gate exists to force someone to make by hand.
          #
          # `legal`, `malformed` and `provably` are that module's own test
          # names and refusal words -- base32 alphabets that are legal, inputs
          # that are malformed, and a bound that is provably reached.
          totp_vector='
          755224 287082 359152 969429 338314 254676 287922
          162583 399871 520489 005924 050471 081804 279037 353130
          gezdgnbvgy3tqojqgezdgnbvgy3tqojq
          legal malformed provably
          '

          # ---- group 19: two more test scaffolding words that arrived with the
          # census and the null-price decoder. `census-incremental` is a
          # temporary directory name chosen for the test that proves the census
          # APPENDS rather than rewrites -- the one that asserts on the file's
          # INODE, because asserting on its size passed under both strategies
          # and let a mutant survive. `fits` and `skipped` are assertion labels:
          # a window that fits inside both the vendor cap and one month, and a
          # bar the Groww decoder skipped because a price cell held null.
          # `daily` and `unstorable` are `Scratch::new(...)` temp-directory
          # names in crates/pull/tests/broker.rs -- one for the test that a
          # daily pull lands under `1day/` and folds a session into one bar,
          # one for the test that a rung the store cannot carry is refused BY
          # NAME rather than filed under the nearest directory that exists.
          # Both name a scratch path this repository chose, not a segment any
          # vendor or account uses.
          late_scaffold='census-incremental fits skipped daily unstorable'
          # `crates/pull/src/folder.rs` and its tests, added by another line of work. Read in
          # context before declaring, one at a time, because declaring a literal is a claim
          # that it is not a parameter-path segment:
          #
          #   vendor-data     `pub const ROOT_DIR` -- a LOCAL filesystem directory the folder
          #                   scanner walks. Not a Parameter Store segment; nothing joins it
          #                   into a `/<org>/<env>/<vendor>/<field>` path.
          #   bent            scratch directory names in `tests/folder.rs`, each naming the
          #   bought-nothing  case it sets up -- a folder whose files are bent, one that
          #   wrong-kind      bought nothing, one holding the wrong kind, one never created,
          #   never-created   one already sealed.
          #   sealed
          #   earliest        ordinary field and label words in the same module.
          #   latest
          #   files
          #   pulled
          #   read
          #   verb
          #
          # Declared rather than left refusing, and the distinction from gate 11's
          # `crates/pull/src/totp.rs` entry is the point: THAT one is a real §4 violation left
          # visible for its owner, because blessing it would hide a defect. These are not
          # defects -- a scratch directory called `sealed` is not a credential path, and saying
          # so is what this gate asks for. Their owner should still confirm the list.
          folder_scaffold='vendor-data bent bought-nothing wrong-kind never-created sealed earliest latest files pulled read verb'

          # ---- group 20: THE MANIFEST FORMAT'S OWN FIELD NAMES, and nothing
          # else. `pull::manifest::Layout::declare` refuses a degenerate format
          # geometry and NAMES THE FIELD it refused —
          # `ManifestError::DegenerateLayout { field }` — exactly as
          # `store::layout::Layout::declare` does one crate away, and for the
          # reason stated there: a `const` panic cannot format a field name, so
          # the fallible door is where an operator finds out which of the four
          # numbers was wrong.
          #
          # All four are field names on a struct in THIS repository, spelled the
          # way the struct spells them. None is an account, an environment, a
          # vendor or a field of a vendor's record: `magic` is the eight bytes a
          # manifest begins with, `version` is its format number, and the two
          # strides are the byte width of one entry in the two widths this
          # workspace computes offsets in. D-0067.
          layout_field='magic version entry_stride entry_stride_len'

          # ---- group 22: TELEMETRY FIELD KEYS AND OUTCOME WORDS. D-0075.
          # `crates/pull` gained a telemetry dependency and 15 emit sites, and
          # every `.with("key", ...)` puts a bare lower-case word in the source
          # — which is exactly the shape this gate scans for. None of these is
          # a path segment: they are the LEFT side of a log field, and the
          # right side is the value. They are declared one by one rather than
          # waved through with a pattern, because "it looks like a log field"
          # is precisely the excuse a real credential segment would wear.
          #
          # WHAT IS DELIBERATELY NOT HERE. No org, no environment, no vendor
          # and no field name from the Parameter Store shape. `value_len` is
          # the closest this list comes to a credential and it is a LENGTH:
          # `crates/pull/src/ssm.rs` logs how long the token is and never the
          # token, and never the parameter name. Gate 1c still refuses the
          # path itself in any tracked file, and this group does not touch it.
          telemetry_field='
          bars bars_out before_open before_window after_window at_or_after_close
          bucket_secs bytes cap_days chunk chunks dropped entries epoch
          first_chunk_to folded from_version generation ghosts header
          instrument_id keys landed members outcome per_day per_minute
          per_second reason refused region_bytes repairing representable
          rows rows_in snapshots url value_len why absent degraded dir
          field file kept loaded max rotated vendors
          asked blank byte_len chars duplicate fault
          about census rows_read slices
          not-base32 too-long
          '

          # THE SECOND BATCH, and why each is not a path segment. The emit
          # sites in `secret.rs`, `totp.rs`, `work.rs` and `config.rs` landed
          # after this group was first written, so the gate correctly went red
          # on all fifteen. Every one is the LEFT side of a `.with(...)`:
          #
          #   asked blank duplicate kept  — `work.rs` counts, one plan's
          #     four outcomes. Integers on the right, never a name.
          #   byte_len chars max          — LENGTHS. `secret.rs` logs how many
          #     bytes the credential is and never the credential; `totp.rs`
          #     logs how many characters were offered against `MAX_SECRET_LEN`.
          #   fault not-base32 too-long   — `totp.rs` outcome words: a
          #     `TotpError` rendered to a stable token so a page can group by
          #     it. They name a FAILURE, not a location.
          #   file loaded vendors         — `config.rs`, reporting that the
          #     untracked local configuration was read and how many vendors it
          #     named. The count, never the contents.
          #   rotated                     — `secret.rs`, a bool: whether a
          #     re-read returned a different value. CLAUDE.md §8's "a stale
          #     token is re-read; if the re-read returns the same dead value,
          #     the pull halts loudly".
          #
          # `field` IS THE ONE WORTH ARGUING ABOUT, so it is argued here. §8's
          # shape is `/<org>/<env>/<vendor>/<field>`, and `secret.rs` logs
          # `.with("field", <the field's name>)` — the fourth segment's VALUE,
          # not just the key. That is deliberate and it is inside §8's own
          # carve-out: "`crates/pull` holds the shape and the field names; it
          # holds no `org`, `env`, or `vendor` literal." The field names are
          # already tracked source. The two segments §8 keeps out of this
          # repository — `org` and `env` — are read at run time from the
          # untracked configuration and appear in NO event on any of these
          # paths. A log handed to somebody still cannot be turned into a
          # parameter path.

          # THE THIRD BATCH — the four run-scoped failure events, D-0087.
          # `refused_whole` and the two census arms returned `Err` and logged
          # NOTHING, so a backfill that landed zero bars left a quiet log. All
          # four are the LEFT side of a `.with(...)`:
          #
          #   about      — the folder or path a refused RUN was about. A local
          #     archive directory the operator typed, or a store path this
          #     repository rendered. Never a Parameter Store segment.
          #   census     — the census file's own path on disk, same shape.
          #   rows_read  — a COUNT. The rows a refused run did read, so the
          #     receipt cannot blame a vendor that answered perfectly.
          #   slices     — a COUNT of appended slices whose census went
          #     unpublished.
          #
          # Two counts and two filesystem paths. No org, no env, no vendor, no
          # field of a vendor's record.

          # ---- group 23: A YEAR-MONTH IN AN ASSERTION. D-0070.
          # `pull::unit::a_daily_bucket_is_an_ist_day_...` asserts the month a
          # folded bar derives to, and that assertion is the whole proof of the
          # fold fix: before it, a bar stamped 00:00 IST on 2026-01-01 derived
          # to 2025-12. The literal is a `store::path::YearMonth` rendering,
          # not a path segment — the store's own month component is written
          # from a `YearMonth` and never from a caller's string.
          year_month='2026-01'

          allowed="${seg_shape} ${vendor_wire} ${config_fixture}
          ${secret_fixture} ${scaffold} ${timeframe} ${governor}
          ${record_field} ${header_name} ${bound_number}
          ${debug_label} ${wire_date} ${aws_sigv4} ${aws_shared}
          ${redact_label} ${hash_vector} ${request_field}
          ${totp_vector} ${late_scaffold} ${folder_scaffold} ${layout_field}
          ${telemetry_field} ${year_month}"
          bad=0
          while IFS= read -r word; do
            if [ -z "$word" ]; then continue; fi
            if ! printf '%s\n' $allowed | grep -qxF -- "$word"; then
              printf 'UNDECLARED SEGMENT-SHAPED LITERAL IN crates/pull: %s\n' "$word"
              { git ls-files 'crates/pull' | xargs grep -nF -- "\"$word\"" || true; } \
                | head -3
              bad=1
            fi
          done < <(git ls-files 'crates/pull' \
                   | xargs grep -ohE '"[a-z0-9][a-z0-9_-]{0,31}"' \
                   | tr -d '"' \
                   | { grep -Ev '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } \
                   | sort -u)
          if [ "$bad" -ne 0 ]; then
            echo
            echo "Either the literal is invented — add it above — or it is a real"
            echo "path segment and must not be tracked. See CLAUDE.md section 8."
            exit 1
          fi
          echo "OK — every segment-shaped literal under crates/pull is declared."
      - name: Gate 2 — no build script shells out
        run: |
          set -euo pipefail
          hits=$(git ls-files '*build.rs' | xargs -r grep -ln \
                 -e 'Command::new' -e 'std::process' || true)
          if [ -n "$hits" ]; then
            printf 'BUILD SCRIPT INVOKES AN EXTERNAL PROCESS:\n%s\n' "$hits"
            echo "A build script is Rust, so gate 1 passes it — and then it runs"
            echo "something else. That is the side door. See CLAUDE.md section 2."
            exit 1
          fi
          echo "OK — no build script invokes an external process."

      - name: Gate 9 — core depends on nothing
        run: |
          set -euo pipefail
          # docs/01-architecture.md gives core "May depend on: nothing". Gate 7
          # guards crates/web, but web's single allowed dependency IS core --
          # so a dependency added to core is silently forced into a wasm32
          # build where the filesystem does not exist. Without this gate the
          # architecture's most load-bearing arrow is a convention.
          f=crates/core/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$deps" ]; then
            printf 'crates/core MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            echo "core is compiled to wasm32 through crates/web. See D-0009."
            exit 1
          fi
          echo "OK — core depends on nothing."

      - name: Gate 9b — greeks depends on nothing
        run: |
          set -euo pipefail
          # Same shape as gate 9, for the same reason and a different consumer.
          # crates/greeks is taken by the `tickvault` repository by git URL, so
          # a dependency added here is a dependency forced on a repository that
          # is not this one -- and a type from this workspace in its public
          # surface makes it unusable there outright.
          #
          # Until this gate existed the property was advertised in six places
          # and enforced in none. `crates/greeks/tests/standalone.rs` was named
          # as the proof and cannot be: an integration test fails only on items
          # it NAMES, so a leaked type it does not name is invisible to it, and
          # a `pub use` adds zero code regions so the coverage gate cannot see
          # one either. Both were verified by breaking the property in a copy
          # of this workspace outside the repository -- clippy, the full test
          # suite and 100% coverage all stayed green. See D-0046.
          #
          # No untrusted input reaches this step: the inputs are a tracked
          # manifest path, `git ls-files` and static patterns. Nothing from the
          # event payload is expanded.
          f=crates/greeks/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$deps" ]; then
            printf 'crates/greeks MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            echo "It is shared with another repository by git URL. See D-0046."
            exit 1
          fi
          # And no dev-dependency either: a dev-dependency is not forced on a
          # consumer, but it is forced on anyone who runs this crate's tests,
          # and this crate's tests are part of what is shared.
          dev=$(awk '/^\[dev-dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$dev" ]; then
            printf 'crates/greeks MUST DECLARE NO DEV-DEPENDENCY. Found:\n%s\n' "$dev"
            exit 1
          fi
          # The public surface names no type from this workspace. Every other
          # crate here is reachable only by its package name, so naming one at
          # all is the leak -- including through a re-export, which is the case
          # standalone.rs cannot see.
          leaks=$(git ls-files 'crates/greeks/**/*.rs' \
                  | xargs -r grep -nE '\b(brutex_core|core::(price|instrument|universe|vendor))\b' \
                  || true)
          if [ -n "$leaks" ]; then
            printf 'A WORKSPACE TYPE APPEARS IN crates/greeks:\n%s\n' "$leaks"
            exit 1
          fi
          echo "OK — greeks depends on nothing and names no workspace type."

      - name: Gate 7 — the browser crate depends on core alone
        run: |
          set -euo pipefail
          # `crates/web` no longer exists: D-0052 moved the browser code to
          # `web/`, where it is no longer a crate at all and so has no
          # Cargo.toml and no dependency line to police. The check is kept
          # rather than deleted because the INVARIANT it guards -- the browser
          # code reaches only for `core` -- outlives the layout, and a crate of
          # this name reappearing must be held to it again. The skip below is
          # therefore the correct outcome today, not a gap.
          f=crates/web/Cargo.toml
          [ -f "$f" ] || { echo "skip — crates/web does not exist (D-0052 moved it to web/)"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          extra=$(printf '%s\n' "$deps" | grep -v '^core$' || true)
          if [ -n "$extra" ]; then
            printf 'crates/web MAY ONLY DEPEND ON core. Found:\n%s\n' "$extra"
            echo "It compiles to wasm32 where the filesystem does not exist."
            exit 1
          fi
          echo "OK."

      - name: Gate 13 — no foreign runtime, not even through a dependency
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 forbids "any interpreted
          # runtime, as a dependency, a dev-dependency, or a tool" and "any
          # vendored binding to another language", WITHOUT EXCEPTION. Gate 1
          # enforces section 2 by walking tracked file EXTENSIONS — and a
          # binding does not arrive as an extension. It arrives as one line in
          # a Cargo.toml, which is a `.toml` and passes gate 1 without a
          # murmur; or, worse, as a TRANSITIVE package in Cargo.lock that
          # nobody typed at all and nobody reads. The route is concrete rather
          # than hypothetical: the cost calculator landing in crates/costs is
          # lifted from a predecessor repository whose manifest declared
          # exactly such a binding library. Until this step, the ban was
          # unenforced against the one path a violation was most likely to
          # take.
          #
          # WHY `cargo deny` IS NOT ENOUGH ON ITS OWN. Gate 3 runs
          # `cargo deny check` and deny.toml carries a [bans] list, and that
          # list IS enforced — proven differentially, not assumed: a workspace
          # holding a package by a banned name exits 2 with the entry present
          # and 0 with the entry removed. Three gaps remain anyway.
          #   1. Gate 3 lives in the `build` job, which NEEDS this one. A
          #      violation would otherwise burn a toolchain install, a fetch
          #      and a full compile before anybody hears about it.
          #   2. cargo-deny resolves only the three targets in deny.toml's
          #      [graph]. A dependency conditional on a fourth is invisible to
          #      it. It is not invisible to a text scan of the lock, because
          #      Cargo.lock lists every package for every target.
          #   3. deny.toml is an ordinary tracked file, and one deleted line
          #      disarms it with every other gate still green. Layer 4 below
          #      guards that file the way gate 11 rule 5b guards the clippy
          #      lint table.
          #
          # THE WORD ITSELF IS GATE 15's JOB, not this one's. Gate 15 walks
          # every tracked file — Cargo.toml and Cargo.lock included — for the
          # assembled token, so this step does not repeat that trick. One copy
          # of a fragile mechanism is safer than two.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`
          # and the static lists below — gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly because a gate that oversells
          # itself is worse than no gate:
          #   * A binding published under a name that is not on the list. The
          #     list is finite and the ecosystem is not. deny.toml's
          #     `unknown-registry = "deny"` plus the workspace dependency table
          #     are the controls for the general case; this is the control for
          #     the named ones.
          #   * A C or Lua source tree vendored in WITHOUT a manifest entry.
          #     Gate 1's extension allowlist is what refuses that, and it
          #     already does.
          #   * Anything untracked. `git ls-files` is the input, which is right
          #     for CI — the checkout holds only tracked files — and means a
          #     local run disagrees with CI until `git add`.
          #   * A rename performed inside a `[patch]` or `[replace]` table. The
          #     package NAME still has to appear for cargo to resolve it, so
          #     the name rules catch the ordinary case, but the aliasing is not
          #     modelled.
          #   * Whether a crate that is NOT on the list embeds a runtime.
          #     Nothing textual can decide that.

          # ---- the names, and how the list was built. -----------------------
          # Every name below returned HTTP 200 from
          # https://crates.io/api/v1/crates/<name> when this gate was written.
          # A ban list is worth exactly the crates it can actually stop, and a
          # misspelled entry stops nothing while reading as protection.
          #
          # The thirteen the operator named are all present. The rest are the
          # same class and are here because renaming is the obvious way round a
          # short list: `rusty_v8` and `quickjs-rs` are the former names of `v8`
          # and `rquickjs`; `magnus` and `rutie` sit beside `ruby-sys`;
          # `ext-php-rs` is the PHP one; and `lua-src` / `luajit-src` are the
          # crates that COMPILE the Lua interpreter from its own C sources,
          # which is the floor `mlua` stands on.
          #
          # DELIBERATELY ABSENT, so the holes are written down rather than
          # discovered later:
          #   * `wasmtime` and every other WebAssembly runtime. wasm32 is a
          #     COMPILATION TARGET of this workspace — crates/web, gate 7 — not
          #     a foreign language. Banning the runtime for the target we ship
          #     to would be nonsense.
          #   * `cpp`, `inline-c`, `tcl`. The family rule below also matches
          #     `<name>-*` and `<name>_*`, and `cpp_demangle` is a pure-Rust
          #     symbol demangler that arrives transitively behind `addr2line`.
          #     A gate that is wrong in the false-positive direction is a gate
          #     that gets allowlisted into silence.
          banned='
          pyo3
          mlua rlua hlua lua-src luajit-src
          rquickjs quickjs-rs duktape boa_engine deno_core v8 rusty_v8
          neon node-bindgen
          jni
          ruby-sys magnus rutie
          ext-php-rs
          '

          # THE ESCAPE HATCHES ARE HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism — no magic comment scattered
          # through crates/. One allowlist PER LAYER, so a justification
          # written for a manifest cannot silently excuse the lock, which is
          # the layer a transitive violation hides in. All three ship EMPTY,
          # and all three are audited for staleness at the end of this step.
          allow_decl=''
          allow_lock=''
          allow_build=''

          work=$(mktemp -d)
          bad=0

          # `path:line:text` records compared against a `path count` allowlist.
          # Identical in shape to gates 11 and 12 on purpose: one mechanism to
          # learn, and adding a line anywhere is a visible diff.
          verdict() {
            layer="$1"; hits="$2"; allow="$3"
            for f in $( { printf '%s\n' "$hits" | grep . | cut -d: -f1 | sort -u; } || true ); do
              c=$( { printf '%s\n' "$hits" | grep -c "^${f}:" || true; } | tr -d ' ')
              a=$( { printf '%s\n' "$allow" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
              [ -n "$a" ] || a=0
              if [ "$c" -gt "$a" ]; then
                printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
                { printf '%s\n' "$hits" | grep "^${f}:" | sed 's/^/             /' | head -8; } || true
                bad=1
              else
                printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
              fi
            done
            # An entry naming a file that is gone makes this gate read stronger
            # than it is, so it is a FAILURE. An entry whose file no longer
            # matches is only loose, and says so.
            for p in $( { printf '%s\n' "$allow" | awk 'NF{print $1}'; } || true ); do
              if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
                bad=1
              elif ! printf '%s\n' "$hits" | grep -q "^${p}:"; then
                printf '  ::warning title=Gate 13 allowlist is loose::'
                printf '%s no longer matches layer %s — drop the entry\n' "$p" "$layer"
              fi
            done
            :
          }

          # ---- layer 1: no manifest DECLARES one. ---------------------------
          # EVERY tracked Cargo.toml, the root one included. Checking only
          # crates/ would miss the half that matters: [workspace.dependencies]
          # is where a shared dependency actually lands, and a member then
          # writes nothing but `name = { workspace = true }`.
          #
          # Comments are stripped first — everything from the first `#` — so
          # the prose in these manifests, which discusses banned names BY NAME,
          # is not itself a violation. The cost is that a `#` inside a string
          # truncates its line; no manifest here has one, and a truncated line
          # can only cause a MISS inside a comment, never a false refusal.
          decl="$work/decl"; : > "$decl"
          nt=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "${f##*/}" in Cargo.toml) ;; *) continue ;; esac
            nt=$((nt + 1))
            awk -v F="$f" '{ l = $0; sub(/#.*$/, "", l); print F":"NR":"l }' "$f" >> "$decl"
          done < <(git ls-files '*Cargo.toml')

          # ---- layer 2: nothing in the LOCK either. -------------------------
          # A transitive pull is the same violation one level down and much
          # harder to notice, which makes it the dangerous one. The lock is
          # matched on its package-name lines only — `name = "x"` at the start
          # of a [[package]] stanza. The `dependencies = [ ... ]` arrays are
          # not matched and do not need to be: every name in one of those
          # arrays has its own [[package]] stanza in the same file, by the
          # format's own definition.
          lockc="$work/lock"; : > "$lockc"
          nl=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            nl=$((nl + 1))
            awk -v F="$f" '{ print F":"NR":"$0 }' "$f" >> "$lockc"
          done < <(git ls-files '*Cargo.lock')

          nb=$( { printf '%s\n' $banned | grep -c . || true; } | tr -d ' ')
          echo "walked ${nt} tracked Cargo.toml and ${nl} tracked Cargo.lock"
          echo "  $(awk 'END{print NR}' "$decl") manifest line(s) after comment stripping"
          echo "  $(awk 'END{print NR}' "$lockc") lock line(s)"
          echo "  ${nb} banned crate name(s), each matched with its -* and _* family"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$nt" -eq 0 ]; then
            echo "GATE 13 WALKED NO MANIFEST. A repository with no Cargo.toml is"
            echo "not a Rust workspace; a silent zero is not a pass."
            exit 1
          fi
          if [ "$nl" -eq 0 ]; then
            echo "GATE 13 WALKED NO LOCK FILE. Cargo.lock is the ONLY place a"
            echo "transitive binding is visible, and gate 4 builds --locked."
            echo "An untracked lock disarms the layer that matters most."
            exit 1
          fi

          dh=''; lh=''
          for n in $banned; do
            fam="(${n}|${n}[-_][A-Za-z0-9_-]+)"
            # A dependency key: `n = ...`, `n.workspace = ...`, or the inline
            # form `dependencies = { n = ... }`. Preceded by any non-name
            # character, which the corpus prefix's own `:` also satisfies.
            d1="[^A-Za-z0-9_-]${fam}(\.[A-Za-z_-]+)?[[:space:]]*="
            # A dependency TABLE header: [dependencies.n], [dev-dependencies.n],
            # [build-dependencies.n], [workspace.dependencies.n], and the
            # [target.'cfg(...)'.dependencies.n] shape.
            d2="\[[^]]*dependencies[^]]*\.${fam}\]"
            # A RENAMED dependency: `alias = { package = "n", ... }`. Without
            # this, one word defeats the whole gate.
            d3="package[[:space:]]*=[[:space:]]*\"${fam}\""
            h=$( { grep -E "${d1}|${d2}|${d3}" "$decl" || true; } )
            [ -z "$h" ] || dh="${dh}${h}
          "
            h=$( { grep -E ":name[[:space:]]*=[[:space:]]*\"${fam}\"" "$lockc" || true; } )
            [ -z "$h" ] || lh="${lh}${h}
          "
          done

          echo
          echo "layer 1: a manifest declares a binding or an embedded runtime"
          if [ -z "$( { printf '%s\n' "$dh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 1 "$dh" "$allow_decl"

          echo
          echo "layer 2: the lock resolves one, directly or transitively"
          if [ -z "$( { printf '%s\n' "$lh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 2 "$lh" "$allow_lock"

          # ---- layer 3: no build script EXISTS. -----------------------------
          # Gate 2 asks the narrower question — does a build script shell out —
          # and keeps asking it. This asks the simpler one. A build script is
          # arbitrary code that runs on every developer's machine and on every
          # runner before a single line of this workspace is compiled, and
          # "does it shell out" is decided by a text scan that indirection
          # beats. Nothing in this repository needs one: there is no C to
          # compile, no protocol to generate from, no version to stamp that
          # `env!("CARGO_PKG_VERSION")` does not already carry.
          #
          # THIS IS STRICTER THAN CLAUDE.md SECTION 2, WHICH SAYS "any build.rs
          # that invokes an external process". The stricter reading is
          # deliberate and is the operator's instruction; it is recorded here
          # rather than in a review comment so the difference is visible. The
          # allowlist below is the escape, and taking it should come with a
          # decisions entry.
          bh=$( { git ls-files | awk -F/ '$NF == "build.rs" { print $0 ":1:a build script exists" }'; } || true )
          echo
          echo "layer 3: a build script exists anywhere in the tree"
          if [ -z "$( { printf '%s\n' "$bh" | grep . || true; } )" ]; then
            echo "  none"
          fi
          verdict 3 "$bh" "$allow_build"

          # ---- layer 4: the second line of defence is still armed. ----------
          echo
          echo "layer 4: deny.toml and the step that runs it"
          d=deny.toml
          if ! git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
            echo "  REFUSED  deny.toml is not tracked — gate 3 has no policy to read"
            bad=1
          else
            if grep -qE '^[[:space:]]*wildcards[[:space:]]*=[[:space:]]*"deny"' "$d"; then
              echo '  present  deny.toml sets wildcards = "deny"'
            else
              echo '  REFUSED  deny.toml no longer sets wildcards = "deny"'
              echo '           Every path dependency in this workspace carries a'
              echo '           version BECAUSE of that line — crates/api and'
              echo '           crates/pull both say so in their manifests. Removing'
              echo '           it turns those comments into false claims.'
              bad=1
            fi
            # PINNED AT WHAT deny.toml CARRIES TODAY. A name on this line that
            # disappears from deny.toml is a red build: that is the guard-the-
            # guard half, and it is the same argument gate 11 rule 5b makes
            # about the clippy lint table. Names on THIS gate's list that
            # deny.toml has never carried are a WARNING and not a failure — the
            # scan above is the primary control for them, cargo-deny is the
            # second, and making this step red for a file it does not own would
            # teach a reader to ignore it.
            must='pyo3 mlua rlua deno_core v8 rusty_v8 quickjs-rs boa_engine node-bindgen neon jni'
            for n in $must; do
              if grep -qE "name[[:space:]]*=[[:space:]]*\"${n}\"" "$d"; then
                printf '  present  deny.toml bans %s\n' "$n"
              else
                printf '  REFUSED  deny.toml no longer bans %s\n' "$n"
                bad=1
              fi
            done
            for n in $banned; do
              case " $must " in *" $n "*) continue ;; esac
              if ! grep -qE "name[[:space:]]*=[[:space:]]*\"${n}\"" "$d"; then
                printf '  ::warning title=Gate 13 is ahead of deny.toml::'
                printf 'this gate refuses %s and deny.toml does not list it\n' "$n"
              fi
            done
          fi
          # Is cargo-deny actually RUN, and at a pinned version? Gate 3's own
          # comment argues both, and a comment cannot enforce itself. Both
          # patterns are ANCHORED to a whole line, which is exactly what stops
          # this check from being satisfied by the two lines you are reading:
          # they begin `if grep` and match neither anchor.
          wf=.github/workflows/ci.yml
          # A line's PRESENCE is not a line's EXECUTION, and this is the repair.
          # An audit confirmed by running it that a step carrying `if: false`
          # satisfies every grep below while the command never runs -- so all four
          # of these checks were decorative. Each pattern is now tested against the
          # enclosing STEP: the line must be there AND its step must be REACHABLE.
          #
          # `[ \t]` and not `[[:space:]]`, because the latter matches a newline and
          # would let a pattern span lines in the buffered step text.
          #
          # A job-level `if:` would disable this gate too, and a skipped job is
          # visible in the checks list rather than reported as a pass, so it is out
          # of scope here deliberately.
          runs_unconditionally () {
            awk -v pat="$1" '
              function finish() {
                if (buf ~ pat) {
                  found = 1
                  # Only an `if:` THAT CAN BE FALSE is refused, and getting here
                  # took two wrong rules. "No `if:` at all" refused the real
                  # workflow, because gate 3 legitimately carries
                  # `if: steps.probe.outputs.has_crates ==`. "No `if:` without a
                  # context reference" also refused it, because gate 8 carries
                  # `if: always()` -- constant TRUE, the opposite of a bypass.
                  #
                  # So the rule names the always-skip forms instead. `false` in any
                  # quoting, `0`, and `failure()`/`cancelled()` -- which run the step
                  # only when something has already gone wrong, and so skip it on
                  # every green run. Everything else, constant or not, is allowed.
                  n = split(buf, L, "\n")
                  for (i = 1; i <= n; i++) {
                    if (L[i] !~ /^[ \t]+if:[ \t]/) continue
                    e = L[i]
                    sub(/^[ \t]+if:[ \t]*/, "", e)
                    gsub(/\$\{\{|\}\}|[ \t]/, "", e)
                    e = tolower(e)
                    # The character class permits the quoting a YAML scalar may
                    # carry, without needing a quote literal inside this program.
                    if (e ~ /^[^a-z0-9]*(false|0|failure\(\)|cancelled\(\))[^a-z0-9]*$/) {
                      dead = 1
                    }
                  }
                }
                buf = ""
              }
              /^      - / { finish() }
              { buf = buf "\n" $0 }
              END { finish(); exit (found && !dead) ? 0 : 1 }
            ' "$wf"
          }
          if runs_unconditionally '(^|\n)[ \t]+cargo deny check[ \t]*(\n|$)'; then
            echo "  present  gate 3 invokes cargo deny check, unconditionally"
          else
            echo "  REFUSED  nothing in this workflow RUNS cargo deny check. Either"
            echo "           the line is gone or its step carries an \`if:\`."
            bad=1
          fi
          if runs_unconditionally '(^|\n)[ \t]+cargo install cargo-deny --version [0-9]'; then
            echo "  present  cargo-deny is installed at a pinned version, unconditionally"
          else
            echo "  REFUSED  cargo-deny is installed unpinned — a security verdict"
            echo "           that can change with no commit is a verdict nobody"
            echo "           can read. See D-0034."
            bad=1
          fi

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 13 FAILED."
            echo
            echo "CLAUDE.md section 2 has no exception for this. A binding does"
            echo "not become acceptable by being transitive, by being a"
            echo "dev-dependency, or by being convenient. Remove it, or write"
            echo "the allowlist line above WITH the reason and a"
            echo "docs/05-decisions.md entry beside it."
            exit 1
          fi
          echo "OK — no foreign runtime is declared, resolved, or built for."

      - name: Gate 15 — the forbidden word appears in no tracked file
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md section 2 makes Rust the only language
          # here, and the operator's rule is stricter than the extension
          # allowlist gate 1 walks: the NAME of the best-known interpreted
          # language is not to appear in this repository at all. Not as a
          # dependency, not in a comment, not in a document, not in a variable.
          # Gate 1 cannot see a word — it sees the characters after the last
          # dot. Gate 13 sees only manifests and the lock. This step walks
          # every tracked byte.
          #
          # THE TOKEN IS ASSEMBLED AT RUN TIME AND IT MUST STAY ASSEMBLED.
          # This workflow is itself a tracked file — gate 1 walks `git
          # ls-files` and `.github/workflows/ci.yml` is in that list — so a
          # gate that spelled the banned word out would refuse ITSELF on its
          # first run and every run after, and the only route back to green
          # would be to allowlist the workflow file: which would disarm the
          # ban for the one file best placed to hide things. So the word is
          # built from two halves that mean nothing apart and are the banned
          # token together.
          #
          # IF YOU ARE HERE TO "TIDY" THIS INTO A LITERAL, STOP. That single
          # edit breaks the gate against itself and there is no clean repair.
          # The length self-check below is the tripwire for the other half of
          # the same accident: blanking a fragment would leave a token that
          # matches every line, or an empty one that matches nothing.
          #
          # WHY IT IS A SUBSTRING RULE AND NOT A WHOLE-WORD ONE: the reference
          # implementation and the two Rust-hosted reimplementations all carry
          # the token inside their own crate names, so one substring rule
          # refuses all three for free, without this file naming any of them.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files` and the two
          # static fragments below. Gate 1c's discipline. Nothing from the
          # event payload is expanded.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * Anything untracked. The input is `git ls-files`, which is right
          #     for CI and means a local run and CI disagree until `git add`.
          #   * The word split across two source lines, or written with a
          #     zero-width character inside it, or base64'd, or spelled in a
          #     different script. A determined author beats any text rule. This
          #     stops the accident and the habit, which is what actually
          #     happens.
          #   * Other spellings of the same idea — the file extension, the
          #     interpreter's binary name, a shebang line. Gate 1's extension
          #     allowlist refuses the first. Nothing here refuses the rest.
          #   * Whether the appearance was a VIOLATION or a HISTORICAL
          #     REFERENCE. A sentence describing what a predecessor repository
          #     was written in is not a foreign runtime in this one, and this
          #     gate cannot tell the difference. That is what the allowlist is
          #     for, and taking it is a visible diff on this file.
          #
          # A CI LOG IS NOT A TRACKED FILE, but the log below still MASKS the
          # token wherever it echoes an offending line. Printing it verbatim
          # would make this gate's own output the leak it exists to prevent.

          # ---- the assembly. Neither half is the word; the pair is. ---------
          frag_a=$(printf 'py')
          frag_b=$(printf 'thon')
          tok="${frag_a}${frag_b}"
          if [ "${#tok}" -ne 6 ]; then
            echo "GATE 15 CANNOT ASSEMBLE ITS OWN TOKEN — got ${#tok} characters."
            echo "Somebody edited one of the two fragments above. Read the"
            echo "paragraph beginning IF YOU ARE HERE TO TIDY THIS."
            exit 1
          fi

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. `path max_count`,
          # gate 1d's and gate 11's mechanism. IT SHIPS EMPTY, on the same
          # argument gates 11 and 12 ship empty: every occurrence on the tree
          # today is named in the log of this step, and pinning them here on
          # the way in would convert a list of findings into one line nobody
          # reads. A file listed here is a file where the word is tolerated,
          # which is a thing somebody should have to type on purpose.
          # `crates/vocab/tests/workspace_is_rust.rs` is the test that REFUSES
          # interpreter bindings, and it cannot refuse a crate without naming it.
          # Three of the names in its `FORBIDDEN` list contain the banned word:
          # a Rust-hosted interpreter, a C binding to one, and a `-sys` shim. This
          # gate's own failure message names the allowlist as the answer when "the
          # occurrence genuinely has to stay", and this is that case -- the
          # alternative is a test that bans nothing.
          #
          # The COUNT is pinned at 3, so a fourth occurrence in that file still
          # fails. This is a bounded hole with a named reason, not an exemption.
          allow_word='
          crates/vocab/tests/workspace_is_rust.rs 3
          '

          work=$(mktemp -d)
          refused="$work/refused"; : > "$refused"
          walked=0; skipped=0

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            # -I skips a file git tracks that grep reads as binary, rather than
            # letting one turn the scan into noise. There are none today; a
            # count is printed so that stops being an assumption.
            if ! grep -Iq . -- "$f" 2>/dev/null; then
              skipped=$((skipped + 1))
              continue
            fi
            n=$( { grep -IoiF -e "$tok" -- "$f" || true; } | wc -l | tr -d ' ')
            [ "$n" -gt 0 ] || continue
            # COUNT FIRST, TAB-SEPARATED, PATH LAST. Written `path count` and
            # read back on spaces, a tracked file whose name contains a space
            # splits into the wrong fields, the count comparison becomes a
            # string comparison that errors, and the file is reported ALLOWED.
            # A silent miss is the one failure mode these gates exist to
            # prevent, so the separator is a tab and the unbounded field is
            # last.
            printf '%s\t%s\n' "$n" "$f" >> "$refused"
          done < <(git ls-files)

          echo "walked ${walked} tracked file(s)"
          echo "  ${skipped} skipped as binary"
          echo "  $(awk 'END{print NR}' "$refused") file(s) contain the banned token"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$walked" -eq 0 ]; then
            echo "GATE 15 WALKED NOTHING. A gate that reads no file is not a gate."
            exit 1
          fi

          bad=0
          echo
          tab=$(printf '\t')
          while IFS="$tab" read -r c f; do
            [ -n "${f:-}" ] || continue
            a=$( { printf '%s\n' "$allow_word" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
            [ -n "$a" ] || a=0
            if [ "$c" -gt "$a" ]; then
              printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
              { grep -IniF -e "$tok" -- "$f" \
                  | sed -E "s/${tok}/[BANNED WORD]/Ig" \
                  | sed 's/^/             /' | head -8; } || true
              bad=1
            else
              printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
            fi
          done < "$refused"

          # The same two self-audits gates 11 and 12 carry. An entry naming a
          # file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file is now clean is only loose, and
          # says so.
          for p in $( { printf '%s\n' "$allow_word" | awk 'NF{print $1}'; } ); do
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
              bad=1
            elif ! awk -F'\t' -v F="$p" '$2==F{found=1} END{exit !found}' "$refused"; then
              printf '  ::warning title=Gate 15 allowlist is loose::'
              printf '%s no longer contains the token — drop the entry\n' "$p"
            fi
          done

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 15 FAILED."
            echo
            echo "The word is banned outright, including in prose about a"
            echo "predecessor repository. Reword it — 'the predecessor', 'the"
            echo "prior implementation' — or, if the occurrence genuinely has"
            echo "to stay, add its file to the allowlist above with the reason"
            echo "beside it. Do not spell the word into this workflow to make"
            echo "the match narrower: this file is scanned too."
            exit 1
          fi
          echo "OK — the banned token appears in no tracked file."

      - name: Gate 16 — every crate root forbids unsafe outright
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 5 counts `allow(unsafe_code)` occurrences and
          # caps them at three. It never checks that anything is FORBIDDEN. On
          # a tree where no crate carries the attribute at all it counts zero
          # exceptions and prints the cleanest possible log for the weakest
          # possible state — and a new crate arrives with neither attribute by
          # default, which is exactly the moment nobody is looking. crates/costs
          # is being written as this gate is.
          #
          # DENY IS A DEFAULT; FORBID IS A WALL. The root manifest's
          # `[workspace.lints.rust] unsafe_code = "deny"` is real and it is
          # checked below — but a deny is a lint LEVEL, and one
          # `#[allow(unsafe_code)]` on one function switches it off for that
          # function with nothing red anywhere. `#![forbid(unsafe_code)]` is
          # not a level: an inner allow under a forbid is a hard compile error,
          # not a lint that can be downgraded. The two are complements, and the
          # gate needs both because either alone is one edit from gone.
          #
          # THE THIRD HOLE, WHICH IS THE QUIET ONE. `[workspace.lints]` applies
          # to exactly NOTHING in a member that does not write `[lints]
          # workspace = true` in its own manifest. Deleting those two words
          # from one crate's Cargo.toml disarms the whole workspace lint table
          # for that crate — unsafe_code, unwrap_used, expect_used, panic, the
          # lot — and no gate in this file looked at it before this one. Gate
          # 11 rule 5b guards the CONTENT of that table; this guards whether
          # anybody has opted in to it.
          #
          # STRICTER THAN "lib.rs", DELIBERATELY, AND IT IS RED BECAUSE OF IT.
          # A `main.rs` is a SEPARATE CRATE ROOT. The inner attribute at the
          # top of lib.rs is an attribute on the library crate and does not
          # reach the binary crate at all — they are compiled separately.
          # crates/api/src/main.rs carries no forbid today and this gate
          # refuses it. That difference is written here rather than discovered
          # in a review, which is gate 13 layer 3's precedent.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # the tracked manifests and the static list below — gate 1c's
          # discipline. Nothing from the event payload is expanded.
          #
          # WHAT IT CANNOT SEE:
          #   * A crate root that is neither `src/lib.rs` nor `src/main.rs`. A
          #     `[lib] path = ...` or `[[bin]] path = ...` moves it. The gate
          #     does not parse the override and does not guess: a manifest
          #     whose roots it cannot find is REFUSED, so the blind spot is a
          #     red build rather than a silent skip.
          #   * `unsafe` inside a dependency. `forbid` is per-crate and std
          #     itself is full of it. This gate is about the code this
          #     repository writes.
          #   * Whether the attribute is inside a `#[cfg(...)]` that removes
          #     it. It is matched at the start of a line as an inner attribute,
          #     which is the only place it is legal, but no cfg is evaluated.
          #   * Anything untracked, `git ls-files` being the input.

          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. One tracked crate-root
          # path per line — a plain path and not `path count`, because the
          # question is present-or-absent and a count column for a boolean
          # invites a 0 that reads like an allowance. IT SHIPS EMPTY. The one
          # root that fails today is named in the log; pinning it here on the
          # way in would convert a finding into a line nobody reads.
          allow_root='
          '

          root=Cargo.toml
          bad=0
          nm=0; nr=0

          echo "layer 1: every crate root carries #![forbid(unsafe_code)]"
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            nm=$((nm + 1))
            c=$(printf '%s\n' "$m" | cut -d/ -f2)
            found=0
            for base in lib main; do
              f="crates/${c}/src/${base}.rs"
              git ls-files --error-unmatch "$f" >/dev/null 2>&1 || continue
              found=$((found + 1)); nr=$((nr + 1))
              if grep -qE '^#!\[forbid\([^]]*\bunsafe_code\b' "$f"; then
                printf '  ok       %s\n' "$f"
              elif printf '%s\n' "$allow_root" | awk 'NF{print $1}' \
                   | grep -qxF -- "$f"; then
                printf '  allowed  %s — no forbid, listed above\n' "$f"
              else
                printf '  REFUSED  %s carries no #![forbid(unsafe_code)]\n' "$f"
                bad=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              printf '  REFUSED  %s — neither src/lib.rs nor src/main.rs is tracked.\n' "$m"
              printf '           This gate will not guess where the crate root is.\n'
              bad=1
            fi
          done < <(git ls-files 'crates/*/Cargo.toml')

          echo "  ${nm} crate manifest(s), ${nr} crate root(s) examined"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$nm" -eq 0 ] || [ "$nr" -eq 0 ]; then
            echo "GATE 16 EXAMINED NO CRATE ROOT. A gate that reads no lib.rs and"
            echo "no main.rs is not a gate."
            exit 1
          fi

          # The same two self-audits gates 11 through 15 carry. An entry naming
          # a file that is gone makes this gate read stronger than it is, so it
          # is a failure; an entry whose file now carries the attribute anyway
          # is only loose, and says so.
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
              bad=1
            elif grep -qE '^#!\[forbid\([^]]*\bunsafe_code\b' "$p"; then
              printf '  ::warning title=Gate 16 allowlist is loose::'
              printf '%s forbids unsafe after all — drop the entry\n' "$p"
            fi
          done < <(printf '%s\n' "$allow_root" | awk 'NF{print $1}')

          # ---- layer 2: the workspace deny, and who has opted in to it. -----
          echo
          echo "layer 2: the workspace lint table, and every member inheriting it"
          if grep -qE '^[[:space:]]*unsafe_code[[:space:]]*=[[:space:]]*"deny"' "$root"; then
            echo '  present  root Cargo.toml sets unsafe_code = "deny"'
          else
            echo '  REFUSED  root Cargo.toml no longer denies unsafe_code. Gate 5'
            echo '           states that line already fails the build, and gate 5'
            echo '           cannot check its own premise.'
            bad=1
          fi
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            if awk '
              /^\[lints\]/ { inl = 1; next }
              /^\[/        { inl = 0 }
              inl && /^[[:space:]]*workspace[[:space:]]*=[[:space:]]*true/ { ok = 1 }
              END { exit !ok }
            ' "$m"; then
              printf '  present  %s inherits [lints] workspace = true\n' "$m"
            else
              printf '  REFUSED  %s does not write [lints] workspace = true, so the\n' "$m"
              printf '           workspace lint table applies to none of it\n'
              bad=1
            fi
          done < <(git ls-files 'crates/*/Cargo.toml')

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 16 FAILED."
            echo
            echo "Add #![forbid(unsafe_code)] to the crate root — every crate"
            echo "root, a binary being its own — and keep [lints] workspace ="
            echo "true in the manifest. A deny that one attribute switches off"
            echo "is not the guarantee CLAUDE.md section 9 is read as making."
            exit 1
          fi
          echo "OK — every crate root forbids unsafe and inherits the lint table."

      - name: Gate 17 — nothing logs from inside the sweep
        run: |
          set -euo pipefail
          # WHY THIS EXISTS, AND WHY O(1) IS NOT THE BAR HERE.
          #
          # `telemetry::emit` is O(1) and a FILTERED event is very nearly free:
          # one relaxed atomic load and a comparison, no clock, no lock, no
          # buffer. On a per-member path — thousands of calls — that is
          # genuinely nothing, which is why crates/pull emits there.
          #
          # The sweep is not that path. It walks the combination ladder upward
          # from k=1 and evaluates `(bits & mask) == mask` per (bar, mask). That
          # is BILLIONS of evaluations, and a billion O(1) calls is a billion
          # calls. Constant per-operation cost (CLAUDE.md section 3 rule 4) is
          # satisfied by an emit and the operator still loses the run: the bar
          # is not "each call is cheap", it is "the innermost loop does not call
          # anything at all".
          #
          # SO THE RULE IS ZERO, NOT SMALL. No `telemetry::` reference of any
          # kind may appear in the crates that hold the mask, the vocabulary and
          # the sweep. What replaces it is the pattern `crate::session::
          # DropCensus` already uses in crates/pull: plain integer counters,
          # incremented in the loop with no atomic and no allocation, emitted
          # ONCE at a structural boundary — per k-level, per instrument, per
          # run. Every combination is still accounted for; none of them is
          # logged individually. Full detail, zero marginal cost.
          #
          # WRITTEN BEFORE THE SUBJECT EXISTS, ON PURPOSE. crates/engine and
          # crates/indicators are not workspace members yet and crates/vocab is
          # not tracked yet, so this step passes vacuously today and says so.
          # A rule that arrives after the hot loop is a rule that arrives after
          # somebody has already put an emit in it.
          #
          # NO UNTRUSTED INPUT: `git ls-files` and the static list below.
          swept='vocab engine indicators'
          bad=0
          scanned=0
          for c in $swept; do
            files=$( { git ls-files "crates/$c/src/*.rs" || true; } )
            if [ -z "$files" ]; then
              printf '  absent   crates/%s — not a tracked member yet\n' "$c"
              continue
            fi
            for f in $files; do
              scanned=$((scanned + 1))
              hits=$( { grep -nE 'telemetry::|log::|println!|eprintln!' "$f" || true; } )
              if [ -n "$hits" ]; then
                printf 'LOGGING INSIDE THE SWEEP: %s\n%s\n' "$f" "$hits"
                bad=1
              fi
            done
          done
          if [ "$bad" -ne 0 ]; then
            echo
            echo "GATE 17 FAILED."
            echo
            echo "The sweep evaluates a mask per (bar, combination). A call that"
            echo "is O(1) is still a call, and there are billions of them."
            echo "Count in a plain integer and emit ONE aggregate at the k-level"
            echo "boundary — the shape pull::session::DropCensus already uses."
            exit 1
          fi
          echo "OK — ${scanned} swept source file(s) scanned, none logs per combination."

  # ==========================================================================
  # GATES 3-6 — the toolchain gates.
  # ==========================================================================
      - name: Gate 23 — stderr is not a log, and a new crate is covered the day it appears
        run: |
          set -euo pipefail
          # WHY. Every other logging gate names the crates it walks, so a crate
          # added tomorrow starts outside all of them. And nothing stopped a
          # diagnostic being written with `eprintln!` instead of an event, which
          # was not hypothetical: a refused bind, a server that stopped on an
          # error, and two null-price bar notices all went to a terminal and
          # never reached a log file. Handed the log folder after a failed run,
          # nobody could see any of them — the exact purpose the logging work
          # exists to serve.
          #
          # This walks `crates/*/src` BY GLOB. There is no crate list to fall out
          # of date.
          fail=0

          # WHOLE FILES, TEST CODE INCLUDED, AND DELIBERATELY SO.
          #
          # The first draft of this gate scanned only the region before the first
          # `#[cfg(test)]`. That assumption holds in `crates/telemetry` and is
          # FALSE across the workspace — `api/src/server.rs` has three such
          # blocks, `api/src/ingest.rs` three, `render.rs` three — so the gate
          # would have scanned the wrong region. It refused rather than guessing,
          # which is how this was found, but the fix is not a cleverer window: it
          # is not needing one. Counting whole files needs no brace matching, no
          # string-literal handling, and has no region to get wrong. The cost is
          # that a `println!` added to a TEST also has to be declared, which is a
          # line of bookkeeping rather than a failure mode.
          : > /tmp/prints.txt
          for f in $(git ls-files 'crates/*/src/*.rs' 'crates/*/src/**/*.rs' | sort -u); do
            grep -vE '^[[:space:]]*(//|\*)' "$f" > /tmp/code.txt || true
            # `(^|[^A-Za-z_])` and not `\b`: BSD and GNU disagree about `\b`, and
            # without the guard `println!` also matches INSIDE `eprintln!`.
            # Measured: it counted 17 sites as 20.
            for m in println eprintln print eprint dbg; do
              c=$(grep -cE "(^|[^A-Za-z_])${m}!" /tmp/code.txt || true)
              if [ "$c" -gt 0 ]; then
                printf '%s:%s!:%s\n' "$(echo "$f" | sed 's|crates/||')" "$m" "$c" >> /tmp/prints.txt
              fi
            done
          done

          # CLAUSE A — the print surface is exactly this, and every line says
          # which kind it is.
          #
          #   api/src/server.rs  println! 22, print! 1
          #       The startup banner and the `report` subcommand's output on STDOUT for
          #       the operator who just typed the command, plus test output. Deliberately
          #       not events: the banner is printed before a sink is guaranteed to exist,
          #       and a banner in a log file is noise rather than a record. 19 -> 22 is
          #       three more report lines -- a per-note line, a `universe:` line and a
          #       refusal reason -- all STDOUT report output, none a diagnostic.
          #   api/src/server.rs  eprintln! 7
          #       LINE NUMBERS ARE NOT PINNED HERE, deliberately: this file is being
          #       actively rewritten and every earlier count in this entry cited numbers
          #       that had moved by the next commit. The sites are named by their
          #       function instead, which survives an edit.
          #
          #       FIVE EMIT AND ARE FINE. A refused bind, a server that stopped, and
          #       `sole_server`'s "another instance is serving this store" each call
          #       `telemetry::emit` at `Level::Error` with a `why` immediately before the
          #       print; `stopped_over`'s DEGRADED-session notice emits with an `exit`
          #       field. The usage text on misuse is a CLI contract rather than a
          #       diagnostic. 5 -> 7 is the last two of those, both added with their
          #       emit already in place, which is the shape this gate is asking for.
          #
          #       TWO DO NOT EMIT, AND CANNOT. `run_from`'s D-0124 arm and the store-root
          #       refusal inside the `Serve` arm both fire when the environment could not
          #       name a store root. The sink lives UNDER that root, so at both sites
          #       there is no directory in which to open a log -- the refusal is the
          #       reason no sink exists rather than an accident of ordering, and the
          #       second says so itself: "BEFORE ANYTHING IS OPENED OR CREATED". stderr is
          #       the only channel in existence at that instant, which is the same
          #       argument telemetry/src/sink.rs carries below.
          #   pull/src/http.rs   eprintln! 2
          #       Null-price bar notices, which ALSO emit `pull.decode` events.
          #   telemetry/src/sink.rs  eprintln! 1
          #       The sink's own last-resort notice. It is the thing that failed,
          #       so it is the one place stderr is the only channel left.
          #   telemetry/src/record.rs eprintln! 1
          #   api/src/constituents.rs println! 2
          #       Two lines printed by TESTS for a human reading `--nocapture`,
          #       both past that file's `#[cfg(test)]` at :889 — a cost-benchmark
          #       line (:1773) and the tier partition's five addends and total
          #       across twenty-four rows (:1079). Neither is on a production
          #       path. The first was declared the day the file appeared, because
          #       this gate refused it — which is the whole point of walking
          #       `crates/*/src` by glob, and it refused the second the same way.
          #   core/src/universe.rs, core/src/vendor.rs, greeks/src/{bsm,normal,solver}.rs
          #       Test diagnostic output, printed by tests for a human reading
          #       `--nocapture`. Not on any production path.
          #
          # An UNDECLARED file with any print fails. That is how a crate added
          # tomorrow is covered on its first day, and it is the whole point of the
          # glob above.
          declared='api/src/constituents.rs:println!:2
          api/src/server.rs:println!:22
          api/src/server.rs:eprintln!:7
          api/src/server.rs:print!:1
          core/src/universe.rs:println!:1
          core/src/vendor.rs:println!:1
          greeks/src/bsm.rs:println!:4
          greeks/src/normal.rs:println!:3
          greeks/src/solver.rs:println!:5
          pull/src/http.rs:eprintln!:2
          telemetry/src/record.rs:eprintln!:1
          telemetry/src/sink.rs:eprintln!:1'

          want=$(printf '%s\n' $declared | sort)
          got=$(sort /tmp/prints.txt)
          echo "  declared:"; printf '%s\n' "$want" | sed 's/^/    /'
          echo "  measured:"; printf '%s\n' "$got"  | sed 's/^/    /'
          if [ "$want" != "$got" ]; then
            echo
            echo "  REFUSED  the print surface is not the declared one."
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            echo
            echo "           A NEW print: if it is a DIAGNOSTIC on a production"
            echo "           path, emit an event too — stderr is seen by whoever"
            echo "           is watching, the FILE is what gets handed to a"
            echo "           diagnosis afterwards. Then declare it above saying"
            echo "           which kind it is. A print that is GONE: delete its"
            echo "           line, because a declaration nobody can trace to code"
            echo "           is the stale lie gate 1d refuses."
            fail=1
          fi

          # CLAUSE B — a crate that writes to stderr must be ABLE to log.
          #
          # Structural rather than a proximity heuristic. Proximity was tried and
          # gives false positives: the usage text sits a few lines from the bind
          # error's event and was scored as covered by it. This instead refuses
          # the state that makes a silent diagnostic INEVITABLE rather than
          # merely possible — a crate whose only channel is stderr.
          for f in $(grep 'eprint' /tmp/prints.txt | cut -d: -f1 | sort -u); do
            crate=$(echo "$f" | cut -d/ -f1)
            [ "$crate" = "telemetry" ] && continue   # it IS the logger
            if grep -qE '^telemetry' "crates/$crate/Cargo.toml"; then
              echo "  ok       $crate writes to stderr and can also emit"
            else
              echo "  REFUSED  crate '$crate' writes to stderr but declares no"
              echo "           telemetry dependency, so stderr is the ONLY channel"
              echo "           it has. Add the dependency and emit the event."
              fail=1
            fi
          done

          # WHAT THIS DOES NOT PROVE, said plainly so nobody reads more into a
          # green gate than it earned: it fixes the SET of prints and forces a
          # human to write down what each one is. It does not itself decide
          # whether a given print sits on a production path or in a test, and it
          # does not verify that a particular diagnostic has a matching event.
          # The declaration above carries that, and a reviewer keeps it honest —
          # the same division of labour gate 1d uses for path-shaped literals.
          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 23 FAILED."
            echo "A diagnostic that exists only on a terminal nobody kept is a"
            echo "fact this repository did not record. CLAUDE.md section 4."
            exit 1
          fi
          echo "OK - every print is declared, and stderr is never a crate's only channel."

      - name: Gate 21 — the logger opens nothing but its own files
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: no real bars, no pull,
          # and "even suppose if the data or bars pulled by mistake also, then
          # nowhere the issue of this should happen". That is a requirement
          # about STRUCTURE, not about discipline: whether or not real data is
          # sitting on the disk, the logger must be INCAPABLE of reading it.
          #
          # Two clauses, because either alone is weak.
          fail=0

          # CLAUSE A — crates/telemetry declares NO dependencies.
          #
          # The load-bearing one. A crate that does not depend on `store`,
          # `core`, `pull` or any vendor client cannot call them, so it cannot
          # read a bar, a manifest or a census however it is later edited. It is
          # std-only by construction, and the manifest is where that is
          # enforced rather than a comment nobody re-reads.
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f' crates/telemetry/Cargo.toml \
                 | grep -vE '^[[:space:]]*(#|$)' || true)
          if [ -n "$deps" ]; then
            echo "  REFUSED  crates/telemetry declares dependencies:"
            printf '%s\n' "$deps" | sed 's/^/             /'
            echo "           A logger that can reach the store can read a bar."
            fail=1
          else
            echo "  ok       crates/telemetry declares no dependencies - std only"
          fi

          # CLAUSE B — the production file-opening sites are exactly these.
          #
          # Declared by CONSTRUCT and COUNT, never by line number: a line number
          # is invalidated by editing a comment above it, and a declaration that
          # rots on reformatting is one nobody keeps honest. Same rule as gates
          # 1d and 20.
          #
          #   sink.rs  OpenOptions::new  x2  the sink's own append target
          #   sink.rs  fs::remove_file   x1  dropping the oldest rolled file
          #   sink.rs  fs::rename        x1  rolling within its own directory
          #   tail.rs  File::open        x2  reading back its own file set
          #
          # Every one takes a path built from the sink's own dir plus BASENAME
          # and EXTENSION. A NEW site is not necessarily wrong, but it is never
          # invisible: declare it here with the path it opens and why.
          declared='sink.rs:OpenOptions::new:2
          sink.rs:fs::remove_file:1
          sink.rs:fs::rename:1
          tail.rs:File::open:2'

          : > /tmp/io-sites.txt
          for f in crates/telemetry/src/*.rs; do
            base=$(basename "$f")
            # THE TEST BOUNDARY, asserted rather than assumed. This USED to cut at
            # the first `^#[cfg(test)]` and refuse outright on a second, on the
            # ground that "before the first" then stops meaning "production" and an
            # unsound window reporting PASS is worse than no gate. That ground was
            # right and the tool was wrong: a second block is ordinary, and 823c18d
            # added one -- a `#[cfg(test)] pub(crate) fn sweep_stale_scratch` sitting
            # ABOVE `mod tests` -- so the gate refused a file it had no quarrel with
            # and said so itself: "fix the gate before trusting it again, not the
            # file." This is that fix.
            #
            # Every `#[cfg(test)]` block is now skipped by BRACE COUNTING, so there
            # may be any number of them, and the attribute may cover a `fn` as well
            # as a `mod`. Intervening attributes are stepped over -- `mod tests`
            # carries a multi-line `#[allow(..., reason = "...")]` between the
            # `#[cfg(test)]` and the `mod` keyword.
            #
            # THE SOUNDNESS PRINCIPLE IS KEPT, three ways. The walk exits 3 if it
            # reaches EOF still inside a block, because an unbalanced brace means the
            # window is not the one it thinks it is. The emitted body is then checked
            # to contain NO `#[cfg(test)]` at all, which catches an over- or
            # under-skip that happened to balance. And the surviving line count is
            # PRINTED for every file, so a future edit that silently moves the
            # boundary shows up in the log as a changed number rather than as nothing.
            awk '
              BEGIN { st = 0 }
              st == 0 {
                if ($0 ~ /^#\[cfg\(test\)\][ \t]*$/) { st = 1; next }
                print; next
              }
              # BETWEEN THE ATTRIBUTE AND THE ITEM IT COVERS. Further attributes and
              # their continuation lines are stepped over -- `mod tests` carries a
              # multi-line `#[allow(..., reason = "...")]` before the `mod` keyword.
              st == 1 {
                t = $0; sub(/^[ \t]+/, "", t)
                # A braceless item -- `use`, `const` -- is the whole block, and ends
                # at its own semicolon.
                if (index($0, "{") == 0 && t ~ /;[ \t]*$/) { st = 0; next }
                if (index($0, "{") > 0) { st = 2 }
                next
              }
              # INSIDE THE ITEM. It closes at a `}` in COLUMN ZERO and nowhere else.
              # NOT by counting braces: that was tried and it is unsound here --
              # `json.rs` and `tail.rs` both hold `{` and `}` inside string literals,
              # so the count never returns to zero and the walk ran off the end of
              # both files. A top-level item under rustfmt closes at column zero, and
              # a brace inside a string is never a lone `}` there.
              st == 2 {
                if ($0 ~ /^\}/) { st = 0 }
                next
              }
              END { if (st != 0) exit 3 }
            ' "$f" > /tmp/body.txt || {
              echo "  REFUSED  $base: a cfg(test) block does not close before EOF."
              echo "           The production window cannot be established, so no"
              echo "           verdict is printed for this file. CLAUDE.md section 4."
              fail=1
              continue
            }
            if grep -q '^#\[cfg(test)\]' /tmp/body.txt; then
              echo "  REFUSED  $base: a cfg(test) attribute survived the walk."
              echo "           The skip is wrong in one direction or the other."
              fail=1
              continue
            fi
            printf '  window   %-14s %s production line(s) of %s\n' \
              "$base" "$(awk 'END{print NR}' /tmp/body.txt)" "$(awk 'END{print NR}' "$f")"
            # Drop comment lines, so a construct merely NAMED in prose above is
            # not counted as a call to it.
            grep -vE '^[[:space:]]*(//|\*|/\*)' /tmp/body.txt > /tmp/code.txt || true
            for probe in OpenOptions::new fs::remove_file fs::rename File::open fs::read_dir fs::read_to_string; do
              c=$(grep -cF "$probe" /tmp/code.txt || true)
              if [ "$c" -gt 0 ]; then
                printf '%s:%s:%s\n' "$base" "$probe" "$c" >> /tmp/io-sites.txt
              fi
            done
          done

          want=$(printf '%s\n' $declared | sort)
          got=$(sort /tmp/io-sites.txt)

          echo "  declared:"; printf '%s\n' "$want" | sed 's/^/    /'
          echo "  measured:"; printf '%s\n' "$got"  | sed 's/^/    /'

          if [ "$want" != "$got" ]; then
            echo
            echo "  REFUSED  the logger's file-opening surface is not the declared one."
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            echo
            echo "           A NEW site: say which path it opens and why, and add"
            echo "           it above in the same commit. A site that is GONE:"
            echo "           delete its line, because a declaration nobody can"
            echo "           trace to code is the stale lie gate 1d refuses."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 21 FAILED."
            echo "CLAUDE.md section 4: no fallback that hides a failure. A logger"
            echo "that can reach real bars can be silently wrong about them."
            exit 1
          fi
          echo "OK - the logger depends on nothing and opens only its own files."

      - name: Gate 22 — the sweep crates cannot read a bar
        run: |
          set -euo pipefail
          # WHY. The owner's constraint, in their words: "at any point we should
          # never ever pull any real data or even by mistake pulled bars or data
          # should never ever be used." The second half is the hard part. The
          # first is discipline and can be kept; the second is a claim about what
          # the code is CAPABLE of, and only a structural check can make it.
          #
          # It is not hypothetical. Two real bar files appeared under
          # ~/.brutex/store/bars/groww/NSE/INDEX/{NIFTY,BANKNIFTY}/1min/2020-01.bin
          # during a session whose whole premise was that none existed. Nobody in
          # that session pulled them. So "could the sweep have read them" must be
          # answerable without trusting anyone's account of what they ran.
          #
          # THIS GATE'S FIRST VERSION WAS DEFEATED IN ALL FOUR CLAUSES by an
          # adversarial audit, which composed a working bypass:
          #
          #   [dependencies.store]                       clause A blind
          #   path = "../store"
          #   pub use store::file::BarFile as Bf;        clause C blind
          #   Bf::open_existing(p, ..)?.read_record(n)   clause B blind
          #
          # and gate 22 printed OK. Everything below is the repair, and each
          # clause names the bypass it now refuses.
          fail=0
          SWEEP='vocab indicators engine'

          # ── CLAUSE A — the dependency closure cannot reach a filesystem ────────
          #
          # The load-bearing clause, because it is transitive: a crate that cannot
          # NAME `store` cannot call into one whatever its source says.
          #
          # A1 FIRST, and this is the repair. Cargo accepts four spellings of one
          # dependency, and the extraction in A2 -- `name =` at line start inside
          # the `[dependencies]` range -- can see exactly one of them:
          #
          #   store = { path = "../store" }        the only form A2 sees
          #   store.path = "../store"              a dotted key, same meaning
          #   [dependencies.store]                 a table header, same meaning
          #   [dev-dependencies]                   links into every test and bench
          #   [target.'cfg(unix)'.dependencies]    links on that target
          #
          # A shell cannot parse TOML and this gate is not going to pretend it can.
          # So instead of teaching A2 four spellings, A1 refuses every spelling A2
          # cannot read. These three manifests use none of them, so the constraint
          # costs nothing -- and with A1 held, A2 is a COMPLETE parse rather than a
          # hopeful one. The authoritative parser is Rust:
          # `engine::tests::declared_dependencies`, which handles all four and is
          # tested against all four.
          for c in $SWEEP; do
            m="crates/$c/Cargo.toml"
            # Comments stripped first. A comment mentioning `[dev-dependencies]` is
            # not a `[dev-dependencies]` table, and three of these manifests
            # discuss the graph at length in exactly that way. This is the defect
            # that took `V-06` red and `hits_does_the_same_work_for_every_input`
            # green-on-a-broken-function: text in a comment is text.
            code=$(sed 's/#.*//' "$m")
            for spelling in '^\[dependencies\.' '^\[dev-dependencies' \
                            '^\[build-dependencies' '^\[target\.'; do
              if printf '%s\n' "$code" | grep -qE "$spelling"; then
                echo "REFUSED  $m uses a dependency-table spelling this gate cannot parse: $spelling"
                echo "         Use the flat [dependencies] table with `name = ...`."
                echo "         See engine::tests::declared_dependencies for why."
                fail=1
              fi
            done
            # A dotted key inside the flat table -- `store.path = "../store"` --
            # declares a dependency A2 would not see.
            if printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
               | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+ *='; then
              echo "REFUSED  $m declares a dependency with a dotted key"
              fail=1
            fi

            # A2. With A1 held this is every dependency the manifest declares.
            # `|| true` is load-bearing: `vocab` declares NOTHING, so grep exits 1,
            # and under `set -euo pipefail` that killed this gate before it printed
            # a line -- an exit 1 with no output, indistinguishable from a real
            # refusal, and had the polarity gone the other way it would have passed
            # forever having checked nothing.
            deps=$(printf '%s\n' "$code" | sed -n '/^\[dependencies\]/,/^\[/p' \
                   | { grep -oE '^[A-Za-z0-9_-]+ *=' || true; } \
                   | sed 's/ *=//' | sort -u | tr '\n' ' ')
            case "$c" in
              vocab)             want='' ;;
              indicators|engine) want='vocab ' ;;
            esac
            if [ "$deps" != "$want" ]; then
              echo "REFUSED  crates/$c declares [$deps] and must declare [$want]"
              echo "         A new dependency here is how a bar reaches the sweep."
              fail=1
            fi
          done

          # ── CLAUSE B — no filesystem call site in src/ or benches/ ─────────────
          #
          # Clause A forbids reaching a filesystem through a dependency; this
          # forbids reaching one through `std`. The first version's probe list held
          # nine patterns and the audit walked past it with `include_bytes!`,
          # `fs::read`, `File::create` and `std::process::Command` -- and it scanned
          # only `src/`, so `benches/ratio.rs` could have read a bar file outright.
          #
          # `process::Command` and not `std::process`. The broader pattern was
          # written first and this gate refused its own repository over it: a
          # `harness = false` bench signals failure with `std::process::exit(1)`, and
          # all three do. `exit` cannot read anything. Spawning a process can, which
          # is what `Command` names.
          BANNED='File::open|File::create|OpenOptions|fs::read|fs::write|fs::copy|fs::rename|fs::remove|fs::File|fs::metadata|fs::canonicalize|read_dir|std::fs|MmapOptions|Mmap::|memmap|include_bytes!|process::Command|Command::new|std::os::|libc::'
          for c in $SWEEP; do
            for dir in src benches; do
              [ -d "crates/$c/$dir" ] || continue
              hits=$(grep -rnE "$BANNED" "crates/$c/$dir" 2>/dev/null || true)
              if [ -n "$hits" ]; then
                echo "REFUSED  crates/$c/$dir reaches the filesystem:"
                printf '%s\n' "$hits" | sed 's/^/           /'
                fail=1
              fi
            done
          done

          # ── CLAUSE C — no import of a crate that reads the store, any spelling ─
          #
          # Comments may cite `store::format::Bar` and several do, because that
          # record is what `indicators::Candle` replaced and the history is worth
          # keeping. So the pattern is anchored to an import -- but the first
          # version anchored it to a BARE `use`, and the audit walked past with
          # `pub use store::…` and with `use store as st;`.
          for c in $SWEEP; do
            hits=$(grep -rnE '^[[:space:]]*(pub[[:space:]]+)?use[[:space:]]+(brutex_)?(store|pull|lake|api|telemetry)([^A-Za-z0-9_]|$)' \
                   "crates/$c/src" "crates/$c/benches" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "REFUSED  crates/$c imports a crate that reads the store:"
              printf '%s\n' "$hits" | sed 's/^/           /'
              fail=1
            fi
          done

          # ── CLAUSE D — every compile-time include is a document, by a literal ──
          #
          # Clause B exempts `include_str!` and must: it is compile-time, it reads
          # only paths written as literals in tracked source, and the document
          # guards depend on it. This bounds the exemption so it cannot become the
          # hole -- and the first version's regex only matched a PLAIN literal, so
          # the audit walked past it with
          # `include_str!(concat!(env!("HOME"), "/.brutex/store/bars/…/2020-01.bin"))`,
          # which is not a literal at all and matched nothing.
          for c in $SWEEP; do
            for dir in src benches tests; do
              [ -d "crates/$c/$dir" ] || continue
              # A computed include path is refused outright. There is no legitimate
              # one here, and a gate that cannot evaluate the expression must not
              # guess at what it evaluates to.
              computed=$(grep -rnE 'include_str!\([^")]' "crates/$c/$dir" 2>/dev/null || true)
              if [ -n "$computed" ]; then
                echo "REFUSED  crates/$c/$dir computes an include path instead of writing one:"
                printf '%s\n' "$computed" | sed 's/^/           /'
                fail=1
              fi
              for p in $(grep -rhoE 'include_str!\("[^"]+"\)' "crates/$c/$dir" 2>/dev/null \
                         | sed 's/include_str!("//; s/")//' || true); do
                case "$p" in
                  *.md|*.rs|*.toml|*.lock) : ;;
                  *) echo "REFUSED  crates/$c/$dir includes '$p', not a document or a source file"
                     fail=1 ;;
                esac
                case "$p" in
                  *bars*|*.bin|*.parquet|*.csv)
                     echo "REFUSED  crates/$c/$dir includes '$p', which is bar-shaped"
                     fail=1 ;;
                  *) : ;;
                esac
              done
            done
          done

          # ── CLAUSE E — tests/ may read the disk, bounded ───────────────────────
          #
          # Clause B deliberately does not cover `tests/`, because one test there
          # legitimately reads the filesystem: `vocab/tests/workspace_is_rust.rs`
          # walks tracked files to enforce §2. The audit pointed out the obvious
          # consequence -- repointing that literal at a bar file keeps every other
          # clause green. So the exemption is bounded the same way clause D bounds
          # its own: a path may be built from `CARGO_MANIFEST_DIR`, and may never
          # be bar-shaped or reach into a home directory.
          for c in $SWEEP; do
            [ -d "crates/$c/tests" ] || continue
            hits=$(grep -rnE 'env!\("HOME"\)|var\("HOME"\)|\.brutex|store/bars|\.bin"|\.parquet"' \
                   "crates/$c/tests" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "REFUSED  crates/$c/tests names a path outside the repository:"
              printf '%s\n' "$hits" | sed 's/^/           /'
              fail=1
            fi
          done

          # WHAT THIS GATE CANNOT SEE, said rather than implied. A caller can still
          # read bars itself and hand them to `Evaluator::step` -- that is the API
          # and cannot be forbidden. What is guaranteed is the half that was in
          # question: these three crates cannot go and find data on their own.
          # `crates/api` and `crates/pull` may touch the store, deliberately, and
          # gates 9 and 13 govern them.
          if [ "$fail" -ne 0 ]; then
            echo
            echo "GATE 22 FAILED."
            echo
            echo "A sweep crate that can reach the filesystem can be handed real"
            echo "bars by accident, and the owner's constraint is that even bars"
            echo "pulled by mistake are never used. Keep the capability absent."
            exit 1
          fi
          echo "OK — vocab, indicators and engine cannot reach a bar."
      - name: Gate 19 — a failure an operator can see is a failure the log records
        run: |
          set -euo pipefail
          # THE ONE THING THE EMIT-SITE COUNT CANNOT ANSWER.
          #
          # `api::emitted` counts every `telemetry::emit` under crates/api/src
          # and proves each reaches a file. That is a strong guarantee about the
          # sites that EXIST, and it says nothing whatever about a failure path
          # that has none — which is the gap an operator actually falls into.
          #
          # Measured: four arms of `pull::ingest` pushed a `Failure` onto the
          # receipt and emitted NOTHING, so a backfill that landed zero bars
          # left a quiet log. They were found by reading every `Result`-
          # returning function by hand, which is not a thing anyone will do
          # again. This gate is that reading, mechanised.
          #
          # THE RULE. Every `failures.push(` and `failures: vec![` in production
          # code under crates/{pull,api}/src must have a `telemetry::emit(` or a
          # `note_*(` helper call within the WINDOW lines above it. Both forms
          # count because this workspace extracts emits into `note_*` helpers as
          # soon as a function reaches clippy's line limit — refusing the helper
          # form would push authors to inline the emit and fail the OTHER gate.
          #
          # WHAT IT DELIBERATELY DOES NOT DO. It does not check that the event
          # is at a useful level, or carries the right fields, or is reachable
          # from a test — `api::emitted` and gate 12 cover those. It answers one
          # question: did anybody write an event here at all.
          #
          # Test code is skipped from the first `#[cfg(test)]` onward. Every
          # file in this workspace puts its test module last, and a test that
          # constructs a `Failure` fixture is not a production failure path.
          # ONE EMIT SATISFIES ONE FAILURE, AND ONLY THE NEAREST ONE ABOVE IT.
          #
          # The first version of this gate asked "is there an emit within twelve
          # lines above". It passed a tree with a deliberately deleted emit,
          # because the site below simply matched the site ABOVE's event. A gate
          # that can be satisfied by somebody else's work is not a gate.
          #
          # So each event is claimed at most once, nearest-first. Five failures
          # and four events is a failure, wherever the four happen to sit.
          #
          # A `fn note_*(` DEFINITION is not a call. Counting the helper's own
          # signature would let a file satisfy itself by declaring helpers.
          window=12
          work="$(mktemp -d)"
          found="$work/missing"; : > "$found"
          counted="$work/counted"; : > "$counted"
          for f in $(git ls-files 'crates/pull/src/*.rs' 'crates/api/src/*.rs'); do
            cut=$( { grep -n '^#\[cfg(test)\]' "$f" || true; } | head -1 | cut -d: -f1 )
            if [ -z "$cut" ]; then cut=$(awk 'END{print NR+1}' "$f"); fi
            awk -v cut="$cut" -v window="$window" -v name="$f" '
              NR >= cut { next }
              /^[[:space:]]*fn[[:space:]]+note_[a-z_]+\(/ { next }
              /telemetry::emit\(|note_[a-z_]+\(/ { e[++ne] = NR; next }
              /failures\.push\(|failures: vec!\[/ { p[++np] = NR }
              END {
                for (i = 1; i <= np; i++) {
                  print "counted" > "/dev/stderr"
                  ok = 0
                  for (j = ne; j >= 1; j--) {
                    if (claimed[j]) continue
                    if (e[j] >= p[i]) continue
                    if (p[i] - e[j] > window) break
                    claimed[j] = 1; ok = 1; break
                  }
                  if (!ok) print name ":" p[i]
                }
              }' "$f" >> "$found" 2>>"$counted"
          done

          echo "checked $(wc -l < "$counted" | tr -d ' ') production failure-recording site(s)"
          if [ -s "$found" ]; then
            echo
            echo "A FAILURE IS RECORDED HERE AND NOTHING IS LOGGED:"
            sed 's/^/  /' "$found"
            echo
            echo "The receipt will show it and the log will not, so an operator"
            echo "reading /logs after a failed run sees a quiet file. Emit an"
            echo "event beside it — Error or Warn, so it clears the default"
            echo "floor — or extract a note_* helper as pull::ingest does."
            echo "CLAUDE.md section 4: degrade loudly and name the reason."
            exit 1
          fi
          echo "OK — every recorded failure has its own event beside it."


      - name: Gate 10 — every invariant names a test that exists
        run: |
          set -euo pipefail
          # docs/04-invariants.md asserts: "A consistency check in CI fails if
          # a row's test does not exist." Until this gate existed that sentence
          # was false, which is precisely the decay the file was written to
          # prevent -- a row pointing at nothing is what turns the file into a
          # wish list.
          #
          # THIS GATE HAD A HOLE AND PRINTED "0 missing" THROUGH IT for its
          # whole life. Three defects, every one of them silent:
          #
          #  1. THE SKIP WAS UNAUDITED. The rule was "skip a row whose status
          #     cell is —", justified by the legend's meaning of that glyph:
          #     "not yet reachable (the crate does not exist)". The gate never
          #     checked the crate. So a row could name a test that exists in no
          #     file, wear a —, and pass. TEN rows did, in four crates that are
          #     tracked TODAY: S-02, S-05, S-10, P-01, P-02, P-03, P-04, X-01,
          #     X-02, X-13. Measured, not inferred -- the old gate printed
          #     "checked 139 named test(s); 0 missing" on the same tree that
          #     holds them. The status glyph is now documentation. The fact
          #     that decides is whether crates/<crate>/Cargo.toml is TRACKED,
          #     which is the thing the legend was talking about all along.
          #  2. THE CRATE SEGMENT WAS THROWN AWAY. `crate::module::name` was
          #     reduced to `name` and searched for across every .rs file in the
          #     workspace, so `engine::proptest::antimonotone` would have been
          #     satisfied by an `fn antimonotone` in crates/store. The search is
          #     now confined to the crate the row names.
          #  3. `xargs -r grep -q` RETURNS 123 WHEN ANY BATCH MISSES. xargs
          #     exits 123 if any invocation exits 1..125, and `grep -q` exits 1
          #     on the batches that do not contain the match -- so as soon as
          #     the workspace outgrows one ARG_MAX batch, a test that DOES
          #     exist is reported missing. A red build for a reason that is not
          #     true is how a gate gets ignored. One fixed-string lookup into a
          #     table built once replaces it.
          #
          # WHAT IT STILL CANNOT SEE:
          #   * That the named function is a TEST. `#[test]` is not required,
          #     because a `harness = false` bench function carries no attribute
          #     and C-01 through C-13 are proven by exactly those. So a row can
          #     be satisfied by an ordinary function of the right name in the
          #     right crate.
          #   * That the test proves the invariant. Nothing mechanical can.
          #   * The module segment. `store::unit::x` and `store::fault::x` are
          #     the same question to this gate.
          #   * A row whose "Proven by" cell is prose, a const assertion or a
          #     CI gate rather than a `crate::module::name` token. Those rows
          #     are not checked and never were.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP: `git ls-files`, the document,
          # and the static patterns below. Gate 1c's discipline.
          f=docs/04-invariants.md
          work=$(mktemp -d)

          # ROWS ARE EXEMPTED ONLY HERE, never by a glyph in the document --
          # that is the whole repair. One row id per line, with the reason
          # beside it, gate 1d's mechanism: adding a line is a visible diff and
          # the moment to ask whether the test should just be written.
          #
          # IT WAS DELIBERATELY EMPTY while ten rows were being worked through,
          # so that all ten stayed named in this step's log rather than becoming
          # one line nobody reads. Five survived that pass. Two of the five were
          # WRITABLE and have been written -- A-20 and X-02, D-0060 and D-0061.
          # The three below are not writable, and they are not writable for the
          # same reason each time: THE SUBJECT DOES NOT EXIST. There is no code
          # for a test to drive, so a test here would assert the absence and
          # then have to be deleted the day the thing arrives.
          #
          # A line is honest ONLY while that stays true. Each says what is
          # missing and what would close it; when the closing condition is met,
          # the line goes and the test is written in the same change.
          #
          # WHAT A LINE COSTS, because it is not free. The allowlist keys on the
          # ROW, not on the token, so a row naming two tests has both silenced.
          # P-03 names a second test that EXISTS and passes --
          # pull::unit::a_saturday_is_a_full_session_because_there_is_no_weekend_rule,
          # which pins the absence of a weekend rule as the current behaviour --
          # and this step stops confirming its name for as long as the P-03 line
          # is here. It is still run by cargo test; what is lost is this gate's
          # check that the ROW still points at it. Both silenced tokens are
          # printed by name above, so the cost is in the log rather than hidden.
          allow_pending='
          P-03  no trading calendar and no holiday list exist. crates/pull/src/session.rs computes no day of the week and docs/00-charter.md section 3 records special-session shapes and NO holiday list, so a weekend rule would be wrong -- it records 2025-02-01, a Saturday, as a full 375-bar session. CLOSED BY: a sourced holiday list recorded in the charter FIRST (golden rule 1 forbids inventing one), then a filter in session.rs, then pull::unit::calendar_filter driving it.
          X-01  no run-identity function exists in any crate. blake3 is declared at Cargo.toml [workspace.dependencies] and NO member takes it; nothing hashes CLAUDE.md section 3 rule 3s nine inputs. An earlier version of this exemption said crates/vocab, crates/indicators and crates/engine are not workspace members and that therefore no mask, no vocab_version and no sweep exist. That was FALSE and is corrected here: all three are listed in the root Cargo.toml members, all three have tests and benches, ConditionMask exists, and vocab::VOCAB_VERSION is 3. blake3 is absent from Cargo.lock entirely, so the crate is declared and unresolved rather than resolved and unused. What is actually missing is the identity FUNCTION, a data_digest over the loaded bars, and anywhere to put the result: the store has one file kind, bars, and no results or ranking file. Where the function may live is a decision, not an oversight, because CI gate 9 fails on any dependency in crates/core. CLOSED BY: those crates, then a data_digest over loaded bars, then the identity function, then the test. NOT by adding proptest -- this workspace has twice replaced a phantom property test with exhaustive ordinary tests (S-02, P-01).
          X-13  no cross-vendor bar comparison exists. The reader is there -- BarFile::read_record, walked at every index by S-02, and X-12 already files each vendor under its own path prefix -- but nothing opens two vendors months and matches them bar for bar, so there is no code for a test to drive. This is NOT ruled out by docs/07-plan.md R-6: that forbids SHOWING two feeds side by side and is enforced by a picker and a column, while api::merge already refuses a universe on a cross-vendor ISIN conflict. CLOSED BY: a two-BarFile comparison in crates/store that refuses and names the first divergent timestamp, then store::unit::vendor_disagreement_refuses.
          '

          # (crate, fn) for every tracked crate, built once.
          fns="$work/fns"; : > "$fns"
          for c in $(git ls-files 'crates/*/Cargo.toml' \
                     | sed 's|^crates/||; s|/Cargo.toml$||'); do
            { git ls-files "crates/$c/*.rs" \
              | xargs -r grep -ohE '\bfn [a-z_][a-z_0-9]*' \
              | sed "s|^fn |${c} |" >> "$fns"; } || true
          done
          sort -u -o "$fns" "$fns"

          rows=0; checked=0; missing=0; pending=0; exempt=0
          while IFS= read -r line; do
            case "$line" in \|*) ;; *) continue ;; esac
            rows=$((rows + 1))
            id=$(printf '%s\n' "$line" | awk -F'|' '{print $2}' | tr -d ' ')
            for t in $( { printf '%s\n' "$line" \
                          | grep -oE '`[a-z_]+::[a-z_]+::[a-z_0-9]+`' | tr -d '`' || true; } ); do
              c="${t%%::*}"; fn="${t##*::}"
              # The ONLY reason a row is not checked: the crate it names is not
              # a tracked member of this workspace. That is what the legend's
              # "—" was always supposed to mean, now read off the tree.
              if ! git ls-files --error-unmatch "crates/${c}/Cargo.toml" >/dev/null 2>&1; then
                pending=$((pending + 1))
                continue
              fi
              if [ -n "$( { printf '%s\n' "$allow_pending" \
                            | awk -v I="$id" '$1==I{print "y"; exit}'; } )" ]; then
                exempt=$((exempt + 1))
                printf 'EXEMPT (allowlisted) %s — %s\n' "$id" "$t"
                continue
              fi
              checked=$((checked + 1))
              if ! grep -qxF "${c} ${fn}" "$fns"; then
                printf 'INVARIANT POINTS AT A TEST THAT DOES NOT EXIST: %s (%s)\n' "$t" "$id"
                missing=$((missing + 1))
              fi
            done
          done < "$f"

          echo "read ${rows} table row(s) in ${f}"
          echo "  ${checked} named test(s) checked against a tracked crate"
          echo "  ${pending} skipped — the crate they name is not a workspace member"
          echo "  ${exempt} exempted by the allowlist in this file"
          echo "  ${missing} missing"
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: it reported success while measuring nothing.
          if [ "$checked" -eq 0 ]; then
            echo "GATE 10 CHECKED NOTHING. Either every crate vanished or the row"
            echo "pattern stopped matching. A silent zero is not a pass."
            exit 1
          fi

          bad=0
          [ "$missing" -eq 0 ] || bad=1
          for i in $( { printf '%s\n' "$allow_pending" | awk 'NF{print $1}'; } ); do
            if ! grep -qE "^\| *${i} *\|" "$f"; then
              printf 'STALE ALLOWLIST ENTRY — %s is not a row in %s\n' "$i" "$f"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo
            echo "Either write the test, or record abandoning the invariant in"
            echo "docs/05-decisions.md. Rows are never deleted to go green, and"
            echo "a status glyph no longer silences one."
            exit 1
          fi
          echo "OK — every invariant in a tracked crate names a test that exists."

      - name: Gate 11 — banned constructs on the O(1) paths
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 8 measures a ratio at 1x/10x/100x, which
          # catches a bound that has ALREADY broken on a path someone thought
          # to write a bench for. The audit that produced this gate found four
          # O(1) defects that no gate could see, because each was a *source
          # construct* that is superlinear by nature and none of them had a
          # bench: a map reserved to exactly its load so the next insert
          # rehashed (2.4 ms at 50k entries), a page render that sorted the
          # whole universe per request, an encoder nothing called, and a
          # coverage gate that claimed 100% while exiting 1. Gate 8 says "this
          # path got slower". Gate 11 says "this construct may not appear".
          #
          # WHAT IT SCANS. Tracked `crates/*/src/**.rs` only, and inside each
          # file everything EXCEPT the `#[cfg(test)] mod NAME { ... }` blocks.
          # Test code and benches are exempt on purpose: a test asserting that
          # a refusal happens legitimately unwraps, sorts and panics.
          #
          # IT USED TO BE "THE REGION BEFORE THE FIRST `#[cfg(test)]`", AND
          # THAT BOUNDARY WAS THE BUG IT WARNED ABOUT. Truncating at an
          # attribute hides every line after it, and an attribute is not only
          # ever a test module: `costs/src/trip.rs` carries `#[cfg(test)]` on a
          # const fn 876 lines above its tests, `costs/src/dated.rs` on a const
          # at line 55, `greeks/src/bsm.rs` on a STATEMENT inside the shipping
          # body of `Checked::greeks`. One attribute shrank the scan exactly as
          # silently as two, and the two-attribute check never fired on the
          # single-attribute case — 790 lines of production code were invisible
          # while the gate reported success, `render::json_string` and
          # `server::universe_label` among them, both of which sit AFTER a test
          # module where no truncation rule of any shape can reach them.
          #
          # So the boundary is a SUBTRACTION now, not a cut: from a
          # `#[cfg(test)]`, skip blank lines, `//` comments and attributes to
          # find the item it covers; if that item is an inline `mod NAME {`,
          # drop through to the matching `}` at the same indent; otherwise keep
          # the attribute and the item and carry on scanning. A file may hold
          # as many test modules as it likes, in any position, and none of them
          # hides a line. D-0065.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`
          # and the static patterns below, the same discipline gate 1c states.
          # Nothing from the event payload is expanded. `git ls-files` also
          # means an UNTRACKED file is invisible — which is right for CI, where
          # the checkout holds only tracked files, but means a local run can
          # disagree with CI until the file is added.
          #
          # WHAT IT CANNOT SEE, stated plainly because a gate that oversells
          # itself is worse than no gate:
          #   * Indirection. `.sort()` behind a trait, a `HashMap` arrived at
          #     by `.collect()`, a float behind a type alias or a generic
          #     `T: Float` — all invisible. This is a TEXT scan, not a type
          #     check. It refuses the spelling, not the behaviour.
          #   * Macro-generated code. Expanded after this gate has run.
          #   * `/* ... */` block comments are NOT stripped; only whole lines
          #     whose first non-blank characters are `//` (which covers `///`
          #     and `//!`). A banned token inside a block comment or inside a
          #     string literal is a false positive, and the allowlist is the
          #     escape hatch for it.
          #   * "Per-request" is not decidable from text. Rule 4 refuses every
          #     sort in non-test source and leans on the allowlist to record,
          #     one file at a time, WHY a given sort is bounded. The reasons
          #     are written beside the entries and are the reviewable part.
          #   * A test module whose closing `}` is not at the module keyword's
          #     own indent — which `cargo fmt` cannot produce, and gate 6a
          #     enforces `cargo fmt` — is not delimitable by this scanner, and
          #     that is a HARD FAILURE rather than a guess. "I could not tell
          #     where this module ends" is a thing a gate may say; quietly
          #     scanning half of it is not.
          #   * `#[cfg(test)] mod tests {` written on ONE line is not
          #     recognised as a module and its body IS scanned. That direction
          #     is loud — the test bodies refuse under rules 4 and 5 — never
          #     silent, which is why it is left rather than pattern-matched at.
          #
          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. No magic comment, no
          # `// gate-11-ok` scattered through crates/. Each entry is
          # `path max_occurrences`, and the count is pinned at what the file
          # measures TODAY — so a legitimate existing use stays green while the
          # NEXT one is a red build and a visible diff on this file. That is
          # gate 1d's mechanism: adding a line here is the moment to ask
          # whether the construct is really justified.

          # ---- rule 1. No allowlist. docs/07 layer 4 is unconditional. ------
          # AND IT STAYS EMPTY. The one candidate this rule ever had was
          # `core::vendor::board_of`, which binary-searched three const tables
          # of 6, 2 and 120 entries, once per equity master row. The audit that
          # found it could have written the first entry here with a defensible
          # reason — the tables are compile-time fixed and nothing per-bar
          # reaches them — and did not, because `core::universe::MemberIndex`
          # already exists for exactly this, was built to retire a
          # `binary_search` over 750 entries, and is smaller machinery than the
          # paragraph justifying an exemption would have been. D-0065.
          # `partition_point` is the same O(log n) shape as `binary_search` and was
          # outside rule 1 entirely -- an audit found it live at
          # crates/store/src/file.rs:956 while this rule reported ZERO occurrences.
          #
          # That call is legitimate and the reason is checkable: it partitions the
          # INCOMING BATCH at the last held timestamp, so the log is over a
          # caller-supplied slice whose length is the append size, not over the
          # stored history. `survey` has already proven the batch strictly
          # increasing, which is what makes a partition correct there at all.
          allow_search='
          crates/store/src/file.rs 1
          '

          # ---- rule 2. CLAUDE.md section 7, BOTH HALVES OF IT. --------------
          # THE LAW STRING USED TO SAY ONLY "never a float", AND SECTION 7 DOES
          # NOT SAY ONLY THAT. It says prices are paisa integers and never a
          # float, and in the next sentence that statistical values keep full
          # precision and are never rounded for storage. The rule was printing
          # half its own source, so every full-precision statistic in the
          # workspace read as a violation of a law that permits it. The note
          # below used to say "no such code exists yet". It exists now — three
          # crates of it — so the law string was corrected to state the rule
          # this gate actually enforces. D-0065.
          #
          # THE LINE THIS RULE DRAWS IS PRICE vs STATISTIC, NOT INTEGER vs
          # FLOAT. Each entry below was read occurrence by occurrence and is
          # one or the other:
          #   price.rs      the ONE sanctioned float boundary on a PRICE path —
          #                 the file says so itself. The vendor sends rupees as
          #                 an IEEE double and something has to accept it;
          #                 everything downstream of that `Ok` is an integer
          #                 forever.
          #   vendor.rs     parse_strike, the other end of that same boundary.
          #                 Hands its f64 straight to `from_rupees_half_up` and
          #                 does no arithmetic of its own.
          #   greeks/*      73 occurrences, every one a model input, a model
          #                 output or a polynomial coefficient. NO PAISA CAN
          #                 REACH THIS CRATE: no member of this workspace
          #                 depends on it (it is shared with `tickvault` by git
          #                 URL), its manifest has an empty dependency table
          #                 that gate 9b enforces, and there is no `i64` and no
          #                 `Paisa` in its surface. Snapping a gamma of
          #                 0.00017142680429549402 to a two-decimal grid makes
          #                 it 0.00. D-0046.
          #   lake/bar.rs   8 greek fields plus `paisa_from_lake`, which is a
          #                 boundary PARAMETER and not a stored value: its
          #                 whole body delegates to `Paisa::from_rupees_half_up`
          #                 and attaches the column and row to the refusal. The
          #                 money fields beside it are already `Paisa`.
          #   lake/reader.rs the raw Parquet DOUBLE reader and its buffer. Every
          #                 caller is `price`, `optional_price` — both of which
          #                 convert EVERY row to `Paisa` before returning — or
          #                 one of the eight greeks. Traced: no f64 price
          #                 leaves this file.
          #   telemetry/*   `Value::Float`, its `From`, its owned twin, the
          #                 JSON number writer and the JSON number reader. An
          #                 ENCODER type, not a value type: `Value::paisa`
          #                 exists and produces `Value::Int`, and the `Float`
          #                 variant's own doc reads "Never a price."
          # `crates/core/src/vendor.rs` had an entry here because `parse_strike` routed the
          # strike through a binary float. It parses the digits now, so the entry is removed
          # rather than left loose -- CI warned `no longer matches rule 2 -- tighten it`, and
          # a loose allowlist is a gate reading stronger than it is.
          allow_float='
          crates/core/src/price.rs 4
          crates/greeks/src/bsm.rs 36
          crates/greeks/src/normal.rs 21
          crates/greeks/src/error.rs 17
          crates/greeks/src/solver.rs 13
          crates/greeks/src/moneyness.rs 6
          crates/lake/src/bar.rs 9
          crates/lake/src/reader.rs 3
          crates/telemetry/src/value.rs 5
          crates/telemetry/src/encode.rs 1
          crates/telemetry/src/record.rs 1
          '

          # ---- rule 3. docs/07 law 2: pre-size every map. -------------------
          # Only HashMap/HashSet. A BTreeMap has no `with_capacity` — capacity
          # is not a concept for a B-tree — so including it would put three
          # un-fixable entries in the allowlist and teach a reader to ignore
          # it. A BTreeMap being O(log n) is a real but DIFFERENT complaint,
          # and this is not the instrument for it.
          # manifest.rs::genesis reserves nothing because nothing is known yet
          # to reserve from; the doc comment argues it and points at
          # docs/06-limits.md §17. Layer 3's guarantee is about the LOADED
          # index, which is the one a query touches, and that one is reserved.
          #
          # catalog.rs::build_trigrams is the one place here where the bound is
          # genuinely not knowable, and the reason is circular rather than
          # lazy: THE MAP'S SIZE IS THE NUMBER OF DISTINCT TRIGRAMS, AND
          # COUNTING DISTINCT TRIGRAMS NEEDS THE MAP. What can be counted
          # before the loop is the number of trigram WINDOWS — one per
          # (name, offset) — which is an upper bound only in the sense that
          # every key came from some window; it reserves per window rather than
          # per key, and the ratio between them is how many names share a
          # trigram, which is a property of the data and not computable from it
          # ahead of the pass. Reserving the window count would trade a
          # reservation that grows with the universe for a key count bounded by
          # a three-byte alphabet. The build runs ONCE, inside `Catalog::build`
          # from `Site::new`, into an Arc<Site> (D-0039) — never in a handler.
          # IF IT EVER MOVES ONTO A REQUEST PATH THIS ENTRY IS WRONG and must
          # be deleted rather than re-pinned, which is the same condition the
          # rule 4 merge.rs entry names.
          #
          # TWO MORE FILES WOULD SIT ON THIS LIST IF THEY HAD BEEN ALLOWLISTED
          # INSTEAD OF FIXED, and they are named so nobody re-derives the same
          # reasoning: merge.rs::merge now reserves `asserted` from the same
          # `capacity` the map 33 lines below it already used, and
          # pull::work::Selection::of reserves from the iterator size hint.
          allow_unsized='
          crates/api/src/catalog.rs 1
          crates/pull/src/manifest.rs 1
          '

          # ---- rule 4. docs/07 layer 12: bounded page, never O(universe). ---
          # Each of these was traced to its callers before it was written down.
          # FIVE of the nine files are new here only because this rule had
          # never run: the boundary check above exited before it ever printed,
          # and the four that were already listed are the four that happened to
          # sit in the truncated region.
          #
          # THE census.rs ENTRY WAS STALE IN BOTH ITS COUNT AND ITS REASON. It
          # read 1 and named `grid_instruments`, a function that no longer
          # exists in that file. The two sorts actually there are different
          # functions with a different argument, re-derived below rather than
          # re-pinned — which is the whole difference between an allowlist and
          # a mute button.
          #
          #   BUILT ONCE AT STARTUP, into an Arc<Site> (D-0039). Never in a
          #   handler. If any of these moves into one, the entry is wrong and
          #   must be deleted rather than re-pinned:
          #     autopilot.rs tracked_series — its own doc says "computed once
          #                 when the autopilot starts ... that belongs beside
          #                 the manifest load, not inside a tick".
          #     catalog.rs  build_orders (COLUMNS sorts of the universe, once)
          #                 AND Catalog::search. The second IS per request and
          #                 is allowed anyway: it sorts the HIT LIST of a
          #                 substring search, which layer 12 names as "the
          #                 named exception and stays O(universe)" and
          #                 docs/06-limits.md §24 measures at 6.53 ms.
          #     census.rs   held_series and held_entries. Both run in
          #                 `Site::new` beside the manifest load, both sort the
          #                 store's own held keys, and both are sorted for
          #                 REPRODUCIBILITY rather than for display: the pager
          #                 addresses a row by ordinal, and HashMap order is
          #                 not stable between processes. docs/06-limits.md §32.
          #     master.rs   skipped_by_reason — sorts DECLINE REASONS, bounded
          #                 by the Skip vocabulary. Reached from `universe()`.
          #     merge.rs    single_vendor_members — O(universe log universe),
          #                 allowed only because `universe()` runs once.
          #     render.rs   folder_suggestions — the ~/Downloads walk, bounded
          #                 by MAX_FOLDER_SUGGESTIONS and called from
          #                 `Site::new`. docs/06-limits.md §34.
          #
          #   BOUNDED BY A CONSTANT, wherever they run:
          #     archive.rs  the member list, bounded by MAX_MEMBERS, which the
          #                 walk checks on every push and refuses past.
          #     manifest.rs newest-generation pick — bounded by MAX_SLOTS, 2.
          #
          #   PER RUN, NOT PER REQUEST:
          #     server.rs   broker_run sorts the tracked universe ONCE before
          #                 making one network request per member of it, for
          #                 reproducibility — an unordered backfill resumes
          #                 somewhere different after every restart. The sort
          #                 is not the cost of that function.
          #     server.rs   instruments_json sorts per request, over the
          #                 TRACKED universe (~800 by decision) and not the
          #                 master, which its own comment states and which the
          #                 type-ahead's bound depends on. It is the one entry
          #                 here that is per request and not the layer-12
          #                 exception, and it is the one to look at first if
          #                 this list is ever audited again.
          # `select_nth_unstable`, `BinaryHeap` and `collect::<BTreeSet/Map>` were
          # outside rule 4 and are the same class: a selection, a heap and an ordered
          # collect each cost at least O(n) in what they consume. All three have zero
          # live occurrences today, so widening costs nothing and shuts the hole
          # before anybody uses it.
          #
          # The two entries below are bounded sorts, not O(universe), and each is
          # bounded by something the type system or the vocabulary fixes:
          #   engine   `sort_canonically` orders ONE level's frequent set, which the
          #            ladder has already bounded, and canonical order is what makes a
          #            rerun byte-identical under §3.5.
          #   eval     `Evaluator::positions()` sorts the position list it just built.
          #            Its length is bounded by `vocab::table::NEXT_FREE`, a
          #            compile-time constant, and it is called once per run.
          # THE TWO ENTRIES BELOW WERE PREDICTED HERE AND ARE NOW DUE. The note that stood
          # here said `constituents.rs` and `coverage.rs` were not in the committed tree
          # yet -- another session had them staged -- so an entry naming them would have
          # been a STALE ALLOWLIST ENTRY, which this gate treats as a failure rather than a
          # note, correctly, because such an entry makes the gate read stronger than it is.
          # It closed: "when those files land, rule 4 will refuse them and their owner adds
          # the entries." They landed in 6a58d7c and 6a58d7c's successors, both are tracked
          # and clean, and rule 4 refuses them. So the entries go in -- but re-derived from
          # the code rather than trusted from that prediction, because a forecast is not a
          # trace:
          #
          #   ALL THREE SORTS ARE STARTUP-ONLY. Not one is reachable from an HTTP handler.
          #   Every one funnels through `Read::new` (server.rs), reached only as
          #   `universe()` <- `Site::load` <- `Site::serving` <- `run_in`, once per process
          #   and BEFORE the router is built. The route handlers consume the finished
          #   `Vec<String>` -- `health` reads `report_from(&site.read)`, and
          #   `render::notes_block` takes `&[String]`. The only other production caller of
          #   `universe()` is the `report` CLI subcommand, one invocation per process;
          #   `instruments_html` re-parses per call but every call site is past that file's
          #   `#[cfg(test)]`. D-0039/D-0042 is the decision that makes this so.
          #
          #     constituents.rs  TWO sorts, both bounded by ONE index tier's published
          #                      membership, never the universe. `unresolved_lines` sorts
          #                      `join.lacks`; `reason_lines` sorts one decline reason's
          #                      names inside one unjoinable bucket. `Tier::published`
          #                      states every size -- Nifty50 50, Nifty100 100, Nifty200
          #                      200, Nifty500 500, TotalMarket 750, FnoUnderlyings 213 --
          #                      and `TierJoin::accounted` asserts the five buckets sum to
          #                      it. So the longest possible sort is 750 names, and
          #                      `reason_lines` is at most 2 groups per bucket because
          #                      `NoIsin::reason` is a four-word vocabulary that
          #                      `is_a_malformed_name` splits two and two.
          #     coverage.rs      ONE sort, and it is the only one of the three whose reason
          #                      is written at the site: "a `HashMap` walk is not ordered
          #                      and a reason list that reshuffles between restarts is a
          #                      list an operator cannot diff. `CLAUDE.md` §3 rule 5."
          #                      `from_master` runs only where `target.tier()` is None,
          #                      which `ingest.rs` pins to Swept and Indices: Swept is
          #                      bounded by `InstrumentKey::SWEPT`, which is two entries,
          #                      NIFTY and BANKNIFTY; Indices is the merged index series,
          #                      measured at 35. That 35 is a MEASUREMENT and not a
          #                      compile-time cap -- a vendor adding index series grows it
          #                      -- and it is recorded that way rather than as a bound.
          #
          # WHAT THIS DOES NOT COVER, said plainly so the entry cannot be read as wider
          # than it is: `crates/api`'s own ratio bench reports THIRTY C-15 breaches, up to
          # 2,346 ps per instrument per request against a 1,000 ps ceiling. That is
          # per-request work and these three sorts are not on a request path, so declaring
          # them here cannot and does not silence it. C-15 is undocumented in
          # `docs/06-limits.md` and unrecorded in `docs/11-findings.md`, and gate 8 is red
          # on it.
          allow_sort='
          crates/api/src/constituents.rs 2
          crates/api/src/coverage.rs 1
          crates/engine/src/lib.rs 1
          crates/indicators/src/evaluator.rs 1
          crates/api/src/autopilot.rs 1
          crates/api/src/catalog.rs 2
          crates/api/src/census.rs 2
          crates/api/src/master.rs 1
          crates/api/src/merge.rs 1
          crates/api/src/render.rs 1
          crates/api/src/server.rs 2
          crates/pull/src/archive.rs 1
          crates/pull/src/manifest.rs 1
          '

          # ---- rule 5. CLAUDE.md section 4: refuse, never die. --------------
          # THIS RULE REFUSES A SPELLING, and these ten occurrences are what
          # that costs. Nine of them are not `Result::expect` at all:
          # `telemetry::json::Scan::expect(&mut self, want: u8) ->
          # Result<(), LineFault>` is a PARSER method, every call site is
          # `self.expect(b'"')?` or `scan.expect(b'{')?`, and every one
          # propagates rather than panicking. Renaming it to satisfy a grep
          # would be the tail wagging the gate.
          #
          # ssm.rs::hmac is the one real `Result::expect` in shipping code, and
          # it stays. `Hmac::new_from_slice` returns `InvalidLength`, which HMAC
          # cannot produce for any key length; the alternatives are to
          # propagate an error no input can cause — an arm no test can enter,
          # which is the coverage hole CLAUDE.md section 4 calls a test that
          # asserts nothing — or to substitute a key, which is a fallback that
          # hides a failure. The `expect` message names the reason and rule 5c
          # below now sees the local allow that goes with it.
          # crates/pull/src/totp.rs carries a real `unreachable!()`:
          #
          #     .unwrap_or_else(|_| unreachable!("HMAC accepts every key length"))
          #
          # Rule 5 was blind to `unreachable!` until this commit widened it, so this is
          # a violation the gate has been unable to see rather than a new one. It is a
          # §4 breach -- degrade loudly or refuse, never die -- and a coverage region
          # no input can close, which this workspace has removed four times elsewhere.
          #
          # It is allowlisted at ONE rather than left refusing, and the reasoning is
          # worth stating: `crates/pull` belongs to another line of work, editing it
          # would clobber in-flight changes, and blocking that PR on a defect its owner
          # has not seen yet is not this gate's job. The count is pinned, so a second
          # `unreachable!` anywhere in that file fails. This entry is the report, and it
          # is meant to be removed rather than kept.
          # `crates/api/src/server.rs` 2, and ONE OF THE TWO IS PROSE. `note_header` carries
          # a real `.expect("a sanitised note is visible ASCII")`, sound because
          # `note_alphabet` emits only 0x20..=0x7E, exactly the alphabet a header value
          # admits, so the `Result` arm is a project region no input can enter -- which the
          # coverage floor cannot hold and which `unreachable!()` would only rename. The
          # SECOND match is not code at all: the words `unreachable!()` appear inside that
          # attribute's own `reason = "..."` string, explaining why `unreachable!()` was
          # avoided. The corpus drops whole-line `//` but an attribute's reason text is not
          # a comment, so the rule counts its own explanation -- the same self-referential
          # shape gate 15 already documents about a gate that spells its banned word out.
          # Declared rather than papered over by rewording the justification, because the
          # justification is the useful artefact and the miscount is the gate's.
          allow_panic='
          crates/api/src/server.rs 2
          crates/pull/src/totp.rs 1
          crates/pull/src/ssm.rs 1
          crates/telemetry/src/json.rs 5
          crates/telemetry/src/record.rs 4
          '

          # ---- rule 5c. Nothing disarms those lints outside a test module. --
          # Two entries, each the same line rule 5 allows above. ssm.rs carries
          # `#[allow(clippy::expect_used, reason = ...)]` on `hmac`, and
          # api/src/server.rs carries one on `note_header` for the `.expect`
          # described there. Rule 5c's awk walk counts only a real attribute at
          # bracket depth 0, so unlike rule 5 this count of 1 is exact and holds
          # no prose. Both would read better as `#[expect]`, which reports an
          # exemption nobody needs any more; that is their owners' call.
          # Kept as its own list rather than folded into `allow_panic` because
          # the two ask different questions — "this construct appears" and
          # "the lint that would have caught it is switched off here" — and a
          # file could earn one without the other.
          allow_disarm='
          crates/api/src/server.rs 1
          crates/pull/src/ssm.rs 1
          '

          work=$(mktemp -d)
          corpus="$work/corpus"
          scope="$work/scope"
          : > "$corpus"; : > "$scope"

          # THE SUBTRACTION, one file at a time. `scope` keeps every line that
          # is not inside a `#[cfg(test)] mod NAME { ... }` block, comments and
          # all; `corpus` is `scope` with whole-line `//` dropped. Rules 1..5
          # read `corpus`; rule 5c reads `scope`, because an attribute list can
          # carry a `//` comment inside it and a bracket-counting walk over the
          # stripped text would then lose count.
          strip='
            function emit(line, no,   t) {
              print F ":" no ":" line > SCOPE
              t = line; sub(/^[ \t]+/, "", t)
              if (t !~ /^\/\//) print F ":" no ":" line
            }
            function flush(  i) { for (i = 1; i <= nb; i++) emit(bl[i], bn[i]); nb = 0 }
            function hold(line, no) { nb++; bl[nb] = line; bn[nb] = no }
            BEGIN { st = 0; depth = 0; nb = 0; drop = 0 }
            {
              if (st == 2) {
                drop++
                if ($0 ~ CLOSE) { st = 0; next }
                # INSIDE THE MODULE, EVERY LINE IS DEEPER THAN THE `mod`
                # KEYWORD OR IT IS BLANK. A line at the module indent or
                # shallower that is NOT the closing brace means the brace this
                # scanner is waiting for is not the one that closes the module,
                # and matching a later brace at the same indent would swallow
                # whatever lies between them -- silently, which is the whole
                # defect this boundary replaced. Refuse instead.
                #
                # Blank lines and whole-line comments are exempt, and that
                # costs nothing: neither can hide a construct, and the first
                # line of actual code past the module still trips the check.
                lead = $0; sub(/[^ \t].*$/, "", lead)
                t = $0; sub(/^[ \t]+/, "", t)
                if (t != "" && t !~ /^\/\// && length(lead) <= length(IND)) exit 3
                next
              }
              t = $0; sub(/^[ \t]+/, "", t)
              if (st == 0) {
                if (t ~ /^#\[cfg\(test\)\][ \t]*$/) { st = 1; depth = 0; nb = 0; hold($0, NR); next }
                emit($0, NR); next
              }
              if (depth > 0) { depth += gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if (t == "" || t ~ /^\/\//) { hold($0, NR); next }
              if (t ~ /^#\[/) { depth = gsub(/\[/, "[") - gsub(/\]/, "]"); hold($0, NR); next }
              if ($0 ~ /^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?mod[ \t]+[A-Za-z0-9_]+[ \t]*\{[ \t]*$/) {
                IND = $0; sub(/[^ \t].*$/, "", IND)
                CLOSE = "^" IND "\\}[ \t]*$"
                drop += nb + 1; nb = 0; st = 2; next
              }
              flush(); emit($0, NR); st = 0
            }
            # A module still open at EOF, or an attribute with no item under
            # it, is the same refusal for the same reason: this scanner will
            # not guess where test code ends.
            END { print drop > SUM; if (st != 0) exit 3 }
          '

          walked=0; kept=0; dropped=0; undelimited=0
          # A WHOLE-FILE TEST MODULE IS NOT ON ANY PATH.
          #
          # The stripper below removes `#[cfg(test)] mod NAME { .. }` blocks
          # written INSIDE a file. It cannot see the other shape: a module whose
          # entire file is test code, gated by `#[cfg(test)]` on its `mod` line
          # in the crate root. store/src/emits.rs, pull/src/emit_sites.rs and
          # api/src/emitted.rs are that shape -- each proves that every
          # `telemetry::emit` site in its crate reaches a file -- and they are
          # compiled out of every non-test build, so their `expect`s are no more
          # a panic on an O(1) path than the ones under `tests/` this gate has
          # always skipped.
          #
          # Decided by reading the CRATE ROOT, never the file's own name and
          # never its own contents: a file must not be able to exempt itself.
          # `grep -A 1` means the attribute has to sit immediately above the
          # declaration to count.
          #
          # A FUNCTION, and not an inline filter, because bash's process
          # substitution parser fails on `#` comments inside `<( ... )` --
          # "bad substitution: no closing `)'". The reasoning has to live
          # somewhere it can be read, so it lives here.
          whole_file_test_module() {
            stem="${1##*/}"; stem="${stem%.rs}"
            root="${1%/src/*}/src/lib.rs"
            [ -f "$root" ] \
              && grep -A 1 '^#\[cfg(test)\]$' "$root" \
                 | grep -Eq "^(pub(\([a-z]+\))? )?mod ${stem};$"
          }


          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            # `wc -l` COUNTS NEWLINES, NOT LINES, so a file whose last line is
            # unterminated is reported one short — and a one-line file reports
            # ZERO, which set `end=0` and skipped the file entirely. Caught by
            # feeding this gate a one-line violation with no trailing newline:
            # it exited 0. `cargo fmt` would reject such a file, but gate 6a
            # lives in a later job that this one gates, so relying on it would
            # make gate 11 blind exactly while it runs first.
            tot=$(awk 'END{print NR}' "$f")
            # Pre-created, because a file that is nothing but a test module
            # produces neither, and `set -e` would kill the gate on the `cat`.
            : > "$work/one.scope"; : > "$work/one.sum"
            # NOTHING IS APPENDED UNTIL THE FILE PARSES. A partial corpus from
            # a file the scanner could not delimit would be a scan that quietly
            # covered less than it reported — the exact defect this boundary
            # replaced.
            if awk -v F="$f" -v SCOPE="$work/one.scope" -v SUM="$work/one.sum" \
                   "$strip" "$f" > "$work/one.corpus"; then
              cat "$work/one.corpus" >> "$corpus"
              cat "$work/one.scope" >> "$scope"
              d=$(cat "$work/one.sum")
              dropped=$((dropped + d)); kept=$((kept + tot - d))
            else
              printf 'UNDELIMITED TEST MODULE  %s\n' "$f"
              undelimited=$((undelimited + 1))
            fi
          done < <(git ls-files 'crates/*.rs' \
                   | grep '/src/' | grep -vE '/(tests|benches)/' \
                   | while IFS= read -r cand; do
                       whole_file_test_module "$cand" || printf %s\\n "$cand"
                     done || true)

          # A gate must say what it walked. A glob that matches nothing is the
          # failure mode gate 8 shipped with for the whole life of the
          # repository, and it reported success the entire time.
          echo "walked ${walked} non-test source file(s) under crates/*/src/"
          echo "  ${kept} line(s) in scope, ${dropped} inside a #[cfg(test)] module"
          echo "  $(awk 'END{print NR}' "$corpus") line(s) after comment stripping"
          if [ "$walked" -eq 0 ]; then
            echo "GATE 11 WALKED NOTHING. A gate that scans no file is not a gate."
            exit 1
          fi
          if [ "$undelimited" -ne 0 ]; then
            echo
            echo 'A #[cfg(test)] module above has no closing brace at the same'
            echo 'indent as its own `mod` keyword, so this scanner cannot tell'
            echo 'where it ends and will not guess. `cargo fmt` does not emit'
            echo 'that shape; if it is deliberate, the boundary above is what'
            echo 'has to change, not this message.'
            exit 1
          fi

          bad=0

          check() {
            rule="$1"; pattern="$2"; allow="$3"; law="$4"; src="${5:-$corpus}"
            hits=$( { grep -E "$pattern" "$src" || true; } )
            n=$( { printf '%s' "$hits" | grep -c . || true; } | tr -d ' ')
            echo
            echo "rule ${rule}: ${n} occurrence(s) — ${law}"
            for f in $( { printf '%s\n' "$hits" | grep . | cut -d: -f1 | sort -u; } || true ); do
              c=$( { printf '%s\n' "$hits" | grep -c "^${f}:" || true; } | tr -d ' ')
              a=$( { printf '%s\n' "$allow" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
              [ -n "$a" ] || a=0
              if [ "$c" -gt "$a" ]; then
                printf '  REFUSED  %s — %s occurrence(s), %s allowed\n' "$f" "$c" "$a"
                { printf '%s\n' "$hits" | grep "^${f}:" \
                    | awk -F: '{printf "           %s:%s\n", $1, $2}' | head -8; } || true
                bad=1
              else
                printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
              fi
            done
            # An entry naming a file that no longer exists makes this gate read
            # stronger than it is, so it is a failure and not a note. An entry
            # whose file no longer matches is only loose, and says so.
            for p in $( { printf '%s\n' "$allow" | awk 'NF{print $1}'; } || true ); do
              if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
                bad=1
              elif ! printf '%s\n' "$hits" | grep -q "^${p}:"; then
                printf '  ::warning title=Gate 11 allowlist is loose::'
                printf '%s no longer matches rule %s — tighten it\n' "$p" "$rule"
              fi
            done
            :
          }

          check 1 '\.(binary_search|partition_point)' \
                "$allow_search" \
                'docs/07 layer 4 — never binary_search'

          check 2 '\b(f32|f64)\b' \
                "$allow_float" \
                'CLAUDE.md section 7 — prices are paisa i64 and never a float; statistics keep full precision'

          check 3 '\b(HashMap|HashSet)::(new\(\)|default\(\)|with_capacity\(0\))' \
                "$allow_unsized" \
                'docs/07 law 2 — pre-size every map'

          check 4 '\.sort(_[a-z_]+)?\(|select_nth_unstable|BinaryHeap|collect::<BTree(Set|Map)' \
                "$allow_sort" \
                'docs/07 layer 12 — bounded page, never O(universe)'

          check 5 '(^|[^A-Za-z0-9_])(panic!|todo!|unimplemented!|unreachable!)|\.unwrap\(\)|\.expect\(' \
                "$allow_panic" \
                'CLAUDE.md section 4 — degrade loudly or refuse, never die'

          # Rule 5's construct is ALREADY denied by clippy at the workspace
          # root, and gate 6b runs clippy with -D warnings — so the grep above
          # is expected to find nothing, and finding nothing is not evidence
          # this gate works. What clippy cannot defend is clippy: the lint
          # table is an ordinary tracked file, and deleting one line from it
          # silently disarms the deny across the whole workspace with every
          # other gate still green. These two steps guard the guard.
          echo
          echo "rule 5b: the lint table that denies rule 5 workspace-wide"
          for lint in unwrap_used expect_used panic todo unimplemented; do
            if ! grep -qE "^${lint}[[:space:]]*=[[:space:]]*\"deny\"" Cargo.toml; then
              printf '  REFUSED  Cargo.toml no longer denies clippy::%s\n' "$lint"
              bad=1
            else
              printf '  present  clippy::%s = deny\n' "$lint"
            fi
          done

          # And the second way to disarm it: a local allow. In a test module
          # that is legitimate and this gate never looks there; in shipping
          # code it is a panic nobody can see from the lint table.
          #
          # THE PATTERN USED TO BE `allow\([^)]*clippy::…` ON ONE LINE, AND IT
          # REPORTED "none" WHILE crates/pull/src/ssm.rs DISARMED expect_used.
          # `[^)]*` cannot cross a newline, so every multi-line attribute — the
          # shape `cargo fmt` produces the moment an attribute carries a
          # `reason =` — was invisible, and a rule that prints "none" while a
          # thing exists is worse than one that does not run. It is a bracket
          # walk over `scope` now: from a line beginning `#[allow(` or
          # `#[expect(`, count `[` against `]` until the attribute closes, and
          # test the whole joined attribute for the five lint names. `#[expect]`
          # is included because it disarms exactly as `#[allow]` does.
          #
          # Read over `scope` and not `corpus`, because an attribute list may
          # carry a `//` comment inside it — crates/costs/src/trip.rs does —
          # and a bracket count over comment-stripped text loses its place.
          awk -F: '
            {
              p = $1; n = $2; t = $0
              sub("^" p ":" n ":", "", t); sub(/^[ \t]+/, "", t)
              if (d <= 0) {
                if (t !~ /^#\[(allow|expect)\(/) next
                acc = t; sp = p; sn = n; d = gsub(/\[/, "[", t) - gsub(/\]/, "]", t)
              } else {
                acc = acc " " t; d += gsub(/\[/, "[", t) - gsub(/\]/, "]", t)
              }
              if (d <= 0 && acc ~ /clippy::(unwrap_used|expect_used|panic|todo|unimplemented)/) {
                print sp ":" sn ":" acc
              }
            }
          ' "$scope" > "$work/disarm"
          check 5c 'clippy::' \
                "$allow_disarm" \
                'CLAUDE.md section 4 — a local allow is a panic the lint table cannot show' \
                "$work/disarm"

          # The old inline form printed "none" and nothing else. Kept, because
          # a rule whose healthy state prints one word is a rule a reader can
          # confirm at a glance.
          if [ ! -s "$work/disarm" ]; then
            echo "  none"
          fi

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 11 FAILED."
            echo
            echo "Either the construct goes, or its file earns a line in the"
            echo "allowlist above WITH the reason it is bounded. A count is"
            echo "raised only by someone who can say why. See CLAUDE.md"
            echo "section 3 rule 4 and docs/07-o1-architecture.md."
            exit 1
          fi
          echo "OK — no banned construct outside the allowlist."

      - name: Gate 12 — every O(1) claim names the test that proves it
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. The audit that produced this gate found FIVE
          # documented claims that the code did not have: a coverage row
          # asserting 100% while the step exited 1, an "authoritative encoder"
          # nothing called, an append documented "O(1) worst case" that spiked
          # to 2.4 ms on a census sitting at 7·2^k, a render documented "never
          # O(universe)" that was exactly that, and seven invariant rows naming
          # tests that existed in no file. Every one of them was A COMMENT
          # ASSERTING A PROPERTY THE CODE DID NOT HAVE, and nothing in CI could
          # see any of them. Gate 8 measures a bound that already broke on a
          # path someone thought to bench. Gate 11 refuses a construct by its
          # spelling. Neither reads what the author CLAIMED.
          #
          # THE RULE. A doc block under crates/ that makes a cost claim must,
          # inside that same block, either name its proof or say UNVERIFIED.
          # UNVERIFIED exists so that an honest admission is always CHEAPER
          # than a false claim -- if it were not, the false claim is what gets
          # written. That is the same reason docs/06-limits.md exists.
          #
          # WHAT COUNTS AS NAMING THE PROOF, in the order it is tried:
          #   1. `crate::module::name` that resolves to an `fn name` under
          #      crates/<crate>/. Gate 10's technique, with gate 10's fix: the
          #      crate segment is CHECKED, not thrown away, so a same-named
          #      function in another crate does not satisfy the claim.
          #   2. A tracked `crates/**/tests/*.rs` or `crates/**/benches/*.rs`
          #      path. This is the form the benches already use.
          #   3. An invariant row id -- `C-12`, `M-17`, `S-11` -- that EXISTS
          #      in docs/04-invariants.md AND whose own "Proven by" cell names
          #      a test that resolves by rule 1. This is the form the code
          #      already writes, and it chains: a row gate 10 would refuse
          #      cannot launder a claim through this gate either.
          # A src path is NOT proof. Naming the file the claim is written in
          # proves nothing, and that is the whole defect class.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # docs/04-invariants.md and the static patterns below -- the
          # discipline gate 1c states. Nothing from the event payload is
          # expanded.
          #
          # WHAT IT CANNOT SEE, said plainly:
          #   * Whether the claim is TRUE. It checks that a proof is named and
          #     that the named thing exists. A test can be named that does not
          #     test the claim, and this gate will believe it. It converts an
          #     unfalsifiable comment into a falsifiable one; it does not
          #     falsify it.
          #   * A claim in an ordinary `//` comment, or in a string, or in a
          #     `/* */` block. Only `///` and `//!` runs are blocks here.
          #   * A NEGATIVE claim. "It is O(log n) wearing an O(1) label, and it
          #     is not constant" is the most honest sentence in this repository
          #     and this gate refuses it, because no text rule separates "is
          #     O(1)" from "is not O(1)" without being gamed by the second
          #     spelling of the first. The escape is the allowlist below, and
          #     the cheaper fix is to name the test that proves the bound the
          #     code DOES have.
          #   * `flat` is an ordinary English word. A short, explicit list of
          #     nouns is excluded from the trigger -- a flat struct, a flat
          #     table, a flat bar are not cost claims. That list is in this
          #     file, so widening it is a visible diff. It is a heuristic and
          #     it will be wrong in both directions eventually.
          #   * Macro-generated docs, and anything untracked: the input is
          #     `git ls-files`, so a local run and CI disagree until `git add`.
          #
          # THE ESCAPE HATCH IS HERE, NEVER IN THE CODE. `path max_blocks`,
          # gate 1d's and gate 11's mechanism. IT IS DELIBERATELY EMPTY. Every
          # unproven claim on the tree today is reported by name in the log,
          # and pinning them here on the way in would have converted twelve
          # findings into one line nobody reads.
          allow_claim='
          '

          inv=docs/04-invariants.md
          work=$(mktemp -d)

          # (crate, fn) for every tracked crate, built once. A fixed-string
          # lookup afterwards, so `store::proptest::roundtrip` is not satisfied
          # by an `fn roundtrip` in crates/api.
          fns="$work/fns"; : > "$fns"
          for c in $(git ls-files 'crates/*/Cargo.toml' \
                     | sed 's|^crates/||; s|/Cargo.toml$||'); do
            { git ls-files "crates/$c/*.rs" \
              | xargs -r grep -ohE '\bfn [a-z_][a-z_0-9]*' \
              | sed "s|^fn |${c} |" >> "$fns"; } || true
          done
          sort -u -o "$fns" "$fns"

          # A block is a maximal run of consecutive `///` or `//!` lines. Any
          # other line ends it. One tab-separated record per block, so the
          # whole block can be searched as one string -- "within its own doc
          # block" is the unit the rule is stated in.
          blocks="$work/blocks"; : > "$blocks"
          walked=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            awk -v F="$f" '
              function flush() {
                if (n > 0) printf "%s\t%d\t%s\n", F, start, text
                n = 0; text = ""
              }
              { l = $0; sub(/^[ \t]+/, "", l); gsub(/\t/, " ", l)
                if (l ~ /^\/\/[\/!]/) {
                  sub(/^\/\/[\/!]/, "", l)
                  if (n == 0) start = NR
                  n++; text = text " " l
                } else flush() }
              END { flush() }
            ' "$f" >> "$blocks"
          done < <(git ls-files 'crates/*.rs')

          nb=$(awk 'END{print NR}' "$blocks")
          echo "walked ${walked} tracked .rs file(s) under crates/"
          echo "  $(awk 'END{print NR}' "$fns") (crate, fn) pair(s) to resolve against"
          echo "  ${nb} doc block(s)"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$walked" -eq 0 ] || [ "$nb" -eq 0 ]; then
            echo "GATE 12 WALKED NOTHING. A gate that reads no doc block is not a gate."
            exit 1
          fi

          trigger='[Oo]\(1\)|constant[ -]time|never scans?|worst[ -]case|\bflat\b'
          notclaim='(struct|table|bar|file|field|list|array|layout|namespace|case|month|day|session|price|close)s?'

          refused="$work/refused"; : > "$refused"
          claimed=0; by_test=0; by_path=0; by_row=0; by_unverified=0

          # Echoes the KIND of proof found, or nothing. Always returns 0: a
          # bare `[ ... ] && break` as the last command of a loop makes the
          # enclosing `if` exit 1, and under `set -e` that kills the gate on
          # the ordinary path. Gate 5 records the same class of bug.
          prove() {
            text="$1"
            for t in $( { printf '%s' "$text" \
                          | grep -oE '\b[a-z_]+::[a-z_]+::[a-z_0-9]+\b' || true; } ); do
              if grep -qxF "${t%%::*} ${t##*::}" "$fns"; then echo test; return 0; fi
            done
            for p in $( { printf '%s' "$text" \
                          | grep -oE 'crates/[A-Za-z0-9_./-]*/(tests|benches)/[A-Za-z0-9_.-]+\.rs' \
                          || true; } ); do
              if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then echo path; return 0; fi
            done
            for r in $( { printf '%s' "$text" | grep -oE '\b[A-Z]-[0-9][0-9]\b' || true; } ); do
              row=$( { grep -E "^\| *${r} *\|" "$inv" || true; } | head -1)
              [ -n "$row" ] || continue
              for t in $( { printf '%s' "$row" \
                            | grep -oE '`[a-z_]+::[a-z_]+::[a-z_0-9]+`' | tr -d '`' || true; } ); do
                if grep -qxF "${t%%::*} ${t##*::}" "$fns"; then echo row; return 0; fi
              done
            done
            return 0
          }

          tab=$(printf '\t')
          while IFS="$tab" read -r f ln text; do
            [ -n "${text-}" ] || continue
            # `flat` is stripped of its non-cost senses BEFORE the trigger runs,
            # so the exclusion cannot accidentally swallow a real claim in the
            # same block -- only the words it names.
            scrub=$(printf '%s' "$text" | sed -E "s/[Ff]lat +${notclaim}//g")
            printf '%s' "$scrub" | grep -qE "$trigger" || continue
            claimed=$((claimed + 1))
            if printf '%s' "$text" | grep -q 'UNVERIFIED'; then
              by_unverified=$((by_unverified + 1))
              continue
            fi
            case "$(prove "$text")" in
              test) by_test=$((by_test + 1)) ;;
              path) by_path=$((by_path + 1)) ;;
              row)  by_row=$((by_row + 1)) ;;
              *)    printf '%s:%s\n' "$f" "$ln" >> "$refused" ;;
            esac
          done < "$blocks"

          echo "  ${claimed} block(s) make a cost claim"
          echo "    ${by_test} name a test that exists"
          echo "    ${by_row} name an invariant row whose test exists"
          echo "    ${by_path} name a tracked test or bench file"
          echo "    ${by_unverified} say UNVERIFIED"
          echo "    $(awk 'END{print NR}' "$refused") name nothing"
          if [ "$claimed" -eq 0 ]; then
            echo
            echo "GATE 12 FOUND NO CLAIM AT ALL in ${nb} doc blocks. Either every"
            echo "comment stopped saying O(1) in the same commit, or the trigger"
            echo "stopped matching. Both need a human; a silent zero does not."
            exit 1
          fi

          bad=0
          echo
          for f in $( { cut -d: -f1 "$refused" | sort -u; } ); do
            c=$( { grep -c "^${f}:" "$refused" || true; } | tr -d ' ')
            a=$( { printf '%s\n' "$allow_claim" | awk -v F="$f" '$1==F{print $2; exit}'; } || true)
            [ -n "$a" ] || a=0
            if [ "$c" -gt "$a" ]; then
              printf '  REFUSED  %s — %s unproven claim(s), %s allowed\n' "$f" "$c" "$a"
              { grep "^${f}:" "$refused" | sed 's/^/             doc block at /' | head -8; } || true
              bad=1
            else
              printf '  allowed  %s — %s of %s\n' "$f" "$c" "$a"
            fi
          done
          # Same two self-audits gate 11 carries. An entry naming a file that
          # is gone makes this gate read stronger than it is, so it is a
          # failure; an entry that no longer matches is only loose, and says so.
          for p in $( { printf '%s\n' "$allow_claim" | awk 'NF{print $1}'; } ); do
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              printf '  STALE ALLOWLIST ENTRY — %s is not a tracked file\n' "$p"
              bad=1
            elif ! grep -q "^${p}:" "$refused"; then
              printf '  ::warning title=Gate 12 allowlist is loose::'
              printf '%s claims nothing unproven any more — drop the entry\n' "$p"
            fi
          done

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 12 FAILED."
            echo
            echo 'A cost claim with no proof beside it is the defect this gate'
            echo 'was written for. Name the test — crate::module::name, an'
            echo 'invariant row id, or the bench file — or write UNVERIFIED and'
            echo 'record it in docs/06-limits.md. CLAUDE.md section 3 rule 6.'
            exit 1
          fi
          echo "OK — every cost claim names its proof or says UNVERIFIED."

      - name: Gate 14 — every crate that claims a bound re-measures it
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. Gate 8 runs `cargo bench --workspace --locked` and
          # fails when NO crate carries a bench. That is a floor, not coverage:
          # three benched crates and a fourth with none satisfy it exactly as
          # well as four benched crates do. The audit that produced this gate
          # found two bounds that had ALREADY regressed with every gate green,
          # and both were green for the same reason — nothing measured them:
          #   * crates/pull, manifest append. 43 us at 1k entries, 2.40 ms at
          #     50k. A map reserved to exactly its load, so the next insert
          #     rehashed the whole table. NO BENCH EXISTED for that path.
          #   * crates/api, page render. 3.6 ms to 124.9 ms for the SAME 200
          #     rows, because the render sorted the whole universe per request.
          #     NO BENCH EXISTED for that path either.
          # Both crates sat inside `cargo bench --workspace`'s reach the whole
          # time. Gate 8 measures what somebody thought to write a bench for.
          # A bound with no bench is a bound that will regress, and the
          # regression stays invisible until a user is slow.
          #
          # WHY THE MAPPING IS A TABLE AND NOT AN INFERENCE. The obvious
          # implementation is "this crate has a benches/ directory and this
          # crate makes claims, therefore the claims are benched". That is a
          # GUESSING GATE: it would have passed crates/pull on the day the
          # manifest append regressed, because crates/pull did carry a bench —
          # of a different operation. A guessing gate manufactures confidence
          # rather than evidence, which is worse than no gate, because the
          # confidence is what stops anyone looking. The table below is DATA.
          # Somebody wrote down which bench they believe covers which crate and
          # which measurements it makes. A new crate that claims a bound is a
          # RED BUILD until a row is added, and that row is a visible diff on
          # this file naming a human's belief that can be argued with.
          #
          # WHAT COUNTS AS A CLAIM: gate 12's trigger, character for character,
          # ON PURPOSE. Two gates with two definitions of "a cost claim" is a
          # hole between them — gate 12 would accept a claim proved by a unit
          # test that this gate never demands a bench for, and nothing would
          # show the difference. Gate 12 asks whether a claim NAMES a proof.
          # This gate asks whether the crate RE-MEASURES it. Same demand, two
          # halves; they must be triggered by the same words or neither is
          # complete.
          #
          # SCOPE. Tracked `crates/*/src/**.rs` only, which is gate 11's scope.
          # A cost claim inside a bench or a test is the measurement describing
          # itself, not a promise about shipping code.
          #
          # NO UNTRUSTED INPUT REACHES THIS STEP. The inputs are `git ls-files`,
          # the tracked manifests, docs/04-invariants.md and the static table
          # below — gate 1c's discipline. Nothing from the event payload is
          # expanded.
          #
          # WHAT IT CANNOT SEE, said plainly because a gate that oversells
          # itself is worse than no gate:
          #   * WHETHER THE BENCH MEASURES THE OPERATION THE CLAIM IS ABOUT.
          #     This is the big one. The gate proves a crate re-measures
          #     SOMETHING at more than one magnitude against a ceiling, and
          #     that the invariant rows the table names are really printed by
          #     that bench. A crate can bench its cheapest path and claim its
          #     most expensive one and this gate will believe it. The `rows`
          #     column is the reviewable part and it is only as complete as the
          #     person who wrote it.
          #   * WHETHER THE CEILING IS HONEST. 3.0x is the shared-CI figure in
          #     docs/04-invariants.md. A bench that declared a 1000x ceiling
          #     would satisfy every check here and measure nothing useful. The
          #     value is not read; only that a named ceiling exists and is
          #     compared against.
          #   * GRANULARITY IS THE CRATE. Ten claimed operations and one
          #     benched operation passes layer 1. Layer 4 is the per-operation
          #     half and it checks the rows the table ASSERTS, not the rows the
          #     claims would need.
          #   * IT RUNS NOTHING. This is a text scan in the no-toolchain job so
          #     that it fails in seconds. Gate 8 is the step that actually
          #     executes the numbers; this gate proves the numbers exist to be
          #     executed, and layer 5 proves gate 8 still executes them.
          #   * `git ls-files` means anything UNTRACKED is invisible — right
          #     for CI, where the checkout holds only tracked files, and a
          #     reason a local run disagrees with CI until `git add`.

          # ---- THE COVERAGE TABLE. `crate bench_path min_points rows...` -----
          # crate       the directory under crates/ whose claims are covered
          # bench_path  the tracked bench that covers them
          # min_points  how many ratio measurements that bench must contain —
          #             CALL SITES of the reporting helper, with its own `fn
          #             ratio(` definition line excluded, so the number means
          #             the number of small-to-large comparisons and not one
          #             more than that. PINNED AT WHAT THE BENCH CARRIES TODAY
          #             at HEAD. It is a floor, not an equality: adding a
          #             measurement stays green, DELETING one is a red build.
          #             That is gate 11's mechanism applied to the measurements
          #             themselves — the quiet way to disarm a bench is to keep
          #             the file and remove the numbers.
          # rows        the docs/04-invariants.md row ids the bench prints.
          #             Each is checked to be a real row in that file AND to
          #             appear in the bench, so a row id cannot be invented
          #             here to pad the table.
          #
          # crates/api WAS DELIBERATELY ABSENT AND THIS GATE WAS RED BECAUSE OF
          # IT. api makes cost claims in catalog.rs, census.rs, merge.rs and
          # render.rs, and no bench for it was tracked — render is one of the
          # two operations this gate was written about. The row below was added
          # only after `crates/api/benches/ratio.rs` was tracked and read: it
          # builds three universes of 2, 2,787 and 50,000 instruments, renders
          # the real `instruments_html_from` and `dashboard_html` at each, and
          # asserts three separate ceilings — the 2,787→50,000 ratio at a fixed
          # 200 drawn rows, the marginal picoseconds per instrument (the audit's
          # own 62,500 ps/instrument defect measured directly), and cost PER
          # RENDERED ROW so flatness cannot be bought by drawing less. Adding
          # the row before the bench existed would have made the gate green over
          # nothing, which is the failure gate 8 shipped with.
          #
          # crates/costs likewise. `crates/costs/benches/ratio.rs` measures the
          # regime lookup at the anchor row against the last row and on a
          # two-row table against a three-row one, the option arithmetic at a
          # near strike against a far one and at one lot against a million, and
          # the round trip at both magnitudes — each against CEILING_PERMILLE.
          # Its twelve row ids are `C-K-01` … `C-K-12`, NOT `K-01` … `K-12`:
          # both families are real rows in docs/04-invariants.md, the `K-*`
          # family is the crate's correctness rows, and layer 4's substring
          # match would have accepted the wrong one. D-0045 renumbered these
          # ids precisely so this row could be added and mean something.
          #
          # min_points are pinned at what each bench carries at the commit that
          # added its row — api 4, costs 27, counted with layer 3's own awk.
          cover='
          core   crates/core/benches/ratio.rs   3  C-09 C-10
          pull   crates/pull/benches/ratio.rs   4  C-11 C-12
          store  crates/store/benches/ratio.rs  4  C-01 C-07 C-08
          api    crates/api/benches/ratio.rs    4  C-14 C-15 C-16 C-17
          costs  crates/costs/benches/ratio.rs  27 C-K-01 C-K-02 C-K-03 C-K-04 C-K-05 C-K-06 C-K-07 C-K-08 C-K-09 C-K-10 C-K-11 C-K-12
          lake      crates/lake/benches/ratio.rs      6  C-L-01 C-L-02 C-L-03
          telemetry crates/telemetry/benches/ratio.rs 6  C-T-01 C-T-02 C-T-03
          greeks    crates/greeks/benches/ratio.rs    6  C-G-01 C-G-02 C-G-03
          vocab     crates/vocab/benches/ratio.rs     7  C-V-01 C-V-02 C-V-03 C-V-04
          indicators crates/indicators/benches/ratio.rs 5  C-I-01 C-I-02 C-I-03 C-I-04
          engine    crates/engine/benches/ratio.rs    4  C-E-01 C-E-02 C-E-03 C-E-04
          '

          inv=docs/04-invariants.md
          wf=.github/workflows/ci.yml
          work=$(mktemp -d)
          bad=0

          # ---- discovery: which crates claim a bound. -----------------------
          # Gate 12's block scanner and gate 12's trigger. A block is a maximal
          # run of `///` or `//!` lines; any other line ends it. Records are
          # TAB separated and read back on tabs, so a path containing a space
          # is attributed to the right file — gates 11, 12 and 13 all
          # word-split their paths and gate 15 was fixed for it; this gate is
          # written the fixed way from the start.
          tab=$(printf '\t')
          blocks="$work/blocks"; : > "$blocks"
          walked=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            walked=$((walked + 1))
            awk -v F="$f" '
              function flush() {
                if (n > 0) printf "%s\t%d\t%s\n", F, start, text
                n = 0; text = ""
              }
              { l = $0; sub(/^[ \t]+/, "", l); gsub(/\t/, " ", l)
                if (l ~ /^\/\/[\/!]/) {
                  sub(/^\/\/[\/!]/, "", l)
                  if (n == 0) start = NR
                  n++; text = text " " l
                } else flush() }
              END { flush() }
            ' "$f" >> "$blocks"
          done < <(git ls-files 'crates/*.rs' \
                   | grep '/src/' | grep -vE '/(tests|benches)/' || true)

          trigger='[Oo]\(1\)|constant[ -]time|never scans?|worst[ -]case|\bflat\b'
          notclaim='(struct|table|bar|file|field|list|array|layout|namespace|case|month|day|session|price|close)s?'

          claims="$work/claims"; : > "$claims"
          while IFS="$tab" read -r f ln text; do
            [ -n "${text-}" ] || continue
            scrub=$(printf '%s' "$text" | sed -E "s/[Ff]lat +${notclaim}//g")
            printf '%s' "$scrub" | grep -qE "$trigger" || continue
            printf '%s\t%s\t%s\n' "$(printf '%s' "$f" | cut -d/ -f2)" "$f" "$ln" \
              >> "$claims"
          done < "$blocks"

          nc=$(awk 'END{print NR}' "$claims")
          nb=$(awk 'END{print NR}' "$blocks")
          ncr=$(git ls-files 'crates/*/Cargo.toml' | awk 'END{print NR}')
          echo "walked ${walked} tracked source file(s) under crates/*/src/"
          echo "  ${nb} doc block(s), ${nc} of them make a cost claim"
          echo "  ${ncr} tracked crate manifest(s)"
          echo "  $( { printf '%s\n' "$cover" | awk 'NF{n++} END{print n+0}'; } ) row(s) in the coverage table"
          # A glob that matches nothing is the failure mode gate 8 shipped with
          # for the whole life of the repository, reporting success throughout.
          if [ "$walked" -eq 0 ] || [ "$ncr" -eq 0 ]; then
            echo "GATE 14 WALKED NOTHING. A gate that reads no source file and"
            echo "no manifest is not a gate."
            exit 1
          fi
          if [ "$nc" -eq 0 ]; then
            echo "GATE 14 FOUND NO COST CLAIM AT ALL in ${nb} doc blocks. Either"
            echo "every crate stopped claiming a bound in the same commit, or"
            echo "the trigger stopped matching gate 12's. Both need a human."
            exit 1
          fi

          # ---- layer 1: every claiming crate has a row. ---------------------
          echo
          echo "layer 1: a crate that claims a bound is named in the table"
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            n=$( { grep -c "^${c}${tab}" "$claims" || true; } | tr -d ' ')
            row=$( { printf '%s\n' "$cover" | awk -v C="$c" '$1==C{print; exit}'; } || true)
            if [ -z "$row" ]; then
              printf '  REFUSED  crates/%s — %s cost claim(s), no row in the table\n' "$c" "$n"
              { grep "^${c}${tab}" "$claims" \
                  | awk -F'\t' '{printf "             doc block at %s:%s\n", $2, $3}' \
                  | head -8; } || true
              bad=1
            else
              printf '  covered  crates/%s — %s cost claim(s)\n' "$c" "$n"
            fi
          done < <(cut -f1 "$claims" | sort -u)

          # ---- layers 2, 3 and 4, one table row at a time. ------------------
          echo
          echo "layer 2: the named bench is tracked and its exit code reaches cargo"
          echo "layer 3: it has the shape of a ratio measurement"
          echo "layer 4: the invariant rows it claims to print are real and present"
          nrow=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            nrow=$((nrow + 1))
            c=$(printf '%s\n' "$line" | awk '{print $1}')
            b=$(printf '%s\n' "$line" | awk '{print $2}')
            pts=$(printf '%s\n' "$line" | awk '{print $3}')
            rows=$(printf '%s\n' "$line" | awk '{for (i = 4; i <= NF; i++) printf "%s ", $i}')
            m="crates/${c}/Cargo.toml"

            # A row naming a crate or a bench that is not tracked makes this
            # gate read stronger than it is, so it is a FAILURE and not a note.
            if ! git ls-files --error-unmatch "$m" >/dev/null 2>&1; then
              printf '  STALE TABLE ROW — crates/%s has no tracked manifest\n' "$c"
              bad=1
              continue
            fi
            if ! git ls-files --error-unmatch "$b" >/dev/null 2>&1; then
              printf '  REFUSED  %s is not tracked — the row promises a bench that\n' "$b"
              printf '           does not exist in this checkout\n'
              bad=1
              continue
            fi
            # A row for a crate that no longer claims anything is only loose.
            if ! grep -q "^${c}${tab}" "$claims"; then
              printf '  ::warning title=Gate 14 table row is loose::'
              printf 'crates/%s claims no bound any more — drop the row\n' "$c"
            fi

            # layer 2b. `harness = false` IS LOAD-BEARING, not decoration.
            # Cargo auto-discovers benches/*.rs with harness = TRUE, which
            # links libtest, which supplies its own `main` — and the bench's
            # own exit(1) on a breached ratio never reaches cargo. The
            # assertion would still be written, still be compiled, and still
            # be unable to fail the build. The bench NAME is checked against
            # the file stem for the same reason: a [[bench]] table that names
            # a different file leaves this one running under the default.
            stem=$(printf '%s\n' "${b##*/}" | sed 's/\.rs$//')
            decl=$(awk '
              /^\[\[bench\]\]/ { inb = 1; nm = ""; hz = ""; next }
              /^\[/            { if (inb) { print nm " " hz; inb = 0 } }
              inb {
                if ($0 ~ /^[[:space:]]*name[[:space:]]*=/) {
                  nm = $0; sub(/.*=[[:space:]]*"/, "", nm); sub(/".*/, "", nm)
                }
                if ($0 ~ /^[[:space:]]*harness[[:space:]]*=/) {
                  hz = $0; sub(/.*=[[:space:]]*/, "", hz); sub(/[[:space:]#].*/, "", hz)
                }
              }
              END { if (inb) print nm " " hz }
            ' "$m")
            if printf '%s\n' "$decl" | grep -qxF "${stem} false"; then
              printf '  ok       %s — [[bench]] %s, harness = false\n' "$b" "$stem"
            else
              printf '  REFUSED  %s — %s declares no [[bench]] named %s with\n' "$b" "$m" "$stem"
              printf '           harness = false. Under the default harness the\n'
              printf '           bench cannot fail the build at all.\n'
              bad=1
            fi

            # layer 3. THE SHAPE, not the truth. Each of these refuses the
            # cheapest way to satisfy the table — a file called ratio.rs
            # containing `fn main() {}`. None of them proves the measurement
            # is correct, and the comment at the top says so.
            #   CEILING     a named ceiling exists AND is referenced again,
            #               so it is compared and not merely declared
            #   ratio(      how many measurement points, against min_points.
            #               The helper's own definition line is subtracted, so
            #               a file that only DEFINES `fn ratio` and calls it
            #               nowhere counts zero rather than one.
            #   Instant     something is actually timed
            #   black_box   the timed work cannot be optimised away
            #   println!    the numbers are printed, not just judged — the
            #               mask-evaluation bench's rule, so a human reads the
            #               shape rather than only the verdict
            #   exit        a breach leaves a non-zero status
            npt=$(awk '/ratio\(/ && !/fn[ \t]+ratio\(/ { n++ } END { print n+0 }' "$b")
            nce=$( { grep -c 'CEILING' "$b" || true; } | tr -d ' ')
            miss=''
            [ "$nce" -ge 2 ] || miss="${miss} a-named-ceiling-compared-against"
            [ "$npt" -ge "$pts" ] || miss="${miss} ${npt}-of-${pts}-measurement-points"
            grep -q 'Instant' "$b"      || miss="${miss} nothing-is-timed"
            grep -q 'black_box' "$b"    || miss="${miss} no-black_box"
            grep -q 'println!' "$b"     || miss="${miss} prints-nothing"
            grep -qE 'process::exit' "$b" || miss="${miss} cannot-exit-non-zero"
            if [ -z "$miss" ]; then
              printf '  ok       %s — %s point(s) >= %s, ceiling compared, prints, exits\n' \
                     "$b" "$npt" "$pts"
            else
              printf '  REFUSED  %s is not a ratio bench:%s\n' "$b" "$miss"
              bad=1
            fi

            # layer 4. The rows the table asserts. Checked BOTH ways: the id
            # is a real row in docs/04-invariants.md, and the bench really
            # prints it. Either half alone is forgeable — an id invented here,
            # or an id in the bench that names no invariant.
            for r in $rows; do
              inrow=0; inbench=0
              grep -qE "^\| *${r} *\|" "$inv" && inrow=1 || true
              grep -qF -- "$r" "$b" && inbench=1 || true
              if [ "$inrow" -eq 1 ] && [ "$inbench" -eq 1 ]; then
                printf '  ok       %s — %s is a row in %s and is printed\n' "$b" "$r" "$inv"
              else
                printf '  REFUSED  %s — %s: in-invariants=%s in-bench=%s\n' \
                       "$b" "$r" "$inrow" "$inbench"
                bad=1
              fi
            done
          done < <(printf '%s\n' "$cover" | grep -v '^[[:space:]]*$' || true)

          if [ "$nrow" -eq 0 ]; then
            echo "  THE COVERAGE TABLE IS EMPTY. Layer 1 above then passes only"
            echo "  when no crate claims a bound, and that is not this repository."
            bad=1
          fi

          # ---- layer 5: the step that RUNS them is still armed. -------------
          # This gate proves the numbers exist. Gate 8 is what executes them,
          # and gate 8 is an ordinary block of this file: deleting one line
          # turns every bench above into dead code with every other gate still
          # green. Gate 11 rule 5b guards the clippy lint table for the same
          # reason, and gate 13 layer 4 guards deny.toml.
          #
          # Both patterns are ANCHORED to a whole line, which is what stops
          # them being satisfied by the two `if grep` lines you are reading:
          # those begin with `if`, so neither anchor matches.
          echo
          echo "layer 5: gate 8 still runs what this gate counted"
          # A line's PRESENCE is not a line's EXECUTION, and this is the repair.
          # An audit confirmed by running it that a step carrying `if: false`
          # satisfies every grep below while the command never runs -- so all four
          # of these checks were decorative. Each pattern is now tested against the
          # enclosing STEP: the line must be there AND its step must be REACHABLE.
          #
          # `[ \t]` and not `[[:space:]]`, because the latter matches a newline and
          # would let a pattern span lines in the buffered step text.
          #
          # A job-level `if:` would disable this gate too, and a skipped job is
          # visible in the checks list rather than reported as a pass, so it is out
          # of scope here deliberately.
          runs_unconditionally () {
            awk -v pat="$1" '
              function finish() {
                if (buf ~ pat) {
                  found = 1
                  # Only an `if:` THAT CAN BE FALSE is refused, and getting here
                  # took two wrong rules. "No `if:` at all" refused the real
                  # workflow, because gate 3 legitimately carries
                  # `if: steps.probe.outputs.has_crates ==`. "No `if:` without a
                  # context reference" also refused it, because gate 8 carries
                  # `if: always()` -- constant TRUE, the opposite of a bypass.
                  #
                  # So the rule names the always-skip forms instead. `false` in any
                  # quoting, `0`, and `failure()`/`cancelled()` -- which run the step
                  # only when something has already gone wrong, and so skip it on
                  # every green run. Everything else, constant or not, is allowed.
                  n = split(buf, L, "\n")
                  for (i = 1; i <= n; i++) {
                    if (L[i] !~ /^[ \t]+if:[ \t]/) continue
                    e = L[i]
                    sub(/^[ \t]+if:[ \t]*/, "", e)
                    gsub(/\$\{\{|\}\}|[ \t]/, "", e)
                    e = tolower(e)
                    # The character class permits the quoting a YAML scalar may
                    # carry, without needing a quote literal inside this program.
                    if (e ~ /^[^a-z0-9]*(false|0|failure\(\)|cancelled\(\))[^a-z0-9]*$/) {
                      dead = 1
                    }
                  }
                }
                buf = ""
              }
              /^      - / { finish() }
              { buf = buf "\n" $0 }
              END { finish(); exit (found && !dead) ? 0 : 1 }
            ' "$wf"
          }
          if runs_unconditionally '(^|\n)[ \t]+cargo bench --workspace --locked[ \t]*(\n|$)'; then
            echo "  present  gate 8 invokes cargo bench --workspace --locked"
          else
            echo "  REFUSED  nothing in this workflow runs the benches. Every"
            echo "           ceiling above is then an assertion no machine makes."
            bad=1
          fi
          if runs_unconditionally '(^|\n)[ \t]*echo "GATE 8 MEASURED NOTHING'; then
            echo "  present  gate 8 still refuses an empty bench set"
          else
            echo "  REFUSED  gate 8 no longer fails when no bench exists. A skip"
            echo "           that reports success is the fallback CLAUDE.md"
            echo "           section 4 bans, and it is what gate 8 shipped with."
            bad=1
          fi

          echo
          if [ "$bad" -ne 0 ]; then
            echo "GATE 14 FAILED."
            echo
            echo "A crate that promises a constant bound and never re-measures it"
            echo "is the defect this gate was written for — the manifest append"
            echo "and the page render both regressed inside a green build. Write"
            echo "the bench, wire it with harness = false, and add its row to the"
            echo "table above. If the bound is being abandoned, say so in"
            echo "docs/05-decisions.md and delete the claim; do not delete the"
            echo "row and keep the sentence. CLAUDE.md section 3 rules 4 and 6."
            exit 1
          fi
          echo "OK — every crate that claims a bound names a bench that measures it."

  build:
    name: Gates 3-6 — fmt, clippy, deny, test
    runs-on: ubuntu-24.04
    needs: language-purity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Cargo refuses a virtual workspace with no members, so between the
      # automation commit and the first crate there is genuinely nothing to
      # compile. This probe says so out loud rather than letting a green tick
      # imply a build happened. It disarms itself permanently the moment
      # crates/core lands, and it is checked against the tracked tree, not the
      # manifest, so it cannot be satisfied by an untracked directory.
      - name: Is there a crate to build yet?
        id: probe
        run: |
          set -euo pipefail
          n=$(git ls-files 'crates/*/Cargo.toml' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "has_crates=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No crate exists yet::\
          The toolchain gates (fmt, build, clippy, deny, test) compiled NOTHING \
          on this commit because the workspace has no members. This is not a \
          passing build — it is an empty one. It stops being possible as soon \
          as crates/core is merged."
          else
            echo "has_crates=true" >> "$GITHUB_OUTPUT"
            echo "$n crate manifest(s) tracked — the toolchain gates apply."
          fi

      - name: Gate 6a — formatting
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fmt --all --check

      # `--offline` only succeeds if every crate is already in CARGO_HOME.
      # A newly added dependency has never been downloaded on a runner, so
      # gate 4 structurally rejected the FIRST dependency the workspace ever
      # gained -- it passed until now only because there were none. Fetching
      # with --locked first preserves the whole point of the gate (build the
      # EXACT locked versions, resolve nothing) while letting it actually run.
      - name: Gate 4a — fetch exactly what the lock names
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fetch --locked

      - name: Gate 4 — locked, offline
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo build --workspace --locked --offline --all-targets

      - name: Gate 6b — clippy
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Gate 5 — unsafe is denied, exceptions are counted
        run: |
          set -euo pipefail
          # unsafe_code = "deny" at the workspace root already fails the build.
          # This gate additionally caps how many documented exceptions exist,
          # so they cannot quietly multiply.
          # Two bugs lived here and both failed in the SAFE direction's
          # opposite: `grep -c` exits 1 when it matches nothing, and with
          # `set -o pipefail` that made the gate fail exactly when the
          # repository was clean. And `grep -c` omits the `file:` prefix when
          # given a single file, so `awk -F:` read field 2 of a bare number
          # and counted zero — an exception in the only .rs file would have
          # been invisible. Counting occurrences directly fixes both.
          n=$( { git ls-files '*.rs' | xargs -r grep -oh 'allow(unsafe_code)' || true; } \
               | wc -l | tr -d ' ')
          echo "documented unsafe exceptions: $n"
          if [ "$n" -gt 3 ]; then
            echo "More than 3 unsafe exceptions. Each needs a decision entry."
            git ls-files '*.rs' | xargs -r grep -n 'allow(unsafe_code)'
            exit 1
          fi

      - name: Gate 3 — dependency policy
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # The pin was ^0.16, which cannot PARSE the current RUSTSEC advisory
          # database: RUSTSEC-2026-0109.md uses TOML front-matter that 0.16.4
          # rejects, so the gate died on "failed to load advisory database"
          # before it checked anything. That is the worst shape of failure for
          # a security gate -- red for a reason unrelated to security, which
          # trains a reader to ignore it.
          #
          # This is a CI tool version, not a workspace dependency: it adds
          # nothing to the dependency graph and needs no ledger entry. The
          # constraint stays bounded rather than floating, so a future breaking
          # 0.18.9 needs rustc 1.88 and rust-toolchain.toml pins 1.85.0, so the
          # version is pinned EXACTLY at 0.18.3 -- the newest release cargo
          # itself reports as supporting 1.85.0. A caret range would silently
          # re-break the moment a newer cargo-deny raises its MSRV again.
          #
          # THE VERSION IS PINNED, AND UNTIL D-0034 IT WAS NOT. The paragraph
          # above said "pinned EXACTLY at 0.18.3" while the command below said
          # `cargo install cargo-deny --locked` -- and `--locked` pins the
          # tool's own dependency graph, never the tool version. So every run
          # installed whatever was newest that day, and a security gate whose
          # verdict can change with no commit is a verdict nobody can read.
          # 0.19.0 is the version this repository is measured against; the
          # advisory database is still fetched fresh on every run, which is the
          # part that is supposed to move.
          cargo install cargo-deny --version 0.19.0 --locked
          cargo deny check

      - name: Tests
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo test --workspace --locked

      - name: The browser crate actually builds for the browser
        run: |
          [ -d crates/web ] || { echo "skip"; exit 0; }
          cargo build -p web --target wasm32-unknown-unknown --locked

  # ==========================================================================
  # Coverage — 100% line and branch, no omit list.
  # ==========================================================================
  coverage:
    name: Coverage 100%
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - name: Measure
        run: |
          set -euo pipefail
          n=$(git ls-files 'crates/*/Cargo.toml' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::warning title=Coverage measured nothing::\
          No crate exists yet, so 100% coverage is vacuously true. \
          See docs/06-limits.md section 7."
            exit 0
          fi
          # THE MEASURING INSTRUMENT IS PINNED. `--locked` pins the tool's own
          # dependency graph, not the tool version, so this used to install
          # whatever cargo-llvm-cov was newest that day. `--fail-under-regions
          # 100` is the threshold most sensitive to how a given cargo-llvm-cov
          # and LLVM pair enumerates regions: a version that splits one region
          # into two turns the gate red with no source change, and one that
          # starts skipping a construct turns it green while uncovered code
          # exists. Neither is distinguishable from a real regression in the
          # log. 0.8.4 is the version the operator's machine measures with, so
          # "CI is green" and "my machine is green" are now the same statement.
          # D-0034.
          cargo install cargo-llvm-cov --version 0.8.4 --locked
          cargo llvm-cov --workspace --locked \
            --fail-under-lines 100 --fail-under-regions 100 \
            --summary-only

      - name: Gate 20 — every uncovered line in the logger is declared, with its reason
        # ALWAYS, even when the step above failed. That step enforces the
        # workspace ideal and currently cannot pass; this one enforces something
        # that CAN, and a gate that only runs when everything is already green
        # is a gate that never runs.
        if: always()
        run: |
          set -euo pipefail
          # WHY THIS EXISTS BESIDE `--fail-under 100`.
          #
          # `CLAUDE.md` §9 asks for 100%. `cargo llvm-cov` offers no way to say
          # "this line is unreachable and declared" — no line-level exclusion, no
          # ignore mechanism finer than a whole file. So §9 and §3 rule 6 pull
          # against each other: the honest thing (a backstop for a condition the
          # process cannot create) is indistinguishable from the dishonest thing
          # (a line nobody bothered to test).
          #
          # This is the same answer gate 1d gives for path-shaped literals:
          # DECLARE each one, with a reason, and let the gate refuse anything
          # undeclared. `docs/06-limits.md` §54 carries the reasons in prose;
          # this carries the counts, and the two must agree.
          #
          # A COUNT PER FILE, not a line number, because line numbers move every
          # time somebody edits a comment and a declaration that rots is worse
          # than none.
          #
          # AN EXACT MATCH, not a ceiling. A file that drops BELOW its declared
          # count fails too — the reason is gone and the declaration is now a
          # lie, which is precisely what gate 1d says about a stale native-crate
          # entry. Covering a line is a success the declaration has to record.
          declared='
          clock.rs 1
          level.rs 1
          lib.rs 6
          sink.rs 8
          tail.rs 3
          '
          cargo llvm-cov report --locked --text > /tmp/cov.txt

          # IS THERE A PROFILE AT ALL? The step above runs `--fail-under`, so it
          # exits non-zero on a real shortfall AND on a build failure, and this
          # step runs `if: always()` either way. Reading a missing or half-written
          # profile yields a plausible-looking report full of zero-count lines,
          # and comparing counts against it would report "coverage regressed"
          # when the truth is "the tests never ran". Refuse to render a verdict
          # on data that is not there. Measured: a stale profile read 13.96%
          # where a real one read 96.80%.
          # A FILE COUNT IS NOT ENOUGH. A half-written profile still lists all
          # five files; it just marks most of their lines uncovered. So measure
          # the fraction: a real profile leaves ~1% of this crate uncovered, a
          # degraded one leaves most of it. Anything past 50% is not a
          # regression somebody introduced, it is a profile nobody can read.
          read -r total zero <<EOF
          $(awk '
            /telemetry\/src\/[a-z_]+\.rs:/ { f=1; next }
            f && /^ *[0-9]+\| *[0-9]+\|/ { t++; if ($0 ~ /^ *[0-9]+\| *0\|/) z++ }
            END { printf "%d %d\n", t+0, z+0 }
          ' /tmp/cov.txt)
          EOF
          if [ "$total" -lt 500 ] || [ $(( zero * 2 )) -gt "$total" ]; then
            echo "NO USABLE COVERAGE PROFILE — $zero of $total telemetry lines"
            echo "read as uncovered. A real profile leaves about 19. The measure"
            echo "step did not produce usable data, which usually means the"
            echo "workspace failed to BUILD or the target directory was cleared"
            echo "underneath it. This gate is reporting THAT, not a coverage"
            echo "regression. Measured: a stale profile read 13.96% where a"
            echo "real one read 96.80%."
            exit 1
          fi

          actual=$(awk '
            /telemetry\/src\/[a-z_]+\.rs:/ { f=$0; sub(".*/crates/telemetry/src/","",f); sub(":","",f); next }
            f && /^ *[0-9]+\| *0\|/ { n[f]++ }
            END { for (k in n) printf "%s %d\n", k, n[k] }
          ' /tmp/cov.txt | sort)
          # `paste` joins with a TAB and awk prints a SPACE; normalise, or the
          # gate fails on whitespace while every count agrees.
          want=$(printf '%s\n' $declared | paste - - | tr '\t' ' ' | sort)

          echo "declared:"; printf '%s\n' "$want"   | sed 's/^/  /'
          echo "measured:"; printf '%s\n' "$actual" | sed 's/^/  /'

          if [ "$want" != "$actual" ]; then
            echo
            echo "THE LOGGER'S UNCOVERED SET IS NOT THE DECLARED ONE."
            echo
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$actual") || true
            echo
            echo "A file with MORE uncovered lines than declared has a new gap:"
            echo "cover it, or add it to docs/06-limits.md section 54 with the"
            echo "reason it cannot run and raise the count here in the same"
            echo "commit. A file with FEWER has a declaration that is now false:"
            echo "lower the count and delete the prose that justified it."
            exit 1
          fi
          echo "OK — every uncovered line in crates/telemetry is declared."

  # ==========================================================================
  # GATE 18 — no surviving mutant on what this change touched.
  # ==========================================================================
  mutants:
    name: Gate 18 — no surviving mutant
    runs-on: ubuntu-24.04
    needs: build
    steps:
      # THE WHOLE HISTORY, because this gate's scope IS the diff. With the
      # default shallow clone there is no merge base to diff against and the
      # step would mutate nothing while reporting success — the exact silent
      # pass CLAUDE.md §4 calls a fallback that hides a failure.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No surviving mutant
        run: |
          set -euo pipefail
          # WHY THIS EXISTS. CLAUDE.md §9 has required "no surviving mutant on
          # touched modules" since before this file did, and NOTHING enforced
          # it. `cargo-mutants` was installed on the operator's machine and a
          # `mutants.out.old/` sat in the tree carrying **33 caught and 15
          # missed** — fifteen mutations that survived, thirteen of them in one
          # function, with no gate to say so. A clause in the definition of
          # done that no step executes is a clause that is true by nobody
          # checking.
          #
          # WHY --in-diff AND NOT THE WHOLE WORKSPACE. §9 says "on touched
          # modules", and it says that because it has to: mutation testing runs
          # the test suite once per mutant, so a full-workspace pass over this
          # tree is hours. A gate that takes hours is a gate somebody disables,
          # and a disabled gate is worse than an honest absence — it reads as
          # protection. `--in-diff` mutates only the lines this change actually
          # touched, which is both what the law asks for and what fits in CI.
          #
          # WHAT THAT MEANS, STATED PLAINLY: this gate does NOT prove the
          # workspace is free of surviving mutants. It proves THIS CHANGE did
          # not add one. The 15 already in `crates/lake` are not caught by it
          # and are recorded in docs/06-limits.md rather than hidden behind a
          # green tick.
          #
          # THE TOOL IS PINNED, for the reason D-0034 gives about cargo-deny
          # and cargo-llvm-cov: a verdict that can change with no commit is a
          # verdict nobody can read.
          cargo install cargo-mutants --version 26.2.0 --locked

          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            echo "::warning title=Gate 18 mutated nothing::\
          No base commit to diff against — the first commit of a history has \
          no predecessor. Nothing was mutated and nothing is claimed."
            exit 0
          fi
          git diff "$base"...HEAD -- 'crates/*/src/*.rs' > /tmp/changed.diff
          if [ ! -s /tmp/changed.diff ]; then
            echo "OK — no crate source changed, so there is nothing to mutate."
            exit 0
          fi
          echo "Mutating only the lines this change touched, against $base."

          # `--test-tool=cargo` and the workspace's own suite. The timeout is
          # generous per mutant because a mutant that hangs is a mutant the
          # suite did NOT catch, and killing it early would score it as caught.
          set +e
          cargo mutants --in-diff /tmp/changed.diff \
            --timeout 300 --no-shuffle --colors never
          status=$?
          set -e

          # cargo-mutants exits 0 when every mutant was caught, and non-zero
          # when any survived, was unviable in a way it could not classify, or
          # timed out. The file is the authority either way, because it is what
          # an operator reads.
          missed=mutants.out/missed.txt
          if [ -s "$missed" ]; then
            echo
            echo "GATE 18 FAILED — these mutations survived the test suite:"
            cat "$missed"
            echo
            echo "Each line is a change to the source that NO test noticed."
            echo "CLAUDE.md §4: a test that asserts nothing is banned, and a"
            echo "surviving mutant is that test, found by experiment rather"
            echo "than by review. Write the assertion that kills it."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "GATE 18 FAILED — cargo-mutants exited ${status} with no"
            echo "missed list. Read the output above: a timeout or an unviable"
            echo "mutant is not a pass, and this step will not call it one."
            exit "$status"
          fi
          echo "OK — every mutation of the changed lines was caught by a test."

  # ==========================================================================
  # GATE 8 — per-operation cost stays constant as input grows.
  # ==========================================================================
  complexity:
    name: Gate 8 — O(1) ratio
    runs-on: ubuntu-24.04
    needs: build
    # THE BENCH BUDGET, WRITTEN DOWN. Gate 14 proves these benches exist and
    # have the shape of a ratio measurement; this job is what executes them,
    # and a bench is the one step in this file whose cost is chosen by the
    # person writing the measurement rather than by the size of the tree. The
    # Actions default is 360 minutes — six hours of a pinned runner for a loop
    # that will never converge. Each bench takes a minimum over 60 trials and
    # crates/core's worst case allocates a 4 MiB field per repetition, so the
    # ceiling that matters is set here rather than discovered on a blocked
    # queue. A breach of THIS is not a slow ratio, it is a bench that stopped
    # terminating, and it should be read that way.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Per-operation cost at 1x / 10x / 100x
        run: |
          set -euo pipefail
          # THIS GATE WAS A NO-OP FOR THE WHOLE LIFE OF THE REPOSITORY, and
          # both defects fixed in D-0032 and D-0033 merged through it green.
          # The guard was `[ -d benches ] || { echo skip; exit 0; }`, which
          # tests for a directory at the repository ROOT. Cargo benches live at
          # `crates/<name>/benches`, so the probe could never have found one
          # even after they were written, and a skip that reports success is
          # exactly the fallback CLAUDE.md section 4 bans.
          #
          # It now looks where benches live, and an empty set is a FAILURE
          # rather than a pass: CLAUDE.md section 3 rule 4 makes this gate the
          # enforcement mechanism for constant per-operation cost, and a gate
          # cannot enforce over nothing. See D-0034.
          n=$(git ls-files 'crates/*/benches/*.rs' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "GATE 8 MEASURED NOTHING — no crate carries a bench."
            echo "Write one, or record abandoning the invariant in"
            echo "docs/05-decisions.md. This step does not skip."
            exit 1
          fi
          echo "$n bench source file(s) tracked."
          # Each harness is `harness = false`: it prints every number it took
          # and exits non-zero on a breach. See docs/04-invariants.md C-01,
          # C-07 through C-10 for the ratios and the ceiling.
          cargo bench --workspace --locked

  # ==========================================================================
  # Aggregate — this is the only required check on the branch rule.
  # ==========================================================================
  # The job NAME is what a branch-protection rule and the auto-merge workflow
  # match on, so it is spelled exactly as the required check: `ci-ok`.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [language-purity, build, coverage, complexity, mutants]
    if: always()
    steps:
      - name: Verify every gate went green
        # The results cross into the shell through env rather than being
        # interpolated into the script body — the same rule the auto-merge
        # workflow follows, applied here for consistency even though `needs`
        # results are not attacker-controlled.
        #
        # Note the SINGLE quotes inside the expression. A GitHub Actions
        # expression accepts only single-quoted strings; `join(x, " ")` is a
        # parse error that invalidates the ENTIRE workflow file, which is how
        # this repository's first CI run produced zero jobs and no log.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo "no gate reported a result at all — refusing to call that green"
            exit 1
          fi
          for x in ${RESULTS}; do
            [ "$x" = "success" ] || { echo "a gate did not pass: $x"; exit 1; }
          done
          echo "all gates green"
