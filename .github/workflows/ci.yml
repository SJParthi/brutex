          # no prose. Both would read better as `#[expect]`, which reports an
          # exemption nobody needs any more; that is their owners' call.
          # Kept as its own list rather than folded into `allow_panic` because
          # the two ask different questions — "this construct appears" and
          # "the lint that would have caught it is switched off here" — and a
