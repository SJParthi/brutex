          # (crate, fn) for every tracked crate, built once.
          #
          # COMMENT LINES ARE DROPPED BEFORE THE `fn` IS READ, and until they were
          # a row could be satisfied by a function that exists only in prose. The
          # extraction was `grep -ohE '\bfn name'` over the whole file, so
          #
          #   /// ... and `fn constraint` is what used to live here
          #
          # put `pull constraint` in this table exactly as a real declaration
          # would. Measured on this tree: THREE such phantoms -- `api tests`,
          # `pull constraint`, `telemetry expensive` -- none of them currently
          # named by a row, which is luck rather than a property. A gate whose
          # proof table can be extended by writing a comment is a gate a comment
          # can satisfy.
          #
          # The filter is the one gates 17, 22 and 23 already use: drop lines
          # whose first non-blank token is `//` or `*`. It is conservative in the
          # safe direction -- a `fn` declaration cannot sit on a line beginning
          # `//` -- and it does NOT strip a trailing comment on a code line, nor
          # the opening line of a `/* */` block. Both remain, and both are
          # documented the same way in gate 17.
          #
          # One file at a time rather than `xargs`, because the filter is
          # per-file. That is slower and it is 189 files.
          fns="$work/fns"; : > "$fns"
          path_fns="$work/path-fns"; : > "$path_fns"
          for c in $(git ls-files 'crates/*/Cargo.toml' \
                     | sed 's|^crates/||; s|/Cargo.toml$||'); do
            while IFS= read -r one; do
              [ -n "$one" ] || continue
              { grep -vE '^[[:space:]]*(//|\*)' "$one" || true; } \
                | { grep -ohE '\bfn [a-z_][a-z_0-9]*' || true; } \
                | sed 's|^fn ||' \
                | while IFS= read -r fn; do
                    printf '%s %s\n' "$c" "$fn" >> "$fns"
                    printf '%s\t%s\n' "$one" "$fn" >> "$path_fns"
                  done
            done < <(git ls-files "crates/$c/*.rs")
          done
          sort -u -o "$fns" "$fns"

          # D-0662: bare test names followed by a source path are also proof
          # references. The old qualified-token expression ignored them all.
          rustc --edition=2024 --test -D warnings .github/invariant_paths.rs -o "$work/invariant-path-tests"
          "$work/invariant-path-tests"
          rustc --edition=2024 -D warnings .github/invariant_paths.rs -o "$work/invariant-paths"
          "$work/invariant-paths" "$f" "$path_fns"

          rows=0; checked=0; missing=0; pending=0; exempt=0
          while IFS= read -r line; do
            case "$line" in \|*) ;; *) continue ;; esac
            rows=$((rows + 1))
            id=$(printf '%s\n' "$line" | awk -F'|' '{print $2}' | tr -d ' ')
            for t in $( { printf '%s\n' "$line" \
                          | grep -oE '`[a-z_][a-z_0-9]*(::[a-z_][a-z_0-9]*){2,}`' | tr -d '`' || true; } ); do
              c="${t%%::*}"; fn="${t##*::}"
              # The ONLY reason a row is not checked: the crate it names is not
              # a tracked member of this workspace. That is what the legend's
              # "—" was always supposed to mean, now read off the tree.
              if ! git ls-files --error-unmatch "crates/${c}/Cargo.toml" >/dev/null 2>&1; then
                pending=$((pending + 1))
                continue
              fi
              if [ -n "$( { printf '%s\n' "$allow_pending" \
                            | awk -v I="$id" '$1==I{print "y"; exit}'; } )" ]; then
                exempt=$((exempt + 1))
                printf 'EXEMPT (allowlisted) %s — %s\n' "$id" "$t"
                continue
              fi
              checked=$((checked + 1))
              if ! grep -qxF "${c} ${fn}" "$fns"; then
                printf 'INVARIANT POINTS AT A TEST THAT DOES NOT EXIST: %s (%s)\n' "$t" "$id"
                missing=$((missing + 1))
              fi
            done
          done < "$f"

          echo "read ${rows} table row(s) in ${f}"
          echo "  ${checked} named test(s) checked against a tracked crate"
          echo "  ${pending} skipped — the crate they name is not a workspace member"
          echo "  ${exempt} exempted by the allowlist in this file"
          echo "  ${missing} missing"
          # A pattern that stops matching is the failure mode gate 8 shipped
          # with: it reported success while measuring nothing.
          if [ "$checked" -eq 0 ]; then
            echo "GATE 10 CHECKED NOTHING. Either every crate vanished or the row"
            echo "pattern stopped matching. A silent zero is not a pass."
            exit 1
          fi

          bad=0
          [ "$missing" -eq 0 ] || bad=1
          for i in $( { printf '%s\n' "$allow_pending" | awk 'NF{print $1}'; } ); do
            if ! grep -qE "^\| *${i} *\|" "$f"; then
              printf 'STALE ALLOWLIST ENTRY — %s is not a row in %s\n' "$i" "$f"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo
            echo "Either write the test, or record abandoning the invariant in"
            echo "docs/05-decisions.md. Rows are never deleted to go green, and"
            echo "a status glyph no longer silences one."
            exit 1
          fi
          echo "OK — checked named invariant references resolve to tracked declarations."

