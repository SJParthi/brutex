name: Auto-merge

# Enables GitHub's native squash auto-merge on a pull request.
#
# GITHUB OWNS THE MERGE DECISION AND THIS FILE DOES NOT SECOND-GUESS IT.
# Branch protection on main is strict and requires `ci-ok`, so GitHub is
# incapable of merging a red or unfinished pull request. Re-deriving that in
# shell added no safety and got it wrong once already (see section 5 below).
# What this workflow owns is the decision to ARM auto-merge, and — just as
# load-bearing — the duty to say out loud when it did not.
#
# Two triggers, because one is not enough:
#   pull_request  — catches a PR that is already green when it opens or is
#                   re-pushed (a rebase onto a green main, for instance).
#   workflow_run  — catches the far more common case: the PR opened while CI
#                   was still running, and CI has only now finished.
#
# `workflow_run: types: [completed]` FIRES ON EVERY COMPLETION. A CI run that
# concluded `failure` delivers a byte-identical event shape to one that
# concluded `success`; only `.conclusion` separates them, and until this
# revision nothing read it. The job walked the check runs, PRINTED them, and
# called `gh pr merge --auto` regardless. The merge stayed safe — GitHub
# refused it — but the job reported success on top of a failed run, and a
# green tick on a check named "Enable squash auto-merge on green" is read by
# a human as "armed, this will land by itself". That silence is the defect
# this file now fixes. It is not a second opinion on CI; it is an honest
# report of what the automation did, which in that case was nothing.
#
# TWO CLASSES OF NOT-MERGING, and the difference is whether a human has to act:
#
#   NOT READY YET — closed, draft, behind main, the head moved under us, the
#                   triggering run was cancelled, gates still running. Quiet,
#                   exit 0, job stays green. A push or a later CI completion
#                   re-evaluates the same pull request; the automation has not
#                   stopped, it has simply not fired yet.
#
#   STOPPED       — CI concluded failure, a gate on this head has already
#                   failed, the check-run list could not be read, the PR is
#                   from a fork (a fork gets a read-only token by design), or
#                   the merge call itself did not take. Nothing this workflow
#                   can observe will restart it. It emits an `::error::`
#                   annotation, writes a heading into the job summary, and
#                   EXITS NON-ZERO.
#
# The quiet conditions are tested BEFORE the loud ones on purpose. A CI run
# that was cancelled by `cancel-in-progress`, or one whose head has since been
# pushed over, is a race that resolves itself, and shouting about it would
# train a reader to ignore the shout.
#
# HONEST LIMIT. A non-zero exit is the whole of the alarm. Nothing here opens
# an issue, retries, or notifies anyone, so a stop is seen only by someone who
# looks at the pull request or at the Actions tab. This job is also not a
# required check, so going red cannot block a merge GitHub would otherwise
# make — which is deliberate: the alarm must never become a second gate.
#
# SECURITY. No value from the event payload is interpolated into a `run:`
# body. Every value crosses into the shell through `env:` and is quoted at the
# point of use, so a branch name or a title cannot become a command. The base
# branch is a literal rather than `github.event.*.default_branch`, so nothing
# attacker-shaped decides what we compare against.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  # One evaluation at a time per head commit. Not cancel-in-progress: a
  # cancelled evaluation is a pull request that silently never merges.
  group: auto-merge-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable squash auto-merge on green
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate every gate, then enable or refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: main
          # Exactly one of these is populated, depending on the trigger.
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          SHA_FROM_RUN: ${{ github.event.workflow_run.head_sha }}
          # Populated on the workflow_run trigger only, and empty on the
          # pull_request one. `completed` says the run ENDED; this says how.
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          # This job's own check run. It is in progress while it evaluates, so
          # counting it as a pending gate would deadlock every merge forever.
          SELF_CHECK_NAME: Enable squash auto-merge on green
          REQUIRED_CHECK: ci-ok
        run: |
          set -euo pipefail

          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # NOT READY YET. A later event re-evaluates this same pull request,
          # or there is nothing left to evaluate. Quiet, and exit 0: a green
          # tick here says "the automation ran and correctly did nothing",
          # which is true.
          not_yet() {
            say "Not merging yet — $*"
            say "No merge was enabled. Nothing has failed."
            exit 0
          }

          # STOPPED. Loud, and exit 1. Three separate surfaces, because each
          # one is seen by a different reader: the `::error::` annotation
          # shows on the run page and in the PR's checks list, the heading
          # makes the job summary state the reason without being buried in a
          # markdown paragraph (consecutive summary lines with no blank line
          # between them render as ONE paragraph, which is why the block below
          # writes its own blank lines), and the exit status is what stops the
          # check from claiming green over a red run.
          stopped() {
            printf '::error title=Auto-merge stopped::%s\n' "$*"
            printf 'STOPPED — %s\n' "$*"
            {
              printf '\n'
              printf '## STOPPED — auto-merge was NOT enabled\n'
              printf '\n'
              printf '%s\n' "$*"
              printf '\n'
              printf 'Nothing retries this and nobody is notified. It needs a human.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # ---------------------------------------------------------------
          # 1. Which pull request is this about?
          # ---------------------------------------------------------------
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr="$PR_FROM_EVENT"
            sha=""
          else
            sha="$SHA_FROM_RUN"
            pr=$(gh api "repos/${REPO}/commits/${sha}/pulls" \
                   --jq '[.[] | select(.state == "open")] | .[0].number // empty')
          fi
          # No pull request is the shape of every CI run on main, INCLUDING a
          # failed one. Quiet is right there: the red X belongs to that CI run
          # and there is no pull request for this job to arm or to lie about.
          if [ -z "${pr:-}" ]; then
            say "No open pull request is associated with this event. Nothing to do."
            exit 0
          fi
          say "Pull request: #${pr}"

          # ---------------------------------------------------------------
          # 2. Is it even a candidate?
          # ---------------------------------------------------------------
          read -r state draft fork head < <(
            gh pr view "$pr" --repo "$REPO" \
              --json state,isDraft,isCrossRepository,headRefOid \
              --jq '[.state, (.isDraft|tostring), (.isCrossRepository|tostring), .headRefOid] | @tsv'
          )
          say "State ${state} · draft ${draft} · fork ${fork} · head ${head}"

          [ "$state" = "OPEN" ]  || not_yet "the pull request is ${state}, not OPEN."
          [ "$draft" = "false" ] || not_yet "the pull request is a draft."

          # The head this job evaluated must be the head that gets merged. If a
          # push landed while we were deciding, this event is about a sha that
          # is already history: its own CI run produced, or will produce, its
          # own workflow_run event. QUIET, and tested before anything loud —
          # a failed gate on a superseded sha is not news, and an alarm on a
          # race that resolves itself is worse than no alarm. (The audit that
          # produced this revision classed a moved head as loud. It is not:
          # CI sets `cancel-in-progress: true`, so a second push in quick
          # succession makes this path routine.)
          if [ -n "$sha" ] && [ "$sha" != "$head" ]; then
            not_yet "the branch moved during evaluation (evaluated ${sha}, head is now ${head}); a later run owns the new head."
          fi

          # A fork PR gets a read-only token, so this workflow can NEVER arm
          # it — not on a later push, not ever. Loud, because a green tick
          # here would promise an automatic merge that cannot happen and the
          # pull request would sit waiting on nobody.
          [ "$fork" = "false" ] || \
            stopped "pull request #${pr} comes from a fork, and a fork gets a read-only token by design. Auto-merge can never be armed for it; review and merge it by hand."

          # ---------------------------------------------------------------
          # 3. Did the CI run that woke us up actually pass?
          # ---------------------------------------------------------------
          # Empty on the pull_request trigger, where there is no run to judge.
          if [ -n "${CI_CONCLUSION:-}" ]; then
            say "Triggering CI run concluded: ${CI_CONCLUSION}"
            case "$CI_CONCLUSION" in
              success)
                : ;;
              cancelled|skipped|stale|neutral)
                # Not a verdict on the code. A cancelled CI run is the normal
                # shape of two pushes in quick succession.
                not_yet "the CI run that triggered this concluded ${CI_CONCLUSION}, which is not a verdict on ${head}." ;;
              *)
                stopped "CI concluded ${CI_CONCLUSION} on ${head}. Auto-merge was not enabled and this pull request will not land until CI is green. ${CI_RUN_URL}" ;;
            esac
          fi

          # ---------------------------------------------------------------
          # 4. Behind main is not a merge — but it is not an alarm either.
          # ---------------------------------------------------------------
          # A pull request that passed CI against an older main proves nothing
          # about the merge result. Linear history is required on main, so a
          # behind branch could not fast-forward anyway. Quiet: a rebase is a
          # push, and a push is a new event.
          behind=$(gh api "repos/${REPO}/compare/${BASE_BRANCH}...${head}" --jq '.behind_by')
          say "Commits behind ${BASE_BRANCH}: ${behind}"
          [ "$behind" -eq 0 ] || not_yet "the branch is ${behind} commit(s) behind ${BASE_BRANCH}; rebase it."

          # ---------------------------------------------------------------
          # 5. Every gate. Not only the required one.
          # ---------------------------------------------------------------
          # This step used to REFUSE whenever any check was still pending. That
          # was wrong and it broke every merge: on a `pull_request` event the
          # gates have only just STARTED, so pending is the normal state and it
          # refused every single time. Nothing re-evaluated afterwards, because
          # the `workflow_run` re-trigger fires against main rather than the
          # pull request branch. Both of the first two pull requests had to be
          # merged by hand as a result.
          #
          # PENDING IS STILL NOT A REFUSAL — that fix stands, and it is why
          # `none` is absent from the failure list below. What the correction
          # went too far on was FAILED: waiting for GitHub is delegation, but
          # arming a merge while printing a red gate is silence.
          #
          # A list that cannot be read is not an empty list. `|| true` used to
          # turn an API error into "no gates found", which is precisely the
          # fallback-that-hides-a-failure CLAUDE.md section 4 bans; a
          # transient 5xx now paints this job red instead of arming a merge on
          # gates nobody looked at.
          if ! runs=$(gh api "repos/${REPO}/commits/${head}/check-runs" --paginate \
                        --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv'); then
            stopped "the check-run list for ${head} could not be read, so no claim about the gates can be made. Re-run this job."
          fi

          failed=""
          while IFS=$'\t' read -r name status conclusion; do
            [ -n "$name" ] || continue
            [ "$name" = "$SELF_CHECK_NAME" ] && continue
            say "  gate ${name}: ${status}/${conclusion}"
            # A check run concludes as exactly one of: action_required,
            # cancelled, failure, neutral, success, skipped, stale, timed_out.
            # Three of those are a gate saying no. `cancelled`, `skipped`,
            # `stale`, `neutral` and a still-running `none` are deliberately
            # absent — none of them is a verdict, and treating a cancelled
            # gate as a failure would reintroduce the alarm on a superseded
            # push that section 3 just took out.
            case "$conclusion" in
              failure|timed_out|action_required)
                failed="${failed}${failed:+, }${name}" ;;
            esac
          done <<< "$runs"

          [ -z "$failed" ] || \
            stopped "these gates have already failed on ${head}: ${failed}. Auto-merge was not enabled."

          say "No gate on ${head} has failed."
          say "Required check '${REQUIRED_CHECK}' is enforced by branch protection."

          # ---------------------------------------------------------------
          # 6. Hand it to GitHub, which merges iff ci-ok goes green.
          # ---------------------------------------------------------------
          say "Enabling squash auto-merge on #${pr}."
          if gh pr merge "$pr" --repo "$REPO" --auto --squash; then
            say "Auto-merge enabled — GitHub merges when ci-ok passes."
          else
            # `--auto` merges outright when the pull request is already
            # mergeable, and a second invocation then errors. That is not a
            # failure worth surfacing.
            now=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)
            [ "$now" = "MERGED" ] || \
              stopped "could not enable auto-merge on #${pr}; its state is ${now}."
            say "Already merged."
          fi
