# common-feat-v1: THE common feature module of Brutex, version 1 (REQ 72 / REQ72-PLAN v4 section A, signed by MAIN
# 2026-11-13 15:50:46 IST with amendments A1-A4), built as the minimum slice the ADANIENT sniper needs (REQ 76f,
# SNIPER-REQUIREMENTS sections 11 and 13). Two crates:
#   crates/common_feat : the readings. Pure integer functions, std only, no I/O, no float (REQ72-PLAN A.1).
#   crates/feat_io     : the readers and the run driver (the host side). It reads the store's ZERODHA minute candles through
#                        the existing store reader (store::file::BarFile, generation-aware), the GDFL tick store (FORMAT.md v1,
#                        keeping the LTQ = 0 new-price trade rows, LTQ0-HL-1) and the NSE bhavcopy extract. It never writes the
#                        store; it writes only under the run folder it is given.
[workspace]
resolver = "3"
members = ["crates/common_feat", "crates/feat_io"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code             = "deny"
missing_docs            = "warn"
unreachable_pub         = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                      = { level = "deny", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
float_arithmetic         = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
todo                     = "deny"
unimplemented            = "deny"
dbg_macro                = "deny"

[profile.release]
opt-level = 3
debug = 1
overflow-checks = true
