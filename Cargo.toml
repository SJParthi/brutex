[workspace]
resolver = "3"

# One line per crate that EXISTS. A member is added by the pull request that
# creates the crate, never before it — a manifest that names a directory which
# is not there fails `cargo build --workspace` outright, and CI gate 4 is not
# something to be red while waiting for later work.
#
# The intended final graph is in docs/01-architecture.md §1, in the order the
# crates are built:
#   core → store → vocab → indicators → engine → pull → api → web → cli
#
# plus two leaves that are in no part of that chain, each with no arrow into it:
#
#   `costs`  — Indian F&O transaction costs. Depends on `core` only. D-0041.
#   `greeks` — Black-Scholes-Merton. Depends on **nothing**, and is shared with
#              the `tickvault` repository by git URL. D-0046.
#
# `CLAUDE.md` §5 lists neither; see D-0046, "One discrepancy an operator has to
# settle". Both arrived here from branches that had each appended to this list
# without seeing the other — the same shape as the D-0037 identifier collision
# this merge also had to resolve. The union is correct; neither side was wrong.
members = [
    "crates/core",
    "crates/greeks",
    "crates/store",
    "crates/pull",
    "crates/api",
    "crates/costs",
    "crates/lake",
    "crates/telemetry",
    "crates/vocab",
    "crates/indicators",
    "crates/engine",
    # The only place `indicators` and `engine` can legally meet: gate 22 clause A
    # pins both of their dependency sets to `vocab` alone and ships no allowlist,
    # so the join has to live in a crate that is not on gate 22's list. See
    # `crates/runner/Cargo.toml` for why that preserves the gate rather than
    # avoiding it.
    "crates/runner",
    # THE ENTRY POINT THE SWEEP NEVER HAD. Until this member existed the only
    # binary was `api`, whose dependency set names none of `runner`, `engine`,
    # `indicators`, `vocab` or `costs` -- so the ladder, the vocabulary and every
    # statistical stage were compiled, tested and unreachable. See D-0169.
    #
    # It depends on `runner`, `engine`, `indicators`, `costs`, `store` and `core`.
    # `store` IS among them, and this comment used to say the opposite -- that the
    # crate was deliberately NOT on `store` because the operator's standing rule
    # forbids both a vendor pull and the bars already on disk, leaving
    # `runner::synthetic` as the only honest input. `cli sweep-stored` reads a real
    # instrument-month through `store::file::BarFile`, so that argued for an
    # absence which has been filled. Corrected by D-0208, which also names the four
    # other places CLAUDE.md section 5 had drifted.
    #
    # What still holds is the gate 22 half: `cli` is a CALLER, never a swept crate,
    # and must never be added to that gate's list.
    "crates/cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
license      = "UNLICENSED"
publish      = false

# ---------------------------------------------------------------------------
# Lints apply to every member. A crate that needs an exception writes an
# explicit `#[allow]` at the narrowest possible scope with a comment saying
# why — never by relaxing the workspace level.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code            = "deny"
missing_docs           = "warn"
unreachable_pub        = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                 = { level = "deny", priority = -1 }
pedantic            = { level = "warn", priority = -1 }
unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
indexing_slicing    = "deny"
float_arithmetic    = "deny"   # prices are integers; CLAUDE.md §7. D-0061
cast_possible_truncation = "deny"
cast_sign_loss      = "deny"
todo                = "deny"
unimplemented       = "deny"
dbg_macro           = "deny"

[workspace.dependencies]
# Kept here so every member shares one version. Add nothing without an entry
# in docs/05-decisions.md naming what it replaces.
memmap2  = "0.9"
thiserror = "2"
blake3   = "1"
crc32c   = "0.6"
rayon    = "1"
tracing  = "0.1"
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time"] }
axum     = "0.8"
rustls-graviola = "0.4"
# `gzip` IS FOR ONE ENDPOINT AND IT IS NOT OPTIONAL FOR IT. Zerodha's
# instrument dump is documented as "a gzipped CSV dump"; without transparent
# decoding `.text()` yields lossy garbage that can still clear a length check.
# Transparent to every other caller: reqwest advertises the encoding and decodes
# it, so a vendor that does not gzip is unaffected. D-0309.
reqwest  = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "gzip"] }
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
clap     = { version = "4", features = ["derive"] }
hmac     = "0.12"
sha1     = "0.10"
# SHA-256, for the AWS SigV4 signature in `pull::ssm`. Pure Rust, RustCrypto,
# with no `asm` feature — so no assembly and no C. That is the whole reason the
# AWS SDK was refused in favour of signing the one request by hand. See D-0051.
sha2     = { version = "0.10", default-features = false }
governor = "0.7"
aws-config  = "1"
aws-sdk-ssm = "1"

[profile.release]
# Silent wrapping is not an acceptable answer to an arithmetic mistake in a
# backtesting engine: a wrapped price is a plausible number that is wrong, which is
# exactly what CLAUDE.md S4 bans. Without this, `debug` panicked on overflow and
# `release` wrapped, so the two profiles disagreed about what a bug is. Costs a
# branch per arithmetic op; the sweep's hot path is `ConditionMask::hits`, which is
# bitwise and unaffected.
overflow-checks = true
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = 1        # keep symbols; profiles are worthless without them

[profile.bench]
inherits      = "release"
debug         = true
