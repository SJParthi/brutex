  "cli census-recount gdfl --from 2018-11-10 with BRUTEX_STORE on the copy, the same, with no --to so the span runs to the newest day copied (this check writes the copy's GDFL census and GDFL import journal)",
  "cli census-recount zerodha --from 2015-01-01 with BRUTEX_STORE on the copy, the same, from the oldest Zerodha month held (the 2015-01 index 1day bars, outside the operator's window and kept) to the newest (this check writes the copy's Zerodha census; the recount closes journal days for gdfl alone)",
  "cli scrub-blocks gdfl with BRUTEX_STORE on the copy, run until the copy's audit/scrub-blocks.gdfl.cursor ends in a done line of a pass that began on the copy (a run resumes where the copied cursor stood; this check writes the copy's audit/scrub-blocks.gdfl.log and .cursor): bad=0 unverifiable=0 misfiled=0 missing=0, or each bad block named",
  "cli scrub-blocks zerodha with BRUTEX_STORE on the copy, the same (this check writes the copy's audit/scrub-blocks.zerodha.log and .cursor)",
]
env = ["BRUTEX_STORE"]
closes = ["DB-B73", "OWED-21"]
