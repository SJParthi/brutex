# ------------------------------------------------------------- environment --

[[env]]
name = "BRUTEX_STORE"
means = "The store root the cli writes, with no default (main proves it exists). For the run: the operator's real store. For a rehearsal: a private copy, never the real store and never a shadow whose bars/ links into it."

[[env]]
name = "BRUTEX_GDFL_CM_ARCHIVE"
means = "The vendor's capital-market outer zip (indices and shares, 2018-09-01 to 2026-09-24); on the operator's Mac the file 'NSE (Stock+Indices)_01.09.2018 to 24.09.2026_Tick.zip' at the drive's root. Read only."

[[env]]
name = "BRUTEX_GDFL_NFO_ARCHIVES"
means = "The directory of the vendor's yearly options zips; on the operator's Mac the Options directory at the drive's root. Read only."

[[env]]
name = "BRUTEX_GDFL_TICKSTORE"
means = "The verified tick store's root, which holds 2026-09-25, 28, 29 and 30 that the zips end before; on the operator's Mac brutex/tickstore-data on the drive. Read only."

