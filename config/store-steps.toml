note = "RAW_ARCHIVES, STORE and SECOND_DRIVE are the operator's three paths. The copy is append-only: no --delete-after, so a file removed from this drive is never removed from the copy (the store is append-only, CLAUDE.md section 3 rule 8; verify-R3-36-r1 followup). The dry run writes nothing on either side. The GDFL recount spans leave out 2018-11-06 and 2018-11-09 for the reason S-01's note gives (D-3317 item 5, verify-R3-36-r3), and the Zerodha one starts at the oldest Zerodha month the store holds, not at the GDFL archive's first day."

