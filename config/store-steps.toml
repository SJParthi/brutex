# ------------------------------------------------------------------- rules --

[[rule]]
id = "R-01"
text = "One command-line run at a time, and none beside a long import, scrub or pull. Every cli run logs into the one folder <store>/logs/cli, whose lock refuses a second writer; the second run then keeps no events and no audit lines, and only its terminal says so. Before a step, confirm no other cli process works on the store."
source = ["RA-118"]
until = "IA-1"

[[rule]]
id = "R-02"
text = "Stop the app before a store is restored from a snapshot, and start it after. A store rolled back under a running app brings lock files back holding old claims and puts the runs ledger, alert queue, checking images and logs back in time under an app whose memory holds the newer state."
source = ["RA-329"]
until = "never"

[[rule]]
id = "R-03"
text = "A snapshot (S-01) is taken before every bulk write and its name is written in the step's run record; it is not a backup (the same drive). Until S-01's drill has run once on this drive, the undo of a bad write is the store's own append-only history and the independent copy (S-17)."
source = ["RA-288", "DB-B73"]
until = "never"

[[rule]]
id = "R-04"
text = "Capital-market runs (indices, stocks) before S-18 and S-19 are unfiltered: no symbol names, no --stored and no --retry-refused. A day closed under a names filter lets a later --stored run make alias months from a special session alone (72 repairs on the WP-12f checker's copy), and an unfiltered run files the whole stored scope (CmScope::stored walks every alias index row)."
source = ["CMP-03"]
until = "never"

# ------------------------------------------------------------------- steps --

[[step]]
id = "S-01"
title = "Snapshot of the drive before a bulk write, with the restore drill"
state = "pending"
writes = "An APFS local snapshot (outside the store's files). Nothing in the store."
command = [
  "tmutil localsnapshot",
  "tmutil listlocalsnapshots /Volumes/WD_BLACK",
]
dry_run = [
  "the drill of docs/36-ops-runbook.md section 4 with BRUTEX_STORE on a private copy on a scratch APFS volume first: take the snapshot, write one month into a scratch store there, mount the snapshot read-only, copy that month back by name, compare shasum -a 256 with the copy taken before",
]
prerequisites = ["WP-81", "operator: the restore drill (it changes what the drive keeps, so no agent runs it)", "operator: every writer stopped (the app and every cli run) while the copy is taken"]
check = [
  "tmutil listlocalsnapshots /Volumes/WD_BLACK lists the new snapshot; an empty list means the command did not cover this drive and the undo does not exist",
  "docs/36-ops-runbook.md section 4 holds the drill's commands, times and df before and after, and says whether one month came back alone",
  "cli census-recount gdfl --from 2018-09-03 --to 2026-09-30, on a store restored from the snapshot and before any writer starts (the same for zerodha): every count equals the census the snapshot holds",
  "cli scrub-blocks gdfl, on the restored store before any writer starts (the same for zerodha): 0 mismatches, or each bad block named",
]
closes = ["RA-288", "RA-329"]
not_rehearsed = "waits for operator: the drill, on a scratch volume first and then once on this drive"
disk = "UNVERIFIED: a kept snapshot pins every block replaced after it (repair generations, compacted census epochs, rolled logs) as space no file listing shows; the drill's step 5 measures df before and after. Delete it once the run it guarded is checked green (tmutil deletelocalsnapshots)."
note = "Take it and restore it with the app and every cli run stopped (R-02, FM-221): a copy taken while a writer appends holds torn months or a census that disagrees with them. No verb takes every census lock for a copy (NOT DONE in code). Since this list was written, the 13 and 14 Oct bulk writes (S-09, S-10, S-30, S-31 and the partial runs of S-14, S-16, S-19, S-28) ran with no snapshot taken. man tmutil gives localsnapshot no mount point, and this drive is excluded from Time Machine, so the first command is NOT PROVED to snapshot it."

