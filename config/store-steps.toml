# config/store-steps.toml — the store steps, as one checked list (R3-36).
#
# Every write a person runs by hand on the operator's store is one [[step]]
# here: what it writes, the exact command, the packages that must be merged
# and deployed first, the dry run, the time and bytes that dry run took on a
# private copy, how to check the store afterwards, and the findings and audit
# rows it closes. The runbooks that lived only in plans (WP-80 in the fix
# plan, IA-14's table in section 6.8 of the ingest design) are entries here.
#
# NOTHING IN THE REPOSITORY RUNS A STEP. Each runs only on the operator's yes,
# and a step is closed only by its run: `state = "done"` carries the run's own
# record (`ran`, `ran_ms`); a run that did not close its step is the pending
# step's `last_run`; a step that ran before a step it follows says so in
# `ran_out_of_order`. `.github/gates_store_steps.rs` (CI gate 30) reads this
# file and refuses a step without a command, a dry run, a prerequisite, a check
# or a row it closes; a leftover below that no step closes, or that two close;
# a pending step without rehearsal figures that does not name what it waits
# for; a step whose prerequisites are all merged that has no figures; and a
# copy or snapshot of the store taken without every writer stopped, or whose
# restore is not read back before any writer starts (FM-221).
#
# WHERE A RUN'S RECORD COMES FROM: the store's own files, never memory:
# imports/gdfl.journal (begin/done lines with run=<id>), imports/gdfl.lineage
# (re-key lines), audit/gdfl.repairs and audit/zerodha.repairs (one line per
# new generation, with its reason), logs/cli/audit.ndjson (cli.lifecycle and
# 'run finished' events with exit codes). A batch script's own log is not a
# record: the 14 Oct chain printed rc=0 for a re-key the cli ended with exit 1.
#
# HOW TO READ A STEP
#   command        one exact command per line. `cli` is the release binary of
#                  the deployed build (<target>/release/cli), run with the
#                  variables in `env` set (see [[env]]). `POST` lines are the
#                  app's own form routes, pressed from its page. `planned:`
#                  marks a command a package has not built yet.
#   dry_run        the same work without writing the operator's store: a
#                  read-only form of the verb, or the command with BRUTEX_STORE
#                  on a PRIVATE COPY (a new directory whose bars/ is a real
#                  directory of APFS clones, `cp -c`, never a link into the
#                  real store, and never a shadow.sh shadow).
#   prerequisites  packages that must be merged AND deployed first, and
#                  `operator: <what>` items only the operator can supply.
#   rehearsed_*    the dry run, timed on a private copy: milliseconds, bytes
#                  of the files the run created or rewrote (an upper bound on
#                  the growth: a ledger appended to counts whole), files it
#                  created or rewrote, where, on which build, and what it did.
#   not_rehearsed  "waits for <package>" or "waits for operator: <what>".
#   disk           the projection for the real run, from the measured sample.
#   closes / helps rows this step closes (each leftover by exactly one step) /
#                  rows owned elsewhere whose store half this step carries.
#   check          read on the app after the run (restarted on the new state),
#                  or on a test server whose store root clones bar-generations-v1
#                  as well as bar-revisions-v1: without the generation pointers
#                  a repaired month is served at generation 0, and a step that
#                  wrote a new generation reads as never run (14 Oct: ETERNAL
#                  2025-04-08 answered 0 without them and 16,788 with them).
#   last_run       a run that did not close the step, from the store's records.
#   ran_out_of_order  a done step that ran before a step it follows: which, and
#                  what that left.
#
# WHEN A PACKAGE MERGES: set its `merged = true` (the gate compares the flag
# with the `Merge <package>:` subjects of the history it reads) and rehearse
# every step that waited for it, in the same change.
#
# The reader is a strict subset of TOML: [[table]] headers; key = "string",
# ["array", "of strings"], an integer, or true/false; # comments.

format = 1

