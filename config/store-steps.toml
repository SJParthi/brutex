# ------------------------------------------------------------------- rules --

[[rule]]
id = "R-01"
text = "One command-line run at a time, and none beside a long import, scrub or pull. Every cli run logs into the one folder <store>/logs/cli, whose lock refuses a second writer; the second run then keeps no events and no audit lines, and only its terminal says so. Before a step, confirm no other cli process works on the store."
source = ["RA-118"]
until = "IA-1"

[[rule]]
id = "R-02"
text = "Stop the app before a store is restored from a snapshot, and start it after. A store rolled back under a running app brings lock files back holding old claims and puts the runs ledger, alert queue, checking images and logs back in time under an app whose memory holds the newer state."
source = ["RA-329"]
until = "never"

[[rule]]
id = "R-03"
text = "A snapshot (S-01) is taken before every bulk write and its name is written in the step's run record; it is not a backup (the same drive). Until S-01's drill has run once on this drive, the undo of a bad write is the store's own append-only history and the independent copy (S-17)."
source = ["RA-288", "DB-B73"]
until = "never"

[[rule]]
id = "R-04"
text = "Capital-market runs (indices, stocks) before S-18 and S-19 are unfiltered: no symbol names, no --stored and no --retry-refused. A day closed under a names filter lets a later --stored run make alias months from a special session alone (72 repairs on the WP-12f checker's copy), and an unfiltered run files the whole stored scope (CmScope::stored walks every alias index row)."
source = ["CMP-03"]
until = "never"

# ------------------------------------------------------------------- steps --

[[step]]
id = "S-01"
title = "Snapshot of the drive before a bulk write, with the restore drill"
state = "pending"
writes = "An APFS local snapshot (outside the store's files). Nothing in the store."
command = [
  "planned: cli snapshot take (a name proposed here: no package builds a snapshot verb yet, so until one does the operator takes the APFS local snapshot of the drive by hand with tmutil, as the note says)",
]
dry_run = [
  "the drill of docs/36-ops-runbook.md section 4 with BRUTEX_STORE on a private copy on a scratch APFS volume first: take the snapshot, write one month into a scratch store there, mount the snapshot read-only, copy that month back by name, compare shasum -a 256 with the copy taken before",
]
prerequisites = ["WP-81", "operator: the restore drill (it changes what the drive keeps, so no agent runs it)", "operator: every writer stopped (the app and every cli run) while the copy is taken"]
check = [
  "tmutil listlocalsnapshots /Volumes/WD_BLACK lists the new snapshot; an empty list means the command did not cover this drive and the undo does not exist",
  "docs/36-ops-runbook.md section 4 holds the drill's commands, times and df before and after, and says whether one month came back alone",
  "cli census-recount gdfl --from 2018-09-03 --to 2018-11-05 on a store restored from the snapshot, before any other writer starts (this check writes the GDFL census and the GDFL import journal, so it is the first writer after the restore): every count equals the census the snapshot holds",
  "cli census-recount gdfl --from 2018-11-07 --to 2018-11-08 on the restored store, the same (this check writes the GDFL census and the GDFL import journal)",
  "cli census-recount gdfl --from 2018-11-10 on the restored store, the same, with no --to so the span runs to the newest day the snapshot holds (this check writes the GDFL census and the GDFL import journal)",
  "cli census-recount zerodha --from 2015-01-01 on the restored store, the same, from the oldest Zerodha month held (the 2015-01 index 1day bars, outside the operator's window and kept) to the newest (this check writes the Zerodha census; the recount closes journal days for gdfl alone)",
  "cli scrub-blocks gdfl on the restored store, before any writer but the recount starts, run until audit/scrub-blocks.gdfl.cursor ends in a done line of a pass that began after the restore (a run resumes where the restored cursor stood, so when that cursor ends in a progress line the first done finishes the snapshot's pass, and the next pass is the read-back; this check writes audit/scrub-blocks.gdfl.log and .cursor): bad=0 unverifiable=0 misfiled=0 missing=0, or each bad block named",
  "cli scrub-blocks zerodha on the restored store, the same (this check writes audit/scrub-blocks.zerodha.log and .cursor)",
]
closes = ["RA-288", "RA-329"]
not_rehearsed = "waits for operator: the drill, on a scratch volume first and then once on this drive"
disk = "UNVERIFIED: a kept snapshot pins every block replaced after it (repair generations, compacted census epochs, rolled logs) as space no file listing shows; the drill's step 5 measures df before and after. Delete it once the run it guarded is checked green (tmutil deletelocalsnapshots)."
note = "Take it and restore it with the app and every cli run stopped (R-02, FM-221): by hand today with `tmutil localsnapshot`, then `tmutil listlocalsnapshots` on the drive, which R4-06 moved here from the command list because a store step's command is a cli verb or a POST (AUT-07). a copy taken while a writer appends holds torn months or a census that disagrees with them. No verb takes every census lock for a copy (NOT DONE in code). Since this list was written, the 13 and 14 Oct bulk writes (S-09, S-10, S-30, S-31 and the partial runs of S-14, S-16, S-19, S-28) ran with no snapshot taken. man tmutil gives localsnapshot no mount point, and this drive is excluded from Time Machine, so the first command is NOT PROVED to snapshot it. The GDFL recount spans leave out 2018-11-06 and 2018-11-09, the two option days the vendor refused (D-3317 item 5): the recount closes as recounted every day of its span whose last journal line is an incomplete with no stage, and those two days end in one (read 15 Oct, read only), so a span over either would mark it done and no import would retry its refused files (verify-R3-36-r3). Their months are still recounted, because the recount rebuilds every month a day of its span touches. Gate 30 reads the excluded days from D-3317 item 5 and refuses a span that covers one."

