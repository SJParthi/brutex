# Research screening policy selected under the operator's delegation, 2026-09-07.
# These are explicit research choices, not externally certified trading limits.
# See docs/22-research-policy.md for the plain-language table and rationale.
# This deliberately small TOML subset accepts flat keys, integers, booleans,
# comments, and quoted risk multiples. No tables, arrays, or executable formulas.
policy_version = 1
# CADENCE FLOORS, corrected 2026-09-11. These three were 200/60/200, and at the
# swept window that is not a mild filter -- it is the grinder being mandated.
# 413 training days at 60min is 2,891 bars, so 200 hits is 69,180 ppm: the
# combination had to fire on SEVEN PERCENT of all bars. lib.rs already records a
# run pruned by a 20,000 ppm floor and calls that "five times too strict ... a
# grinder by any reading"; 69,180 is three and a half times stricter again.
# One intraday trade a week over 413 days is ~83 trades, so a floor of 40 admits
# down to one trade a fortnight and lets the statistical gates below -- which are
# untouched -- decide whether that evidence is sufficient. min_winning_trades
# follows at 10 because 40 trades at the V3 one-in-three ratio is ~13 wins, and
# a floor of 80 winners was arithmetically unreachable at any honest rare cadence.
min_support_hits = 40
min_independent_sessions = 30
min_trades = 40
max_mae_paisa = "risk*1"
# WIN-RATE FLOORS. 400000/350000 -> 250000/140000.
#
# The point floor is the breakeven implied by min_worst_reward_risk_ppm: at 3:1
# the breakeven win rate is 1/(1+3) = 25%, so a 40% floor rejected strategies
# the engine's OWN payoff rule calls profitable.
#
# The WILSON floor is 140000 and NOT 200000, and the difference is the whole
# point. An adversarial audit found 200000 made the policy's own stated minimum
# corner UNSATISFIABLE: at n = min_trades = 40 with exactly 25% wins, the Wilson
# lower bound (z = 1.959964, no continuity correction, floored) is 141,871 ppm.
# A 200,000 floor therefore demanded 13 wins in 40 -- 32.5%, SEVEN AND A HALF
# POINTS ABOVE the breakeven this file computes -- and silently became the
# binding win-rate gate for every candidate under 248 trades, which is all of
# them. Wilson shrinkage at (40, 0.25) is 108,129 ppm; the floor must sit below
# that or it overrides the point floor it was meant to sit beneath.
min_win_rate_ppm = 250000
min_wilson_win_rate_ppm = 140000
min_return_drawdown_ppm = 2000000
min_weakest_period_return_paisa = "risk*-1"
max_pbo_ppm = 200000
max_fwer_p_value_ppm = 50000
max_spa_p_value_ppm = 50000
min_decided_folds = 6
max_ambiguous_fill_rate_ppm = 0
max_gap_affected_rate_ppm = 0
# CONCENTRATION CEILINGS. 100000 -> 500000, and this is the edit that decides
# whether the engine's stated objective is representable at all.
#
# The share denominator is GROSS WIN. With W winners, one of them N times the
# mean of the others, the largest share is N/(N + W - 1). Solving at the 10%
# ceiling gives the exact cost: admitting a winner N times the typical one
# requires W >= 9N + 1 WINNERS. A 10x outlier therefore needed 91 winning
# trades -- more than twice min_trades in winners alone -- and at the 13 winners
# the Wilson floor actually implies, the best trade was capped at 1.33x the
# average win. CLAUDE.md §1 states the objective as "the rare, massive winner
# ... pays enormously when it pays". A 1.33x ceiling is not a filter on that
# shape, it is its refusal, and lowering min_trades from 200 made it stricter
# rather than looser (at 52 winners the old ceiling was 5.7x).
#
# 500000 admits a 12x winner at 13 winners while still refusing any result where
# one trade or one session supplies MORE than half the gross win -- which is the
# "profitable only because of one lucky print" case these gates exist to catch.
# The robust form of that question is whether the result survives deleting its
# best trade; a fixed share cap is a proxy for it, and the proxy must not be set
# where it excludes the thing being searched for.
max_session_concentration_ppm = 500000
max_largest_trade_profit_share_ppm = 500000
# Operator's defining criterion: the largest peak-to-trough fall in cumulative
# pessimistic closed-trade P&L, capped at THREE risk units, down from ten.
#
# An earlier version of this comment claimed the cap "equals
# min_worst_reward_risk_ppm, so one minimum-sized win repays the worst
# drawdown", and that it "forces the average loss under three tenths of a risk
# unit". An adversarial audit refuted both. The first conflates a CEILING with
# an OBSERVATION: 3R is three times the MAX_POINTS cap on a loss, while the 3:1
# rule is three times the WORST OBSERVED loss, so if the worst observed loss is
# 0.2R the minimum win need only be 0.6R against an admitted drawdown of 3R --
# one win repaying a fifth of the worst run, not all of it. The second is false
# because a flat trade counts as a losing trade but contributes zero to
# drawdown, so a ten-run of nine flats and one 3R loss satisfies both gates with
# the average loss untouched.
#
# What is true and is why the number stays: 3R is a hard ceiling on the worst
# run in risk units, it is measured per price unit rather than scaled by size,
# and it makes max_average_loss_paisa below redundant for any streak longer than
# three -- which the audit measured at 96% of arrangements at this win rate.
max_drawdown_paisa = "risk*3"
# A longer study is not rejected merely for accumulating more losing trades.
# The losing-trade RATE and losing-streak cap below still apply.
max_losing_trade_rate_ppm = 750000
max_losing_trades = 18446744073709551615
min_pessimistic_profit_paisa = "risk*5"
min_winning_trades = 10
min_average_win_paisa = 1
max_average_loss_paisa = "risk*1"
min_profit_factor_ppm = 1500000
max_consecutive_losing_streak = 10
# A lucky consecutive winning streak is not evidence we require.
min_consecutive_winning_streak = 0
min_bootstrap_draws = 1000
min_bootstrap_strategies = 2
min_bootstrap_periods = 60
min_pbo_contributing_folds = 6
max_pbo_unrankable_folds = 0
min_profitable_oos_folds = 4
min_oos_pessimistic_return_paisa = 1
max_white_reality_p_value_ppm = 50000
require_white_reality_rejection = true
max_romano_wolf_p_value_ppm = 50000
require_romano_wolf_rejection = true
