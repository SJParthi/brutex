# config/owed-runs.toml — every store run still owed, as one tracked list
# (R4-06 item 3, AUT-07).
#
# WRITTEN ONCE BY HAND on 17 Oct 2026 from three sources, so that CI never
# reads an untracked path: the data census of 13 Oct (the operator's state
# folder data-census-20261013, analysis.json `totals` and each row's `owed`
# and `*_runs` fields), the rows of the round-3 fix plan whose package lists a
# store write (round3-packages.json `store_writes`), and its `not_packaged`
# items whose verdict is store_write_only. A run that writes nothing to the
# operator's store (a read-only measurement, a read-only plan, a proof in a
# NEW empty folder) is not owed here, and each one left out is named at the
# end of this file with why.
#
# THE RULE (gate 30, `.github/gates_store_steps.rs --owed`): every [[owed]]
# id below is a leftover of config/store-steps.toml, and so is closed by
# exactly one step there; every OWED- leftover there is an id here. An owed
# run no step names, or one two steps name, is a red build.
#
# Each entry: `id` (OWED-<nn>, never renumbered or reused), `what` (the run,
# in words), `source` (the census field or plan row it comes from), `note`.

format = 1

