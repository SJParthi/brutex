      WITHOUT SCRIPT THIS PAGE WAS A BLANK WHITE RECTANGLE, AND SAID NOTHING.

      `+layout.js` sets `ssr = false`, so every prerendered file in `web/build`
      is a shell: five files, byte-identical bodies, no nav and no headings.
      That is the correct choice under D-0053 -- the Rust binary must never run
      a JavaScript renderer -- but its consequence was a failure mode with no
      symptom. A bundle that 404s from a stale cache, a chunk that throws on an
      old browser, and JavaScript switched off all produced the same blank
      page, and a blank page names no reason.

      CLAUDE.md section 4: degrade loudly and name the reason, or refuse. Never
      both silently. So this block names the reason AND routes onward, because
      there is somewhere to go: `crates/api/src/render.rs` still serves plain
      server-rendered HTML on the same origin, with ordinary form POSTs and no
      script at all. Those pages are not a downgrade of this one, they are the
      surface this one was built over, and they answer without a bundle.

      Inline styles rather than classes: `theme.css` arrives through
      `%sveltekit.head%`, and a block whose whole purpose is to survive a
      failed asset load must not depend on an asset loading.
    -->
