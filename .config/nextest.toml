# Each mutant starts a fresh process. Prioritize the smallest published hash
# vector so a broken compression loop fails before expensive long-input cases.
# This changes order only: no test filter, skip, retry or ignored failure.
[[profile.default.overrides]]
filter = 'test(the_published_vectors_reproduce)'
priority = 100

# Fast operator and sealed-record regressions fail before long statistical
# suites when a mutant breaks those boundaries. Every test still runs unless
# an actual failure triggers the mutation job's existing fail-fast behavior.
[[profile.default.overrides]]
filter = 'test(operator_boundary_tests::) | test(every_selection_v3_byte_is_bound) | test(every_selection_v4_byte_is_bound) | test(every_execution_v4_companion_byte_is_bound)'
priority = 100

[[profile.default.overrides]]
filter = 'test(folds_preserve_parent_worker_candidate_and_pair_limits) | test(every_global_replay_v2_companion_byte_is_bound)'
priority = 100

# This complete stored transaction reauthenticates eight retained chains. Run
# the smaller contract regressions first so mutation fail-fast can stop on a
# real failure before paying for it. It is neither filtered out nor skipped.
[[profile.default.overrides]]
filter = 'test(all_eight_stored_rungs_publish_exact_selection_chains_and_reuse_every_byte)'
priority = -100

# D-0693. Each advisory-lock regression fails in milliseconds when a lock is
# released only by close, so a mutant that stops an unlock is caught before the
# long suites start. This changes order only: every test still runs.
[[profile.default.overrides]]
filter = 'test(released_despite_a_duplicated_descriptor) | test(dropping_receipt_releases_lock_even_when_a_duplicate_descriptor_survives) | test(a_refused_release_is_returned_naming_the_file) | test(a_contended_lock_is_refused_and_takes_nothing)'
priority = 100

# The three cli tests that caught mutants at positions 955, 1174 and 1309 of
# 1,445 in the audit follow-up bundle's local Gate 18 run. Late in the order,
# they left seven cli mutants alive for 13 to 25 minutes each before the one
# failure that fail-fast stops on. Run first, a mutant they catch costs
# seconds. This changes order only: every test still runs.
[[profile.default.overrides]]
filter = 'test(cash_inventory_never_relabels_an_index_as_a_stock) | test(an_fno_index_underlying_is_refused_by_the_surface_sentence) | test(every_knob_that_moves_the_answer_moves_the_identity)'
priority = 100

# D-0694: the stock statement on every stored report and the ordinary stored
# sweep's minute-gap withholding, with the AF-19 repairs of both. Pure renders
# and small generated stores, run early so a cli mutant that breaks either
# fails before the long suites. This changes order only: nothing is filtered,
# skipped, retried or ignored.
[[profile.default.overrides]]
filter = 'test(equity_statement_tests::) | test(the_ordinary_stored_sweep_) | test(a_gap_free_month_keeps_its_bars_and_masks_and_moves_its_identity) | test(every_stored_report_over_a_stock_states_corporate_actions_are_unchecked) | test(a_pool_with_a_stock_states_corporate_actions_are_unchecked) | test(the_stock_inventory_states_corporate_actions_are_unchecked) | test(the_equity_note_is_decided_by_the_kind) | test(a_walk_offering_a_stock_states_corporate_actions_are_unchecked) | test(a_stock_search_states_corporate_actions_are_unchecked) | test(a_stock_research_scope_states_corporate_actions_are_unchecked) | test(states_corporate_actions_inside_its_findings) | test(the_minute_gap_rule_is_bound_by_value_and_the_audited_door_records_the_ladder_alone) | test(a_holed_day_the_signal_rung_does_not_hold_withholds_nothing_and_is_not_named) | test(a_listing_that_prints_a_stock_states_gross_and_corporate_actions)'
priority = 100
