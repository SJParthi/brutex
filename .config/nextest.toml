# D-4180: the pure turn rule and the deadline-bounded fan-out, first. Run 1286
# timed out on nine `ordered.rs` mutants that these two tests catch in
# milliseconds or at their own 30 s deadline: in name order an earlier test
# reached the same never-granted turn first and waited with no bound, so the
# shard spent its whole test timeout there. This changes order only: every
# test still runs, and none is filtered, skipped, retried or ignored.
[[profile.default.overrides]]
filter = 'test(=ordered::tests::a_lane_never_waits_on_its_own_slot) | test(=ordered::tests::turns_are_granted_in_round_then_input_order_within_a_deadline)'
priority = 100

