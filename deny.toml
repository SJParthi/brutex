[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked  = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

# An entry in `allow` that no dependency uses is a tidiness observation, not a
# policy violation — and while crates/core is the only member, NOTHING uses any
# of them, so the default made gate 3 red on a workspace with zero
# dependencies. This does not weaken the policy: a license outside the list
# above is still refused, which is the check that matters. Trimming the list to
# whatever happens to be in use today would be worse — it would have to be
# edited every time a dependency lands, which is how an allowlist quietly
# becomes a rubber stamp.
unused-allowed-license = "allow"

# The workspace crates are `publish = false` and carry `license = "UNLICENSED"`,
# which is NOT a valid SPDX identifier — cargo-deny cannot parse it and reports
# `core = 0.1.0 is unlicensed`. This is the mechanism cargo-deny provides for
# exactly that case: skip the licence check for crates that are never
# published, because a licence expression only means something for a crate
# someone else can consume.
#
# It does NOT weaken the check that matters. Every THIRD-PARTY dependency is
# still held to the `allow` list above; this exemption reaches only crates in
# this workspace, which are ours and are not distributed.
private = { ignore = true }

# ONE CRATE, ONE LICENCE. `exceptions` does not add CC0-1.0 to `allow` above:
# any OTHER crate carrying CC0-1.0 is still refused, which is the difference
# between this and widening the policy.
#
# `tiny-keccak 2.0.2` is CC0-1.0 and it is never compiled by this workspace.
# It arrives only as
#
#     parquet -> ahash -> const-random -> const-random-macro -> tiny-keccak
#
# and `const-random` is an OPTIONAL dependency of `ahash`, selected by its
# `compile-time-rng` feature, which is chosen only where there is no runtime
# random source. Measured on this tree rather than assumed —
# `cargo tree --target <t> -p parquet -i const-random` prints "nothing to
# print" for `x86_64-unknown-linux-gnu` and for `aarch64-apple-darwin`, and
# prints the chain above only for `wasm32-unknown-unknown`.
#
# `lake` never builds for wasm32. `CLAUDE.md` §5 makes `web` the only wasm
# crate and gives it `core` as its sole dependency, so no wasm build can reach
# `parquet` at all. cargo-deny resolves it anyway because `[graph] targets`
# above lists wasm32 and cargo-deny unions the targets across the whole
# workspace — it has no way to know which member is built for which.
#
# So the code under this licence is never compiled, never linked and never
# shipped. See docs/05-decisions.md D-0056, which recorded the need for this
# line when `crates/lake` landed.
#
# `webpki-roots 1.0.9` is CDLA-Permissive-2.0 and the operator decided on
# 2026-08-09 to accept it. UNLIKE `tiny-keccak` above, this one IS compiled and
# IS shipped: it is reached on the ordinary native path,
#
#     webpki-roots -> hyper-rustls -> reqwest -> pull -> api
#
# measured with `cargo tree -i webpki-roots` on this tree, not assumed. It is
# the Mozilla CA certificate root store — the trust anchors rustls checks a
# vendor's TLS certificate against, which is what makes `crates/pull` able to
# reach a vendor over HTTPS at all.
#
# The decision rests on three things. CDLA-Permissive-2.0 is permissive: it
# carries no copyleft, no reciprocal obligation on this repository, and no
# source-disclosure term, so it cannot reach the rest of the workspace. What it
# licenses is DATA rather than code — a generated list of certificates, which
# is the case the Community Data License Agreement was written for. And there
# is no substitute that avoids it without being worse: the alternative is the
# host platform's native trust store, which would make the pull's behaviour
# depend on the machine it runs on and break `CLAUDE.md` §3 rule 5.
#
# It is an EXCEPTION and not an `allow` entry on purpose. The reasoning above
# is about this crate being certificate data; it does not transfer to some
# other crate that happens to carry the same licence, and such a crate is still
# refused. See docs/05-decisions.md D-0066.
exceptions = [
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

# Crates that embed or bind another language runtime. Adding any of these
# defeats the whole point of this repository. The list is not exhaustive by
# design — `unknown-registry = "deny"` plus the workspace dependency table in
# Cargo.toml is the real control, and every new dependency needs an entry in
# docs/05-decisions.md before it lands.
deny = [
    { name = "pyo3" },
    { name = "mlua" },
    { name = "rlua" },
    { name = "deno_core" },
    { name = "v8" },
    { name = "rusty_v8" },
    { name = "quickjs-rs" },
    { name = "boa_engine" },
    { name = "node-bindgen" },
    { name = "neon" },
    { name = "jni" },
    # ADDED BY D-0211, WHICH REMOVED `ring` FROM THE BUILD. The list above is
    # about interpreted runtimes; these three are C and assembly, and nothing
    # stopped them returning once the TLS feature that pulled them was changed.
    # `ring` vendors 17 .c, 28 .h, 73 .S and 17 .asm and compiles them through
    # its own build.rs -- both halves of what CLAUDE.md section 2 forbids
    # without exception. `aws-lc-rs`/`aws-lc-sys` are the other rustls provider
    # and are worse on the same axis. `cc` is the compiler driver whose presence
    # is the tell that some crate is building C.
    #
    # A crate that legitimately needs one of these does not edit this list
    # quietly: it needs a docs/05-decisions.md entry saying why section 2 bends,
    # which is the whole point of naming them here rather than trusting a test.
    { name = "ring" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "cc" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
